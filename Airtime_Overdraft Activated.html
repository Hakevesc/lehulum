<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Errif Activated</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root { --Primary: #FE353D; --On-Surface: #1C1C21; --On-Surface-Low: #7C7C87; --Border: #E8E8EC; --Background: #F5F5F5; --Success: #1FC83B; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 24px 8px; background: var(--Background); }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 24px; text-align: center; }
  .ok-icon { width: 92px; height: 92px; border-radius: 50%; background: #E8F9EC; display: flex; align-items: center; justify-content: center; margin-bottom: 22px; animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  .ok-icon svg { width: 46px; height: 46px; stroke: var(--Success); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ok-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  .ok-desc { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 14px; line-height: 1.6; max-width: 280px; margin-bottom: 22px; }
  .limit-card { width: 100%; background: #FFF; border: 1px solid var(--Border); border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .limit-card .lbl { font-family: 'Switzer', sans-serif; font-size: 13px; color: var(--On-Surface-Low); }
  .limit-card .amt { font-family: 'Switzer', sans-serif; font-size: 18px; font-weight: 700; color: var(--Primary); }

  .bottom-area { flex-shrink: 0; width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 12px 24px 28px; background: var(--Background); }
  .btn-primary { width: 100%; height: 52px; border-radius: 14px; background: var(--Primary); color: #FFF; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; border: none; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 16px rgba(254,53,61,0.25); }
  .btn-primary:hover { background: #E5303A; transform: translateY(-1px); }
  .btn-primary:active { transform: scale(0.98); }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="body">
      <div class="ok-icon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2 class="ok-title">Errif Activated</h2>
      <p class="ok-desc">Your Errif overdraft is ready. You can now complete this airtime purchase and repay later.</p>
      <div class="limit-card">
        <span class="lbl">Available Errif limit</span>
        <span class="amt">5,000.00 ETB</span>
      </div>
    </div>

    <div class="bottom-area">
      <button class="btn-primary" onclick="continuePayment()">Continue to Payment</button>
    </div>

  </div>
</div>

<script>
  function continuePayment() {
    sessionStorage.setItem('odStatus', 'active_ok');
    const data = JSON.parse(sessionStorage.getItem('airtimeData') || '{}');
    data.payAccount = 'overdraft';
    data.fee = '0.00';
    data.total = parseFloat(data.payAmount || '0').toFixed(2);
    sessionStorage.setItem('airtimeData', JSON.stringify(data));
    window.location.href = 'Airtime_Review.html';
  }
</script>

<script src="figma-export.js"></script>
</body>
</html>
