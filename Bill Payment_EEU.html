<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Payment</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
    --Field: #F8F8F9;
    --Field-Border: #EFEFF1;
    --Success: #1FC83B;
    --Success-Light: #EEF9F0;
    --Warning: #E09B0B;
    --Warning-Light: #FDF6E7;
    --Error-Light: #FDECEC;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; background: var(--Background); flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); flex-shrink: 0; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .scroll { flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  .scroll::-webkit-scrollbar { width: 0; }

  /* ── Accordion ── */
  .accordion { background: #FFF; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); overflow: hidden; }
  .acc-head { padding: 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; }
  .acc-head .logo { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .acc-head .logo img { width: 100%; height: 100%; object-fit: contain; }
  .acc-head .nm { flex: 1; min-width: 0; font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 700; color: var(--On-Surface); }
  .acc-head .caret { width: 18px; height: 18px; stroke: var(--Primary); stroke-width: 2.4; fill: none; flex-shrink: 0; transition: transform 0.25s; }
  .accordion.open .acc-head .caret { transform: rotate(180deg); }

  /* Collapsed panels stay in the DOM so a typed value survives a toggle */
  .acc-body { display: none; padding: 0 16px 16px; flex-direction: column; gap: 8px; border-top: 1px solid #F0F0F3; margin: 0 16px; padding-left: 0; padding-right: 0; }
  .accordion.open .acc-body { display: flex; }

  .field-label { font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 500; color: var(--On-Surface); margin-top: 10px; }
  .field { height: 56px; background: var(--Field); border: 1px solid var(--Field-Border); border-radius: 12px; padding: 0 16px; display: flex; align-items: center; gap: 8px; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; }
  .field:focus-within { border-color: var(--Primary); background: #FFF; box-shadow: 0 0 0 3px rgba(254,53,61,0.08); }
  .field input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 700; color: var(--On-Surface); letter-spacing: 0.2px; }
  .field input::placeholder { color: #A5A5AE; font-weight: 400; letter-spacing: 0; }
  /* Out-of-range amounts tint the value itself */
  .field.warn { border-color: var(--Warning); background: #FFF; }
  .field.warn input { color: var(--Warning); }
  .field.err { border-color: var(--Primary); background: #FFF; }
  .field.err input { color: var(--Primary); }

  .amount-group { gap: 8px; }
  .hint-group { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .balance-hint { font-family: 'Switzer', sans-serif; font-size: 11.5px; color: var(--On-Surface-Low); }
  .balance-hint b { color: var(--On-Surface); font-weight: 600; }
  .cost-hint { font-family: 'Switzer', sans-serif; font-size: 11.5px; font-weight: 600; color: var(--On-Surface); }

  /* ── Lookup status chip ── */
  .status-chip { display: none; align-items: center; gap: 10px; border-radius: 12px; padding: 13px 14px; margin-top: 4px; font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 500; }
  .status-chip.show { display: flex; }
  .status-chip .ic { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .status-chip .ic svg { width: 13px; height: 13px; stroke-width: 3; fill: none; }
  .status-chip.loading { background: #F1F1F4; color: var(--On-Surface-Low); }
  .status-chip.loading .ic { border: 2.5px dashed var(--Success); animation: spin 1.6s linear infinite; }
  .status-chip.ok { background: var(--Success-Light); color: var(--On-Surface); }
  .status-chip.ok .ic { border: 1.8px solid var(--Success); }
  .status-chip.ok .ic svg { stroke: var(--Success); }
  .status-chip.info { background: #EDEDF0; color: var(--On-Surface); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Bottom button ── */
  .bottom-bar { flex-shrink: 0; padding: 10px 16px 18px; background: var(--Background); }
  .continue-btn { width: 100%; height: 52px; border-radius: 14px; border: none; background: #E0E0E0; color: var(--On-Surface-Low); font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; cursor: not-allowed; transition: all 0.2s; }
  .continue-btn.active { background: var(--Primary); color: #FFF; cursor: pointer; box-shadow: 0 4px 16px rgba(254,53,61,0.25); }
  .continue-btn.active:hover { background: #E5303A; box-shadow: 0 6px 20px rgba(254,53,61,0.35); transform: translateY(-1px); }
  .continue-btn.active:active { transform: scale(0.98) translateY(0); }
</style>
<link rel="stylesheet" href="styles/field-error.css">
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title">Bill Payment</span>
      <div style="width:36px;"></div>
    </div>

    <div class="scroll">

      <!-- ── Post paid: the bill is fetched against a contract number ── -->
      <div class="accordion" id="accPost">
        <div class="acc-head" onclick="toggle('post')">
          <span class="logo"><img src="assets/bill pay logos/eelectricu_logo.png" alt=""></span>
          <span class="nm">EEU Post Paid</span>
          <svg class="caret" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="acc-body">
          <span class="field-label">Enter Contract Number</span>
          <div class="field" id="contractField">
            <input id="contractInput" type="text" inputmode="numeric" maxlength="12" placeholder="e.g. 45292921"
                   autocomplete="off" oninput="onContractInput()">
          </div>
          <div class="status-chip loading" id="contractLoading">
            <span class="ic"></span>
            <span>Looking Up Contract Number</span>
          </div>
          <div class="status-chip ok" id="contractOk">
            <span class="ic"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span id="contractOkName"></span>
          </div>
          <div class="status-chip info" id="contractNone">
            <span>There is no open invoice</span>
          </div>
          <div class="field-error" id="contractBad">
            <span class="fe-ic"><svg viewBox="0 0 24 24"><path d="M17 7 7 17M7 7l10 10"/></svg></span>
            <span class="fe-txt">Invalid contract number</span>
          </div>
        </div>
      </div>

      <!-- ── Prepaid: the customer buys a chosen amount of credit ── -->
      <div class="accordion" id="accPre">
        <div class="acc-head" onclick="toggle('pre')">
          <span class="logo"><img src="assets/bill pay logos/eelectricu_logo.png" alt=""></span>
          <span class="nm">EEU Prepaid</span>
          <svg class="caret" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="acc-body">
          <span class="field-label">Enter Serial Number</span>
          <div class="field" id="serialField">
            <input id="serialInput" type="text" inputmode="numeric" maxlength="12" placeholder="e.g. 45292921"
                   autocomplete="off" oninput="onSerialInput()">
          </div>
          <div class="status-chip loading" id="serialLoading">
            <span class="ic"></span>
            <span>Looking Up Serial Number</span>
          </div>
          <div class="status-chip ok" id="serialOk">
            <span class="ic"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span id="serialOkName"></span>
          </div>
          <div class="status-chip info" id="serialNone">
            <span>There is no open invoice</span>
          </div>
          <div class="field-error" id="serialBad">
            <span class="fe-ic"><svg viewBox="0 0 24 24"><path d="M17 7 7 17M7 7l10 10"/></svg></span>
            <span class="fe-txt">Invalid serial number</span>
          </div>

          <div class="amount-group" id="amountGroup" style="display:none; flex-direction:column;">
            <span class="field-label" id="amtLabel">Enter Amount</span>
            <div class="field" id="amtField">
              <input id="amtInput" type="text" inputmode="decimal" placeholder="e.g. 120 ETB" autocomplete="off"
                     oninput="onAmountInput()" onfocus="unformatAmount()" onblur="formatAmount()">
            </div>
            <div class="hint-group">
              <div class="balance-hint" id="balanceHintRow"><b>Balance:</b> <span id="balanceHint">—</span></div>
              <div class="cost-hint" id="costHint" style="display:none;"></div>
            </div>
            <div class="field-error" id="amtMsg"><span class="fe-ic"><svg viewBox="0 0 24 24"><path d="M17 7 7 17M7 7l10 10"/></svg></span><span class="fe-txt"></span></div>
          </div>
        </div>
      </div>

    </div>

    <div class="bottom-bar">
      <button class="continue-btn" id="continueBtn" onclick="continuePayment()" disabled>Continue</button>
    </div>

  </div>
</div>

<script>
  // Contract numbers resolve to a customer and an outstanding bill; serials only
  // resolve to a customer, since prepaid credit is bought by amount.
  // Codes run in a series: the base number pays, +1 has nothing outstanding and
  // +2 bills more than the wallet holds, so every outcome is reachable by hand.
  const CONTRACTS = {
    '45292921': { customer: 'Derartu Tulu Andegna', month: 'Aug - 2026', amount: 400 },
    '45292922': { customer: 'Derartu Tulu Andegna', month: 'Aug - 2026', amount: 0 },
    '45292923': { customer: 'Derartu Tulu Andegna', month: 'Aug - 2026', amount: 21000 },
    '11727112': { customer: 'Alemu Girma Bekele',   month: 'Aug - 2026', amount: 1340.50 },
    '71121245': { customer: 'Hiwot Tesfaye Alemu',  month: 'Jul - 2026', amount: 862.75 }
  };

  // A prepaid meter is topped up either by ETB or by kilowatt hours, and the
  // serial decides which — the second field follows from the lookup.
  const SERIALS = {
    '45292921': { customer: 'Derartu Tulu Andegna', mode: 'amount' },
    '45292922': { customer: 'Derartu Tulu Andegna', mode: 'kwh' },
    '55211400': { customer: 'Alemu Girma Bekele',   mode: 'amount' }
  };

  // The field takes a couple of digits past a valid code so an over-long entry
  // can be reported rather than silently trimmed into a different account.
  const CODE_LEN = 8, MAX_TYPED = 12;
  const MIN_AMT = 5, MAX_AMT = 75000, BALANCE = 3000, FEE = 5;
  const RATE = 3.00;   // ETB per kilowatt hour
  // The receipt breaks the charge out as a service fee plus VAT.
  const SERVICE_FEE = 2, VAT = 5;

  const BILLER = {
    name: 'EEU',
    fullName: 'Ethiopian Electric Utility',
    category: 'Utility',
    abbr: 'EE',
    logo: 'assets/bill pay logos/eelectricu_logo.png'
  };

  const $ = id => document.getElementById(id);
  const fmt = n => parseFloat(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  let open = null;        // 'post' | 'pre' | null
  let mode = 'amount';    // prepaid input unit: 'amount' (ETB) or 'kwh'
  let contract = null;    // resolved post-paid bill
  let serial = null;      // resolved prepaid meter
  let contractTimer = null, serialTimer = null;

  /* ── Accordion ── */
  function toggle(which) {
    open = open === which ? null : which;
    $('accPost').classList.toggle('open', open === 'post');
    $('accPre').classList.toggle('open', open === 'pre');
    updateBtn();
  }

  /* ── Shared lookup: a full-length code resolves, anything else clears ── */
  function runLookup(value, ids, directory, onHit) {
    const [loading, ok, bad, field, none] = ids.map($);
    [loading, ok, bad, none].filter(Boolean).forEach(el => el.classList.remove('show'));
    field.classList.remove('err');

    if (value.length > CODE_LEN) {
      bad.classList.add('show');
      field.classList.add('err');
      updateBtn();
      return null;
    }
    if (value.length < CODE_LEN) { updateBtn(); return null; }

    loading.classList.add('show');
    updateBtn();
    return setTimeout(() => {
      const hit = directory[value];
      loading.classList.remove('show');
      if (hit && hit.amount === 0) {
        // The account exists, it simply has nothing to pay right now.
        onHit(null);
        if (none) none.classList.add('show');
      } else if (hit) {
        onHit(hit);
        ok.querySelector('span:last-child').textContent = hit.customer;
        ok.classList.add('show');
      } else {
        onHit(null);
        bad.classList.add('show');
        field.classList.add('err');
      }
      updateBtn();
    }, 1200);
  }

  function onContractInput() {
    const el = $('contractInput');
    el.value = el.value.replace(/\D/g, '').slice(0, MAX_TYPED);
    clearTimeout(contractTimer);
    contract = null;
    contractTimer = runLookup(el.value,
      ['contractLoading', 'contractOk', 'contractBad', 'contractField', 'contractNone'],
      CONTRACTS,
      hit => { contract = hit ? Object.assign({ number: el.value }, hit) : null; });
  }

  function onSerialInput() {
    const el = $('serialInput');
    el.value = el.value.replace(/\D/g, '').slice(0, MAX_TYPED);
    clearTimeout(serialTimer);
    serial = null;
    showAmountGroup(false);
    serialTimer = runLookup(el.value,
      ['serialLoading', 'serialOk', 'serialBad', 'serialField', 'serialNone'],
      SERIALS,
      hit => {
        serial = hit ? Object.assign({ number: el.value }, hit) : null;
        if (serial) { mode = serial.mode || 'amount'; showAmountGroup(true); }
      });
  }

  // The unit the meter is topped up in decides the label, placeholder and suffix.
  function showAmountGroup(show) {
    const group = $('amountGroup');
    group.style.display = show ? 'flex' : 'none';
    $('costHint').style.display = 'none';
    if (!show) return;
    const isKwh = mode === 'kwh';
    $('amtLabel').textContent = isKwh ? 'Enter Kilo Watt' : 'Enter Amount';
    $('amtInput').placeholder = isKwh ? 'e.g. 50 kWh' : 'e.g. 120 ETB';
    $('amtInput').value = '';
    $('balanceHint').textContent = fmt(BALANCE) + ' ETB';
    setAmountState(null);
  }

  /* ── Amount (prepaid only) ── */
  const amountValue = () => {
    const raw = $('amtInput').value.replace(/[^\d.]/g, '');
    return raw === '' ? null : parseFloat(raw);
  };

  function onAmountInput() {
    const el = $('amtInput');
    el.value = el.value.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1');
    validateAmount();
    updateBtn();
  }

  function unformatAmount() {
    const n = amountValue();
    $('amtInput').value = n === null ? '' : String(n);
  }

  function formatAmount() {
    const n = amountValue();
    if (n !== null && !isNaN(n)) $('amtInput').value = fmt(n) + (mode === 'kwh' ? ' kWh' : ' ETB');
  }

  // Kilowatt hours are billed at a flat rate, so every check still runs on ETB.
  const costOf = n => mode === 'kwh' ? n * RATE : n;

  function setAmountState(state, text) {
    const field = $('amtField'), msg = $('amtMsg');
    field.classList.toggle('warn', state === 'warn');
    field.classList.toggle('err', state === 'err');
    msg.classList.toggle('warn', state === 'warn');
    msg.classList.toggle('err', state === 'err');
    msg.classList.toggle('show', !!state);
    $('balanceHintRow').style.display = state ? 'none' : '';
    if (text) msg.querySelector('.fe-txt').textContent = text;
  }

  function validateAmount() {
    const n = amountValue();
    const hint = $('costHint');
    hint.style.display = 'none';
    if (n === null) { setAmountState(null); return null; }

    const unit = mode === 'kwh' ? ' kWh' : ' ETB';
    const cost = costOf(n);
    if (isNaN(n) || n <= 0) { setAmountState('err', 'Enter a valid ' + (mode === 'kwh' ? 'reading' : 'amount')); return null; }
    if (cost < MIN_AMT) { setAmountState('err', 'Minimum ' + (mode === 'kwh' ? 'Kilo Watt: ' + fmt(MIN_AMT / RATE) + unit : 'Amount: ' + fmt(MIN_AMT) + unit)); return null; }
    if (cost > MAX_AMT) { setAmountState('err', 'Maximum ' + (mode === 'kwh' ? 'Kilo Watt: ' + fmt(MAX_AMT / RATE) + unit : 'Amount: ' + fmt(MAX_AMT) + unit)); return null; }
    if (cost + FEE > BALANCE) { setAmountState('warn', 'Insufficient Balance'); return null; }

    // In kilowatt mode the ETB cost is not obvious, so spell it out.
    if (mode === 'kwh') {
      hint.textContent = fmt(n) + ' kWh = ' + fmt(cost) + ' ETB';
      hint.style.display = '';
    }
    setAmountState(null);
    return n;
  }

  function updateBtn() {
    const ok = open === 'post' ? !!contract
             : open === 'pre'  ? (!!serial && validateAmount() !== null)
             : false;
    $('continueBtn').classList.toggle('active', ok);
    $('continueBtn').disabled = !ok;
  }

  /* ── Continue ── */
  function continuePayment() {
    let payload = null;

    if (open === 'post' && contract) {
      payload = {
        plan: 'post',
        planLabel: 'Post Paid',
        account: contract.number,
        customerName: contract.customer,
        billMonth: contract.month,
        payAmount: contract.amount.toFixed(2)
      };
    } else if (open === 'pre' && serial) {
      const entered = validateAmount();
      if (entered === null) return;
      payload = {
        plan: 'pre',
        planLabel: 'PrePaid',
        account: serial.number,
        customerName: serial.customer,
        payAmount: costOf(entered).toFixed(2)
      };
      if (mode === 'kwh') payload.kilowatts = String(entered);
    }
    if (!payload) return;

    payload.biller = BILLER;
    payload.fee = FEE.toFixed(2);
    payload.serviceFee = SERVICE_FEE.toFixed(2);
    payload.vat = VAT.toFixed(2);
    payload.total = (parseFloat(payload.payAmount) + FEE).toFixed(2);
    payload.payAccount = 'main';
    payload.payerName = 'Abebeb Bikila Maraton';
    // Prepaid credit is redeemed with a token; a post-paid bill is simply settled.
    if (payload.plan === 'pre') payload.token = genToken();
    sessionStorage.setItem('billPaymentData', JSON.stringify(payload));
    window.location.href = 'Bill Payment_Review.html';
  }

  // Four groups of four digits, the way a meter token is printed.
  function genToken() {
    return Array.from({ length: 4 }, () =>
      String(Math.floor(1000 + Math.random() * 9000))).join(' ');
  }

  function goBack() { window.location.href = 'Pay Bill.html'; }
</script>

<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
