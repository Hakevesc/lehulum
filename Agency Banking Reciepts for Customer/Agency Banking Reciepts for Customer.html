<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agency Banking Receipts for Customer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Switzer:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', 'Switzer', sans-serif; background: linear-gradient(135deg, #A41016 0%, #ED1C24 100%); display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 300px; min-width: 300px; background: #FFF; display: flex; flex-direction: column; height: 100vh; overflow: hidden; border-right: 1px solid #E8E8EC; }
  .sidebar-header { padding: 16px 16px 12px; border-bottom: 1px solid #E8E8EC; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .sidebar-header .logo { width: 32px; height: 32px; border-radius: 8px; background: #FE353D; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; font-weight: 700; }
  .sidebar-header .title { color: #1C1C21; font-size: 15px; font-weight: 600; font-family: 'Switzer', sans-serif; }
  .sidebar-header .subtitle { color: #7C7C87; font-size: 11px; font-weight: 400; }
  .sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 0 20px; scrollbar-width: none; -ms-overflow-style: none; }
  .sidebar-scroll::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .sidebar-scroll::-webkit-scrollbar-thumb { display: none; }
  .category-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 6px 14px; cursor: pointer; user-select: none; transition: background 0.15s; }
  .category-header:hover { background: #F5F5F5; }
  .category-label { color: #7C7C87; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-family: 'Switzer', sans-serif; }
  .category-chevron { width: 16px; height: 16px; stroke: #7C7C87; stroke-width: 2; fill: none; transition: transform 0.2s; }
  .category-chevron.collapsed { transform: rotate(-90deg); }
  .category-items { overflow: hidden; max-height: 1000px; transition: max-height 0.25s ease; }
  .category-items.closed { max-height: 0; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 16px; margin: 1px 8px; border-radius: 8px; cursor: pointer; transition: all 0.12s; color: #1C1C21; font-size: 13px; font-weight: 400; font-family: 'Switzer', sans-serif; text-decoration: none; border: none; background: transparent; width: calc(100% - 16px); text-align: left; }
  .nav-item:hover { background: #F5F5F5; }
  .nav-item.active { background: #FFF1F2; color: #FE353D; font-weight: 600; }
  .nav-item .icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .nav-item .icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .main-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  /* Source receipt pages already render their own phone-frame (rounded corners,
     shadow, status bar) inside a 20px page padding. This container just hosts
     that page's natural render size (360+40 x 780+40) as a transparent window
     so only the source's phone shows — no second frame stacked on top of it. */
  .center-phone { width: 400px; height: 820px; background: transparent; overflow: hidden; position: relative; flex-shrink: 0; }
  .center-phone iframe { width: 100%; height: 100%; border: none; background: transparent; display: block; }
  .mobile-toggle { display: none; position: fixed; top: 10px; left: 10px; z-index: 1000; width: 38px; height: 38px; border-radius: 10px; background: rgba(254,53,61,0.9); border: none; cursor: pointer; align-items: center; justify-content: center; }
  .mobile-toggle svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2; }
  .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 99; }
  @media (max-width: 768px) {
    .sidebar { position: fixed; left: -330px; top: 0; z-index: 100; transition: left 0.3s; box-shadow: 4px 0 24px rgba(0,0,0,0.3); }
    .sidebar.open { left: 0; }
    .sidebar-overlay.open { display: block; }
    .mobile-toggle { display: flex; }
    .center-phone { transform: scale(0.8); }
  }
</style>
</head>
<body>
<button class="mobile-toggle" onclick="toggleSidebar()"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">M</div>
    <div><div class="title">Agency Banking Receipts</div><div class="subtitle">9 Receipt Types</div></div>
  </div>
  <div class="sidebar-scroll" id="sidebarNav"></div>
</div>
<div class="main-area">
  <div class="center-phone"><iframe id="pageIframe" src="Agency Banking Cashout.html" scrolling="no" frameborder="0"></iframe></div>
</div>
<script>
const receipts = [
  { group: 'Agency Banking', label: 'Cashout (Bank to Merchant)', file: 'Agency Banking Cashout.html', icon: 'send' },
  { group: 'Agency Banking', label: 'Cash In (Merchant to Bank)', file: 'Agency Banking Cash In.html', icon: 'money' },
  { group: 'Agency Banking', label: 'M-PESA Customer Cashout', file: 'M-PESA Customer.html', icon: 'user' },
  { group: 'Agency Banking', label: 'M-PESA Customer Cash In', file: 'M-PESA Customer Cash In.html', icon: 'check' },
  { group: 'Pay Utility', label: 'Payment ET (Ethiopian Airlines)', file: 'Pay Utility ET.html', icon: 'send' },
  { group: 'Pay Utility', label: 'Payment DSTV (Subscription)', file: 'Pay Utility DSTV.html', icon: 'smartphone' },
  { group: 'Pay Utility', label: 'Payment Water (AA Water Auth)', file: 'Pay Utility Water.html', icon: 'receipt' },
  { group: 'Pay Utility', label: 'Payment School (Bole Intl)', file: 'Pay Utility School.html', icon: 'shield' },
  { group: 'Pay Utility', label: 'Payment EEU (Electric)', file: 'Pay Utility EEU.html', icon: 'info' },
];
const icons = {
  send: '<svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4 20-7z"/></svg>',
  money: '<svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
  user: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  smartphone: '<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>',
  receipt: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  shield: '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>',
  info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
};
const groups = [...new Set(receipts.map(p => p.group))];
const nav = document.getElementById('sidebarNav');
let collapsedGroups = JSON.parse(localStorage.getItem('abRecCollapsed') || '[]');
groups.forEach(group => {
  const items = receipts.filter(p => p.group === group);
  const isCollapsed = collapsedGroups.includes(group);
  const header = document.createElement('div');
  header.className = 'category-header';
  header.innerHTML = '<span class="category-label">' + group + '</span><svg class="category-chevron ' + (isCollapsed ? 'collapsed' : '') + '" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';
  header.onclick = () => toggleGroup(group);
  const container = document.createElement('div');
  container.className = 'category-items ' + (isCollapsed ? 'closed' : '');
  items.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.innerHTML = '<span class="icon">' + (icons[p.icon] || icons.receipt) + '</span>' + p.label;
    btn.dataset.page = p.file;
    btn.onclick = () => loadPage(btn, p.file);
    container.appendChild(btn);
  });
  nav.appendChild(header);
  nav.appendChild(container);
});
function toggleGroup(name) {
  const idx = collapsedGroups.indexOf(name);
  if (idx > -1) collapsedGroups.splice(idx, 1);
  else collapsedGroups.push(name);
  localStorage.setItem('abRecCollapsed', JSON.stringify(collapsedGroups));
  document.querySelectorAll('.category-header').forEach(h => {
    if (h.querySelector('.category-label').textContent === name) {
      h.querySelector('.category-chevron').classList.toggle('collapsed');
      h.nextElementSibling.classList.toggle('closed');
    }
  });
}
function loadPage(btn, file) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('pageIframe').src = file;
  closeSidebar();
}
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }
document.querySelector('.nav-item')?.classList.add('active');
</script>

<!-- Export to Figma button (shared exporter) — lives at the gallery level so
     it sits on the page background, not inside the iframe-loaded receipt. -->
<script src="../figma-export.js"></script>
</body>
</html>
