<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Timed Out</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Border: #E8E8EC;
    --Warning: #FF9800;
    --Warning-Light: #FFF8E1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif; background: transparent;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .phone-frame {
    width: 360px; height: 780px; background: #F5F5F5; border-radius: 30px;
    overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 14px 24px 8px; background: #F5F5F5;
  }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px 12px; background: #F5F5F5;
  }
  .back-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%;
    background: transparent; border: none; cursor: pointer; transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; }
  .header-title {
    color: var(--On-Surface); font-family: 'Switzer', sans-serif;
    font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center;
  }

  .result-body {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px 28px; text-align: center;
  }
  .result-icon {
    width: 96px; height: 96px; border-radius: 28px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px; background: var(--Warning-Light);
    box-shadow: 0 4px 20px rgba(255,152,0,0.18);
  }
  .result-icon svg { width: 46px; height: 46px; stroke: var(--Warning); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .result-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 12px; }
  .result-desc { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 400; line-height: 1.6; max-width: 282px; }
  .reassure {
    margin-top: 18px; display: inline-flex; align-items: center; gap: 8px;
    background: #FFF; border: 1px solid var(--Border); border-radius: 12px;
    padding: 10px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .reassure svg { width: 16px; height: 16px; stroke: var(--On-Surface-Low); stroke-width: 2; fill: none; }
  .reassure span { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 500; }

  .bottom-area {
    width: 100%; display: flex; flex-direction: column; align-items: center;
    padding: 0 24px 28px; gap: 12px;
  }
  .btn-primary {
    width: 100%; height: 50px; border-radius: 14px;
    background: var(--Primary); color: #FFF1F2;
    font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500;
    border: none; cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(254,53,61,0.25);
  }
  .btn-primary:hover { background: #E5303A; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(254,53,61,0.35); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-link {
    color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif;
    font-size: 13px; font-weight: 500; cursor: pointer;
    background: none; border: none; padding: 6px 0; transition: color 0.2s;
  }
  .btn-link:hover { color: var(--On-Surface); }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>

<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="window.location.href='Lehulum Home.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <span class="header-title">Transfer</span>
      <div style="width: 36px;"></div>
    </div>

    <div class="result-body">
      <div class="result-icon">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>
      </div>
      <h2 class="result-title">Request Timed Out</h2>
      <p class="result-desc">The transfer is taking longer than expected. Please check your connection and try again.</p>
      <div class="reassure">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>Confirm in History before retrying</span>
      </div>
    </div>

    <div class="bottom-area">
      <button class="btn-primary" onclick="history.back()">Try Again</button>
      <button class="btn-link" onclick="window.location.href='Transaction History.html'">Check Transaction History</button>
    </div>

  </div>
</div>

<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
