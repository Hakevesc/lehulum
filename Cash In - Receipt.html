<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash In - Receipt</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&family=Barlow:wght@400&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --Primary-Dark: #C41520;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Gray-0: #FFF;
    --Primary-Light: #FFF1F2;
    --Success: #1FC83B;
    --Success-Light: #E8F9EC;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: transparent;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }

  .phone-frame {
    width: 360px; height: 780px;
    background: #F5F5F5; border-radius: 30px;
    overflow: hidden; position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }

  .app-content { height: 100%; position: relative; display: flex; flex-direction: column; }

  /* Status Bar */
  .status-bar {
    flex-shrink: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 14px 24px 8px; background: #F5F5F5;
  }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  /* Header */
  .header-nav {
    flex-shrink: 0; z-index: 5;
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: #F5F5F5;
  }
  .close-btn, .header-action-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%;
    background: transparent; border: none; cursor: pointer; transition: all 0.2s;
  }
  .close-btn:hover, .header-action-btn:hover { background: rgba(0,0,0,0.05); }
  .close-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; }
  .header-action-btn svg { width: 20px; height: 20px; stroke: var(--On-Surface); stroke-width: 1.8px; }
  .header-title {
    color: var(--On-Surface); font-family: 'Switzer', sans-serif;
    font-size: 17px; font-weight: 500; letter-spacing: 0.3px;
    flex: 1; text-align: center;
  }
  .header-actions { display: flex; gap: 4px; }

  /* Scrollable Content */
  .scrollable-content {
    flex: 1; overflow-y: auto; padding: 0 16px 20px;
    display: flex; flex-direction: column;
  }
  .scrollable-content::-webkit-scrollbar { width: 0; }

  /* Receipt Card */
  .receipt-card {
    width: 100%; background: #FAFAFA; border: 1px solid #EFEFF2; border-radius: 20px;
    padding: 46px 18px 22px;
    display: flex; flex-direction: column; align-items: center;
    position: relative; overflow: visible;
    margin-top: 34px;
  }

  /* Green success circle overlapping the top */
  .success-icon-wrapper {
    position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--Success-Light); border: 2px solid var(--Success);
    display: flex; align-items: center; justify-content: center;
    z-index: 10; box-shadow: 0 0 0 5px #F5F5F5;
  }
  .success-icon-wrapper svg { width: 26px; height: 26px; stroke: var(--Success); stroke-width: 2.5; fill: none; }

  /* Receipt Header */
  .receipt-header { width: 100%; text-align: center; margin-bottom: 18px; }
  .receipt-header h2 {
    color: var(--On-Surface); font-family: 'Switzer', sans-serif;
    font-size: 20px; font-weight: 700; letter-spacing: -0.2px; margin-bottom: 6px;
  }
  .receipt-header p {
    color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif;
    font-size: 12.5px; font-weight: 400;
  }

  /* Transaction Details */
  .transaction-details {
    width: 100%; display: flex; flex-direction: column;
    gap: 13px; margin-bottom: 18px;
  }
  .detail-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .detail-row .label {
    color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif;
    font-size: 12px; font-weight: 400; letter-spacing: 0.1px;
    flex-shrink: 0; max-width: 150px;
  }
  .detail-row .value {
    color: var(--On-Surface); font-family: 'Switzer', sans-serif;
    font-size: 13px; font-weight: 500;
    text-align: right; overflow-wrap: break-word; flex: 1;
  }
  .detail-row .value.copyable { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }

  .copy-btn {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 8px; background: transparent; border: none;
    cursor: pointer; transition: all 0.2s; border-radius: 6px;
  }
  .copy-btn:hover { background: var(--Primary-Light); }
  .copy-btn .copy-text { color: var(--Primary); font-family: 'Switzer', sans-serif; font-size: 11px; font-weight: 500; }
  .copy-btn svg { width: 14px !important; height: 14px !important; stroke: var(--Primary); stroke-width: 2; fill: none; }
  .copy-btn.copied .copy-text, .copy-btn.copied svg { stroke: var(--Success); color: var(--Success); }

  /* Stamp Watermark */
  .stamp-watermark {
    position: absolute; top: 52%; left: 50%;
    transform: translate(-50%, -50%);
    width: 230px; height: 230px;
    opacity: 0.5; mix-blend-mode: multiply;
    pointer-events: none; z-index: 1;
  }
  .stamp-watermark img { width: 100%; height: 100%; object-fit: contain; }

  /* Amount Section */
  .amount-section {
    width: 100%; text-align: center;
    padding-top: 16px; border-top: 1px solid #E8E8EC;
    position: relative; z-index: 2;
  }
  .beneficiary-name {
    color: var(--On-Surface); font-family: 'Switzer', sans-serif;
    font-size: 16px; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.2px;
  }
  .amount-display { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 18px; }
  .amount-value {
    color: var(--Success); font-family: 'Switzer', sans-serif;
    font-size: 38px; font-weight: 700; letter-spacing: -0.5px; line-height: 1;
  }
  .amount-currency {
    color: var(--Success); font-family: 'Switzer', sans-serif;
    font-size: 16px; font-weight: 500;
    padding-left: 10px; border-left: 2px solid var(--Success); line-height: 1.1;
  }

  /* QR Code */
  .qr-wrapper {
    padding: 6px; border: 3px solid var(--Primary);
    border-radius: 14px; background: #FFF;
    display: inline-block; position: relative; z-index: 2;
  }
  .qr-wrapper img { width: 76px; height: 76px; display: block; }

  /* Bottom Actions */
  .bottom-actions {
    flex-shrink: 0;
    display: flex; justify-content: space-around;
    padding: 10px 16px 12px; width: 100%;
    background: #F5F5F5;
  }
  .action-btn {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: transparent; border: none; cursor: pointer;
    transition: all 0.2s; flex: 1; padding: 4px 0;
  }
  .action-btn:hover { transform: translateY(-2px); }
  .action-btn:active { transform: scale(0.95); }
  .action-icon {
    width: 46px; height: 46px; border-radius: 13px;
    border: 1.5px solid var(--Primary); background: transparent;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .action-btn:hover .action-icon { background: var(--Primary-Light); }
  .action-icon svg { width: 22px; height: 22px; stroke: var(--Primary); stroke-width: 2; fill: none; }
  .action-label {
    color: var(--On-Surface); font-family: 'Switzer', sans-serif;
    font-size: 11px; font-weight: 500; letter-spacing: 0.1px;
  }

  /* Toast */
  .toast {
    position: absolute; bottom: 96px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--On-Surface); color: #FFF;
    padding: 11px 22px; border-radius: 12px;
    font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 500;
    opacity: 0; pointer-events: none; transition: all 0.3s ease;
    z-index: 1000; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Share sheet ── */
  /* Bottom modal for sharing the receipt through a common set of apps,
     matching the app's other bottom-sheet conventions (sheet-overlay /
     sheet / sheet-grip / sheet-close / sheet-title). */
  .sheet-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 50; }
  .sheet-overlay.show { opacity: 1; pointer-events: auto; }
  .sheet { position: relative; width: 100%; max-height: 82%; overflow-y: auto; background: #FFF; border-radius: 24px 24px 0 0; padding: 12px 20px 22px; display: flex; flex-direction: column; gap: 14px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1); }
  .sheet-overlay.show .sheet { transform: translateY(0); }
  .sheet-grip { width: 44px; height: 4px; border-radius: 2px; background: #D8D8DE; margin: 0 auto 4px; }
  .sheet-close { position: absolute; top: 12px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: var(--Field, #F5F5F5); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .sheet-close svg { width: 15px; height: 15px; stroke: var(--On-Surface-Low); stroke-width: 2; fill: none; }
  .sheet-title { font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 700; color: var(--On-Surface); text-align: center; }
  .share-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 8px; padding: 4px 0 6px; }
  .share-item { display: flex; flex-direction: column; align-items: center; gap: 7px; background: none; border: none; padding: 0; cursor: pointer; }
  .share-item .ico { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .share-item .ico svg { width: 22px; height: 22px; }
  .share-item span { font-family: 'Switzer', sans-serif; font-size: 11px; color: var(--On-Surface-Low); text-align: center; }
</style>
<script src="assets/qrcode.min.js"></script>
<script src="assets/qr.js"></script>
</head>
<body>

<div class="phone-frame">
  <div class="app-content">

    <!-- Status Bar -->
    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>

      <!-- Share sheet — lets the customer share the receipt through a common

<div class="toast" id="toast"></div>

<script>
  const data = JSON.parse(sessionStorage.getItem('cashInData') || '{}');
  const agent = data.agent || {};
  const $ = id => document.getElementById(id);
  const fmt = n => parseFloat(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  const amount = parseFloat(data.amount || 0);
  $('detailType').textContent = 'Cash-In';
  $('detailAgent').textContent = data.agentName || agent.name || '\u2014';
  $('detailAgentCode').textContent = data.agentCode || agent.code || '\u2014';
  $('detailName').textContent = data.customerName || 'Derartu Tulu Andegna';
  $('detailAmount').textContent = '+' + Math.round(amount).toLocaleString('en-US');
  $('transactionId').textContent = data.ref || ('U' + 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random()*26)] + Array.from({length:8},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join(''));

  const pad = n => String(n).padStart(2, '0');
  const stamp = d => pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() +
    ' at ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

  $('detailDate').textContent = stamp(new Date());

  const qrData = encodeURIComponent(JSON.stringify({
    type: 'Cash-In',
    voucher: data.voucherCode || '',
    txId: $('transactionId').textContent,
    amount: fmt(amount) + ' ETB'
  }));
  renderQR($('qrCode'), decodeURIComponent(qrData), 240);

  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function copyText(text) {
    return navigator.clipboard.writeText(text).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    });
  }

  function copyTransactionId() {
    copyText($('transactionId').textContent);
    $('copyBtn').classList.add('copied');
    $('copyBtn').querySelector('.copy-text').textContent = 'Copied!';
    showToast('Transaction ID copied to clipboard');
    setTimeout(() => { $('copyBtn').classList.remove('copied'); $('copyBtn').querySelector('.copy-text').textContent = 'Copy ID'; }, 2000);
  }

  function shareReceipt() { openShareSheet(); }

  function openShareSheet() { document.getElementById('shareSheetOverlay').classList.add('show'); }
  function closeShareSheet() { document.getElementById('shareSheetOverlay').classList.remove('show'); }
  function shareVia(app) {
    closeShareSheet();
    showToast('Receipt shared via ' + app + '!');
  }

  function copyReceiptLink() {
    // Copy only — do NOT close the sheet
    const url = window.location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).catch(() => fallbackCopy(url));
    } else {
      fallbackCopy(url);
    }
    showToast('Receipt link copied!');
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'absolute';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }

  function downloadReceipt() { showToast('Downloading receipt as PDF...'); }
  function goHome() { sessionStorage.removeItem('cashInData'); window.location.href = 'Lehulum Home.html'; }
  function addToFavorite() { showToast('Added to favorites!'); }
  function cashInAgain() { sessionStorage.removeItem('cashInData'); window.location.href = 'Cash In.html'; }
</script>
