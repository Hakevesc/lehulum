<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSTV</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Background: #F5F5F5;
    --Field-Border: #EFEFF1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; background: var(--Background); flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); flex-shrink: 0; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .scroll { flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  .scroll::-webkit-scrollbar { width: 0; }

  /* ── What the subscriber is on today ── */
  .current-card { background: #FFF; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 14px; flex-shrink: 0; }
  .current-head { display: flex; align-items: center; gap: 10px; }
  .current-head svg { width: 20px; height: 20px; stroke: var(--On-Surface); stroke-width: 1.7; fill: none; }
  .current-head span { font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 500; color: var(--On-Surface); }
  .current-item { position: relative; border: 1px solid var(--Field-Border); border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 14px; }
  .active-badge { position: absolute; top: -11px; right: 14px; background: #EDEDF0; color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.6px; padding: 4px 9px; border-radius: 6px; }
  .logo { width: 40px; height: 40px; border-radius: 50%; background: #FFF; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.14); }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  .item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .item-name { font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 700; color: var(--On-Surface); }
  .item-sub { font-family: 'Switzer', sans-serif; font-size: 12.5px; color: var(--On-Surface-Low); }

  /* ── Period ── */
  .section-title { font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 500; color: var(--On-Surface); padding: 0 2px; }
  .periods { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { height: 36px; padding: 0 13px; border: none; border-radius: 999px; background: #ADADB5; color: #FFF; font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 600; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.18s, transform 0.12s; }
  .pill:hover { background: #9B9BA4; }
  .pill:active { transform: scale(0.97); }
  .pill.selected { background: var(--Primary); }
  .pill.selected:hover { background: #E5303A; }
  .pill svg { width: 14px; height: 14px; stroke: #FFF; stroke-width: 3; fill: none; display: none; }
  .pill.selected svg { display: block; }

  /* ── Choices ── */
  .option-list { display: flex; flex-direction: column; gap: 12px; }
  .option-row { background: #FFF; border: 1.5px solid transparent; border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 14px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s; }
  .option-row:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.08); transform: translateY(-1px); }
  .option-row.selected { border-color: var(--Primary); }
  .option-action { font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 700; color: var(--Primary); flex-shrink: 0; }
  .option-row.selected .option-action { display: none; }
  .option-check { display: none; width: 24px; height: 24px; border-radius: 50%; border: 1.8px solid var(--Primary); align-items: center; justify-content: center; flex-shrink: 0; }
  .option-check svg { width: 13px; height: 13px; stroke: var(--Primary); stroke-width: 3; fill: none; }
  .option-row.selected .option-check { display: flex; }

  /* ── Action ── */
  .bottom-bar { flex-shrink: 0; padding: 10px 16px 18px; background: var(--Background); }
  .confirm-btn { width: 100%; height: 52px; border-radius: 14px; border: none; background: #E0E0E0; color: var(--On-Surface-Low); font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; cursor: not-allowed; transition: all 0.2s; }
  .confirm-btn.active { background: var(--Primary); color: #FFF; cursor: pointer; box-shadow: 0 4px 16px rgba(254,53,61,0.25); }
  .confirm-btn.active:hover { background: #E5303A; box-shadow: 0 6px 20px rgba(254,53,61,0.35); transform: translateY(-1px); }
  .confirm-btn.active:active { transform: scale(0.98) translateY(0); }

  /* ── Add-ons prompt ── */
  .sheet-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 50; }
  .sheet-overlay.show { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; background: #FFF; border-radius: 24px 24px 0 0; padding: 12px 20px 26px; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1); }
  .sheet-overlay.show .sheet { transform: translateY(0); }
  .sheet-grip { width: 44px; height: 4px; border-radius: 2px; background: #D8D8DE; margin: 0 auto 18px; }
  .sheet-title { text-align: center; font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 700; color: var(--On-Surface); }
  .sheet-text { text-align: center; font-family: 'Switzer', sans-serif; font-size: 14.5px; line-height: 1.5; color: var(--On-Surface); margin-top: 18px; }
  .sheet-actions { display: flex; gap: 12px; margin-top: 26px; }
  .sheet-btn { flex: 1; height: 52px; border-radius: 12px; background: #FFF; cursor: pointer; font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 500; transition: background 0.15s, transform 0.12s; }
  .sheet-btn:active { transform: scale(0.98); }
  .sheet-btn.no { border: 1.5px solid var(--Field-Border); color: var(--On-Surface-Low); }
  .sheet-btn.no:hover { background: #FAFAFA; }
  .sheet-btn.yes { border: 1.5px solid var(--Primary); color: var(--Primary); font-weight: 600; }
  .sheet-btn.yes:hover { background: #FFF5F5; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title">DSTV</span>
      <div style="width:36px;"></div>
    </div>

    <div class="scroll">

      <div class="current-card">
        <div class="current-head">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 20.5 7v10L12 21.2 3.5 17V7L12 2.8z"/><path d="M3.5 7 12 11.6 20.5 7M12 11.6v9.6"/></svg>
          <span>Current Package</span>
        </div>
        <div class="current-item">
          <span class="active-badge">ACTIVE</span>
          <span class="logo"><img src="assets/bill pay logos/dstv_logo.png" alt=""></span>
          <span class="item-info">
            <span class="item-name" id="currentName">—</span>
            <span class="item-sub" id="currentSub">—</span>
          </span>
        </div>
      </div>

      <span class="section-title">Choose Period</span>
      <div class="periods" id="periods"></div>

      <span class="section-title">Choose Packages</span>
      <div class="option-list" id="packageList"></div>

    </div>

    <div class="bottom-bar">
      <button class="confirm-btn" id="confirmBtn" onclick="confirmPackage()" disabled>Confirm Package</button>
    </div>

  </div>

  <!-- A package change is the natural moment to offer add-ons -->
  <div class="sheet-overlay" id="addonOverlay" onclick="if(event.target===this)closeAddonPrompt()">
    <div class="sheet">
      <div class="sheet-grip"></div>
      <div class="sheet-title">Add Extra  Add-ons</div>
      <div class="sheet-text">Would you like to customize your subscription with additional channels or features?</div>
      <div class="sheet-actions">
        <button class="sheet-btn no" onclick="skipAddons()">No</button>
        <button class="sheet-btn yes" onclick="goToAddons()">Yes</button>
      </div>
    </div>
  </div>
</div>

<script>
  const PACKAGES = [
    { id: 'gojo',    name: 'Gojo',    price: 290 },
    { id: 'beteseb', name: 'Beteseb', price: 550 },
    { id: 'meda',    name: 'Meda',    price: 750 }
  ];

  const PERIODS = [
    { id: '1m',  label: '1 Month',  months: 1 },
    { id: '3m',  label: '3 Month',  months: 3 },
    { id: '1y',  label: '1 Year',   months: 12 },
    { id: '6m',  label: '6 Month',  months: 6 }
  ];

  const FEE = 2;
  const LOGO = 'assets/bill pay logos/dstv_logo.png';

  const $ = id => document.getElementById(id);
  const fmt = n => parseFloat(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  let sub = { name: 'Alemayehu Tadesse', account: '7043928115', package: 'Meda', addons: '', due: 300 };
  try {
    const saved = JSON.parse(sessionStorage.getItem('dstvSubscriber') || 'null');
    if (saved && saved.account) sub = saved;
  } catch (e) { /* ignore corrupt state */ }

  $('currentName').textContent = sub.package.replace(/\s+/g, ' ').trim();
  $('currentSub').textContent = sub.account;

  let period = PERIODS[0];   // the design opens on one month
  let chosen = null;

  /* ── Period ── */
  function renderPeriods() {
    $('periods').innerHTML = PERIODS.map(p =>
      '<button class="pill' + (period && period.id === p.id ? ' selected' : '') + '" onclick="pickPeriod(\'' + p.id + '\')">' +
        p.label +
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' +
      '</button>').join('');
  }

  function pickPeriod(id) {
    period = PERIODS.find(p => p.id === id) || PERIODS[0];
    renderPeriods();
    updateBtn();
  }

  /* ── Packages ── */
  function renderPackages() {
    $('packageList').innerHTML = PACKAGES.map(p =>
      '<div class="option-row' + (chosen && chosen.id === p.id ? ' selected' : '') + '" id="pkg' + p.id + '" onclick="pickPackage(\'' + p.id + '\')">' +
        '<span class="logo"><img src="' + LOGO + '" alt=""></span>' +
        '<span class="item-info">' +
          '<span class="item-name">' + p.name + '</span>' +
          '<span class="item-sub">' + fmt(p.price) + ' Br/Month</span>' +
        '</span>' +
        '<span class="option-action">Change</span>' +
        '<span class="option-check"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>' +
      '</div>').join('');
  }

  function pickPackage(id) {
    chosen = PACKAGES.find(p => p.id === id) || null;
    renderPackages();
    updateBtn();
  }

  function updateBtn() {
    const ok = !!chosen && !!period;
    $('confirmBtn').classList.toggle('active', ok);
    $('confirmBtn').disabled = !ok;
  }

  /* ── Confirm ── */
  function confirmPackage() {
    if (!chosen || !period) return;
    sessionStorage.setItem('dstvChange', JSON.stringify({
      package: chosen.name,
      price: chosen.price,
      period: period.label,
      months: period.months,
      amount: chosen.price * period.months
    }));
    $('addonOverlay').classList.add('show');
  }

  function closeAddonPrompt() { $('addonOverlay').classList.remove('show'); }

  function goToAddons() { window.location.href = 'Bill Payment_DSTV Addons.html'; }

  function skipAddons() {
    const change = JSON.parse(sessionStorage.getItem('dstvChange') || '{}');
    sessionStorage.setItem('billPaymentData', JSON.stringify({
      plan: 'dstv',
      planLabel: '',
      biller: { name: 'DSTV', fullName: 'DSTV Ethiopia', category: 'TV', abbr: 'DS', logo: LOGO },
      account: sub.account,
      customerName: sub.name,
      rows: [
        { key: 'Business Name',   value: 'DSTV' },
        { key: 'Current Package', value: change.package },
        { key: 'Period',          value: change.period }
      ],
      receiptRows: [
        { key: 'DSTV Code',       value: sub.account },
        { key: 'Current Package', value: change.package },
        { key: 'Period',          value: change.period }
      ],
      // DSTV prints its receipt in its own order, so it supplies the whole block.
      receiptAllRows: [
        { key: 'Transaction Type',       value: 'Pay with M-Pesa' },
        { key: 'Paid To',                value: 'DSTV' },
        { key: 'Package Type',           value: change.package },
        { key: "Payer's Name",           value: 'Abebeb Bikila Maraton' },
        { key: "Payer's M-PESA Number",  value: '0712131415' },
        { key: 'Smart Card Number',      value: sub.account },
        { key: 'Fee',                    value: fmt(FEE) + ' Br' }
      ],
      dateLabel: 'Date and time',
      txType: 'DSTV Payment',
      payAmount: change.amount.toFixed(2),
      fee: FEE.toFixed(2),
      serviceFee: '2.00',
      vat: '0.00',
      total: (change.amount + FEE).toFixed(2),
      payAccount: 'main',
      payerName: 'Abebeb Bikila Maraton'
    }));
    window.location.href = 'Bill Payment_Review.html';
  }

  function goBack() { window.location.href = 'Bill Payment_DSTV.html'; }

  renderPeriods();
  pickPeriod('1m');
  renderPackages();
</script>

<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
