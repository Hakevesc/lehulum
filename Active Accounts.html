<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Accounts</title>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap');

  /* Active Accounts (See all from Saving & Credit): Savings | Credit tabs, a
     summary of the tab, then one card per account with its progress — saved
     toward the goal, or repaid / limit used — and its key dates. Open the
     Credit tab with ?tab=credit. */
  :root {
    --Primary: #FE353D;
    --Primary-Light: #FFF1F2;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Background: #F5F5F5;
    --Success: #16A34A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Switzer, sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  button { font-family: inherit; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; background: var(--Background); flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }
  .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); flex-shrink: 0; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: rgba(0,0,0,0.05); }
  .icon-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .header-title { color: var(--On-Surface); font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  /* Savings | Credit — the app's pill tabs */

  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 20px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { width: 0; }
  .panel { display: none; flex-direction: column; gap: 12px; }
  .panel.show { display: flex; }
  .panel > * { flex-shrink: 0; }

  /* Summary: total, a split bar showing how it divides across the accounts,
     a legend, and a highlight strip (next due / interest earned) */
  .mix { background: #FFF; border-radius: 22px; padding: 16px; box-shadow: 0 4px 16px rgba(15,23,42,0.06); }
  .mix-label { font-size: 12.5px; font-weight: 500; color: var(--On-Surface-Low); }
  .mix-amt { margin-top: 2px; font-size: 26px; font-weight: 700; letter-spacing: -0.4px; color: var(--On-Surface); white-space: nowrap; }
  .mix-amt small { font-size: 13px; font-weight: 500; margin-left: 4px; color: var(--On-Surface-Low); }
  .mix-bar { margin-top: 14px; display: flex; gap: 3px; height: 10px; }
  .mix-bar i { display: block; height: 100%; border-radius: 3px; min-width: 6px; }
  .mix { position: relative; }
  .mix-bar i { transition: opacity 0.25s; }
  .mix-bar.focus i { opacity: 0.3; }
  .mix-bar.focus i.cur { opacity: 1; }
  /* Arrows (top right) step through the accounts one slide at a time */
  .ms-nav { position: absolute; top: 14px; right: 14px; display: flex; align-items: center; gap: 8px; }
  .ms-count { order: 2; font-size: 11.5px; font-weight: 600; color: var(--On-Surface-Low); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ms-count b { color: var(--On-Surface); }
  .ms-nav button:last-child { order: 3; }
  .ms-nav button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid #ECECF0; background: #FFF; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .ms-nav button:disabled { opacity: 0.4; cursor: default; }
  .ms-nav svg { width: 15px; height: 15px; stroke: var(--On-Surface); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ms-track { margin-top: 12px; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 14px; }
  .ms-track::-webkit-scrollbar { display: none; }
  .ms-slide { flex: 0 0 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--Primary-Light); }
  .ms-l { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ms-l .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .ms-l .dot { align-self: flex-start; margin-top: 4px; }
  .ms-name { min-width: 0; }
  .ms-name b { display: block; font-size: 13.5px; font-weight: 600; color: var(--On-Surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ms-name small { display: block; margin-top: 2px; font-size: 11px; color: var(--On-Surface-Low); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ms-r { text-align: right; flex-shrink: 0; }
  .ms-r small { display: block; font-size: 11px; color: var(--On-Surface-Low); white-space: nowrap; }
  .ms-slide { background: #F7F7F9; }
  .has-late .ms-slide, .ms-slide.late { background: var(--Primary-Light); }
  .ms-slide.late .ms-r small { color: var(--Primary); font-weight: 600; }
  .ms-slide.late .ms-r b { color: var(--Primary); }
  .badge.late { background: #FDECEC; color: #C8161D; }
  .ms-r b { display: block; margin-top: 2px; font-size: 14px; font-weight: 700; color: var(--On-Surface); white-space: nowrap; }
  /* Highlight strip: red gradient, two figures side by side, each on two lines */
  .mix-strip { margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; color: #FFF;
    background: linear-gradient(115deg, #FF3B40 0%, #EE2A30 50%, #C8161D 100%); box-shadow: 0 6px 16px rgba(238,42,48,0.22); }
  .mix-strip > svg { width: 32px; height: 32px; padding: 7px; border-radius: 10px; background: rgba(255,255,255,0.18); flex-shrink: 0; stroke: #FFF; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ms-fig { position: relative; flex: 1; min-width: 0; }
  .ms-fig + .ms-fig { padding-left: 12px; }
  .ms-fig .split { position: absolute; left: 0; top: 2px; bottom: 2px; width: 1px; background: rgba(255,255,255,0.3); }
  .ms-fig small { display: block; font-size: 11px; color: rgba(255,255,255,0.85); }
  .ms-fig b { display: block; margin-top: 2px; font-size: 14px; font-weight: 700; white-space: nowrap; }

  .list-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px -2px; }
  .list-head h3 { font-size: 15px; font-weight: 600; color: var(--On-Surface); }
  .list-head small { font-size: 12px; color: var(--On-Surface-Low); }

  /* Account card */
  #savList, #creList { display: flex; flex-direction: column; gap: 12px; }
  .acct { background: #FFF; border-radius: 20px; padding: 14px; box-shadow: 0 4px 16px rgba(15,23,42,0.06); cursor: pointer; }
  .acct:active { transform: scale(0.99); }
  .acct-top { display: flex; align-items: center; gap: 12px; }
  .acct-ic { width: 44px; height: 44px; border-radius: 13px; background: var(--Primary-Light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .acct-ic img { width: 28px; height: 28px; }
  .acct-ic.bank { background: #FFF; border: 1px solid #EFEFF2; }
  .acct-ic.bank img { width: 30px; height: 30px; object-fit: contain; }
  .acct-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .acct-info b { font-size: 14.5px; font-weight: 700; color: var(--On-Surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acct-info small { font-size: 12px; color: var(--On-Surface-Low); }
  .badge { flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.ok { background: #E8F9EE; color: #167C2A; }
  .badge.warn { background: #FEF3C7; color: #B45309; }
  .badge.lock { background: #EDEDF0; color: #55555E; }
  .acct-amt { margin-top: 14px; display: flex; align-items: baseline; justify-content: space-between; }
  .acct-amt b { font-size: 20px; font-weight: 700; color: var(--On-Surface); letter-spacing: -0.2px; }
  .acct-amt b span { font-size: 11.5px; font-weight: 500; color: var(--On-Surface-Low); margin-left: 3px; }
  .acct-amt small { font-size: 12px; color: var(--On-Surface-Low); }
  /* Credit cards (Repay): outstanding / total with captions, Repay in the footer */
  .acct-amt.two { align-items: flex-end; }
  .acct-amt.two > div:last-child { text-align: right; }
  .acct-amt.two em { display: block; margin-top: 2px; font-style: normal; font-size: 11px; color: var(--On-Surface-Low); }
  .acct-amt.two small b { color: var(--On-Surface); }
  .repay { flex-shrink: 0; height: 34px; padding: 0 18px; border: none; border-radius: 999px; background: var(--Primary); color: #FFF; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 3px 10px rgba(254,53,61,0.25); }
  .acct-foot.due svg { stroke: var(--Primary); }
  .acct-amt small b { font-size: 12px; font-weight: 600; color: var(--On-Surface); letter-spacing: 0; }
  .bar { margin-top: 8px; height: 8px; border-radius: 4px; background: #F1F1F4; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--Primary); }
  .bar.credit i { background: #2F6BEA; }
  .acct-foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid #F1F1F4; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #55555E; }
  .acct-foot svg { width: 15px; height: 15px; stroke: #8A8A94; stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .acct-foot span { flex: 1; }
  .acct-foot .chev { stroke: #55555E; stroke-width: 2.2; }

  /* Open a new one */
  .add { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border: 1.5px dashed #F4B4BA; border-radius: 16px; background: #FFF; color: var(--Primary); font-size: 14px; font-weight: 600; cursor: pointer; }
  .add svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; }

  /* Transactions (credit): the latest few, See all → Loan Transactions */
  .see-all { display: inline-flex; align-items: center; gap: 2px; border: none; background: none; padding: 0; cursor: pointer; color: var(--Primary); font-size: 12.5px; font-weight: 600; }
  .see-all svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .txs { background: #FFF; border-radius: 20px; padding: 4px 14px; box-shadow: 0 4px 16px rgba(15,23,42,0.06); }
  .tx { display: flex; align-items: center; gap: 12px; padding: 11px 0; cursor: pointer; }
  .tx + .tx { border-top: 1px solid #F4F4F6; }
  .tx .ic { width: 40px; height: 40px; border-radius: 12px; background: #FFE4E5; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tx .ic svg { width: 18px; height: 18px; stroke: var(--Primary); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .tx.in .ic { background: #E8F9EE; }
  .tx.in .ic svg { stroke: var(--Success); }
  .tx .info { flex: 1; min-width: 0; }
  .tx .info b { display: block; font-size: 13.5px; font-weight: 500; color: var(--On-Surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .info small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--On-Surface-Low); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .right { text-align: right; flex-shrink: 0; }
  .tx .right b { display: block; font-size: 13.5px; font-weight: 700; color: var(--Primary); white-space: nowrap; }
  .tx.in .right b { color: var(--Success); }
  .tx .right small { display: block; margin-top: 2px; font-size: 11px; color: var(--On-Surface-Low); }
  .no-tx { padding: 16px 0; text-align: center; font-size: 12.5px; color: var(--On-Surface-Low); }

  .toast { position: absolute; left: 50%; bottom: 40px; transform: translate(-50%, 10px); background: #1C1C21; color: #FFF; font-size: 13px; padding: 10px 14px; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; white-space: nowrap; z-index: 140; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="icon-btn" onclick="location.href='Credit & Saving.html'" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <span class="header-title" id="pageTitle">My Savings</span>
      <div style="width:36px;"></div>
    </div>


    <div class="scroll">
      <!-- Savings -->
      <section class="panel show" id="pSav">
        <div class="mix" id="savCard">
          <div class="ms-nav"><span class="ms-count" id="savPos"></span><button type="button" id="savPrev" aria-label="Previous account"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><button type="button" id="savNext" aria-label="Next account"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
          <div class="mix-label">Total Savings</div>
          <div class="mix-amt"><span id="savTotal"></span><small>ETB</small></div>
          <div class="mix-bar" id="savBar"></div>
          <div class="ms-track" id="savTrack"></div>
          <div class="mix-strip"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg><div class="ms-fig"><small>Interest earned</small><b>+245.30 ETB</b></div><div class="ms-fig"><span class="split" data-shape="line" data-name="line"></span><small>Locked</small><b>10,000.00 ETB</b></div></div>
        </div>
        <div class="list-head"><h3>Saving Accounts</h3><small>2 active</small></div>
        <div id="savList"></div>
        <button class="add" type="button" onclick="location.href='Coming Soon.html?f=Start%20Saving&back=Active%20Accounts.html'"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Start a New Saving</button>
      </section>

      <!-- Credit -->
      <section class="panel" id="pCre">
        <div class="list-head"><h3>Credit Accounts</h3><small id="creCount"></small></div>
        <div id="creList"></div>
        <div class="list-head"><h3>Transactions</h3><button class="see-all" type="button" onclick="location.href='Loan Transactions.html?type=loan'">See all<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
        <div class="txs" id="creTx"></div>
      </section>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="term-loan-store.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const money = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const CAL = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
  const CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>';

  // Saving accounts: balance toward a goal
  const SAVINGS = [
    { name: 'New Phone Goal', sub: 'Goal Pocket · Flexible', icon: 'Saving.svg', bal: 20000, goal: 35000, badge: ['ok', 'Active'], foot: 'Target date: Dec 31, 2026' },
    { name: 'Emergency Fund', sub: 'Fixed · 6 months · 7% p.a.', icon: 'Saving.svg', bal: 10000, goal: 10000, badge: ['lock', 'Locked'], foot: 'Matures: Mar 15, 2027' }
  ];
  // Credit accounts: every active term loan from the Term Loan store (repaid of
  // the loan). Errif has its own page (Overdraft), so it is not listed here.
  const loans = TL.active(TL.load());
  const CREDIT = loans.map(l => {
    const nx = TL.nextDue(l), paid = TL.paidOf(l);
    const late = nx && new Date(nx.due) < Date.now();
    const soon = nx && !late && (new Date(nx.due) - Date.now()) < 5 * 864e5;
    return { id: l.id, name: l.product, link: `Term Loan - Details.html?id=${l.id}`, sub: l.lender, icon: l.logo, bank: true, bal: TL.remainingOf(l), total: l.total,
      paidPct: Math.round(paid / l.total * 100), badge: late ? ['late', 'Overdue'] : soon ? ['warn', 'Due soon'] : ['ok', 'Active'], late,
      lateAmt: late ? TL.instLeft(nx) : 0,
      foot: nx ? `Due: ${TL.dateStr(nx.due)} · ${money(TL.instLeft(nx))} ETB` : 'Fully repaid', due: nx,
      when: !nx ? 'Fully repaid' : late ? 'Overdue since ' + TL.dateStr(nx.due).replace(/ \d{4}$/, '') : 'Next due ' + TL.dateStr(nx.due) };
  });

  // Summary + counts
  const nextAll = loans.map(TL.nextDue).filter(Boolean).sort((a, b) => new Date(a.due) - new Date(b.due))[0];
  $('creCount').textContent = CREDIT.length + ' active';

  $('savList').innerHTML = SAVINGS.map(a => {
    const pct = Math.min(100, Math.round(a.bal / a.goal * 100));
    return `<div class="acct" onclick="toast('${a.name} details coming soon')">
      <div class="acct-top"><span class="acct-ic"><img src="assets/${a.icon}" alt=""></span>
        <span class="acct-info"><b>${a.name}</b><small>${a.sub}</small></span><span class="badge ${a.badge[0]}">${a.badge[1]}</span></div>
      <div class="acct-amt"><b>${money(a.bal)}<span>ETB</span></b><small>${pct}% of <b>${money(a.goal)}</b></small></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="acct-foot">${CAL}<span>${a.foot}</span>${CHEV}</div>
    </div>`;
  }).join('');

  // Card → loan details; Repay → the Repay screen for that loan
  $('creList').innerHTML = CREDIT.map(a => `<div class="acct" onclick="location.href='${a.link}'">
      <div class="acct-top"><span class="acct-ic${a.bank ? ' bank' : ''}"><img src="${a.icon}" alt=""></span>
        <span class="acct-info"><b>${a.name}</b><small>${a.sub}</small></span><span class="badge ${a.badge[0]}">${a.badge[1]}</span></div>
      <div class="acct-amt two"><div><b>${money(a.bal)}<span>ETB</span></b><em>Credit Outstanding</em></div>
        <div><small>${a.paidPct}% of <b>${money(a.total)}</b></small><em>Total Outstanding</em></div></div>
      <div class="bar credit"><i style="width:${Math.max(a.paidPct, 2)}%"></i></div>
      <div class="acct-foot due">${CAL}<span>${a.due ? 'Due: ' + TL.dateStr(a.due.due) : 'Fully repaid'}</span>
        ${a.due ? `<button class="repay" type="button" onclick="event.stopPropagation(); location.href='Term Loan - Repay.html?id=${a.id}'">Repay</button>` : ''}</div>
    </div>`).join('');

  // Summary split bar + one slide per account: one shade of red per account
  const SHADES = ['#FE353D', '#FF9599', '#B3131A', '#FFC7C9', '#7A0B10'];
  // Credit: red marks overdue only (everything else grey) and the slider shows the
  // overdue accounts; with nothing overdue the bar is all grey and lists what's next
  function mix(p, items, overdueMode) {
    const sum = items.reduce((a, x) => a + x.bal, 0) || 1;
    const bar = $(p + 'Bar'), track = $(p + 'Track'), prev = $(p + 'Prev'), next = $(p + 'Next'), count = $(p + 'Pos');
    const colour = (x, k) => overdueMode ? (x.late ? '#FE353D' : '#C9C9D1') : SHADES[k % SHADES.length];
    bar.innerHTML = items.map((x, k) => `<i style="flex:${x.bal / sum};background:${colour(x, k)}"></i>`).join('');
    const late = overdueMode ? items.filter(x => x.late) : [];
    const shown = late.length ? late : items;
    if (overdueMode) bar.classList.add('static');
    $(p + 'Card').classList.toggle('has-late', late.length > 0);
    track.innerHTML = shown.map(x => `<div class="ms-slide${x.late ? ' late' : ''}">
      <span class="ms-l"><span class="dot" style="background:${colour(x, items.indexOf(x))}"></span><span class="ms-name"><b>${x.name}</b><small>${x.sub.split(' · ')[0]}</small></span></span>
      <span class="ms-r"><small>${x.when}</small><b>${money(x.late ? x.lateAmt : x.bal)} ETB</b></span></div>`).join('');
    items = shown;
    prev.parentElement.style.display = shown.length > 1 ? '' : 'none';   // one item: no ‹ 1 of 1 ›
    let cur = -1;
    function mark(k) {
      if (k === cur) return;
      cur = k;
      if (!bar.classList.contains('static')) {
        bar.classList.add('focus');
        [...bar.children].forEach((seg, n) => seg.classList.toggle('cur', n === k));
      }
      prev.disabled = k === 0; next.disabled = k === items.length - 1;
      count.innerHTML = `<b>${k + 1}</b> of ${items.length}`;
    }
    const go = k => track.scrollTo({ left: k * track.clientWidth, behavior: 'smooth' });
    prev.onclick = () => go(Math.max(0, cur - 1));
    next.onclick = () => go(Math.min(items.length - 1, cur + 1));
    track.addEventListener('scroll', () => mark(Math.round(track.scrollLeft / track.clientWidth)), { passive: true });
    mark(0);
  }
  // Latest term loan movements: money out ↗ red, money in ↙ green
  (function () {
    const OUT = '<svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>', IN = '<svg viewBox="0 0 24 24"><path d="M17 7 7 17M15 17H7V9"/></svg>';
    const when = d => { const t = new Date(); t.setHours(0, 0, 0, 0); const x = new Date(d); x.setHours(0, 0, 0, 0); const n = Math.round((t - x) / 864e5);
      return n === 0 ? 'Today' : n === 1 ? 'Yesterday' : x.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
    const tx = TL.transactions().filter(t => !t.errif).slice(0, 4);
    $('creTx').innerHTML = tx.length ? tx.map(t => `<div class="tx${t.amt > 0 ? ' in' : ''}" onclick="location.href='${t.link}'">
        <span class="ic">${t.amt > 0 ? IN : OUT}</span><span class="info"><b>${t.name}</b><small>${t.sub}</small></span>
        <span class="right"><b>${t.amt > 0 ? '+' : '-'}${money(Math.abs(t.amt))}</b><small>${when(t.when)}</small></span></div>`).join('')
      : '<p class="no-tx">No transactions yet</p>';
  })();
  $('savTotal').textContent = money(SAVINGS.reduce((a, x) => a + x.bal, 0));
  SAVINGS.forEach(x => { x.when = x.foot.replace(':', ''); });
  mix('sav', SAVINGS);

  // One list per visit (no tabs — Saving & Credit's quick actions choose):
  // ?tab=credit → Repayment (term loans), otherwise My Savings
  function showTab(t) {
    const sav = t === 'savings';
    $('pSav').classList.toggle('show', sav); $('pCre').classList.toggle('show', !sav);
    $('pageTitle').textContent = sav ? 'My Savings' : 'Repayment';
    document.title = sav ? 'My Savings' : 'Repayment';
  }
  if (new URLSearchParams(location.search).get('tab') === 'credit') showTab('credit');

  let tt;
  function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }
</script>
