<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw Cash - Find Nearby Agent</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .app-content { height: 100%; overflow-y: auto; display: flex; flex-direction: column; }
  .app-content::-webkit-scrollbar { width: 0; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; background: var(--Background); flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }
  .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); flex-shrink: 0; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .scroll { flex: 1; overflow-y: auto; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .scroll::-webkit-scrollbar { width: 0; }

  /* Locate bar */
  .locate-bar { display: flex; align-items: center; gap: 10px; background: #FFF; border: 1.5px solid var(--Border); border-radius: 12px; padding: 9px 8px 9px 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .locate-bar .pin-ico { width: 19px; height: 19px; stroke: var(--Primary); stroke-width: 1.9; fill: none; flex-shrink: 0; }
  .loc-wrap { flex: 1; min-width: 0; }
  .locate-bar .loc { font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 600; color: var(--On-Surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .locate-bar .sub { font-family: 'Switzer', sans-serif; font-size: 11px; color: var(--On-Surface-Low); }
  .loc-input { display: none; flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: 'Switzer', sans-serif; font-size: 13.5px; font-weight: 500; color: var(--On-Surface); }
  .loc-input::placeholder { color: var(--On-Surface-Low); font-weight: 400; }
  .locate-bar.searching .loc-wrap { display: none; }
  .locate-bar.searching .loc-input { display: block; }
  .loc-btn { width: 36px; height: 36px; border-radius: 10px; border: none; background: #FFF1F2; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
  .loc-btn:hover { background: #FFE0E2; }
  .loc-btn svg { width: 17px; height: 17px; stroke: var(--Primary); stroke-width: 2; fill: none; }

  .loc-suggest { display: none; flex-direction: column; background: #FFF; border: 1.5px solid var(--Border); border-radius: 12px; overflow: hidden; margin-top: -8px; }
  .loc-suggest.show { display: flex; }
  .loc-opt { display: flex; align-items: center; gap: 10px; padding: 11px 13px; cursor: pointer; border-bottom: 1px solid #F2F2F5; transition: background 0.15s; }
  .loc-opt:last-child { border-bottom: none; }
  .loc-opt:hover { background: #FAFAFA; }
  .loc-opt svg { width: 15px; height: 15px; stroke: var(--On-Surface-Low); stroke-width: 2; fill: none; flex-shrink: 0; }
  .loc-opt span { font-family: 'Switzer', sans-serif; font-size: 13px; color: var(--On-Surface); }
  .loc-empty { font-family: 'Switzer', sans-serif; font-size: 12.5px; color: var(--On-Surface-Low); padding: 12px 13px; }

  /* Tabs */
  .tabs { display: flex; background: #FFF; border-radius: 12px; padding: 4px; gap: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .tab { flex: 1; height: 38px; border-radius: 9px; border: none; background: transparent; font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 600; color: var(--On-Surface-Low); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
  .tab svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .tab.active { background: var(--Primary); color: #FFF; box-shadow: 0 2px 8px rgba(254,53,61,0.25); }

  /* Map view */
  .map-view { position: relative; background: #EDEBE6; border-radius: 16px; height: 250px; overflow: hidden; border: 1px solid var(--Border); }
  .map-roads { position: absolute; inset: 0; background-image: repeating-linear-gradient(20deg, rgba(255,255,255,0.9) 0 2px, transparent 0 26px), repeating-linear-gradient(-20deg, rgba(255,255,255,0.85) 0 2px, transparent 0 34px); opacity: 0.55; }
  .map-block-a { position: absolute; left: 14px; top: 30px; width: 96px; height: 72px; background: #E3DFD7; border-radius: 6px; }
  .map-block-b { position: absolute; right: 22px; top: 96px; width: 110px; height: 84px; background: #E3DFD7; border-radius: 6px; }
  .map-block-c { position: absolute; left: 40px; bottom: 18px; width: 88px; height: 60px; background: #E3DFD7; border-radius: 6px; }
  .map-label { position: absolute; font-family: 'Switzer', sans-serif; font-size: 9px; color: #B9B4AA; }
  .map-label.a { left: 22px; top: 40px; }
  .map-label.b { right: 32px; top: 110px; }
  .map-label.c { left: 48px; bottom: 34px; }
  .map-pin { position: absolute; width: 32px; height: 32px; border-radius: 50%; background: var(--Primary); border: 2.5px solid #FFF; box-shadow: 0 2px 10px rgba(254,53,61,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; transform: translate(-50%, -50%); transition: transform 0.15s; }
  .map-pin:hover { transform: translate(-50%, -50%) scale(1.12); }
  .map-pin svg { width: 16px; height: 16px; stroke: #FFF; stroke-width: 2; fill: none; }
  .map-pin .dist { position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: #FFF; border-radius: 5px; padding: 1px 5px; font-family: 'Switzer', sans-serif; font-size: 9.5px; font-weight: 700; color: var(--Primary); white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,0.18); }
  .map-you { position: absolute; left: 52%; top: 46%; width: 16px; height: 16px; border-radius: 50%; background: #2B6BFF; border: 2.5px solid #FFF; box-shadow: 0 1px 6px rgba(0,0,0,0.25); transform: translate(-50%, -50%); }
  .map-you::after { content: ''; position: absolute; left: -6px; bottom: -10px; width: 4px; height: 4px; border-radius: 50%; background: #2B6BFF; box-shadow: 0 4px 0 2px #2B6BFF; opacity: 0.55; }

  /* ── Agent list ── */
  .agent-item { display: flex; align-items: center; gap: 12px; background: #FFF; border-radius: 16px; padding: 13px 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer; transition: box-shadow 0.2s, transform 0.15s; }
  .agent-item:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.08); transform: translateY(-1px); }
  .agent-item:active { transform: scale(0.98); }
  .agent-item .avatar { width: 46px; height: 46px; border-radius: 13px; background: #FFF1F2; color: var(--Primary); font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .agent-item .info { flex: 1; min-width: 0; }
  .agent-item .nm { font-family: 'Switzer', sans-serif; font-size: 13.5px; font-weight: 600; color: var(--On-Surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-item .sub { font-family: 'Switzer', sans-serif; font-size: 11.5px; color: var(--On-Surface-Low); margin-top: 2px; }
  .agent-item .right { text-align: right; flex-shrink: 0; }
  .agent-item .dist { font-family: 'Switzer', sans-serif; font-size: 12px; font-weight: 600; color: var(--On-Surface); }
  .agent-item .eta { font-family: 'Switzer', sans-serif; font-size: 10.5px; color: var(--On-Surface-Low); margin-top: 1px; }
  .agent-item .arrow { width: 18px; height: 18px; stroke: var(--On-Surface-Low); stroke-width: 2; fill: none; flex-shrink: 0; }

  .agent-list { display: flex; flex-direction: column; gap: 10px; }
  .list-hint { font-family: 'Switzer', sans-serif; font-size: 12px; color: var(--On-Surface-Low); }
  .list-hint b { color: var(--On-Surface); font-weight: 600; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="window.location.href='Withdraw Cash.html'">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title">Find Nearby Agent</span>
      <div style="width:36px;"></div>
    </div>

    <div class="scroll">

      <div class="locate-bar">
        <svg class="pin-ico" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <div class="loc-wrap" id="locDisplay">
          <div class="loc" id="locName">Bole, Addis Ababa</div>
          <div class="sub" id="locSub">Using your current location</div>
        </div>
        <input class="loc-input" id="locInput" type="text" placeholder="Search another location"
               onkeydown="if(event.key==='Enter')applySearch()" oninput="renderSuggestions(this.value)">
        <button class="loc-btn" id="locBtn" onclick="toggleSearch()" title="Search location">
          <svg id="locBtnIcon" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
        </button>
      </div>
      <div class="loc-suggest" id="locSuggest"></div>

      <div class="map-view">
        <div class="map-roads"></div>
        <div class="map-block-a"></div><span class="map-label a">Bole</span>
        <div class="map-block-b"></div><span class="map-label b">Airport Rd</span>
        <div class="map-block-c"></div><span class="map-label c">Swords Bldg</span>
        <div id="mapPins"></div>
        <div class="map-you"></div>
        <div class="map-label" style="left:47%;top:58%;font-weight:700;color:#2B6BFF;">You</div>
      </div>

      <div class="list-hint"><b id="agentCount"></b> near <span id="areaName">Bole, Addis Ababa</span> &mdash; sorted by distance.</div>
      <div id="agentList" class="agent-list"></div>

    </div>
  </div>
</div>

<script>
  const AGENTS = [
    { abbr: 'BM', name: 'Betty Merhat Agency', code: '323217', dist: '0.8 km', eta: '9 min walk', addr: 'Bole Medhanialem, Addis Ababa', open: true, x: '29%', y: '41%' },
    { abbr: 'KR', name: 'Kebede Retails', code: '562394', dist: '1.2 km', eta: '14 min walk', addr: 'Bole Airport Road, Addis Ababa', open: true, x: '63%', y: '29%' },
    { abbr: 'MS', name: 'Meskerem Agent Services', code: '778901', dist: '2.1 km', eta: '6 min drive', addr: 'Mekanisa, Addis Ababa', open: false, x: '57%', y: '67%' },
    { abbr: 'BM', name: 'Bole Mini-Mart', code: '204411', dist: '2.6 km', eta: '8 min drive', addr: 'Dembel City Center', open: true, x: null, y: null }
  ];

  function pinIcon() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';
  }

  document.getElementById('mapPins').innerHTML = AGENTS
    .filter(a => a.x)
    .map(a =>
      '<div class="map-pin" style="left:' + a.x + ';top:' + a.y + '" title="' + a.name + '" onclick="pickAgent(\'' + a.code + '\')">' +
        pinIcon() +
        '<span class="dist">' + a.dist + '</span>' +
      '</div>'
    ).join('');

  document.getElementById('agentList').innerHTML = AGENTS.map(a =>
    '<div class="agent-item" onclick="pickAgent(\'' + a.code + '\')">' +
      '<div class="avatar">' + a.abbr + '</div>' +
      '<div class="info">' +
        '<div class="nm">' + a.name + '</div>' +
        '<div class="sub">Agent No. ' + a.code + ' • ' + (a.open ? 'Open now' : 'Open 8:00–18:00') + '</div>' +
      '</div>' +
      '<div class="right">' +
        '<div class="dist">' + a.dist + '</div>' +
        '<div class="eta">' + a.eta + '</div>' +
      '</div>' +
      '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>' +
    '</div>'
  ).join('');

  document.getElementById('agentCount').textContent =
    AGENTS.length + ' authorized agent' + (AGENTS.length === 1 ? '' : 's');

  /* ── Location search ── */
  const AREAS = [
    'Bole, Addis Ababa', 'Piassa, Addis Ababa', 'Megenagna, Addis Ababa',
    'Mekanisa, Addis Ababa', 'Kazanchis, Addis Ababa', 'CMC, Addis Ababa',
    'Sarbet, Addis Ababa', 'Gerji, Addis Ababa'
  ];

  const bar = document.querySelector('.locate-bar');

  function toggleSearch() {
    // The button doubles as submit once the field is open.
    if (bar.classList.contains('searching')) { applySearch(); return; }
    bar.classList.add('searching');
    const el = document.getElementById('locInput');
    el.value = '';
    renderSuggestions('');
    el.focus();
  }

  function renderSuggestions(q) {
    const box = document.getElementById('locSuggest');
    const term = (q || '').trim().toLowerCase();
    const hits = AREAS.filter(a => a.toLowerCase().includes(term)).slice(0, 5);
    if (!bar.classList.contains('searching')) { box.classList.remove('show'); return; }
    box.innerHTML = hits.length
      ? hits.map(a =>
          '<div class="loc-opt" onclick="setLocation(\'' + a.replace(/'/g, "\\'") + '\')">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>' +
            '<span>' + a + '</span>' +
          '</div>').join('')
      : '<div class="loc-empty">No area matches &ldquo;' + (q || '') + '&rdquo;</div>';
    box.classList.add('show');
  }

  function applySearch() {
    const typed = document.getElementById('locInput').value.trim();
    if (!typed) { closeSearch(); return; }
    const match = AREAS.find(a => a.toLowerCase().includes(typed.toLowerCase()));
    setLocation(match || typed);
  }

  function setLocation(name) {
    document.getElementById('locName').textContent = name;
    document.getElementById('locSub').textContent = 'Showing agents near this area';
    closeSearch();
    document.getElementById('areaName').textContent = name;
  }

  function closeSearch() {
    bar.classList.remove('searching');
    document.getElementById('locSuggest').classList.remove('show');
  }

  function pickAgent(code) {
    const a = AGENTS.find(x => x.code === code);
    if (!a) return;
    const data = {
      method: 'nearby',
      methodLabel: 'Nearby Agent',
      agent: { abbr: a.abbr, name: a.name, code: a.code, dist: a.dist, eta: a.eta, addr: a.addr, open: a.open }
    };
    sessionStorage.setItem('withdrawData', JSON.stringify(data));
    window.location.href = 'Withdraw Cash - Agent Details.html';
  }
</script>
</body>
</html>
