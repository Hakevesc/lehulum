<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer to Wallet - Enter Amount</title>
<style>
    @import url("styles/component-keypad.css");
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --Primary-Dark: #C41520;
    --Primary-Darker: #A41016;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Surface-Container: #FCFCFC;
    --Gray-0: #FFF;
    --On-Primary: #FFF1F2;
    --Success: #1FC83B;
    --Success-Light: #E8F9EC;
    --Warning: #FF9800;
    --Warning-Light: #FFF8E1;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .phone-frame {
    width: 360px;
    height: 780px;
    background: var(--Background);
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
  }

  .app-content {
    height: 100%;
    overflow-y: auto;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .app-content::-webkit-scrollbar { width: 0; }

  /* Status Bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 14px 24px 8px;
    background: var(--Background);
  }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  /* Header Navigation */
  .header-nav {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px 12px;
    background: var(--Background);
  }

  .back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg {
    width: 22px;
    height: 22px;
    stroke: var(--On-Surface);
    stroke-width: 1.8px;
  }

  .header-title {
    color: var(--On-Surface);
    font-family: 'Switzer', sans-serif;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.3px;
    flex: 1;
    text-align: center;
  }

  /* Main Content */
  .main-content {
    padding: 14px 20px 18px;
    display: flex;
    flex-direction: column;
    flex: 1;
    width: 100%;
    gap: 14px;
  }

  /* Receiver Card */
  .receiver-card {
    background: #FFF;
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }

  .receiver-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #E8E8EC;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: 'Switzer', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--On-Surface);
  }

  .receiver-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .receiver-name { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.2px; }
  .receiver-bank { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 400; display: flex; align-items: center; gap: 5px; }
  .receiver-bank-icon { width: 36px; height: 36px; border-radius: 9px; overflow: hidden; background: #F5F5F5; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .receiver-bank-icon img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }

  /* Amount Display */
  .amount-section { text-align: center; padding: 2px 0; }
  .amount-display { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin-bottom: 6px; }
  .amount-value {
    font-family: 'Switzer', sans-serif;
    font-size: 50px;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
    color: var(--On-Surface);
    transition: color 0.2s;
  }
  .amount-value.insufficient { color: var(--Primary); }
  .amount-currency {
    font-family: 'Switzer', sans-serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--On-Surface-Low);
    padding-left: 4px;
    border-left: 2px solid var(--Border);
  }

  /* Inline message (warning / info) */
  .msg { display: none; align-items: center; justify-content: center; gap: 6px; min-height: 18px; }
  .msg.show { display: flex; }
  .msg svg { width: 14px; height: 14px; flex-shrink: 0; fill: none; stroke-width: 2; }
  .msg .txt { font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 500; }
  .msg.warn svg { stroke: var(--Primary); }
  .msg.warn .txt { color: var(--Primary); }
  .msg.info svg { stroke: var(--Warning); }
  .msg.info .txt { color: #9a6a00; }

  /* Fee line */
  .fee-line { display: none; align-items: center; justify-content: center; gap: 6px; }
  .fee-line.show { display: flex; }
  .fee-line .fee-label { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 400; }
  .fee-line svg { width: 13px; height: 13px; color: var(--On-Surface-Low); }

  /* Funding account selector */
  .funding-title { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }
  .funding-selector { display: flex; gap: 10px; }
  .fund-option {
    flex: 1; background: #FFF; border: 1.5px solid var(--Border); border-radius: 14px;
    padding: 11px 12px; cursor: pointer; transition: all 0.18s; position: relative;
    display: flex; flex-direction: column; gap: 3px;
  }
  .fund-option.selected { border-color: var(--Primary); background: #FFF7F7; box-shadow: 0 2px 10px rgba(254,53,61,0.12); }
  .fund-option.disabled { opacity: 0.55; cursor: not-allowed; background: #FAFAFA; }
  .fund-option .fo-top { display: flex; align-items: center; justify-content: space-between; }
  .fund-option .fo-name { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 600; }
  .fund-option .fo-bal { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 12px; font-weight: 500; }
  .fund-option .radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--Border); flex-shrink: 0; transition: all 0.18s; }
  .fund-option.selected .radio { border-color: var(--Primary); background: radial-gradient(circle, var(--Primary) 0 5px, transparent 6px); }
  .fund-option .fo-tag { color: var(--Primary); font-family: 'Switzer', sans-serif; font-size: 10px; font-weight: 600; display: none; }
  .fund-option.disabled .fo-tag { display: block; }

  /* Transfer Button */
  .transfer-btn {
    height: 52px;
    border-radius: 14px;
    border: none;
    background: #E0E0E0;
    color: var(--On-Surface-Low);
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: not-allowed;
    transition: all 0.2s;
    margin-top: auto;
  }
  .transfer-btn.active {
    background: var(--Primary);
    color: #FFF;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(254, 53, 61, 0.25);
  }
  .transfer-btn.active:hover { background: #E5303A; box-shadow: 0 6px 20px rgba(254, 53, 61, 0.35); transform: translateY(-1px); }
  .transfer-btn.active:active { transform: scale(0.98) translateY(0); }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="app-content">

    <!-- Status Bar -->
    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <!-- Header Navigation -->
    <div class="header-nav">
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <span class="header-title">Transfer to Wallet</span>
      <div style="width: 36px;"></div>
    </div>

    <!-- Main Content -->
    <div class="main-content">

      <!-- Receiver Card -->
      <div class="receiver-card">
        <div class="receiver-avatar" id="receiverAvatar">HC</div>
        <div class="receiver-info">
          <span class="receiver-name" id="receiverName">Henok Chala</span>
          <div class="receiver-bank">
            <span id="receiverWallet">M-PESA</span>
            <span>&bull;</span>
            <span id="receiverPhone">+251 9** *** 326</span>
          </div>
        </div>
        <div class="receiver-bank-icon">
          <img id="receiverLogo" src="assets/banks logo/M-PESA-logo-icon.png" alt="M-PESA" onerror="this.style.display='none'">
        </div>
      </div>

      <!-- Amount Section -->
      <div class="amount-section">
        <div class="amount-display">
          <span class="amount-value" id="amountValue">0.00</span>
          <span class="amount-currency">ETB</span>
        </div>

        <!-- Inline message -->
        <div class="msg" id="msg">
          <svg id="msgIcon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span class="txt" id="msgText"></span>
        </div>

        <!-- Fee -->
        <div class="fee-line" id="feeLine">
          <span class="fee-label">Fee <span id="feeVal">5.00</span> ETB</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </div>
      </div>

      <!-- Funding account -->
      <span class="funding-title">Pay from</span>
      <div class="funding-selector">
        <div class="fund-option selected" id="optMain" onclick="selectAccount('main')">
          <div class="fo-top">
            <span class="fo-name">Main Account</span>
            <span class="radio"></span>
          </div>
          <span class="fo-bal">12,580.00 ETB</span>
          <span class="fo-tag">Low balance</span>
        </div>
        <div class="fund-option" id="optReward" onclick="selectAccount('reward')">
          <div class="fo-top">
            <span class="fo-name">Reward Account</span>
            <span class="radio"></span>
          </div>
          <span class="fo-bal">800.00 ETB</span>
          <span class="fo-tag">Low balance</span>
        </div>
      </div>

      <!-- Keypad -->
      <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key empty"></button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key delete" onclick="deleteKey()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
      </div>

      <!-- Transfer Button -->
      <button class="transfer-btn" id="transferBtn" onclick="continueTransfer()" disabled>Continue</button>

    </div>

  </div>
</div>

<script>
  // ── Limits & balances (PRD demo values) ──
  const MIN = 1.00;
  const MAX_TXN = 50000.00;
  const DAILY_REMAINING = 100000.00;
  const MAIN = 12580.00;
  const REWARD = 800.00;
  const FEE = 5.00;

  let currentAmount = 0.00;
  let selectedAccount = 'main';

  function formatNumber(num) {
    return num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function setMsg(kind, text) {
    const msg = document.getElementById('msg');
    if (!kind) { msg.classList.remove('show'); return; }
    msg.classList.remove('warn', 'info');
    msg.classList.add('show', kind);
    document.getElementById('msgText').textContent = text;
  }

  function selectAccount(acct) {
    const opt = document.getElementById(acct === 'main' ? 'optMain' : 'optReward');
    if (opt.classList.contains('disabled')) return;   // can't pick an insufficient account
    selectedAccount = acct;
    updateDisplay();
  }

  function updateDisplay() {
    const amountValue = document.getElementById('amountValue');
    const feeLine = document.getElementById('feeLine');
    const btn = document.getElementById('transferBtn');
    const optMain = document.getElementById('optMain');
    const optReward = document.getElementById('optReward');

    amountValue.textContent = formatNumber(currentAmount);

    const canMain = currentAmount <= MAIN;
    const canReward = currentAmount <= REWARD;

    // Funding-account availability + auto-default (PRD business rule)
    optMain.classList.toggle('disabled', currentAmount > 0 && !canMain);
    optReward.classList.toggle('disabled', currentAmount > 0 && !canReward);

    if (currentAmount > 0) {
      if (selectedAccount === 'main' && !canMain && canReward) selectedAccount = 'reward';
      else if (selectedAccount === 'reward' && !canReward && canMain) selectedAccount = 'main';
    }
    optMain.classList.toggle('selected', selectedAccount === 'main');
    optReward.classList.toggle('selected', selectedAccount === 'reward');

    // Validation messaging
    let valid = false;
    amountValue.classList.remove('insufficient');
    feeLine.classList.remove('show');

    if (currentAmount === 0) {
      setMsg(null);
    } else if (currentAmount < MIN) {
      setMsg('warn', 'Minimum transfer is ' + formatNumber(MIN) + ' ETB');
    } else if (currentAmount > MAX_TXN) {
      amountValue.classList.add('insufficient');
      setMsg('warn', 'Above per-transaction limit (' + formatNumber(MAX_TXN) + ' ETB)');
      valid = true;          // press routes to Limit Exceeded
    } else if (currentAmount > DAILY_REMAINING) {
      amountValue.classList.add('insufficient');
      setMsg('warn', 'Exceeds remaining daily limit');
      valid = true;
    } else if (!canMain && !canReward) {
      amountValue.classList.add('insufficient');
      setMsg('warn', 'Insufficient balance in both accounts');
      valid = true;          // press routes to Insufficient Balance
    } else if (!canMain || !canReward) {
      // one account auto-selected
      const using = selectedAccount === 'main' ? 'Main' : 'Reward';
      setMsg('info', 'Using ' + using + ' Account (other is low)');
      feeLine.classList.add('show');
      valid = true;
    } else {
      setMsg(null);
      feeLine.classList.add('show');
      valid = true;
    }

    btn.classList.toggle('active', valid);
    btn.disabled = !valid;
  }

  function pressKey(key) {
    const s = currentAmount.toString();
    const di = s.indexOf('.');
    if (di !== -1 && s.length - di >= 3) return;          // max 2 decimals
    if (s.endsWith('.0') && key === '0') return;
    if (currentAmount === 0 && key === '0') return;
    currentAmount = currentAmount === 0 ? parseFloat(key) : parseFloat(s + key);
    updateDisplay();
  }

  function deleteKey() {
    const s = currentAmount.toString();
    currentAmount = s.length === 1 ? 0.00 : parseFloat(s.slice(0, -1));
    updateDisplay();
  }

  function continueTransfer() {
    if (currentAmount < MIN) return;

    // Limit checks → Limit Exceeded screen
    if (currentAmount > MAX_TXN) {
      sessionStorage.setItem('sendAmount', formatNumber(currentAmount));
      sessionStorage.setItem('limitType', 'transaction');
      window.location.href = 'Transfer_Limit Exceeded.html';
      return;
    }
    if (currentAmount > DAILY_REMAINING) {
      sessionStorage.setItem('sendAmount', formatNumber(currentAmount));
      sessionStorage.setItem('limitType', 'daily');
      window.location.href = 'Transfer_Limit Exceeded.html';
      return;
    }

    // Both accounts insufficient → Insufficient Balance screen
    if (currentAmount > MAIN && currentAmount > REWARD) {
      sessionStorage.setItem('sendAmount', formatNumber(currentAmount));
      sessionStorage.setItem('sendTotal', formatNumber(currentAmount + FEE));
      window.location.href = 'Transfer_Insufficient Balance.html';
      return;
    }

    // Happy path → Confirmation
    sessionStorage.setItem('sendAmount', formatNumber(currentAmount));
    sessionStorage.setItem('sendFee', formatNumber(FEE));
    sessionStorage.setItem('sendTotal', formatNumber(currentAmount + FEE));
    sessionStorage.setItem('sendAccount', selectedAccount);
    window.location.href = 'Transfer_Confirmation.html';
  }

  function goBack() { history.back(); }

  function initials(name) {
    return (name || '?').split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
  }

  // Populate receiver from the recipient validated earlier
  (function loadTarget() {
    let target = null;
    try { target = JSON.parse(sessionStorage.getItem('sendTarget') || 'null'); } catch (e) {}
    if (!target || target.type !== 'wallet') return;
    if (target.holder) {
      document.getElementById('receiverName').textContent = target.holder;
      document.getElementById('receiverAvatar').textContent = initials(target.holder);
    }
    if (target.name) document.getElementById('receiverWallet').textContent = target.name;
    if (target.phone) document.getElementById('receiverPhone').textContent = target.phone;
    if (target.logo) {
      const logo = document.getElementById('receiverLogo');
      logo.src = target.logo; logo.alt = target.name || ''; logo.style.display = '';
    }
  })();

  document.getElementById('feeVal').textContent = formatNumber(FEE);
  updateDisplay();
</script>

<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
</body>
</html>
