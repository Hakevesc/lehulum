<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Payment</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
    --Field: #F8F8F9;
    --Field-Border: #EFEFF1;
    --Warning: #E09B0B;
    --Warning-Light: #FDF6E7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; background: var(--Background); flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); flex-shrink: 0; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .scroll { flex: 1; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  .scroll::-webkit-scrollbar { width: 0; }

  /* ── Payee ── */
  .party-card { position: relative; background: #FFF; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .party-badge { position: absolute; top: -11px; right: 14px; background: #EDEDF0; color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.6px; padding: 4px 9px; border-radius: 6px; }
  .party-logo { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #FFE9EA; color: var(--Primary); font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 700; }
  .party-logo img { width: 100%; height: 100%; object-fit: contain; }
  .party-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .party-name { font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 700; color: var(--On-Surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .party-sub { font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 600; color: var(--On-Surface-Low); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Amount ── */
  .form-card { background: #FFF; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 8px; }
  .field-label { font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 500; color: var(--On-Surface); }
  .field { height: 56px; background: var(--Field); border: 1px solid var(--Field-Border); border-radius: 12px; padding: 0 16px; display: flex; align-items: center; gap: 8px; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; }
  .field:focus-within { border-color: var(--Primary); background: #FFF; box-shadow: 0 0 0 3px rgba(254,53,61,0.08); }
  .field input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 700; color: var(--On-Surface); letter-spacing: 0.2px; }
  .field input::placeholder { color: #A5A5AE; font-weight: 400; letter-spacing: 0; }
  .field.warn { border-color: var(--Warning); background: #FFF; }
  .field.warn input { color: var(--Warning); }
  .field.err { border-color: var(--Primary); background: #FFF; }
  .field.err input { color: var(--Primary); }

  .balance-hint { font-family: 'Switzer', sans-serif; font-size: 11.5px; color: var(--On-Surface-Low); margin-top: 4px; }
  .balance-hint b { color: var(--On-Surface); font-weight: 600; }

  .msg { display: none; font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 600; margin-top: 6px; }
  .msg.show { display: block; }
  .msg.warn { color: var(--Warning); background: var(--Warning-Light); border-radius: 8px; padding: 10px 12px; }
  .msg.err { color: var(--Primary); }

  /* ── Action ── */
  .bottom-bar { flex-shrink: 0; padding: 10px 16px 18px; background: var(--Background); }
  .update-btn { width: 100%; height: 52px; border-radius: 14px; border: none; background: #E0E0E0; color: var(--On-Surface-Low); font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; cursor: not-allowed; transition: all 0.2s; }
  .update-btn.active { background: var(--Primary); color: #FFF; cursor: pointer; box-shadow: 0 4px 16px rgba(254,53,61,0.25); }
  .update-btn.active:hover { background: #E5303A; box-shadow: 0 6px 20px rgba(254,53,61,0.35); transform: translateY(-1px); }
  .update-btn.active:active { transform: scale(0.98) translateY(0); }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title">Bill Payment</span>
      <div style="width:36px;"></div>
    </div>

    <div class="scroll">

      <div class="party-card">
        <span class="party-badge">PAYING FOR</span>
        <span class="party-logo" id="payeeLogo"></span>
        <span class="party-info">
          <span class="party-name" id="payeeName">—</span>
          <span class="party-sub" id="payeeRef">—</span>
        </span>
      </div>

      <div class="form-card">
        <span class="field-label">Enter Amount</span>
        <div class="field" id="amtField">
          <input id="amtInput" type="text" inputmode="decimal" placeholder="e.g. 15,000 ETB" autocomplete="off"
                 oninput="onAmountInput()" onfocus="unformatAmount()" onblur="formatAmount()">
        </div>
        <div class="balance-hint" id="balanceHintRow"><b>Outstanding:</b> <span id="outstanding">—</span></div>
        <div class="msg" id="amtMsg"></div>
      </div>

    </div>

    <div class="bottom-bar">
      <button class="update-btn" id="updateBtn" onclick="update()" disabled>Update</button>
    </div>

  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const fmt = n => parseFloat(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  let data = {};
  try { data = JSON.parse(sessionStorage.getItem('billPaymentData') || '{}'); } catch (e) { /* ignore corrupt state */ }
  const biller = data.biller || {};
  // The fee in full is the ceiling; a partial payment can be anything up to it.
  const FULL = parseFloat(data.fullAmount || data.payAmount || 0);

  $('payeeLogo').innerHTML = biller.logo ? '<img src="' + biller.logo + '" alt="">' : (biller.abbr || '');
  $('payeeName').textContent = data.customerName || 'Customer';
  $('payeeRef').textContent = data.account || '—';
  $('outstanding').textContent = fmt(FULL) + ' ETB';

  const amountValue = () => {
    const raw = $('amtInput').value.replace(/[^\d.]/g, '');
    return raw === '' ? null : parseFloat(raw);
  };

  function onAmountInput() {
    const el = $('amtInput');
    el.value = el.value.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1');
    validate();
    updateBtn();
  }

  function unformatAmount() {
    const n = amountValue();
    $('amtInput').value = n === null ? '' : String(n);
  }

  function formatAmount() {
    const n = amountValue();
    if (n !== null && !isNaN(n)) $('amtInput').value = fmt(n) + ' ETB';
  }

  function setState(state, text) {
    const field = $('amtField'), msg = $('amtMsg');
    field.classList.toggle('warn', state === 'warn');
    field.classList.toggle('err', state === 'err');
    msg.classList.toggle('warn', state === 'warn');
    msg.classList.toggle('err', state === 'err');
    msg.classList.toggle('show', !!state);
    $('balanceHintRow').style.display = state ? 'none' : '';
    if (text) msg.textContent = text;
  }

  function validate() {
    const n = amountValue();
    if (n === null) { setState(null); return null; }
    if (isNaN(n) || n <= 0) { setState('err', 'Enter a valid amount'); return null; }
    if (n > FULL) { setState('err', 'Maximum Amount: ' + fmt(FULL) + ' ETB'); return null; }
    setState(null);
    return n;
  }

  function updateBtn() {
    const ok = validate() !== null;
    $('updateBtn').classList.toggle('active', ok);
    $('updateBtn').disabled = !ok;
  }

  function update() {
    const n = validate();
    if (n === null) return;
    data.payAmount = n.toFixed(2);
    data.total = (n + parseFloat(data.fee || 0)).toFixed(2);
    sessionStorage.setItem('billPaymentData', JSON.stringify(data));
    window.location.href = 'Bill Payment_Review.html';
  }

  function goBack() { window.location.href = 'Bill Payment_Review.html'; }

  // Open on whatever is currently being paid, so a repeat edit starts from it.
  $('amtInput').value = String(parseFloat(data.payAmount || FULL));
  formatAmount();
  updateBtn();
</script>

<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
