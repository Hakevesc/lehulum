<style>
  /* ---------- Banner ad story ----------
     Tapping a home banner opens it as a full-screen story: progress bars on
     top, a big headline, the picture, and one call to action at the foot. */
  .banner-slide { cursor: pointer; }
  .story { position: absolute; inset: 0; z-index: 200; overflow: hidden; background: #FFFFFF; opacity: 0; visibility: hidden; transform: scale(0.96); transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s; }
  .story.show { opacity: 1; visibility: visible; transform: none; }
  .story-bars { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; gap: 5px; z-index: 3; }
  .story-bars span { flex: 1; height: 3px; border-radius: 2px; background: rgba(28, 28, 33, 0.15); overflow: hidden; }
  .story-bars i { display: block; height: 100%; width: 0; background: #1C1C21; }
  .story-x { position: absolute; top: 30px; right: 12px; width: 40px; height: 40px; border: 0; background: none; z-index: 4; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .story-x svg { width: 24px; height: 24px; stroke: #1C1C21; stroke-width: 2.2; fill: none; stroke-linecap: round; }
  .story-slide { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .story-slide .txt { padding: 88px 24px 0; text-align: center; color: #1C1C21; animation: storyIn 0.35s ease; }
  .story-slide h2 { font-family: 'Switzer', 'Inter', sans-serif; font-size: 34px; font-weight: 800; line-height: 1.02; letter-spacing: -0.5px; text-transform: uppercase; }
  .story-slide p { margin-top: 14px; font-size: 15.5px; line-height: 1.4; color: #3A3A42; }
  .story-slide .pic { position: relative; flex: 1; min-height: 0; margin: 14px 0 96px; animation: storyIn 0.45s ease; }
  .story-slide .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; display: block; mix-blend-mode: multiply; /* melts the picture's off-white backdrop into the page */ }
  @keyframes storyIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .story-tap { position: absolute; top: 70px; bottom: 100px; border: 0; background: none; z-index: 2; cursor: pointer; }
  .story-tap.prev { left: 0; width: 33%; }
  .story-tap.next { right: 0; width: 67%; }
  .story-cta { position: absolute; left: 24px; right: 24px; bottom: 28px; height: 54px; border: 0; border-radius: 27px; background: #FE353D; color: #FFFFFF; font-family: 'Poppins', 'Inter', sans-serif; font-size: 16px; font-weight: 600; z-index: 4; cursor: pointer; box-shadow: 0 8px 20px rgba(254, 53, 61, 0.3); }
  .story-cta:active { transform: scale(0.98); }
</style>

  // ============================================================
  // Listen for test scenario popups from parent (index.html)
  // ============================================================
  window.addEventListener('message', function(event) {
    // Only accept messages from the same origin
    if (event.data && event.data.type === 'showTestPopup') {
      showTestPopupInline(event.data.html, event.data.css || '');
    }

    // Re-trigger an announcement surface on demand (index.html test panel)
    if (event.data && event.data.type === 'showAnnouncement') {
      const variant = event.data.variant;
      if (variant === 'popup')   showAnnouncementModal();
      if (variant === 'tooltip') showAnnouncementTip();
      if (variant === 'strip') {
        const el = document.getElementById('annStrip');
        if (el) { el.classList.remove('ann-hidden'); el.scrollIntoView({ block: 'center' }); }
      }
    }
  });

  function showTestPopupInline(html, css) {
    // Remove any previous test popup
    const existing = document.getElementById('testPopupInline');
    if (existing) existing.remove();

    const container = document.createElement('div');
    container.id = 'testPopupInline';
    container.innerHTML = (css ? `<style>${css}</style>` : '') + html;
    document.body.appendChild(container);
  }
</script>

      let isVisible = false;

      const eyeOffSvg = '<svg viewBox="0 0 24 24" fill="none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19.5C7 19.5 2.73 16.39 1 12C2.73 7.61 7 4.5 12 4.5C14.12 4.5 16.07 5.2 17.62 6.38" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 12C15 13.66 13.66 15 12 15C10.34 15 9 13.66 9 12C9 10.34 10.34 9 12 9" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="1" y1="1" x2="23" y2="23" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>';
      const eyeOnSvg = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5C17 19.5 21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5Z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      eyeBtn.addEventListener('click', function() {
        isVisible = !isVisible;
        if (isVisible) {
          mainBalance.textContent = mainBalance.dataset.value;
          rewardBalance.textContent = rewardBalance.dataset.value;
          errifBalance.textContent = errifBalance.dataset.value;
          balanceCard.classList.add('balance-visible');
          eyeIcon.innerHTML = eyeOffSvg;
          eyeBtn.title = 'Hide balances';
        } else {
          mainBalance.textContent = '* * * * * *';
          rewardBalance.textContent = '****';
          errifBalance.textContent = '****';
          balanceCard.classList.remove('balance-visible');
          eyeIcon.innerHTML = eyeOnSvg;
          eyeBtn.title = 'Show balances';
        }
      });
    }

    // 5. Initialize Banner Slider
    initBannerSlider();
    initStory();

    // 6. Initialize QR FAB Speed-dial
    initQrFab();

    // 7. Initialize announcement entry points (strip / tooltip / popup)
    initAnnouncements();
  }

  // ============================================================
  // Announcement entry points
  //   strip   — always visible, sits under the welcome bar
  //   tooltip — anchored to the bell, auto-shows then auto-hides
  //   popup   — once per session, promotes the top campaign
  // ============================================================
  function initAnnouncements() {
    if (!activeAnnouncements.length) return;

    renderAnnouncementStrip();
    renderAnnouncementTip();
    renderAnnouncementModal();

    const badge = document.getElementById('annBellBadge');
    if (badge) badge.textContent = activeAnnouncements.length;

    // Tooltip appears shortly after load, then retreats on its own.
    setTimeout(showAnnouncementTip, 900);
    // Popup waits until the tooltip has cleared, and only once per session.
    if (!sessionStorage.getItem('mpesa.annPopupSeen')) {
      setTimeout(() => {
        sessionStorage.setItem('mpesa.annPopupSeen', '1');
        showAnnouncementModal();
      }, 1800);
    }
  }

  /* ---------- 1. inline info strip ---------- */
  function renderAnnouncementStrip() {
    const host = document.getElementById('announcementStripContainer');
    if (!host || !stripItem) return;
    host.innerHTML = `
      <div class="ann-strip tone-${stripItem.type}" id="annStrip" onclick="openAnnouncements('${stripItem.id}')">
        <div class="ann-strip-icon" style="background:${stripItem.iconBg}">${stripItem.glyph}</div>
        <div class="ann-strip-body">
          <span class="ann-strip-title">${stripItem.title}</span>
          <span class="ann-strip-sub">${stripItem.short}</span>
        </div>
        <button class="ann-strip-close" aria-label="Dismiss"
                onclick="event.stopPropagation();dismissAnnouncementStrip()">&times;</button>
      </div>`;
  }

  function dismissAnnouncementStrip() {
    const el = document.getElementById('annStrip');
    if (el) el.classList.add('ann-hidden');
  }

  /* ---------- 2. bell tooltip ---------- */
  function renderAnnouncementTip() {
    const host = document.getElementById('announcementTipContainer');
    if (!host) return;
    const n = activeAnnouncements.length;
    const tipLead = stripItem || activeAnnouncements.find(a => a.id !== 'sys-maintenance') || activeAnnouncements[0];
    const tipText = tipLead && tipLead.short ? `${tipLead.short}. ` : '';
    host.innerHTML = `
      <div class="ann-tip ann-hidden" id="annTip" onclick="openAnnouncements()">
        <div class="ann-tip-arrow" id="annTipArrow"></div>
        <div class="ann-tip-head">
          <div class="ann-tip-glyph">📣</div>
          <span class="ann-tip-title">${n} new announcement${n > 1 ? 's' : ''}</span>
          <button class="ann-tip-close" aria-label="Dismiss"
                  onclick="event.stopPropagation();hideAnnouncementTip()">&times;</button>
        </div>
        <div class="ann-tip-text">${tipText}Tap to see all offers and notices.</div>
        <span class="ann-tip-link">View announcements &rsaquo;</span>
      </div>`;
  }

  // Anchored to the live position of the bell so it stays correct
  // regardless of frame padding or status-bar height.
  function positionAnnouncementTip() {
    const tip = document.getElementById('annTip');
    const bell = document.getElementById('bellIcon');
    const frame = document.querySelector('.phone-frame');
    const arrow = document.getElementById('annTipArrow');
    if (!tip || !bell || !frame) return;

    const f = frame.getBoundingClientRect();
    const b = bell.getBoundingClientRect();

    const right = Math.max(10, f.right - b.right - 4);
    tip.style.top = (b.bottom - f.top + 10) + 'px';
    tip.style.right = right + 'px';

    // Point the arrow at the centre of the bell.
    if (arrow) {
      const tipRect = tip.getBoundingClientRect();
      const bellCentreFromTipRight = tipRect.right - (b.left + b.width / 2);
      arrow.style.right = Math.min(tip.offsetWidth - 20, Math.max(10, bellCentreFromTipRight - 8)) + 'px';
    }
  }

  function showAnnouncementTip() {
    const tip = document.getElementById('annTip');
    if (!tip) return;
    tip.classList.remove('ann-hidden');
    positionAnnouncementTip();
    clearTimeout(showAnnouncementTip._t);
    showAnnouncementTip._t = setTimeout(hideAnnouncementTip, 6000);
  }

  function hideAnnouncementTip() {
    const tip = document.getElementById('annTip');
    if (tip) tip.classList.add('ann-hidden');
  }

  /* ---------- 3. popup modal ---------- */
  function renderAnnouncementModal() {
    const host = document.getElementById('announcementModalContainer');
    if (!host || !modalItem) return;
    const expiry = annExpiryLabel(modalItem.expiresInDays);
    const hasImg = !!modalItem.popupImage;
    host.innerHTML = `
      <div class="ann-modal ann-hidden" id="annModal"
           onclick="if(event.target===this)hideAnnouncementModal()">
        <div class="ann-modal-card">
          <div class="ann-modal-art ${hasImg ? 'has-image' : ''}" style="background:${modalItem.gradient || 'linear-gradient(175deg, #DE2B35 0%, #B31922 100%)'}">
            <div class="ann-modal-wave-bg"></div>
            <span class="ann-modal-badge">${modalItem.badge}</span>
            <button class="ann-modal-close" aria-label="Close" onclick="hideAnnouncementModal()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
            ${hasImg ? `
              <div class="ann-modal-img-wrap">
                <img class="ann-modal-img" src="${modalItem.popupImage}" alt="${modalItem.title}">
              </div>
            ` : `
              <div class="ann-art-circle a1"></div>
              <div class="ann-art-circle a2"></div>
              <span class="ann-art-glyph">${modalItem.glyph}</span>
            `}
            <svg class="ann-modal-bottom-curve" viewBox="0 0 320 24" fill="none" preserveAspectRatio="none">
              <path d="M0,24 Q160,0 320,24 L320,24 L0,24 Z" fill="#FFFFFF"/>
            </svg>
          </div>
          <div class="ann-modal-body">
            <h2 class="ann-modal-title">${modalItem.popupTitleHtml || modalItem.title}</h2>
            <p class="ann-modal-text">${modalItem.popupDesc || (modalItem.body || modalItem.desc).split('\n\n')[0]}</p>
            ${expiry ? `
              <div class="ann-modal-expiry">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="13" r="8"></circle>
                  <path d="M12 9v4l2 2"></path>
                  <path d="M5 3L2 6"></path>
                  <path d="M22 6l-3-3"></path>
                  <path d="M12 2v3"></path>
                </svg>
                <span>${expiry}</span>
              </div>
            ` : ''}
            <div class="ann-modal-actions">
              <button class="ann-btn primary"
                      onclick="announcementCta('${modalItem.cta.href}','${modalItem.id}')">
                ${modalItem.cta.label}
              </button>
              <button class="ann-btn secondary" onclick="hideAnnouncementModal()">
                ${(modalItem.ghostCta && modalItem.ghostCta.label) || 'Maybe Later'}
              </button>
            </div>
          </div>
        </div>
      </div>`;
  }

  function showAnnouncementModal() {
    hideAnnouncementTip();
    const m = document.getElementById('annModal');
    if (m) m.classList.remove('ann-hidden');
  }

  function hideAnnouncementModal() {
    const m = document.getElementById('annModal');
    if (m) m.classList.add('ann-hidden');
  }

  /* ---------- shared navigation ---------- */
  // Redirection rule: a CTA with a journey goes straight there,
  // otherwise the customer lands on the Announcements screen.
  function announcementCta(href, id) {
    if (href) { window.location.href = href; return; }
    openAnnouncements(id);
  }

  function openAnnouncements(id) {
    window.location.href = id
      ? 'Announcement Detail.html?id=' + encodeURIComponent(id)
      : 'Announcement.html';
  }

  // Banner ad story: each banner opens a short story. Slides advance on
  // their own (5 s); tap right for next, left for previous, hold to pause.
  const STORIES = {
    all: {
      cta: 'Get started', go: 'More Services.html',
      slides: [
        { title: 'Do it all with <span style="white-space:nowrap">M-PESA</span>', text: 'Send, pay, buy airtime and settle bills, all from one app.', img: 'assets/stories/all-1.jpg' },
        { title: 'Pay in a scan', text: 'Scan the merchant QR and pay in seconds, no cash needed.', img: 'assets/stories/all-2.jpg' },
        { title: 'Everything in one place', text: 'Airtime, packages, bills and transfers, right where you need them.', img: 'assets/stories/all-3.jpg' }
      ]
    },
    send: {
      cta: 'Send money', go: 'Send Money Menu.html',
      slides: [
        { title: 'Send money anywhere', text: 'Transfer to any M-PESA user instantly, day or night.', img: 'assets/stories/send-1.jpg' },
        { title: 'Straight to the bank', text: 'Move money from your wallet to any bank account in seconds.', img: 'assets/stories/send-2.jpg' }
      ]
    },
    bills: {
      cta: 'Pay a bill', go: 'Pay Bill.html',
      slides: [
        { title: 'Pay bills easily', text: 'Electricity, water and DSTV, settled from your sofa.', img: 'assets/stories/bills-1.jpg' },
        { title: 'School fees, sorted', text: 'Pay school fees on time without queuing at the bank.', img: 'assets/stories/bills-2.jpg' },
        { title: 'A receipt every time', text: 'Get an instant receipt for every bill you pay.', img: 'assets/stories/bills-3.jpg' }
      ]
    }
  };
  const STORY_MS = 5000;
  let story = null, storyAt = 0, storyT0 = 0, storyLeft = STORY_MS, storyTimer = 0, storyHeld = false;

  function openStory(key) {
    story = STORIES[key];
    if (!story) return;
    document.getElementById('storyBars').innerHTML = story.slides.map(() => '<span><i></i></span>').join('');
    const s = story;
    document.getElementById('storyCta').textContent = s.cta;
    document.getElementById('storyCta').onclick = () => { window.location.href = s.go; };
    document.getElementById('story').classList.add('show');
    showStorySlide(0);
  }

  function closeStory() {
    clearTimeout(storyTimer);
    document.getElementById('story').classList.remove('show');
    story = null;
  }

  function showStorySlide(i) {
    storyAt = i;
    const sl = story.slides[i];
    document.getElementById('storySlide').innerHTML =
      '<div class="txt"><h2>' + sl.title + '</h2><p>' + sl.text + '</p></div>' +
      '<div class="pic"><img src="' + sl.img + '" alt=""></div>';
    document.querySelectorAll('#storyBars i').forEach((b, k) => { b.style.width = k < i ? '100%' : '0'; });
    storyLeft = STORY_MS;
    storyT0 = performance.now();
    clearTimeout(storyTimer);
    storyTimer = setTimeout(() => tickStory(performance.now()), 40);
  }

  function tickStory(now) {
    if (!story) return;
    if (storyHeld) { storyT0 = now - (STORY_MS - storyLeft); storyTimer = setTimeout(() => tickStory(performance.now()), 40); return; }
    const done = Math.min(1, (now - storyT0) / STORY_MS);
    storyLeft = STORY_MS * (1 - done);
    document.querySelectorAll('#storyBars i')[storyAt].style.width = (done * 100) + '%';
    if (done >= 1) { storyStep(1); return; }
    storyTimer = setTimeout(() => tickStory(performance.now()), 40);
  }

  function storyStep(d) {
    if (!story) return;
    const n = storyAt + d;
    if (n >= story.slides.length) { closeStory(); return; }
    showStorySlide(Math.max(0, n));
  }

  function initStory() {
    const el = document.getElementById('story');
    if (!el) return;
    el.addEventListener('pointerdown', e => { if (!e.target.closest('.story-cta, .story-x')) storyHeld = true; });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, () => { storyHeld = false; }));
  }

  // Banner Slider Functionality
  function initBannerSlider() {
    const slides = document.querySelectorAll('.banner-slide');
    const dots = document.querySelectorAll('.banner-dot, .dot');
    let currentSlide = 0;
    let slideInterval;

    function goToSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.remove('active');
        if (dots[i]) dots[i].classList.remove('active');
      });
      
      slides[index].classList.add('active');
      if (dots[index]) dots[index].classList.add('active');
      currentSlide = index;
    }

    function nextSlide() {
      const next = (currentSlide + 1) % slides.length;
      goToSlide(next);
    }

    function startAutoSlide() {
      slideInterval = setInterval(nextSlide, 4000);
    }

    function stopAutoSlide() {
      clearInterval(slideInterval);
    }

    dots.forEach((dot, index) => {
      dot.addEventListener('click', () => {
        goToSlide(index);
        stopAutoSlide();
        startAutoSlide();
      });
    });

    let touchStartX = 0;
    let touchEndX = 0;
    const sliderContainer = document.getElementById('bannerSlidesContainer');
    
    if (sliderContainer) {
      sliderContainer.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        stopAutoSlide();
      }, {passive: true});

      sliderContainer.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
        startAutoSlide();
      }, {passive: true});
    }

    function handleSwipe() {
      const swipeThreshold = 50;
      const diff = touchStartX - touchEndX;
      
      if (Math.abs(diff) > swipeThreshold) {
        if (diff > 0) {
          nextSlide();
        } else {
          const prev = (currentSlide - 1 + slides.length) % slides.length;
          goToSlide(prev);
        }
      }
    }

    startAutoSlide();

    const bannerSlider = document.querySelector('.banner-slider');
    if (bannerSlider) {
      bannerSlider.addEventListener('mouseenter', stopAutoSlide);
      bannerSlider.addEventListener('mouseleave', startAutoSlide);
    }
  }

  // QR FAB Speed-Dial Functionality
  function initQrFab() {
    const wrapper = document.getElementById('qrFabWrapper');
    const btn = document.getElementById('qrFabBtn');
    const backdrop = document.getElementById('qrFabBackdrop');
    if (!wrapper || !btn) return;

    let isOpen = false;

    function openMenu() {
      isOpen = true;
      wrapper.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
    }

    function closeMenu() {
      isOpen = false;
      wrapper.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }

    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      isOpen ? closeMenu() : openMenu();
    });

    if (backdrop) {
      backdrop.addEventListener('click', closeMenu);
    }

    const myQrEl = document.getElementById('qrActionMyQR');
    if (myQrEl) {
      myQrEl.addEventListener('click', function() {
        closeMenu();
        window.location.href = 'My QR Code.html';
      });
    }

    const scanEl = document.getElementById('qrActionScan');
    if (scanEl) {
      scanEl.addEventListener('click', function() {
        closeMenu();
        window.location.href = 'Scan QR.html';
      });
    }

    const verifyEl = document.getElementById('qrActionVerify');
    if (verifyEl) {
      verifyEl.addEventListener('click', function() {
        closeMenu();
        window.location.href = 'Verify Receipt.html';
      });
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && isOpen) closeMenu();
    });
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    renderApp();
  } else {
    document.addEventListener('DOMContentLoaded', renderApp);
  }
</script>
