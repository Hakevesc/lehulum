<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan QR Code</title>
<link rel="stylesheet" href="styles/design-tokens.css">
<link rel="stylesheet" href="styles/base.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  body { font-family: 'Inter', sans-serif; }

  /* Camera fills the whole phone frame */
  .camera { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 30%, #2a2a31 0%, #161619 55%, #0a0a0c 100%); overflow: hidden; }
  #cameraFeed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .camera.live #cameraFeed { display: block; }
  /* Subtle blurred "scene" for the simulated feed */
  .camera-scene { position: absolute; inset: 0; background: radial-gradient(40% 30% at 25% 25%, rgba(255,255,255,0.06), transparent), radial-gradient(35% 25% at 75% 70%, rgba(254,53,61,0.08), transparent); filter: blur(2px); }
  .camera.live .camera-scene { display: none; }

  /* Dark dimming with a transparent square cut-out via box-shadow */
  .viewfinder { position: absolute; top: 50%; left: 50%; width: 226px; height: 226px; transform: translate(-50%, -54%); border-radius: 26px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.55); }
  /* Corner brackets */
  .corner { position: absolute; width: 34px; height: 34px; border: 4px solid #fff; }
  .corner.tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 26px 0 0 0; }
  .corner.tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 26px 0 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 26px; }
  .corner.br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 26px 0; }

  .scan-line { position: absolute; left: 10px; right: 10px; top: 12px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, #FE353D, transparent); box-shadow: 0 0 14px 2px rgba(254,53,61,0.7); animation: scanMove 2.2s ease-in-out infinite; }
  @keyframes scanMove { 0% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(196px); opacity: 1; } 100% { transform: translateY(0); opacity: 0.4; } }

  /* Top bar */
  .cam-top { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; }
  .cam-time { color: #fff; font-size: 14px; font-weight: 600; font-family: 'Switzer', sans-serif; }
  .cam-icon-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.16); backdrop-filter: blur(6px); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
  .cam-icon-btn:hover { background: rgba(255,255,255,0.28); }
  .cam-icon-btn.active { background: #FE353D; }
  .cam-icon-btn svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2; fill: none; }

  .cam-title { position: absolute; top: 64px; left: 0; right: 0; text-align: center; z-index: 5; color: #fff; font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 600; }

  .cam-hint { position: absolute; left: 0; right: 0; bottom: 160px; z-index: 5; text-align: center; color: rgba(255,255,255,0.85); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 400; padding: 0 40px; line-height: 1.5; }

  /* Detected result sheet — merchant-payment modal style */
  .sheet-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 50; }
  .sheet-overlay.show { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; background: #FFF; border-radius: 24px 24px 0 0; padding: 12px 16px 20px; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1); }
  .sheet-overlay.show .sheet { transform: translateY(0); }
  .sheet-grip { width: 44px; height: 4px; border-radius: 2px; background: #D8D8DE; margin: 0 auto 18px; }
  .sheet-merchant { display: flex; align-items: center; gap: 14px; padding: 0 4px 20px; }
  .sheet-merchant .avatar { width: 52px; height: 52px; border-radius: 14px; background: #FFE9EA; color: var(--Primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 700; }
  .sheet-merchant .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .sheet-merchant .nm { font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 700; color: var(--On-Surface); }
  .sheet-merchant .sub { font-family: 'Switzer', sans-serif; font-size: 13px; color: var(--On-Surface-Low); }
  .sheet-actions { display: flex; gap: 12px; }
  .sheet-btn { height: 52px; border-radius: 14px; border: none; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; transition: background 0.15s, transform 0.12s; }
  .sheet-btn:active { transform: scale(0.98); }
  .sheet-btn.back { flex: 1; background: #F1F1F4; color: var(--On-Surface); }
  .sheet-btn.back:hover { background: #E9E9ED; }
  .sheet-btn.pay { flex: 1.4; background: var(--Primary); color: #FFF; box-shadow: 0 4px 16px rgba(254,53,61,0.25); }
  .sheet-btn.pay:hover { background: #E5303A; }

</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="camera" id="camera">
    <video id="cameraFeed" autoplay playsinline muted></video>
    <div class="camera-scene"></div>

    <!-- Top bar -->
    <div class="cam-top">
      <button class="cam-icon-btn" onclick="goBack()" aria-label="Close">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <span class="cam-time">10:00</span>
      <button class="cam-icon-btn" id="flashBtn" onclick="toggleFlash()" aria-label="Flash">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>
    </div>

    <div class="cam-title">Scan QR Code</div>

    <!-- Viewfinder -->
    <div class="viewfinder">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="scan-line"></div>
    </div>

    <div class="cam-hint" id="camHint">Point your camera at a merchant or M-PESA QR code to pay or receive.</div>
  </div>

  <!-- Scanned merchant — merchant payment modal style -->
  <div class="sheet-overlay" id="resultOverlay" onclick="if(event.target===this)closeScan()">
    <div class="sheet">
      <div class="sheet-grip"></div>
      <div class="sheet-merchant">
        <span class="avatar">LC</span>
        <span class="info">
          <span class="nm">London Cafe</span>
          <span class="sub">Merchant Short Code: 4529292178</span>
        </span>
      </div>
      <div class="sheet-actions">
        <button class="sheet-btn back" onclick="closeScan()">Back</button>
        <button class="sheet-btn pay" onclick="payScannedMerchant()">Pay</button>
      </div>
    </div>
  </div>
</div>

<script>
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = document.getElementById('cameraFeed');
      v.srcObject = stream;
      document.getElementById('camera').classList.add('live');
      window._camStream = stream;
    } catch (e) {}
  }

  function stopCamera() {
    if (window._camStream) window._camStream.getTracks().forEach(t => t.stop());
  }

  function toggleFlash() {
    document.getElementById('flashBtn').classList.toggle('active');
  }

  // Append ?qr=invalid to demo an unrecognized / invalid merchant QR
  function isInvalidScan() {
    return new URLSearchParams(location.search).get('qr') === 'invalid';
  }

  function simulateScan() {
    if (isInvalidScan()) {
      sessionStorage.setItem('merchantError', 'invalid_qr');
      stopCamera();
      window.location.href = 'Merchant Payment_Service Unavailable.html';
      return;
    }
    document.getElementById('camHint').textContent = 'QR code detected';
    document.getElementById('resultOverlay').classList.add('show');
  }

  function closeScan() {
    document.getElementById('resultOverlay').classList.remove('show');
    document.getElementById('camHint').textContent = 'Point your camera at a merchant or M-PESA QR code to pay or receive.';
  }

  // Detected merchant retrieved from the QR → continue into the merchant flow
  function payScannedMerchant() {
    sessionStorage.setItem('merchantData', JSON.stringify({
      name: 'London Cafe',
      code: '4529292178',
      category: 'Food & Beverage',
      sub: 'Food & Beverage &bull; Merchant No. 4529292178',
      abbr: 'LC'
    }));
    // Land on the merchant payment screen with this merchant pre-resolved.
    sessionStorage.setItem('merchantResolved', '1');
    stopCamera();
    window.location.href = 'Pay Merchant.html';
  }

  function goBack() {
    stopCamera();
    window.location.href = 'Lehulum Home.html';
  }

  // The camera opens on mount; the scanner finds a code on its own shortly after
  startCamera();
  setTimeout(simulateScan, 3000);
</script>

<script src="figma-export.js"></script>

<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
