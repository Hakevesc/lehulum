<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSTV</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Background: #F5F5F5;
    --Field-Border: #EFEFF1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; background: var(--Background); flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); flex-shrink: 0; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .scroll { flex: 1; overflow-y: auto; padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 16px; }
  .scroll::-webkit-scrollbar { width: 0; }

  /* ── Subscriber ── */
  .account-card { background: #FFF; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 14px; flex-shrink: 0; }
  .account-head { display: flex; align-items: center; gap: 14px; }
  .account-head .logo { width: 44px; height: 44px; border-radius: 50%; background: #FFF; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.14); }
  .account-head .logo img { width: 100%; height: 100%; object-fit: contain; }
  .account-head .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .account-head .nm { font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 700; color: var(--On-Surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account-head .sub { font-family: 'Switzer', sans-serif; font-size: 12.5px; color: var(--On-Surface-Low); }

  .package-row { border-top: 1px solid #F0F0F3; padding-top: 14px; display: flex; align-items: center; gap: 12px; }
  .package-row .ico { width: 40px; height: 40px; border-radius: 12px; background: #F1F1F4; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .package-row .ico svg { width: 20px; height: 20px; stroke: var(--On-Surface-Low); stroke-width: 1.7; fill: none; }
  .package-row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .package-row .label { font-family: 'Switzer', sans-serif; font-size: 11.5px; color: var(--On-Surface-Low); }
  .package-row .value { font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 700; color: var(--On-Surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .view-link { display: flex; align-items: center; gap: 4px; font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 600; color: var(--Primary); cursor: pointer; flex-shrink: 0; transition: opacity 0.2s; }
  .view-link:hover { opacity: 0.7; }
  .view-link svg { width: 15px; height: 15px; stroke: var(--Primary); stroke-width: 2.4; fill: none; }

  /* ── Services ── */
  .section-title { font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 500; color: var(--On-Surface); padding: 0 2px; }
  .services-card { background: #FFF; border-radius: 16px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
  .service-row { border: 1px solid var(--Field-Border); border-radius: 14px; padding: 14px 12px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s; }
  .service-row:hover { border-color: var(--Primary); box-shadow: 0 6px 18px rgba(0,0,0,0.07); transform: translateY(-1px); }
  .service-row:active { transform: scale(0.99); }
  .service-row .ico { width: 40px; height: 40px; border-radius: 12px; background: #FFE9EA; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .service-row .ico svg { width: 20px; height: 20px; stroke: var(--Primary); stroke-width: 1.8; fill: none; }
  .service-row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .service-row .nm { font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 700; color: var(--On-Surface); }
  .service-row .desc { font-family: 'Switzer', sans-serif; font-size: 12px; color: var(--On-Surface-Low); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chev { width: 18px; height: 18px; stroke: var(--Primary); stroke-width: 2.4; fill: none; flex-shrink: 0; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title">DSTV</span>
      <div style="width:36px;"></div>
    </div>

    <div class="scroll">

      <div class="account-card">
        <div class="account-head">
          <span class="logo"><img src="assets/bill pay logos/dstv_logo.png" alt=""></span>
          <span class="info">
            <span class="nm" id="holderName">—</span>
            <span class="sub" id="holderAccount">—</span>
          </span>
        </div>

        <div class="package-row">
          <span class="ico">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 20.5 7v10L12 21.2 3.5 17V7L12 2.8z"/><path d="M3.5 7 12 11.6 20.5 7M12 11.6v9.6"/></svg>
          </span>
          <span class="info">
            <span class="label">Current Package</span>
            <span class="value" id="currentPackage">—</span>
          </span>
          <span class="view-link" onclick="viewPackage()">
            View
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </span>
        </div>
      </div>

      <span class="section-title">DSTV Services</span>

      <div class="services-card">
        <div class="service-row" onclick="openService('change')">
          <span class="ico">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 20.5 7v10L12 21.2 3.5 17V7L12 2.8z"/><path d="M3.5 7 12 11.6 20.5 7M12 11.6v9.6"/></svg>
          </span>
          <span class="info">
            <span class="nm">Change Package</span>
            <span class="desc">Upgrade or downgrade your plan</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>

        <div class="service-row" onclick="openService('addons')">
          <span class="ico">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
          </span>
          <span class="info">
            <span class="nm">Add Extra Add-ons</span>
            <span class="desc">Include Extra Channel &amp; bouquets</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>

        <div class="service-row" onclick="openService('custom')">
          <span class="ico">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h12"/><circle cx="17.5" cy="14" r="1.3"/></svg>
          </span>
          <span class="info">
            <span class="nm">Pay a Custom Amount</span>
            <span class="desc">Enter specific amount to pay</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>

        <div class="service-row" onclick="openService('current')">
          <span class="ico">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
          </span>
          <span class="info">
            <span class="nm">Pay a Current Package</span>
            <span class="desc" id="currentDue">—</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
  // The subscriber the account number resolved to, with what they are on today.
  let SUBSCRIBER = {
    name: 'Alemayehu Tadesse',
    account: '7043928115',
    package: 'Meda  Plus',
    addons: 'Add-Ons',
    due: 300
  };
  try {
    const saved = JSON.parse(sessionStorage.getItem('dstvSubscriber') || 'null');
    if (saved && saved.account) SUBSCRIBER = saved;
  } catch (e) { /* ignore corrupt state */ }

  const FEE = 2;
  const LOGO = 'assets/bill pay logos/dstv_logo.png';

  const $ = id => document.getElementById(id);
  const fmt = n => parseFloat(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  const packageLabel = SUBSCRIBER.package + (SUBSCRIBER.addons ? ' + ' + SUBSCRIBER.addons : '');

  $('holderName').textContent = SUBSCRIBER.name;
  $('holderAccount').textContent = SUBSCRIBER.account;
  $('currentPackage').textContent = packageLabel;
  $('currentDue').textContent = 'Due: ' + SUBSCRIBER.package.replace(/\s+/g, ' ') + ' (' + fmt(SUBSCRIBER.due) + ' Br)';

  // Every route out of here pays the same subscriber, so the payload is shared.
  function payload(amount, rows, receiptRows) {
    return {
      plan: 'dstv',
      planLabel: '',
      biller: { name: 'DSTV', fullName: 'DSTV Ethiopia', category: 'TV', abbr: 'DS', logo: LOGO },
      account: SUBSCRIBER.account,
      customerName: SUBSCRIBER.name,
      rows: rows,
      receiptRows: receiptRows,
      // DSTV prints its receipt in its own order, so it supplies the whole block.
      receiptAllRows: [
        { key: 'Transaction Type',       value: 'Pay with M-Pesa' },
        { key: 'Paid To',                value: 'DSTV' },
        { key: 'Package Type',           value: SUBSCRIBER.package },
        { key: "Payer's Name",           value: 'Abebeb Bikila Maraton' },
        { key: "Payer's M-PESA Number",  value: '0712131415' },
        { key: 'Smart Card Number',      value: SUBSCRIBER.account },
        { key: 'Fee',                    value: fmt(FEE) + ' Br' }
      ],
      dateLabel: 'Date and time',
      txType: 'DSTV Payment',
      payAmount: amount.toFixed(2),
      fee: FEE.toFixed(2),
      serviceFee: '2.00',
      vat: '0.00',
      total: (amount + FEE).toFixed(2),
      payAccount: 'main',
      payerName: 'Abebeb Bikila Maraton'
    };
  }

  function openService(which) {
    if (which === 'current') {
      sessionStorage.setItem('billPaymentData', JSON.stringify(payload(
        SUBSCRIBER.due,
        [
          { key: 'Business Name',   value: 'DSTV' },
          { key: 'Current Package', value: SUBSCRIBER.package }
        ],
        [
          { key: 'DSTV Code',       value: SUBSCRIBER.account },
          { key: 'Current Package', value: packageLabel }
        ]
      )));
      window.location.href = 'Bill Payment_Review.html';
      return;
    }

    // Each of the other three has a screen of its own.
    sessionStorage.setItem('dstvSubscriber', JSON.stringify(SUBSCRIBER));
    sessionStorage.removeItem('dstvChange');
    const NEXT = {
      change: 'Bill Payment_DSTV Package.html',
      addons: 'Bill Payment_DSTV Addons.html',
      custom: 'Bill Payment_DSTV Amount.html'
    };
    if (NEXT[which]) window.location.href = NEXT[which];
  }

  function viewPackage() { openService('change'); }

  function goBack() { window.location.href = 'Bill Payment_DSTV Card.html'; }
</script>

<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
