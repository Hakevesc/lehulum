<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Errif Activated — M-PESA</title>
<link rel="stylesheet" href="styles/design-tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/component-status-bar.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap');

  /* Errif activated (after Activate → PIN): marks Errif active, shows the limit
     and what happens next, then Go to Errif. */
  :root { --Font: 'Switzer', 'Inter', sans-serif; }
  body { font-family: var(--Font); }
  .app-content { display: flex; flex-direction: column; align-items: center; text-align: center; padding-bottom: 0 !important; }
  .app-content > * { flex-shrink: 0; }

  .ok { margin-top: 48px; width: 96px; height: 96px; border-radius: 50%; background: #E8F9EE; display: flex; align-items: center; justify-content: center; animation: pop 0.45s cubic-bezier(.2,1.4,.4,1) both; }
  .ok span { width: 64px; height: 64px; border-radius: 50%; background: #16A34A; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(22,163,74,0.3); }
  .ok svg { width: 32px; height: 32px; stroke: #FFF; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes pop { from { transform: scale(0.6); } to { transform: none; } }
  h1 { margin-top: 20px; font-size: 22px; font-weight: 700; color: var(--On-Surface, #1C1C21); }
  .sub { margin-top: 6px; max-width: 270px; font-size: 13.5px; line-height: 1.5; color: var(--On-Surface-Low, #7C7C87); }

  .lim { margin-top: 22px; width: 100%; padding: 18px; border-radius: 20px; color: #FFF; text-align: left;
    background: linear-gradient(115deg, #FF3B40 0%, #EE2A30 50%, #C8161D 100%); box-shadow: 0 8px 20px rgba(238,42,48,0.25); }
  .lim small { display: block; font-size: 12.5px; color: rgba(255,255,255,0.88); }
  .lim b { display: block; margin-top: 2px; font-size: 28px; font-weight: 700; letter-spacing: -0.4px; }
  .lim b span { font-size: 13px; font-weight: 500; margin-left: 4px; color: rgba(255,255,255,0.85); }

  .next { margin-top: 12px; width: 100%; padding: 6px 16px; border-radius: 20px; background: #FFF; box-shadow: 0 4px 16px rgba(15,23,42,0.06); text-align: left; }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
  .row + .row { border-top: 1px solid #F1F1F4; }
  .row i { width: 36px; height: 36px; border-radius: 11px; background: #FFF1F2; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .row i svg { width: 19px; height: 19px; stroke: var(--Primary, #FE353D); stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .row p { font-size: 12.5px; line-height: 1.45; color: #55555E; }
  .row p b { color: var(--On-Surface, #1C1C21); font-weight: 600; }

  .bottom-bar { margin-top: auto; width: calc(100% + 32px); padding: 10px 16px 18px; background: var(--Background, #F5F5F5); }
  .btn-primary { width: 100%; height: 52px; border: none; border-radius: 14px; background: var(--Primary, #FE353D); color: #FFF; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; box-shadow: 0 4px 16px rgba(254,53,61,0.25); }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="time">10:00</span>
    <div class="status-icons">
      <svg data-name="icon-wifi" viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
      <svg data-name="icon-signal" viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
      <svg data-name="icon-battery" viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
    </div>
  </div>

  <div class="app-content">
    <div class="ok"><span><svg data-name="icon-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span></div>
    <h1>Errif is active</h1>
    <p class="sub">Your payments will now go through even when your balance is short.</p>

    <div class="lim"><small>Your Errif limit</small><b id="limit"></b></div>

    <div class="next">
      <div class="row"><i><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></i><p><b>Used automatically</b> when a payment is more than your balance.</p></div>
      <div class="row"><i><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></i><p><b>Repays itself</b> from the next money you receive.</p></div>
      <div class="row"><i><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></i><p><b>We'll let you know</b> each time Errif covers a payment.</p></div>
    </div>

    <div class="bottom-bar"><button class="btn-primary" onclick="location.href='Overdraft.html'">Go to Errif</button></div>
  </div>
</div>

<script src="term-loan-store.js"></script>
<script>
  // Turn Errif on (fresh: nothing owed yet)
  const E = TL.errifLoad();
  if (!E.active) { E.active = true; E.used = 0; E.since = new Date().toISOString(); E.history = []; TL.errifSave(E); }
  document.getElementById('limit').innerHTML = TL.fmt(E.limit) + '<span>ETB</span>';
</script>
<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
