<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Package</title>
<style>
  @import url("styles/component-keypad.css");
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --On-Primary: #FFF1F2;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
    --Success: #1FC83B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; background: var(--Background); flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); flex-shrink: 0; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .scroll-content { flex: 1; overflow-y: auto; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 16px; }
  .scroll-content::-webkit-scrollbar { width: 0; }

  .seg { background: #FFF; border-radius: 14px; padding: 5px; display: flex; gap: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .seg-tab { flex: 1; height: 40px; border-radius: 10px; border: none; background: transparent; font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 600; color: var(--On-Surface-Low); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .seg-tab svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
  .seg-tab.active { background: var(--Primary); color: #FFF; box-shadow: 0 2px 8px rgba(254,53,61,0.25); }

  .section-label { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }

  .telco-grid { display: flex; gap: 10px; }
  .telco { flex: 1; background: #FFF; border: 1.5px solid var(--Border); border-radius: 14px; padding: 12px; cursor: pointer; transition: all 0.18s; display: flex; align-items: center; gap: 10px; }
  .telco.selected { border-color: var(--Primary); background: #FFF7F7; box-shadow: 0 2px 10px rgba(254,53,61,0.12); }
  .telco .avatar { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 700; color: #FFF; }
  .telco .nm { font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 600; color: var(--On-Surface); }

  .self-chip { display: none; align-items: center; gap: 12px; background: #FFF; border: 1px solid var(--Border); border-radius: 14px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .self-chip.show { display: flex; }
  .self-chip .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--On-Primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .self-chip .ic svg { width: 20px; height: 20px; stroke: var(--Primary); stroke-width: 2; fill: none; }
  .self-chip .t { font-family: 'Switzer', sans-serif; font-size: 11.5px; color: var(--On-Surface-Low); }
  .self-chip .v { font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 700; color: var(--On-Surface); letter-spacing: 0.5px; margin-top: 2px; }

  .others-entry { display: none; flex-direction: column; gap: 10px; }
  .others-entry.show { display: flex; }
  .number-display { display: flex; align-items: center; justify-content: center; gap: 3px; min-height: 44px; }
  .number-value { font-family: 'Switzer', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 1px; color: var(--On-Surface); }
  .number-value.placeholder { color: #C5C5CB; font-weight: 500; letter-spacing: 0.5px; }
  .number-caret { width: 2px; height: 28px; background: var(--Primary); animation: caret-blink 1s step-end infinite; }
  @keyframes caret-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .field-error { display: none; align-items: center; justify-content: center; gap: 6px; }
  .field-error.show { display: flex; }
  .field-error svg { width: 14px; height: 14px; stroke: var(--Primary); stroke-width: 2; fill: none; }
  .field-error span { color: var(--Primary); font-family: 'Switzer', sans-serif; font-size: 12px; font-weight: 500; }
  .contacts-btn { align-self: center; display: flex; align-items: center; gap: 8px; background: var(--On-Primary); border: none; border-radius: 12px; padding: 10px 18px; cursor: pointer; transition: all 0.2s; }
  .contacts-btn:hover { background: #FFE0E2; }
  .contacts-btn svg { width: 18px; height: 18px; stroke: var(--Primary); stroke-width: 2; fill: none; }
  .contacts-btn span { color: var(--Primary); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 600; }

  .switch-link { align-self: center; background: none; border: none; cursor: pointer; font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 600; color: var(--On-Surface-Low); padding: 2px 0; display: inline-flex; align-items: center; gap: 4px; }
  .switch-link:hover { color: var(--Primary); }
  .switch-link svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }

  .bottom-bar { flex-shrink: 0; padding: 8px 20px 20px; background: var(--Background); display: flex; flex-direction: column; gap: 10px; }
  .keypad-wrap { display: none; }
  .keypad-wrap.show { display: block; }
  .continue-btn { width: 100%; height: 52px; border-radius: 14px; border: none; background: #E0E0E0; color: var(--On-Surface-Low); font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; cursor: not-allowed; transition: all 0.2s; }
  .continue-btn.active { background: var(--Primary); color: #FFF; cursor: pointer; box-shadow: 0 4px 16px rgba(254,53,61,0.25); }
  .continue-btn.active:hover { background: #E5303A; transform: translateY(-1px); }
  .continue-btn.active:active { transform: scale(0.98); }

  .modal-overlay { position: absolute; inset: 0; z-index: 1000; background: rgba(0,0,0,0.5); display: none; align-items: flex-end; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .bottom-sheet { width: 100%; background: #FFF; border-radius: 24px 24px 0 0; padding: 20px 20px 28px; animation: slideUpSheet 0.35s cubic-bezier(0.34,1.56,0.64,1); max-height: 70%; overflow-y: auto; }
  .bottom-sheet::-webkit-scrollbar { width: 0; }
  @keyframes slideUpSheet { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sheet-grip { width: 40px; height: 4px; background: #D8D8DD; border-radius: 2px; margin: 0 auto 16px; }
  .sheet-title { font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 700; color: var(--On-Surface); margin-bottom: 16px; text-align: center; }
  .sheet-list { display: flex; flex-direction: column; gap: 4px; }
  .sheet-item { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-radius: 14px; cursor: pointer; transition: background 0.15s; }
  .sheet-item:hover { background: #FFF1F2; }
  .sheet-avatar { width: 44px; height: 44px; border-radius: 50%; background: #E8E8EC; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 600; color: var(--On-Surface); }
  .sheet-item-info { flex: 1; }
  .sheet-item-name { font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .sheet-item-sub { font-family: 'Switzer', sans-serif; font-size: 12px; color: var(--On-Surface-Low); margin-top: 1px; }
</style>
</head>
<body>

<div class="phone-frame">

  <div class="status-bar">
    <span class="time">10:00</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
      <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
      <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
    </div>
  </div>

  <div class="header-nav">
    <button class="back-btn" onclick="goBack()">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <span class="header-title">Buy Package</span>
    <div style="width:36px;"></div>
  </div>

  <div class="scroll-content">

    <div class="seg">
      <button class="seg-tab active" id="tabSelf" onclick="setType('self')">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Buy for Self
      </button>
      <button class="seg-tab" id="tabOthers" onclick="setType('others')">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Buy for Others
      </button>
    </div>

    <span class="section-label">Telecom provider</span>
    <div class="telco-grid" id="telcoGrid"></div>

    <span class="section-label" id="recipientLabel">Recipient</span>

    <div class="self-chip show" id="selfChip">
      <div class="ic">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </div>
      <div>
        <div class="t">Your registered number</div>
        <div class="v" id="selfNumber">0712 131 415</div>
      </div>
    </div>

    <div class="others-entry" id="othersEntry">
      <div class="number-display">
        <span class="number-value placeholder" id="numberValue">09XX XXX XXX</span>
        <span class="number-caret"></span>
      </div>
      <div class="field-error" id="fieldError">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>Enter a valid 10-digit number starting with 09 or 07</span>
      </div>
      <button class="contacts-btn" onclick="openContacts()">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Select from Contacts</span>
      </button>
    </div>

    <button class="switch-link" onclick="window.location.href='Airtime_Buy.html'">
      <svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/></svg>
      Buy airtime instead
    </button>

  </div>

  <div class="bottom-bar">
    <div class="keypad-wrap" id="keypadWrap">
      <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key empty"></button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key delete" onclick="deleteKey()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
            <line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/>
          </svg>
        </button>
      </div>
    </div>
    <button class="continue-btn" id="continueBtn" onclick="proceed()">Continue</button>
  </div>

  <div class="modal-overlay" id="contactsOverlay" onclick="if(event.target===this)closeContacts()">
    <div class="bottom-sheet">
      <div class="sheet-grip"></div>
      <div class="sheet-title">Choose a contact</div>
      <div class="sheet-list" id="contactList"></div>
    </div>
  </div>

</div>

<script>
  const REGISTERED = '0712131415';
  const PROVIDERS = [
    { id: 'safaricom', name: 'Safaricom',     abbr: 'SC', color: '#43B02A' },
    { id: 'ethio',     name: 'Ethio Telecom', abbr: 'ET', color: '#0072BC' }
  ];
  const contacts = [
    { name: 'Henok Chala',     number: '0712131415' },
    { name: 'Aster Mequanent', number: '0911223344' },
    { name: 'Kidist Birhanu',  number: '0922334455' },
    { name: 'Samuel Desta',    number: '0933445566' },
    { name: 'Marta Solomon',   number: '0944556677' }
  ];

  let purchaseType = 'self';
  let providerIndex = 0;
  let digits = '';

  function initials(name) { return name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase(); }
  function formatNumber(d) { if (!d) return ''; return [d.slice(0,4), d.slice(4,7), d.slice(7,10)].filter(Boolean).join(' '); }
  function isValid(d) { return d.length === 10 && (d.startsWith('09') || d.startsWith('07')); }
  function isUnregistered(d) { return isValid(d) && d.endsWith('0000'); }

  function renderProviders() {
    document.getElementById('telcoGrid').innerHTML = PROVIDERS.map((p, i) => `
      <div class="telco ${i === providerIndex ? 'selected' : ''}" onclick="selectProvider(${i})">
        <div class="avatar" style="background:${p.color}">${p.abbr}</div>
        <span class="nm">${p.name}</span>
      </div>`).join('');
  }
  function selectProvider(i) { providerIndex = i; renderProviders(); }

  function setType(t) {
    purchaseType = t;
    document.getElementById('tabSelf').classList.toggle('active', t === 'self');
    document.getElementById('tabOthers').classList.toggle('active', t === 'others');
    document.getElementById('selfChip').classList.toggle('show', t === 'self');
    document.getElementById('othersEntry').classList.toggle('show', t === 'others');
    document.getElementById('keypadWrap').classList.toggle('show', t === 'others');
    document.getElementById('recipientLabel').textContent = t === 'self' ? 'Recipient' : 'Recipient mobile number';
    render();
  }

  function render() {
    if (purchaseType === 'others') {
      const el = document.getElementById('numberValue');
      const err = document.getElementById('fieldError');
      if (digits.length === 0) { el.textContent = '09XX XXX XXX'; el.classList.add('placeholder'); }
      else { el.textContent = formatNumber(digits); el.classList.remove('placeholder'); }
      err.classList.toggle('show', digits.length === 10 && !isValid(digits));
    }
    const ok = purchaseType === 'self' || isValid(digits);
    const btn = document.getElementById('continueBtn');
    btn.classList.toggle('active', ok);
    btn.disabled = !ok;
  }

  function pressKey(k) { if (digits.length < 10) { digits += k; render(); } }
  function deleteKey() { digits = digits.slice(0, -1); render(); }

  function openContacts() {
    document.getElementById('contactList').innerHTML = contacts.map((c, i) => `
      <div class="sheet-item" onclick="pickContact(${i})">
        <div class="sheet-avatar">${initials(c.name)}</div>
        <div class="sheet-item-info">
          <div class="sheet-item-name">${c.name}</div>
          <div class="sheet-item-sub">${formatNumber(c.number)}</div>
        </div>
      </div>`).join('');
    document.getElementById('contactsOverlay').classList.add('show');
  }
  function closeContacts() { document.getElementById('contactsOverlay').classList.remove('show'); }
  function pickContact(i) { const c = contacts[i]; closeContacts(); persistAndGo(c.number, c.name); }

  function persistAndGo(number, name) {
    const p = PROVIDERS[providerIndex];
    sessionStorage.setItem('packageData', JSON.stringify({
      purchaseType: purchaseType,
      provider: p.name, providerAbbr: p.abbr, providerColor: p.color,
      recipient: number, recipientName: name || (purchaseType === 'self' ? 'My number' : '')
    }));
    window.location.href = 'Package_Select.html';
  }

  function proceed() {
    if (purchaseType === 'self') { persistAndGo(REGISTERED, 'My number'); return; }
    if (!isValid(digits)) return;
    if (isUnregistered(digits)) {
      sessionStorage.setItem('packageEnteredNumber', formatNumber(digits));
      window.location.href = 'Package_Invalid Number.html';
      return;
    }
    persistAndGo(digits, '');
  }

  function goBack() { window.location.href = 'Lehulum Home.html'; }

  document.addEventListener('keydown', function (e) {
    if (purchaseType !== 'others') return;
    if (e.key >= '0' && e.key <= '9') pressKey(e.key);
    else if (e.key === 'Backspace') deleteKey();
    else if (e.key === 'Enter') proceed();
  });

  renderProviders();
  document.getElementById('selfNumber').textContent = formatNumber(REGISTERED);
  setType('self');
</script>

<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
