<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Term Loan · Apply</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap');

  /* Apply for a term loan: the offer, Select Amount chips + Enter Amount (within
     the offer and your available limit), the repayment period, a live repayment
     summary, terms, then the confirmation sheet → M-PESA PIN → receipt. */
  :root {
    --Primary: #FE353D;
    --Primary-Light: #FFF1F2;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
    --Field: #F7F7F9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Switzer', 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  button, input { font-family: inherit; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; background: var(--Background); flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }
  .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); flex-shrink: 0; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title { color: var(--On-Surface); font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { width: 0; }
  .scroll > * { flex-shrink: 0; }

  .offer { display: flex; align-items: center; gap: 12px; background: #FFF; border-radius: 16px; padding: 14px; box-shadow: 0 4px 14px rgba(15,23,42,0.05); }
  .logo { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #EFEFF2; background: #FFF; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .logo img { width: 34px; height: 34px; object-fit: contain; }
  .offer .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .offer b { font-size: 15px; font-weight: 700; color: var(--On-Surface); }
  .offer small { font-size: 12.5px; color: var(--On-Surface-Low); }
  .tag { flex-shrink: 0; padding: 3px 8px; border-radius: 999px; background: #EDEDF0; font-size: 10.5px; font-weight: 600; color: #55555E; }

  .card { background: #FFF; border-radius: 16px; padding: 16px; box-shadow: 0 4px 14px rgba(15,23,42,0.05); }
  .field-label { display: block; font-size: 14px; font-weight: 600; color: var(--On-Surface); margin-bottom: 8px; }
  .gap { margin-top: 16px; }
  .amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .chip { display: flex; align-items: center; justify-content: center; height: 52px; padding: 0 6px; border: 1px solid #EFEFF2; border-radius: 14px; background: #FFF; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: all 0.18s; }
  .chip .amt-val { font-size: 18px; font-weight: 700; color: var(--On-Surface); }
  .chip.selected { background: var(--Primary); border-color: var(--Primary); box-shadow: 0 4px 16px rgba(254,53,61,0.25); }
  .chip.selected .amt-val { color: #FFF; }
  .field { height: 52px; background: var(--Field); border: 1.5px solid var(--Border); border-radius: 14px; padding: 0 14px; display: flex; align-items: center; gap: 8px; }
  .field:focus-within { border-color: var(--Primary); background: #FFF; box-shadow: 0 4px 12px rgba(254,53,61,0.12); }
  .field.err { border-color: var(--Primary); background: #FFF; }
  .field input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 16px; font-weight: 700; color: var(--On-Surface); }
  .field input::placeholder { color: var(--On-Surface-Low); font-size: 15px; font-weight: 400; }
  .suffix { font-size: 13px; font-weight: 600; color: var(--On-Surface-Low); }
  .hint { margin-top: 8px; font-size: 12px; color: var(--On-Surface-Low); }
  .hint b { color: var(--On-Surface); font-weight: 600; }
  .err-text { display: none; margin-top: 6px; font-size: 12px; color: var(--Primary); }
  .err-text.show { display: block; }

  /* Repayment period — segmented pills */
  .terms-seg { display: flex; gap: 8px; }
  .seg { flex: 1; height: 44px; border-radius: 12px; border: 1.5px solid var(--Border); background: #FFF; font-size: 13.5px; font-weight: 700; color: var(--On-Surface); cursor: pointer; }
  .seg.on { border-color: var(--Primary); background: var(--Primary-Light); color: var(--Primary); }

  /* Repayment summary */
  .sum-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 12.5px; color: #55555E; }
  .sum-row + .sum-row { border-top: 1px solid #F1F1F4; }
  .sum-row b { color: var(--On-Surface); font-weight: 700; font-variant-numeric: tabular-nums; }
  .sum-row.total b { font-size: 15px; color: var(--Primary); }
  .sched { margin-top: 8px; padding: 4px 12px; border-radius: 12px; background: #F7F7F9; }
  .sched .sum-row { padding: 8px 0; font-size: 12px; }

  .agree { display: flex; align-items: flex-start; gap: 10px; padding: 0 4px; font-size: 12.5px; line-height: 1.45; color: #55555E; cursor: pointer; }
  .agree input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--Primary); flex-shrink: 0; cursor: pointer; }
  .agree a { color: var(--Primary); font-weight: 600; text-decoration: none; }

  .bottom-bar { flex-shrink: 0; padding: 10px 16px 18px; background: var(--Background); }
  .btn-primary { width: 100%; height: 52px; border: none; border-radius: 14px; background: var(--Primary); color: #FFF; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; box-shadow: 0 4px 16px rgba(254,53,61,0.25); }
  .btn-primary:disabled { background: #E0E0E0; color: var(--On-Surface-Low); box-shadow: none; cursor: not-allowed; }

  /* Confirmation sheet */
  .scrim { position: absolute; inset: 0; z-index: 100; background: rgba(0,0,0,0.42); opacity: 0; visibility: hidden; transition: opacity 0.22s, visibility 0.22s; }
  .scrim.show { opacity: 1; visibility: visible; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 101; background: #FFF; border-radius: 28px 28px 0 0; padding: 10px 16px 22px; transform: translateY(100%); transition: transform 0.28s cubic-bezier(.2,.8,.2,1); }
  .sheet.show { transform: translateY(0); }
  .sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: #D8D8DE; margin: 0 auto 16px; }
  .cf-head { position: relative; display: flex; align-items: center; gap: 12px; border: 1px solid #E6E6EA; border-radius: 16px; padding: 14px; }
  .cf-head .logo { width: 42px; height: 42px; border-radius: 50%; }
  .cf-head b { display: block; font-size: 15px; font-weight: 700; color: var(--On-Surface); }
  .cf-head small { font-size: 12.5px; color: var(--On-Surface-Low); }
  .cf-badge { position: absolute; top: -11px; right: 14px; padding: 4px 10px; border-radius: 999px; background: #EDEDF0; color: #3A3A42; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
  .cf-rows { margin: 6px 0 18px; }
  .cf-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid #EFEFF2; }
  .cf-row:last-child { border-bottom: none; }
  .cf-row span { font-size: 12.5px; color: #55555E; }
  .cf-row b { font-size: 12.5px; font-weight: 700; color: var(--On-Surface); font-variant-numeric: tabular-nums; }
  .cf-row b.red { font-size: 14px; color: var(--Primary); }
  .cf-actions { display: flex; gap: 12px; }
  .cf-btn { flex: 1; height: 52px; border-radius: 14px; background: #FFF; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; }
  .cf-btn.cancel { border: 1.5px solid #E0E0E4; color: #55555E; }
  .cf-btn.confirm { border: 1.5px solid var(--Primary); color: var(--Primary); }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="app-content" id="app">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="location.href='Term Loan.html'" aria-label="Back">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title">Apply for Loan</span>
      <div style="width:36px;"></div>
    </div>

    <div class="scroll">
      <div class="offer">
        <span class="logo"><img id="oLogo" src="" alt=""></span>
        <span class="info"><b id="oName"></b><small id="oLender"></small></span>
        <span class="tag" id="oTag"></span>
      </div>

      <div class="card">
        <div class="field-label">Select Amount</div>
        <div class="amounts" id="chips"></div>
        <label class="field-label gap" for="amount">Enter Amount</label>
        <div class="field" id="amountField">
          <input id="amount" type="text" inputmode="decimal" placeholder="e.g. 1,000" autocomplete="off">
          <span class="suffix">ETB</span>
        </div>
        <div class="hint" id="limitHint"></div>
        <div class="err-text" id="err"></div>

        <div class="field-label gap">Repay in</div>
        <div class="terms-seg" id="terms"></div>
      </div>

      <div class="card">
        <div class="field-label">Repayment Summary</div>
        <div class="sum-row"><span>Loan amount</span><b id="sAmt">0.00 ETB</b></div>
        <div class="sum-row"><span>Access fee (<span id="sAccP"></span>)</span><b id="sAcc">0.00 ETB</b></div>
        <div class="sum-row"><span>Daily fee (<span id="sDayP"></span> × <span id="sDays"></span> days)</span><b id="sDay">0.00 ETB</b></div>
        <div class="sum-row total"><span>Total repayment</span><b id="sTotal">0.00 ETB</b></div>
        <div class="sched" id="sched"></div>
      </div>

      <label class="agree"><input type="checkbox" id="agree"><span>I agree to the <a href="Terms & Conditions Inspiration.html" onclick="event.stopPropagation()">loan terms</a>. Late repayment adds a <b id="pen"></b> daily penalty and can lower my credit score.</span></label>
    </div>

    <div class="bottom-bar">
      <button class="btn-primary" id="continueBtn" disabled onclick="openConfirm()">Continue</button>
    </div>
  </div>

  <!-- Confirmation -->
  <div class="scrim" id="scrim" onclick="closeConfirm()"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Confirm loan">
    <div class="sheet-grip"></div>
    <div class="cf-head">
      <span class="cf-badge">TERM LOAN</span>
      <span class="logo"><img id="cfLogo" src="" alt=""></span>
      <span><b id="cfName"></b><small id="cfLender"></small></span>
    </div>
    <div class="cf-rows">
      <div class="cf-row"><span>To:</span><b>Main account · 0712 *** *78</b></div>
      <div class="cf-row"><span>Loan amount:</span><b id="cfAmt"></b></div>
      <div class="cf-row"><span>Fees:</span><b id="cfFees"></b></div>
      <div class="cf-row"><span>Repay by:</span><b id="cfDue"></b></div>
      <div class="cf-row"><span>Total repayment:</span><b class="red" id="cfTotal"></b></div>
    </div>
    <div class="cf-actions">
      <button class="cf-btn cancel" onclick="closeConfirm()">Cancel</button>
      <button class="cf-btn confirm" onclick="confirmLoan()">Confirm</button>
    </div>
  </div>
</div>

<script src="term-loan-store.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const { fmt } = TL;
  const offer = TL.offer(new URLSearchParams(location.search).get('offer')) || TL.OFFERS[0];
  const avail = Math.max(0, TL.LIMIT - TL.outstanding(TL.load()));
  const MAX = Math.min(offer.max, avail);
  let days = offer.days[0];

  $('oLogo').src = $('cfLogo').src = offer.logo;
  $('oName').textContent = $('cfName').textContent = offer.name;
  $('oLender').textContent = $('cfLender').textContent = offer.lender;
  $('oTag').textContent = offer.productLabel;
  $('limitHint').innerHTML = `Borrow <b>${fmt(offer.min)} – ${fmt(MAX)} ETB</b> · Available limit ${fmt(avail)} ETB`;
  $('sAccP').textContent = (offer.access * 100).toFixed(0) + '%';
  $('sDayP').textContent = (offer.daily * 100).toFixed(2) + '%';
  $('pen').textContent = (offer.penalty * 100).toFixed(1) + '%';

  // Quick amounts within the offer
  const picks = [0.25, 0.5, 1].map(f => Math.round(MAX * f / 100) * 100).filter((v, i, a) => v >= offer.min && a.indexOf(v) === i);
  $('chips').innerHTML = picks.map(v => `<button class="chip" type="button" data-amount="${v}"><span class="amt-val">${Number(v).toLocaleString('en-US')}</span></button>`).join('');
  $('chips').style.gridTemplateColumns = `repeat(${picks.length}, 1fr)`;
  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { $('amount').value = Number(c.dataset.amount).toLocaleString('en-US'); update(); }));

  // Repayment period
  $('terms').innerHTML = offer.days.map(d => `<button class="seg${d === days ? ' on' : ''}" type="button" data-d="${d}">${d} days</button>`).join('');
  document.querySelectorAll('.seg').forEach(s => s.addEventListener('click', () => {
    days = Number(s.dataset.d); document.querySelectorAll('.seg').forEach(x => x.classList.toggle('on', x === s)); update();
  }));

  const amt = () => Number($('amount').value.replace(/,/g, '')) || 0;
  $('amount').addEventListener('input', e => {
    let v = e.target.value.replace(/[^\d.]/g, ''); const [i, f] = v.split('.');
    e.target.value = (i ? Number(i).toLocaleString('en-US') : '') + (f !== undefined ? '.' + f.slice(0, 2) : '');
    update();
  });
  $('agree').addEventListener('change', update);

  let q = null;
  function update() {
    const a = amt();
    q = TL.quote(offer, a, days);
    $('sAmt').textContent = fmt(a) + ' ETB';
    $('sAcc').textContent = fmt(q.access) + ' ETB';
    $('sDays').textContent = days;
    $('sDay').textContent = fmt(q.dailyFee) + ' ETB';
    $('sTotal').textContent = fmt(q.total) + ' ETB';
    $('sched').innerHTML = q.instalments.map(i => `<div class="sum-row"><span>Instalment ${i.n} · ${TL.dateStr(i.due)}</span><b>${fmt(a ? i.amount : 0)} ETB</b></div>`).join('');
    const bad = a > 0 && (a < offer.min || a > MAX);
    $('err').textContent = a > MAX ? (a > avail ? 'More than your available limit.' : 'More than this offer allows.') : a > 0 && a < offer.min ? `Minimum is ${fmt(offer.min)} ETB.` : '';
    $('err').classList.toggle('show', bad); $('amountField').classList.toggle('err', bad);
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('selected', Number(c.dataset.amount) === a));
    $('continueBtn').disabled = !(a >= offer.min && a <= MAX && $('agree').checked);
  }

  function openConfirm() {
    if ($('continueBtn').disabled) return;
    document.activeElement && document.activeElement.blur();
    $('cfAmt').textContent = fmt(amt()) + ' ETB';
    $('cfFees').textContent = fmt(q.access + q.dailyFee) + ' ETB';
    $('cfDue').textContent = TL.dateStr(q.due) + (offer.inst > 1 ? ` (${offer.inst} parts)` : '');
    $('cfTotal').textContent = fmt(q.total) + ' ETB';
    $('scrim').classList.add('show'); $('sheet').classList.add('show');
  }
  function closeConfirm() { $('scrim').classList.remove('show'); $('sheet').classList.remove('show'); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeConfirm(); });

  // Confirm → M-PESA PIN → receipt (the receipt books the loan)
  function confirmLoan() {
    sessionStorage.setItem('termLoanData', JSON.stringify({
      kind: 'apply', offer: offer.id, lender: offer.lender, logo: offer.logo, product: offer.name,
      amount: amt(), days, access: q.access, dailyFee: q.dailyFee, total: q.total, instalments: q.instalments, due: q.due,
      back: 'Term Loan - Apply.html?offer=' + offer.id
    }));
    location.href = 'Term Loan - Enter PIN.html';
  }
  update();
</script>
<script src="components/keyboard.js"></script>
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
