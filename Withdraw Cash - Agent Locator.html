<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw Cash</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
    --Field: #F7F7F8;
    --Success: #1FC83B;
    --Success-Light: #E8F9EC;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; background: var(--Background); flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); flex-shrink: 0; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .scroll { flex: 1; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  .scroll::-webkit-scrollbar { width: 0; }

  /* ── Form card ── */
  .form-card { background: #FFF; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 8px; }
  .field-label { font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 600; color: var(--On-Surface); margin-top: 6px; }
  .field-label:first-child { margin-top: 0; }
  .field { height: 50px; background: var(--Field); border: 1.5px solid var(--Border); border-radius: 12px; padding: 0 14px; display: flex; align-items: center; gap: 8px; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; }
  .field:focus-within { border-color: var(--Primary); background: #FFF; box-shadow: 0 4px 12px rgba(254,53,61,0.12); }
  .field input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 500; color: var(--On-Surface); }
  .field input::placeholder { color: var(--On-Surface-Low); font-weight: 400; letter-spacing: 0; }
  .field input.strong { font-size: 16px; font-weight: 700; letter-spacing: 0.6px; }
  .field .suffix { font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 500; color: var(--On-Surface-Low); flex-shrink: 0; }
  .balance-hint { font-family: 'Switzer', sans-serif; font-size: 11.5px; color: var(--On-Surface-Low); margin-top: 2px; }
  .balance-hint b { color: var(--On-Surface); font-weight: 600; }

  /* Inline validation message */
  .msg { display: none; align-items: center; gap: 8px; font-family: 'Switzer', sans-serif; font-size: 12px; margin-top: 2px; }
  .msg.show { display: flex; }
  .msg svg { width: 15px; height: 15px; stroke-width: 2.4; fill: none; flex-shrink: 0; }
  .msg.warn { color: var(--Primary); }
  .msg.warn svg { stroke: var(--Primary); }



  /* ── Resolved agent row under the short code field: avatar, name, code and
     a green check once the code matches a known agent ── */
  .agent-card { background: var(--Field); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .agent-card[hidden] { display: none; }
  .agent-card-avatar { width: 44px; height: 44px; border-radius: 50%; background: #FFE9EA; color: var(--Primary); display: flex; align-items: center; justify-content: center; font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .agent-card-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .agent-card-name { font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 700; color: var(--On-Surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent-card-sub { font-family: 'Switzer', sans-serif; font-size: 12.5px; color: var(--On-Surface-Low); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent-card-check { width: 22px; height: 22px; border-radius: 50%; background: var(--Success); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .agent-card-check svg { width: 13px; height: 13px; stroke: #FFF; stroke-width: 3; fill: none; }

  /* ── Full-screen camera (same as the Scan QR page) ── */
  .camera { position: absolute; inset: 0; z-index: 40; background: radial-gradient(120% 90% at 50% 30%, #2a2a31 0%, #161619 55%, #0a0a0c 100%); overflow: hidden; display: none; }
  .camera.show { display: block; }
  #cameraFeed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .camera.live #cameraFeed { display: block; }
  .camera-scene { position: absolute; inset: 0; background: radial-gradient(40% 30% at 25% 25%, rgba(255,255,255,0.06), transparent), radial-gradient(35% 25% at 75% 70%, rgba(254,53,61,0.08), transparent); filter: blur(2px); }
  .camera.live .camera-scene { display: none; }
  .viewfinder { position: absolute; top: 50%; left: 50%; width: 226px; height: 226px; transform: translate(-50%, -54%); border-radius: 26px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.55); }
  .corner { position: absolute; width: 34px; height: 34px; border: 4px solid #fff; }
  .corner.tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 26px 0 0 0; }
  .corner.tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 26px 0 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 26px; }
  .corner.br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 26px 0; }
  .scan-line { position: absolute; left: 10px; right: 10px; top: 12px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, #FE353D, transparent); box-shadow: 0 0 14px 2px rgba(254,53,61,0.7); animation: scanMove 2.2s ease-in-out infinite; }
  @keyframes scanMove { 0% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(196px); opacity: 1; } 100% { transform: translateY(0); opacity: 0.4; } }
  .cam-top { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; }
  .cam-time { color: #fff; font-size: 14px; font-weight: 600; font-family: 'Switzer', sans-serif; }
  .cam-icon-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.16); backdrop-filter: blur(6px); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
  .cam-icon-btn:hover { background: rgba(255,255,255,0.28); }
  .cam-icon-btn.active { background: #FE353D; }
  .cam-icon-btn svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2; fill: none; }
  .cam-title { position: absolute; top: 64px; left: 0; right: 0; text-align: center; z-index: 5; color: #fff; font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 600; }
  .cam-hint { position: absolute; left: 0; right: 0; bottom: 160px; z-index: 5; text-align: center; color: rgba(255,255,255,0.85); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 400; padding: 0 40px; line-height: 1.5; }

  /* ── QR-detected sheet: name + short code, Back / Pay — same language as the
     home Scan QR page's merchant-detected bottom sheet ── */
  .qr-detect-party { display: flex; align-items: center; gap: 14px; padding: 0 4px 20px; }
  .qr-detect-party .avatar { width: 52px; height: 52px; border-radius: 14px; background: #FFE9EA; color: var(--Primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 700; }
  .qr-detect-party .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .qr-detect-party .nm { font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 700; color: var(--On-Surface); }
  .qr-detect-party .sub { font-family: 'Switzer', sans-serif; font-size: 13px; color: var(--On-Surface-Low); }
  .qr-detect-actions { display: flex; gap: 12px; }
  .qr-detect-btn { flex: 1; height: 52px; border-radius: 14px; border: none; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; transition: background 0.15s, transform 0.12s; }
  .qr-detect-btn:active { transform: scale(0.98); }
  .qr-detect-btn.back { background: #F1F1F4; color: var(--On-Surface); }
  .qr-detect-btn.back:hover { background: #E9E9ED; }
  .qr-detect-btn.pay { flex: 1.4; background: var(--Primary); color: #FFF; box-shadow: 0 4px 16px rgba(254,53,61,0.25); }
  .qr-detect-btn.pay:hover { background: #E5303A; }

  /* ── Recent card ── */
  .recent-card { background: #FFF; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 12px; }
  .recent-title { font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 600; color: var(--On-Surface); letter-spacing: 0.2px; }
  .recent-list { display: flex; flex-direction: column; gap: 6px; }
  .recent-item { display: flex; align-items: center; gap: 12px; padding: 7px 0; cursor: pointer; border-radius: 10px; transition: background 0.15s; }
  .recent-item:hover { background: #FAFAFA; }
  .recent-avatar { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #FFF; border: 1px solid #ECECEC; display: flex; align-items: center; justify-content: center; }
  .recent-avatar img { width: 100%; height: 100%; object-fit: cover; }
  /* Agents get a name-initial avatar instead of a stock photo icon */
  .recent-avatar.initials { background: #FFE9EA; color: var(--Primary); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 700; border: none; }
  .recent-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .recent-name { font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 600; color: var(--On-Surface); letter-spacing: 0.2px; }
  .recent-sub { font-family: 'Switzer', sans-serif; font-size: 12px; color: var(--On-Surface-Low); }
  .recent-avatar svg { width: 19px; height: 19px; stroke: var(--Primary); stroke-width: 1.9; fill: none; }
  .recent-amt { font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 700; color: var(--On-Surface); white-space: nowrap; }
  .recent-empty { font-family: 'Switzer', sans-serif; font-size: 13px; color: var(--On-Surface-Low); padding: 6px 0; }
  .chev { width: 18px; height: 18px; stroke: var(--Primary); stroke-width: 2.4; fill: none; flex-shrink: 0; }

  /* ── Bottom button ── */
  .bottom-bar { flex-shrink: 0; padding: 10px 16px 18px; background: var(--Background); display: flex; gap: 12px; }
  .bottom-bar .qr-detect-btn[hidden] { display: none; }
  .bottom-bar .qr-detect-btn.back { flex: 1; height: 52px; }
  .bottom-bar .continue-btn { flex: 1.4; }
  .continue-btn { width: 100%; height: 52px; border-radius: 14px; border: none; background: #E0E0E0; color: var(--On-Surface-Low); font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; cursor: not-allowed; transition: all 0.2s; }
  .continue-btn.active { background: var(--Primary); color: #FFF; cursor: pointer; box-shadow: 0 4px 16px rgba(254,53,61,0.25); }
  .continue-btn.active:hover { background: #E5303A; box-shadow: 0 6px 20px rgba(254,53,61,0.35); transform: translateY(-1px); }
  .continue-btn.active:active { transform: scale(0.98) translateY(0); }

  /* ── Confirmation bottom sheet ── */
  .sheet-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 50; }
  .sheet-overlay.show { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; background: #FFF; border-radius: 24px 24px 0 0; padding: 12px 20px 22px; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1); }
  .sheet-overlay.show .sheet { transform: translateY(0); }
  .sheet-grip { width: 44px; height: 4px; border-radius: 2px; background: #D8D8DE; margin: 0 auto 14px; }
  .sheet-title { text-align: center; font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 700; color: var(--On-Surface); margin-bottom: 20px; }

  .party-card { position: relative; border: 1.5px solid var(--Border); border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .party-badge { position: absolute; top: -11px; right: 14px; background: #EDEDF0; color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.6px; padding: 4px 9px; border-radius: 6px; }
  .party-avatar { width: 44px; height: 44px; border-radius: 50%; background: #FFE9EA; color: var(--Primary); display: flex; align-items: center; justify-content: center; font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .party-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .party-name { font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 700; color: var(--On-Surface); }
  .party-sub { font-family: 'Switzer', sans-serif; font-size: 12.5px; color: var(--On-Surface-Low); }

  .sum-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 2px; border-bottom: 1px solid #F0F0F3; }
  .sum-row.total { border-bottom: none; }
  .sum-key { font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 400; color: var(--On-Surface-Low); }
  .sum-val { font-family: 'Switzer', sans-serif; font-size: 13.5px; font-weight: 700; color: var(--On-Surface); }
  .sum-row.total .sum-val { color: var(--Primary); font-size: 15px; }

  .sheet-actions { display: flex; gap: 12px; margin-top: 20px; }
  .sheet-btn { flex: 1; height: 50px; border-radius: 12px; background: #FFF; cursor: pointer; font-family: 'Switzer', sans-serif; font-size: 14.5px; font-weight: 500; transition: background 0.15s, transform 0.12s; }
  .sheet-btn:active { transform: scale(0.98); }
  .sheet-btn.cancel { border: 1.5px solid var(--Border); color: var(--On-Surface-Low); }
  .sheet-btn.cancel:hover { background: #FAFAFA; }
  .sheet-btn.confirm { border: 1.5px solid var(--Primary); color: var(--Primary); font-weight: 600; }
  .sheet-btn.confirm:hover { background: #FFF5F5; }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="window.location.href='Withdraw Cash.html'">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title">Withdraw Cash</span>
      <div style="width:36px;"></div>
    </div>

    <div class="scroll">

      <div class="form-card">
        <span class="field-label">Merchant Short Code</span>
        <div class="field">
          <input id="codeInput" class="strong" type="text" inputmode="numeric" maxlength="6" placeholder="Enter short code" autocomplete="off" oninput="onCodeInput(this)">
        </div>
        <div class="msg warn" id="codeMsg">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          <span id="codeMsgTxt"></span>
        </div>
        <div class="agent-card" id="agentRow" hidden>
          <span class="agent-card-avatar" id="agentAbbr"></span>
          <span class="agent-card-info">
            <span class="agent-card-name" id="agentName"></span>
            <span class="agent-card-sub" id="agentSub"></span>
          </span>
          <span class="agent-card-check"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
        </div>

        <span class="field-label">Amount</span>
        <div class="field">
          <input id="amtCode" type="text" inputmode="decimal" placeholder="e.g. 120 ETB" oninput="onAmountInput(this)">
          <span class="suffix">ETB</span>
        </div>
        <div class="balance-hint" id="balanceHintCode"><b>Balance:</b> 12,580.00 ETB</div>
        <div class="msg warn" id="amtMsgCode">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          <span id="amtMsgCodeTxt"></span>
        </div>

        <span class="field-label">Note (Optional)</span>
        <div class="field">
          <input id="noteCode" type="text" placeholder="e.g. Rent money" maxlength="40">
        </div>
      </div>

      <!-- Recent: agents, or once an agent is set, your withdrawals there -->
      <div class="recent-card">
        <span class="recent-title" id="recentTitle">Recent</span>
        <div class="recent-list" id="recentList"></div>
      </div>

    </div>

    <div class="bottom-bar">
      <button class="qr-detect-btn back" id="rescanBtn" onclick="openCamera()" hidden>Rescan</button>
      <button class="continue-btn" id="continueBtn" onclick="continueFlow()" disabled>Continue</button>
    </div>

  </div>

  <!-- Full-screen camera for scanning the agent's QR -->
  <div class="camera" id="camera">
    <video id="cameraFeed" autoplay playsinline muted></video>
    <div class="camera-scene"></div>
    <div class="cam-top">
      <button class="cam-icon-btn" onclick="closeCamera()" aria-label="Close">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <span class="cam-time">10:00</span>
      <button class="cam-icon-btn" id="flashBtn" onclick="this.classList.toggle('active')" aria-label="Flash">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>
    </div>
    <div class="cam-title">Scan QR Code</div>
    <div class="viewfinder">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="scan-line"></div>
    </div>
    <div class="cam-hint" id="camHint">Point your camera at the agent's QR code to withdraw cash.</div>
  </div>

  <!-- QR agent detected — merchant-scan-style sheet: name + short code, Back / Pay -->
  <div class="sheet-overlay" id="qrDetectOverlay" onclick="if(event.target===this)resumeScan()">
    <div class="sheet">
      <div class="sheet-grip"></div>
      <div class="qr-detect-party">
        <span class="avatar" id="qrDetAvatar"></span>
        <span class="info">
          <span class="nm" id="qrDetName"></span>
          <span class="sub" id="qrDetSub"></span>
        </span>
      </div>
      <div class="qr-detect-actions">
        <button class="qr-detect-btn back" onclick="resumeScan()">Back</button>
        <button class="qr-detect-btn pay" onclick="confirmAgentDetected()">Continue</button>
      </div>
    </div>
  </div>

  <!-- Confirmation sheet -->
  <div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this)closeSheet()">
    <div class="sheet">
      <div class="sheet-grip"></div>
      <div class="sheet-title">Confirmation</div>

      <div class="party-card">
        <span class="party-badge">MERCHANT</span>
        <div class="party-avatar" id="cfAvatar"></div>
        <div class="party-info">
          <span class="party-name" id="cfName"></span>
          <span class="party-sub" id="cfSub"></span>
        </div>
      </div>

      <div class="sum-row">
        <span class="sum-key">Withdrawal Amount:</span>
        <span class="sum-val" id="cfAmount"></span>
      </div>
      <div class="sum-row">
        <span class="sum-key">Fee:</span>
        <span class="sum-val" id="cfFee"></span>
      </div>
      <div class="sum-row total">
        <span class="sum-key">Total:</span>
        <span class="sum-val" id="cfTotal"></span>
      </div>

      <div class="sheet-actions">
        <button class="sheet-btn cancel" onclick="closeSheet()">Cancel</button>
        <button class="sheet-btn confirm" onclick="confirmWithdraw()">Confirm</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Same roster the nearby-agent screen uses, so a resolved agent renders identically downstream.
  const AGENTS = {
    '323217': { abbr: 'BM', name: 'Betty Merhat Agency', code: '323217', dist: '0.8 km', addr: 'Bole Medhanialem, Addis Ababa' },
    '562394': { abbr: 'KR', name: 'Kebede Retails', code: '562394', dist: '1.2 km', addr: 'Bole Airport Road, Addis Ababa' },
    '778901': { abbr: 'MS', name: 'Meskerem Agent Services', code: '778901', dist: '2.1 km', addr: 'Mekanisa, Addis Ababa' },
    '204411': { abbr: 'BM', name: 'Bole Mini-Mart', code: '204411', dist: '2.6 km', addr: 'Dembel City Center' },
    '615208': { abbr: 'AT', name: 'Abebe Tadesse Shop', code: '615208', dist: '3.4 km', addr: 'Gerji, Addis Ababa' },
    '430092': { abbr: 'HS', name: 'Hana Supermarket', code: '430092', dist: '4.1 km', addr: 'Megenagna, Addis Ababa' }
  };

  // Recent agents (no agent picked yet) and past withdrawals at each agent
  const RECENT_AGENTS = ['323217', '562394', '204411'];
  const WITHDRAWALS = {
    '323217': [{ amt: 1500, when: '24 Sep 2026 · 6:12 PM' }, { amt: 800, when: '17 Sep 2026 · 1:40 PM' }, { amt: 2000, when: '02 Sep 2026 · 9:05 AM' }],
    '562394': [{ amt: 500, when: '21 Sep 2026 · 11:18 AM' }, { amt: 1200, when: '08 Sep 2026 · 4:55 PM' }],
    '615208': [{ amt: 3000, when: '26 Sep 2026 · 7:30 PM' }, { amt: 1000, when: '12 Sep 2026 · 10:02 AM' }],
    '778901': [{ amt: 600, when: '15 Sep 2026 · 2:20 PM' }],
    '430092': [{ amt: 2500, when: '30 Aug 2026 · 5:45 PM' }],
    '204411': [{ amt: 400, when: '19 Sep 2026 · 8:10 AM' }]
  };

  const MIN_AMT = 10, MAX_AMT = 10000, BALANCE = 12580;
  let agent = null;          // agent resolved from the short code field
  let scanned = false;       // agent came from a QR scan → Rescan button shows
  let scanTimer = null;      // simulated "QR found" timer while the camera is open

  const $ = id => document.getElementById(id);

  /* ── Full-screen camera ── */
  async function startCamera() {
    if (window._camStream || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      window._camStream = stream;
      $('cameraFeed').srcObject = stream;
      $('camera').classList.add('live');
    } catch (e) {}
  }
  function stopCamera() {
    if (window._camStream) window._camStream.getTracks().forEach(t => t.stop());
    window._camStream = null;
    $('camera').classList.remove('live');
  }

  function openCamera() {
    $('camHint').textContent = "Point your camera at the agent's QR code to withdraw cash.";
    $('camera').classList.add('show');
    startCamera();
    clearTimeout(scanTimer);
    scanTimer = setTimeout(simulateScan, 3000);
  }

  // Close: back to the form if an agent is already set, else leave the flow
  function closeCamera() {
    clearTimeout(scanTimer);
    $('qrDetectOverlay').classList.remove('show');
    stopCamera();
    if (agent) $('camera').classList.remove('show');
    else window.location.href = 'Withdraw Cash.html';
  }

  // The QR identifies the agent on its own — show it in the detected sheet
  function simulateScan() {
    const a = AGENTS['562394'];
    $('qrDetAvatar').textContent = a.abbr;
    $('qrDetName').textContent = a.name;
    $('qrDetSub').textContent = 'Merchant Short Code: ' + a.code;
    $('qrDetectOverlay').dataset.code = a.code;
    $('camHint').textContent = 'QR code detected';
    $('qrDetectOverlay').classList.add('show');
  }

  // Back on the sheet: keep scanning
  function resumeScan() {
    $('qrDetectOverlay').classList.remove('show');
    $('camHint').textContent = "Point your camera at the agent's QR code to withdraw cash.";
    clearTimeout(scanTimer);
    scanTimer = setTimeout(simulateScan, 3000);
  }

  // Continue on the sheet: close the camera and fill the form with the agent
  function confirmAgentDetected() {
    const a = AGENTS[$('qrDetectOverlay').dataset.code];
    $('qrDetectOverlay').classList.remove('show');
    clearTimeout(scanTimer);
    stopCamera();
    $('camera').classList.remove('show');
    scanned = true;
    $('rescanBtn').hidden = false;
    lockAgent(a);
    $('amtCode').focus();
  }

  /* ── Merchant short code (editable, also filled by a scan) ── */
  function onCodeInput(el) {
    el.value = el.value.replace(/\D/g, '').slice(0, 6);
    const a = AGENTS[el.value];
    $('codeMsg').classList.remove('show');
    if (a) { lockAgent(a); return; }
    agent = null;
    $('agentRow').hidden = true;
    if (el.value.length === 6) { $('codeMsgTxt').textContent = 'Invalid merchant short code.'; $('codeMsg').classList.add('show'); }
    updateBtn();
    renderRecent();
  }

  function lockAgent(a) {
    agent = a;
    $('codeInput').value = a.code;
    $('codeMsg').classList.remove('show');
    $('agentAbbr').textContent = a.abbr;
    $('agentName').textContent = a.name;
    $('agentSub').textContent = a.code + (a.dist ? ' · ' + a.dist : '');
    $('agentRow').hidden = false;
    updateBtn();
    renderRecent();
  }

  /* ── Amount ── */
  function onAmountInput(el) {
    el.value = el.value.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1');
    validateAmount();
    updateBtn();
  }

  function amountEl() { return $('amtCode'); }

  function validateAmount() {
    const raw = amountEl().value.trim();
    const msg = $('amtMsgCode');
    if (raw === '') { msg.classList.remove('show'); $('balanceHintCode').style.display = ''; return null; }
    const n = parseFloat(raw);
    let err = '';
    if (isNaN(n) || n <= 0) err = 'Enter a valid amount.';
    else if (n < MIN_AMT) err = 'Minimum withdrawal is ' + MIN_AMT + ' ETB.';
    else if (n > MAX_AMT) err = 'Maximum withdrawal is ' + MAX_AMT.toLocaleString() + ' ETB/Transaction';
    else if (n > BALANCE) err = 'Amount exceeds your available balance.';
    if (err) { $('amtMsgCodeTxt').textContent = err; msg.classList.add('show'); $('balanceHintCode').style.display = 'none'; return null; }
    msg.classList.remove('show');
    $('balanceHintCode').style.display = '';
    return n;
  }

  function updateBtn() {
    const ok = !!agent && validateAmount() !== null;
    $('continueBtn').classList.toggle('active', ok);
    $('continueBtn').disabled = !ok;
  }

  /* ── Recent ── */
  const CHEV = '<svg class="chev" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  const CASH = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>';

  // No agent: recent agents to pick from. Agent set: your withdrawals there —
  // tapping one fills the amount again.
  function renderRecent() {
    const list = $('recentList');
    if (!agent) {
      $('recentTitle').textContent = 'Recent';
      list.innerHTML = RECENT_AGENTS.map(c => AGENTS[c]).map(a => `
        <div class="recent-item" onclick="useRecent('${a.code}')">
          <div class="recent-avatar initials">${a.abbr}</div>
          <div class="recent-info"><span class="recent-name">${a.name}</span><span class="recent-sub">${a.code}</span></div>
          ${CHEV}
        </div>`).join('');
      return;
    }
    $('recentTitle').textContent = 'Recent withdrawals';
    const rows = WITHDRAWALS[agent.code] || [];
    list.innerHTML = rows.length ? rows.map(w => `
        <div class="recent-item" onclick="reuseAmount(${w.amt})">
          <div class="recent-avatar initials">${CASH}</div>
          <div class="recent-info"><span class="recent-name">Withdraw</span><span class="recent-sub">${w.when}</span></div>
          <span class="recent-amt">${fmt(w.amt)} ETB</span>
        </div>`).join('')
      : '<div class="recent-empty">No withdrawals at this agent yet.</div>';
  }

  function reuseAmount(n) {
    amountEl().value = String(n);
    validateAmount();
    updateBtn();
    amountEl().focus();
  }

  // A picked agent (map, favourite, frequent or Recent) fills the short code
  function useRecent(code) {
    const a = AGENTS[code];
    if (!a) return;
    lockAgent(a);
    $('amtCode').focus();
  }

  /* ── Confirmation sheet ── */
  // Same fee table the review screen uses, so totals agree across the flow.
  function computeFee(n) {
    if (n <= 0) return 0;
    if (n <= 2000) return 7;
    if (n <= 5000) return 15;
    if (n <= 8000) return 30;
    return 45;
  }

  const fmt = n => parseFloat(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  function continueFlow() {
    const amt = validateAmount();
    if (!agent || amt === null) return;
    const fee = computeFee(amt);
    $('cfAvatar').textContent = agent.abbr;
    $('cfName').textContent = agent.name;
    $('cfSub').textContent = 'Short Code: ' + agent.code;
    $('cfAmount').textContent = fmt(amt) + ' ETB';
    $('cfFee').textContent = fmt(fee) + ' ETB';
    $('cfTotal').textContent = fmt(amt + fee) + ' ETB';
    $('sheetOverlay').classList.add('show');
  }

  function closeSheet() { $('sheetOverlay').classList.remove('show'); }

  function confirmWithdraw() {
    const amt = validateAmount();
    if (!agent || amt === null) return;
    const fee = computeFee(amt);
    sessionStorage.setItem('withdrawData', JSON.stringify({
      method: 'agent',
      methodLabel: scanned ? 'Merchant QR Code' : 'Merchant Short Code',
      entry: scanned ? 'qr' : 'code',
      agent: agent,
      agentName: agent.name,
      agentCode: agent.code,
      agentDist: agent.dist,
      amount: amt,
      fee: fee,
      total: amt + fee,
      note: $('noteCode').value.trim(),
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    }));
    window.location.href = 'Withdraw Cash - Enter PIN.html';
  }

  renderRecent();

  /* ── Entry: a picked agent fills the form; a Scan QR entry opens the camera ── */
  try {
    const data = JSON.parse(sessionStorage.getItem('withdrawData') || '{}');
    const code = String(data.agentCode || (data.agent && data.agent.code) || '');
    if (/^\d{6}$/.test(code)) useRecent(code);
    else if (data.entry === 'qr') openCamera();
  } catch (e) { /* ignore corrupt state and render the screen as-is */ }
</script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
