<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw Cash - Receipt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* Withdraw at Agent: "Voucher Generated" with the one-time voucher code the
     agent redeems, the withdrawal details, the code expiry and the total. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Figtree', system-ui, sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #1C1C1E; }
  button { font-family: inherit; }
  .phone-frame { width: 360px; height: 780px; background: #F2F2F2; border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }

  .top-space { height: 24px; flex: none; }
  header { height: 56px; flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 0 12px; }
  .icon-btn { width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 22px; }
  .icon-btn:hover { background: rgba(0,0,0,0.05); }
  header h1 { font-size: 17px; font-weight: 500; text-align: center; }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 12px; scrollbar-width: none; }
  main::-webkit-scrollbar { display: none; }
  .card { background: #FFF; border-radius: 28px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); padding-bottom: 20px; }
  .head { padding: 26px 18px 14px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .ok { width: 48px; height: 48px; border-radius: 14px; background: #E6F4E4; border: 1.5px solid #4CAF50; display: flex; align-items: center; justify-content: center; }
  .head h2 { margin-top: 8px; font-size: 17px; font-weight: 700; }
  .head .thanks { margin-top: 4px; font-size: 12.5px; color: #6E6E73; }

  /* The voucher code the agent redeems */
  .voucher { width: 100%; margin-top: 18px; border: 1.5px solid #DD3545; background: #FDEEF0; border-radius: 18px; padding: 14px 14px 0; display: flex; flex-direction: column; align-items: center; }
  .v-label { align-self: flex-start; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: #1C1C1E; }
  .v-label i { width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid #DD3545; display: flex; align-items: center; justify-content: center; }
  .v-code { margin: 8px 0 12px; padding-left: 0.1em; font-size: 28px; font-weight: 700; line-height: 1.1; letter-spacing: 0.1em; word-spacing: 0.08em; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .v-rule { align-self: stretch; border-top: 1px solid #EFA3AB; }
  .v-actions { align-self: stretch; display: grid; grid-template-columns: 1fr 1fr; }
  .v-btn { height: 48px; padding: 0; border: 0; background: transparent; color: #1C1C1E; font-size: 13.5px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }

  .tear { position: relative; height: 24px; display: flex; align-items: center; }
  .tear::before, .tear::after { content: ''; position: absolute; top: 0; width: 24px; height: 24px; border-radius: 12px; background: #F2F2F2; }
  .tear::before { left: -12px; } .tear::after { right: -12px; }
  .tear i { flex: 1; margin: 0 18px; border-top: 1px solid #E0E0E3; }

  .details { padding: 10px 18px 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 32px; }
  .row .k { font-size: 12.5px; color: #6E6E73; }
  .row .v { font-size: 12.5px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }

  /* Code expiry */
  .expiry { margin-top: 14px; display: flex; align-items: center; gap: 10px; background: #FDEEF0; border-radius: 12px; padding: 14px 16px; }
  .expiry i { width: 29px; height: 29px; border-radius: 8px; background: #DD3545; display: flex; align-items: center; justify-content: center; flex: none; }
  .expiry span { flex: 1; font-size: 13px; font-weight: 600; color: #DD3545; }
  .expiry b { font-size: 13px; font-weight: 700; }

  .rule { margin: 16px 0 0; border-top: 1px solid #F0F0F0; }
  .who { margin-top: 18px; text-align: center; font-size: 15px; font-weight: 500; }
  .amount { margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #F23E3E; }
  .amount b { font-size: 36px; font-weight: 500; line-height: 1; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }
  .amount i { width: 1px; height: 40px; background: #F23E3E; }
  .amount span { font-size: 17px; font-weight: 500; }

  footer { flex: none; padding: 12px 16px 24px; }
  .done { width: 100%; height: 48px; border: 0; border-radius: 16px; background: #DD3545; color: #FFF; font-size: 15px; font-weight: 500; cursor: pointer; }
  .done:active { transform: scale(0.99); }

  .toast { position: absolute; left: 50%; bottom: 96px; transform: translate(-50%, 10px); background: #1C1C1E; color: #FFF; font-size: 13px; padding: 10px 14px; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; white-space: nowrap; z-index: 20; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="top-space"></div>
  <header>
    <button class="icon-btn" type="button" aria-label="Back" onclick="goHome()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <h1>Withdraw At Agent</h1>
    <span></span>
  </header>

  <main>
    <section class="card">
      <div class="head">
        <div class="ok"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#43A047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2>Voucher Generated</h2>
        <p class="thanks">Thank you for choosing M-PESA Lehulum</p>

        <!-- The one-time voucher code, shown to the agent -->
        <div class="voucher">
          <div class="v-label">
            <i><svg width="11" height="11" viewBox="0 0 24 24" fill="#DD3545" aria-hidden="true"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12z"/></svg></i>
            Voucher code
          </div>
          <div class="v-code" id="vCode"></div>
          <div class="v-rule"></div>
          <div class="v-actions">
            <button class="v-btn" type="button" onclick="copyCode()">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#DD3545" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>
              Copy code
            </button>
            <button class="v-btn" type="button" onclick="shareCode()">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#DD3545" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6"/></svg>
              Share code
            </button>
          </div>
        </div>
      </div>

      <div class="tear"><i></i></div>

      <div class="details">
        <div class="row"><span class="k">Name</span><span class="v" id="dName">Aster Mequanent</span></div>
        <div class="row"><span class="k">Phone number</span><span class="v">0712 *** *78</span></div>
        <div class="row"><span class="k">Merchant short code</span><span class="v" id="dCode"></span></div>
        <div class="row"><span class="k">Transaction type</span><span class="v">Withdraw at Agent</span></div>
        <div class="row"><span class="k">Date</span><span class="v" id="dDate"></span></div>

        <div class="expiry">
          <i><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></i>
          <span>Code expires in</span>
          <b>24 hrs</b>
        </div>

        <div class="rule"></div>
        <p class="who" id="who"></p>
        <p class="amount"><b id="bigTotal"></b><i></i><span>ETB</span></p>
      </div>
    </section>
  </main>

  <footer>
    <button class="done" type="button" onclick="goHome()">Done</button>
  </footer>
  <div class="toast" id="toast"></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const data = JSON.parse(sessionStorage.getItem('withdrawData') || '{}');
  const agent = data.agent || {};
  // Whole amounts without decimals (-21,005), otherwise two places
  const money = n => { const v = parseFloat(n || 0); return v.toLocaleString('en-US', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }); };

  const total = parseFloat(data.total || (parseFloat(data.amount || 0) + parseFloat(data.fee || 0)));
  $('who').textContent = data.agentName || agent.name || 'Meskerem Agent Services';
  $('dCode').textContent = data.agentCode || agent.code || '778901';
  $('vCode').textContent = String(data.voucherCode || '777653').replace(/(\d{3})(?=\d)/g, '$1 ').trim();
  if (data.payerName) $('dName').textContent = data.payerName;
  $('bigTotal').textContent = '-' + money(total || 21005);
  const d = new Date();
  $('dDate').textContent = d.toLocaleDateString('en-GB') + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

  let toastT;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }
  function copyCode() { try { navigator.clipboard.writeText(data.voucherCode || ''); } catch (e) {} toast('Voucher code copied'); }
  function shareCode() { toast('Voucher code shared'); }
  function goHome() { window.location.href = 'Lehulum Home.html'; }
</script>
<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
