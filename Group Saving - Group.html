<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Saving — M-PESA</title>
<link rel="stylesheet" href="styles/design-tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/component-status-bar.css">
<link rel="stylesheet" href="styles/component-sc-card.css">
<link rel="stylesheet" href="styles/savings.css">
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap');

  /* One group (?id=). Hero (balance, target, status, members, my share),
     Contribute / Withdraw (admin, once the target or date is reached) or
     Members, who can take money out and when, any leave request, members by
     contribution, transactions. ⋯ admin: Edit Group, Add Members, Close Group;
     member: Leave Group (needs 3 approvals; the demo approves by itself). */
  .rule { display: flex; gap: 12px; align-items: flex-start; }
  .rule i { width: 38px; height: 38px; border-radius: 12px; background: #FFF1F2; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rule i svg { width: 19px; height: 19px; stroke: var(--Primary); stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .rule.ready i { background: #E8F9EE; }
  .rule.ready i svg { stroke: #16A34A; }
  .rule b { display: block; font-size: 13.5px; font-weight: 600; color: var(--On-Surface); }
  .rule small { display: block; margin-top: 2px; font-size: 12px; line-height: 1.45; color: var(--On-Surface-Low); }
  .mem { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .mem + .mem { border-top: 1px solid #F4F4F6; }
  .mem.tap { cursor: pointer; }
  .mem span.inf { flex: 1; min-width: 0; }
  .mem b { display: block; font-size: 13.5px; font-weight: 600; color: var(--On-Surface); }
  .mem small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--On-Surface-Low); }
  .mem .tags { display: flex; gap: 4px; }
  .tg { font-style: normal; padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; background: #F1F1F4; color: #55555E; }
  .tg.you { background: #FFF1F2; color: var(--Primary); }
  .tg.admin { background: #1C1C21; color: #FFF; }
  .tg.leaving { background: #FEF3C7; color: #B45309; }
  .s-sub { position: relative; margin-top: 4px; font-size: 12px; color: var(--On-Surface-Low); }
  .s-sub b { color: var(--On-Surface); font-weight: 600; }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="time">10:00</span>
    <div class="status-icons">
      <svg data-name="icon-wifi" viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.970-4.970 13.030-4.970 18 0l2-2C16.930 2.930 7.080 2.930 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.760-2.760 7.240-2.760 10 0l2-2C15.140 9.140 8.870 9.140 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.100-1.100 2.900-1.100 4 0l2-2c-2.210-2.210-5.790-2.210-8 0z" fill="#1C1C21"/></svg>
      <svg data-name="icon-signal" viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
      <svg data-name="icon-battery" viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
    </div>
  </div>

  <div class="app-content">
    <div class="header-nav">
      <button class="icon-btn" onclick="location.href='Group Saving.html'" aria-label="Back"><svg data-name="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <span class="header-title" id="hTitle">Group Saving</span>
      <button class="icon-btn" id="menuBtn" onclick="openSheet('menu')" aria-label="Menu"><svg data-name="icon-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></button>
    </div>

    <div class="sc-card" id="hero">
      <div class="s-label"><span id="gName"></span></div>
      <div class="s-amount"><span id="gBal"></span><small>ETB</small></div>
      <div class="s-row"><div><span>Target</span><b id="gTarget"></b></div><span class="chip" id="gChip"></span></div>
      <div class="s-bar" id="gBar"><i></i></div>
      <p class="s-note" id="gNote"></p>
      <p class="s-sub" id="gSub"></p>
    </div>
    <div class="rbtns" id="acts"></div>
    <div id="notices" class="list"></div>
    <div id="leave"></div>
    <div class="card rule" id="rule"></div>
    <div class="card" id="membersCard"><div class="sec-head" style="margin:0 0 4px"><b>Members</b><small id="mCount"></small></div><div id="members"></div></div>
    <div class="card"><div class="sec-head" style="margin:0 0 4px"><b>Transactions</b></div><div id="txs"></div></div>
  </div>

  <div class="scrim" id="scrim" onclick="closeSheets()"></div>
  <div class="sheet" id="menu" role="dialog" aria-label="Group menu">
    <div class="sheet-grip"></div>
    <div id="menuItems"></div>
  </div>
  <div class="sheet" id="confirm" role="dialog" aria-label="Confirm">
    <div class="sheet-grip"></div>
    <div class="cf-ic" id="cfIc"></div>
    <p class="cf-t" id="cfT"></p>
    <p class="cf-p" id="cfP"></p>
    <div class="cf-rows rows" id="cfRows"></div>
    <button class="btn-primary" id="cfGo"></button>
    <button class="btn-ghost" id="cfAlt" style="display:none;color:var(--Primary)"></button>
    <button class="btn-ghost" onclick="closeSheets()">Not Now</button>
  </div>
  <div class="sheet" id="editSheet" role="dialog" aria-label="Edit group">
    <div class="sheet-grip"></div>
    <p class="sheet-title">Edit group</p>
    <label class="field"><span>Group name</span><input class="input" id="eName" maxlength="15"></label>
    <label class="field" style="margin-top:12px"><span>Group target</span><div class="amount-in"><input id="eGoal" inputmode="decimal"><small>ETB</small></div></label>
    <label class="field" style="margin-top:12px"><span>Target date</span><input class="input" id="eBy" type="date"></label>
    <p class="hint err" id="eErr" style="display:none;margin-top:8px"></p>
    <button class="btn-primary" style="margin-top:16px" onclick="saveEdit()">Save Changes</button>
  </div>
  <div class="sheet" id="leftSheet" role="dialog" aria-label="Leave approved">
    <div class="sheet-grip"></div>
    <div class="cf-ic" style="background:#E8F9EE"><svg viewBox="0 0 24 24" style="stroke:#16A34A"><path d="M20 6 9 17l-5-5"/></svg></div>
    <p class="cf-t">Leave approved</p>
    <p class="cf-p" id="leftTxt"></p>
    <button class="btn-primary" onclick="location.href='Group Saving.html'">Back to Group Saving</button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="savings-store.js"></script>
<script src="savings-ui.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const fmt = SV.fmt, IC = SVUI.IC;
  let tt;
  function toast(m) { const t = $('toast'); if (!t) return; t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }
  function openSheet(id) { const s = $('scrim'); if (s) s.classList.add('show'); $(id).classList.add('show'); }
  function closeSheets() { const s = $('scrim'); if (s) s.classList.remove('show'); document.querySelectorAll('.sheet').forEach(x => x.classList.remove('show')); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });
  // Hand an action to the shared PIN screen, which returns to Savings - Done.html
  function toPin(data) { sessionStorage.setItem('termLoanData', JSON.stringify(Object.assign({ next: 'Savings - Done.html', back: location.pathname.split('/').pop() + location.search }, data))); location.href = 'Term Loan - Enter PIN.html'; }

  // Leave request card: the requester sees progress; others approve (admin may decline)
  function leaveCard(g, withGroup) {
    const L = g.leave; if (!L) return '';
    const who = SV.person(L.who), n = L.approvals.length, need = SV.LEAVE_NEEDED;
    const dots = `<div class="dots">${Array.from({ length: need }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}<span>${Math.min(n, need)} of ${need} members have approved</span></div>`;
    const where = withGroup ? ' · ' + g.name : '';
    if (L.who === 'me') return `<div class="card leave"><div class="lv-top">${SVUI.av(SV.ME)}<span><b>Leave request sent${where}</b><small>${fmt(SV.leavePayout(g, 'me'))} ETB comes back to you, with interest, once ${need} members approve.</small></span><em class="tag">Waiting</em></div>${dots}</div>`;
    const mine = L.approvals.includes('me');
    return `<div class="card leave"><div class="lv-top">${SVUI.av(who)}<span><b>${who.name} asked to leave${where}</b><small>${fmt(SV.leavePayout(g, L.who))} ETB goes back to them, with interest.</small></span><em class="tag">${mine ? 'Approved' : 'Action required'}</em></div>${dots}
      ${mine ? '' : withGroup ? `<div class="lv-btns one"><button class="yes" onclick="location.href='Group Saving - Group.html?id=${g.id}'">Review Request</button></div>`
        : `<div class="lv-btns${g.admin === 'me' ? '' : ' one'}">${g.admin === 'me' ? '<button onclick="askDecline()">Decline</button>' : ''}<button class="yes" onclick="approve()">Approve</button></div>`}</div>`;
  }
  const ICN = { edit: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>', add: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M19 8v6M16 11h6"/></svg>', close: '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>', leave: '<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>', info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>' };

  const q = new URLSearchParams(location.search);
  let S = SV.load(), g = SV.groupsOf(S).find(x => x.id === q.get('id')) || SV.groupsOf(S)[0];
  const admin = g.admin === 'me';
  function paint() {
    const bal = SV.balanceOf(g), st = SV.statusOf(g), pct = SV.pctOf(g), d = SV.daysLeft(g), mine = SV.memberTotal(g, 'me');
    $('gName').textContent = g.name;
    $('gBal').textContent = fmt(bal);
    $('gTarget').innerHTML = fmt(g.target.amount) + '<small>ETB</small>';
    $('gChip').className = 'chip ' + st.key; $('gChip').textContent = st.label;
    $('gBar').firstElementChild.style.width = Math.max(2, pct) + '%';
    $('gNote').textContent = `${d ? d + ' days to ' : 'Target date '}${SV.dateStr(g.target.by)} · ${pct}%`;
    $('gSub').innerHTML = `${SV.membersLine(g)} · you put in <b>${fmt(mine)} ETB</b>` + (g.auto ? `<br>Auto-save ${SV.autoLine(g.auto)}` : '');

    // Actions: Contribute · Recurring Transfer · Withdraw (admin) or Members
    const can = SV.canWithdraw(g);
    $('acts').innerHTML = SVUI.roundActions([
      { label: 'Contribute', ic: 'plus', kind: 'main', onclick: `location.href='Savings - Amount.html?group=${g.id}'` },
      SVUI.recurring(g.auto, `Savings - Auto Save.html?group=${g.id}`),
      admin ? { label: 'Withdraw', ic: 'down', kind: can ? '' : 'off', onclick: 'withdraw()' }
            : { label: 'Members', ic: 'members', onclick: "$('membersCard').scrollIntoView({behavior:'smooth'})" }
    ]);

    // Who may take money out, and when
    const by = SV.dateStr(g.target.by), adm = SV.person(g.admin);
    $('rule').className = 'card rule' + (can ? ' ready' : '');
    $('rule').innerHTML = can
      ? `<i>${IC.check}</i><span><b>Ready to withdraw</b><small>${bal >= g.target.amount ? 'The group reached its target.' : 'The target date has come.'} You can take the money out now.</small></span>`
      : `<i>${ICN.info}</i><span><b>${admin ? 'You manage this group' : 'Managed by ' + adm.name}</b><small>${admin ? 'You' : adm.name.split(' ')[0]} can withdraw once the target is reached or on ${by}.</small></span>`;

    $('leave').innerHTML = leaveCard(g, false);

    // Members by contribution, pending invitations last
    const rows = g.members.slice().sort((a, b) => (!!a.pending - !!b.pending) || SV.memberTotal(g, b.id) - SV.memberTotal(g, a.id));
    $('mCount').textContent = SV.membersLine(g);
    $('members').innerHTML = rows.map(m => { const p = SV.person(m.id), t = SV.memberTotal(g, m.id), share = bal > 0 ? Math.round(t / bal * 100) : 0;
      const tags = [m.id === 'me' ? '<em class="tg you">You</em>' : '', g.admin === m.id ? '<em class="tg admin">Admin</em>' : '', g.leave && g.leave.who === m.id ? '<em class="tg leaving">Leaving</em>' : '', m.pending ? '<em class="tg">Pending</em>' : ''].join('');
      const tap = admin && m.id !== 'me';
      return `<div class="mem${tap ? ' tap' : ''}" ${tap ? `onclick="memberActions('${m.id}')"` : ''}>${SVUI.av(p)}<span class="inf"><b>${m.id === 'me' ? 'You' : p.name}</b><small>${m.pending ? 'Pending invitation' : fmt(t) + ' ETB · ' + share + '%'}</small></span><span class="tags">${tags}</span></div>`; }).join('');

    // Transactions with who did it
    const IN = '<svg viewBox="0 0 24 24"><path d="M17 7 7 17M15 17H7V9"/></svg>', OUT = '<svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>';
    $('txs').innerHTML = g.txns.length ? g.txns.slice().reverse().map(t => { const out = t.type === 'WITHDRAW', p = SV.person(t.by);
      return `<div class="tx${out ? ' out' : ''}"><span class="ic">${out ? OUT : IN}</span><span class="inf"><b>${t.label || (t.by === 'me' ? 'You' : p.name) + (out ? ' · withdrawal' : t.auto ? ' · auto-save' : ' · contribution')}</b><small>${SV.dateStr(t.on)}</small></span><span class="amt">${out ? '-' : '+'}${fmt(t.amount)}</span></div>`; }).join('')
      : '<p class="no-tx">No transactions yet</p>';

    // ⋯ menu
    const item = (ic, label, fn) => `<button class="menu-item" onclick="closeSheets(); setTimeout(${fn}, 120)"><i>${ICN[ic]}</i><b>${label}</b></button>`;
    $('menuItems').innerHTML = admin ? item('edit', 'Edit Group', 'openEdit') + item('add', 'Add Members', 'addMembers') + item('close', 'Close Group', 'askCloseGroup')
      : (g.leave && g.leave.who === 'me' ? '' : item('leave', 'Leave Group', 'askLeave'));
    $('menuBtn').style.visibility = $('menuItems').innerHTML ? '' : 'hidden';
  }
  paint();
  $('notices').innerHTML = SVUI.noticeBanner(S);

  function confirmSheet({ ic, t, p, rows = [], go, fn, alt }) {
    $('cfIc').innerHTML = ICN[ic] || ic; $('cfT').textContent = t; $('cfP').innerHTML = p;
    $('cfRows').innerHTML = rows.map(([k, v, c]) => `<div class="row${c ? ' ' + c : ''}"><span>${k}</span><b>${v}</b></div>`).join('');
    $('cfRows').style.display = rows.length ? '' : 'none';
    $('cfGo').textContent = go; $('cfGo').onclick = fn;
    $('cfAlt').style.display = alt ? '' : 'none';
    if (alt) { $('cfAlt').textContent = alt.label; $('cfAlt').onclick = alt.fn; }
    openSheet('confirm');
  }
  // Admin takes the whole pot once eligible; the group then closes
  function withdraw() {
    if (!SV.canWithdraw(g)) return toast('Withdraw opens at the target or on ' + SV.dateStr(g.target.by));
    const bal = SV.balanceOf(g);
    confirmSheet({ ic: 'close', t: 'Withdraw the group savings?', p: 'The whole balance goes to your M-PESA wallet.',
      rows: [['From group savings', fmt(bal) + ' ETB'], ['Send to', 'M-PESA wallet'], ['Members', SV.joined(g).length], ['After this', 'Group closes']],
      go: 'Withdraw', fn: () => toPin({ kind: 'sav-grp-withdraw', title: 'Withdraw from ' + g.name, id: g.id, amount: bal }) });
  }
  function askCloseGroup() {
    const mine = SV.memberTotal(g, 'me');
    confirmSheet({ ic: 'close', t: 'Close ' + g.name + '?', p: 'Every member gets back what they put in, and the group is closed for good.',
      rows: [['Paid back to members', fmt(SV.balanceOf(g)) + ' ETB'], ['Your share to wallet', fmt(mine) + ' ETB', 'total']],
      go: 'Close Group', fn: () => toPin({ kind: 'sav-grp-close', title: 'Close ' + g.name, id: g.id, amount: SV.balanceOf(g) }) });
  }
  function askLeave() {
    const pay = SV.leavePayout(g, 'me');
    confirmSheet({ ic: 'leave', t: 'Leave ' + g.name + '?', p: `${SV.LEAVE_NEEDED} other members must approve. Then everything you put in comes back to you, with interest.`,
      rows: [['You put in', fmt(SV.memberTotal(g, 'me')) + ' ETB'], ['Interest', '+' + fmt(SV.memberInterest(g, 'me')) + ' ETB'], ['Paid back', fmt(pay) + ' ETB', 'total']],
      go: 'Send Leave Request', fn: () => toPin({ kind: 'sav-grp-leave', title: 'Leave ' + g.name, id: g.id, amount: Math.round(pay * 100) / 100 }) });
  }
  function approve() {
    const who = SV.person(g.leave.who), pay = SV.leavePayout(g, g.leave.who);
    toPin({ kind: 'sav-grp-approve', title: 'Approve ' + who.name.split(' ')[0] + ' leaving', id: g.id, amount: Math.round(pay * 100) / 100 });
  }
  function askDecline() {
    const who = SV.person(g.leave.who);
    confirmSheet({ ic: 'close', t: 'Decline the request?', p: `${who.name} stays in ${g.name} and their money stays in the group. They are told by SMS.`,
      go: 'Decline Request', fn: () => { g.leave = null; SV.save(S); closeSheets(); paint(); toast('Leave request declined'); } });
  }
  function memberActions(id) {
    const p = SV.person(id), m = g.members.find(x => x.id === id);
    confirmSheet({ ic: SVUI.av(p, 'big'), t: p.name, p: m.pending ? 'Invitation not answered yet.' : 'What they already put in stays in the group.',
      rows: m.pending ? [] : [['Put in', fmt(SV.memberTotal(g, id)) + ' ETB']],
      alt: m.pending ? { label: 'Open as ' + p.name.split(' ')[0] + ' (demo)', fn: () => location.href = `Group Saving - Invitation.html?group=${g.id}&as=${id}` } : null,
      go: m.pending ? 'Cancel Invitation' : 'Remove from Group', fn: () => { g.members = g.members.filter(x => x.id !== id); if (g.leave && g.leave.who === id) g.leave = null; SV.save(S); closeSheets(); paint(); toast(p.name.split(' ')[0] + ' removed from the group'); } });
  }
  function addMembers() {
    SVUI.memberPicker({ existing: g.members.map(m => m.id), button: 'Add to Group', onDone: ids => { ids.forEach(id => g.members.push({ id, pending: true })); SV.save(S); paint(); toast(ids.length + (ids.length > 1 ? ' invitations' : ' invitation') + ' sent'); } });
  }
  function openEdit() {
    $('eName').value = g.name; $('eGoal').value = g.target.amount; $('eBy').value = g.target.by.slice(0, 10);
    $('eBy').min = new Date(Date.now() + 864e5).toISOString().slice(0, 10); $('eErr').style.display = 'none';
    openSheet('editSheet');
  }
  function saveEdit() {
    const n = $('eName').value.trim(), a = parseFloat(($('eGoal').value || '').replace(/,/g, '')) || 0, by = $('eBy').value;
    const err = !n ? 'Give the group a name' : a < SV.TARGET_MIN ? 'The target must be at least 500 ETB' : !by || new Date(by) <= new Date() ? 'Pick a date after today' : '';
    if (err) { $('eErr').textContent = err; $('eErr').style.display = ''; return; }
    g.name = n; g.target.amount = a; g.target.by = new Date(by).toISOString(); SV.save(S); closeSheets(); paint(); toast('Group updated — members were told by SMS');
  }

  // Demo: my own leave request gets approved by the others, one every 3.6 s
  function tickApprovals() {
    if (!g.leave || g.leave.who !== 'me') return;
    const others = SV.joined(g).map(m => m.id).filter(id => id !== 'me' && !g.leave.approvals.includes(id)).sort((a, b) => (b === g.admin) - (a === g.admin));
    if (g.leave.approvals.length < SV.LEAVE_NEEDED && others.length) { g.leave.approvals.push(others[0]); SV.save(S); paint(); toast(SV.person(others[0]).name.split(' ')[0] + ' approved your request'); }
    if (g.leave.approvals.length >= SV.LEAVE_NEEDED) {
      const pay = Math.round(SV.leavePayout(g, 'me') * 100) / 100;
      S.wallet += pay; S.groups = S.groups.filter(x => x.id !== g.id); SV.save(S);
      $('leftTxt').innerHTML = `<b>${fmt(pay)} ETB</b> — what you put in plus interest — was sent to your M-PESA wallet. You are no longer in ${g.name}.`;
      setTimeout(() => openSheet('leftSheet'), 600);
      return;
    }
    setTimeout(tickApprovals, 3600);
  }
  if (g.leave && g.leave.who === 'me') setTimeout(tickApprovals, 3600);
  const done = q.get('done');
  if (done) setTimeout(() => toast({ contribute: 'Contribution added to ' + g.name, leave: 'Leave request sent', approve: 'You approved the request', auto: 'Auto-save is on', autostop: 'Auto-save stopped' }[done] || 'Done'), 300);
</script>
<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
