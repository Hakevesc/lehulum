<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw at Agent</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  /* Withdraw at Agent. Enter Code: type the merchant short code (looked up),
     then the amount. Near By (Find a Merchant): the map with the nearest agents.
     A scanned QR opens with the merchant already filled in. Continue opens the
     confirmation sheet, Confirm goes to the PIN. */
  :root {
    --Primary: #FE353D;
    --Primary-Light: #FFF1F2;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
    --Field: #F7F7F9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  button, input { font-family: inherit; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; background: var(--Background); flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); flex-shrink: 0; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px 16px; gap: 12px; }

  /* Enter Code | Near By: white pill, the active tab solid red */
  .tabs { height: 50px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: #FFF; border-radius: 25px; flex-shrink: 0; box-shadow: 0 2px 10px rgba(15,23,42,0.05); }
  .tab { border: none; border-radius: 21px; background: transparent; color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s, color 0.15s; }
  .tab svg { width: 19px; height: 19px; stroke: currentColor; stroke-width: 1.9; fill: none; }
  .tab#shortTab svg { stroke: var(--On-Surface-Low); }
  .tab#nearbyTab svg { stroke: var(--Primary); }
  .tab.active { background: var(--Primary); color: #FFF; box-shadow: 0 4px 12px rgba(254,53,61,0.3); }
  .tab.active svg { stroke: #FFF !important; }
  /* Merchant found (looked up, picked on the map or scanned): no tabs */
  .found .tabs { display: none; }

  .panel { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 12px; }
  .panel.active { display: flex; }

  .card { background: #FFF; border-radius: 16px; padding: 16px; box-shadow: 0 4px 14px rgba(15,23,42,0.05); flex-shrink: 0; }
  .field-label { display: block; font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 500; color: var(--On-Surface); margin-bottom: 10px; }
  .field { height: 54px; background: var(--Field); border: 1.5px solid var(--Border); border-radius: 12px; padding: 0 14px; display: flex; align-items: center; gap: 8px; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; }
  .field:focus-within { border-color: var(--Primary); background: #FFF; box-shadow: 0 4px 12px rgba(254,53,61,0.12); }
  .field.err { border-color: var(--Primary); background: #FFF; }
  .field input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.4px; color: var(--On-Surface); }
  .field input::placeholder { color: var(--On-Surface-Low); font-size: 15px; font-weight: 400; letter-spacing: 0; }
  .amount-block { margin-top: 16px; }
  .amount-block:first-child { margin-top: 0; }
  .balance { margin-top: 8px; font-family: 'Switzer', sans-serif; font-size: 12px; color: var(--On-Surface-Low); }
  .balance b { font-weight: 600; color: var(--On-Surface); }

  /* Short code lookup */
  .status-chip { display: none; align-items: center; gap: 10px; border-radius: 12px; padding: 12px 14px; margin-top: 10px; font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 500; }
  .status-chip.show { display: flex; }
  .status-chip .ic { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .status-chip .ic svg { width: 13px; height: 13px; stroke-width: 3; fill: none; }
  .status-chip.loading { background: #F1F1F4; color: var(--On-Surface-Low); }
  .status-chip.loading .ic { border: 2.5px dashed #1FC83B; animation: spin 1.6s linear infinite; }
  .status-chip.bad { background: #FDECEC; color: var(--Primary); }
  .status-chip.bad .ic { width: 26px; height: 26px; border-radius: 8px; border: 1.8px solid var(--Primary); }
  .status-chip.bad .ic svg { stroke: var(--Primary); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* The merchant once found (or scanned): edit, or scan again */
  .merchant { display: flex; align-items: center; gap: 12px; background: #FFF; border-radius: 16px; padding: 14px; box-shadow: 0 4px 14px rgba(15,23,42,0.05); flex-shrink: 0; }
  .merchant[hidden] { display: none; }
  .m-av { width: 42px; height: 42px; border-radius: 12px; background: var(--Primary-Light); color: var(--Primary); display: flex; align-items: center; justify-content: center; font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .m-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .m-info b { font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 700; color: var(--On-Surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-info small { font-family: 'Switzer', sans-serif; font-size: 12.5px; color: var(--On-Surface-Low); }
  /* Picked on the map: bold Code label and a pencil to pick another agent */
  .merchant.nearby .m-code-lbl { font-weight: 700; color: var(--On-Surface); }
  .m-btn[hidden] { display: none; }
  .m-btn { width: 36px; height: 36px; border: none; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .m-btn:hover { background: var(--Primary-Light); }
  .m-btn svg { width: 22px; height: 22px; stroke: var(--Primary); stroke-width: 1.9; fill: none; }

  .btn-primary { width: 100%; height: 52px; border: none; border-radius: 14px; background: var(--Primary); color: #FFF; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; box-shadow: 0 4px 16px rgba(254,53,61,0.25); transition: background 0.2s, transform 0.12s; margin-top: auto; flex-shrink: 0; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { background: #E0E0E0; color: var(--On-Surface-Low); box-shadow: none; cursor: not-allowed; }

  /* ── Near By (Find a Merchant): the map, the white card at its foot ── */
  .map-svg-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map-text-label { position: absolute; font-family: 'Switzer', sans-serif; pointer-events: none; }
  .map-text-label.bole { left: 28px; top: 22px; font-size: 12px; font-weight: 600; color: #475569; }
  .map-text-label.swords { left: 54px; bottom: 30px; font-size: 10px; font-weight: 500; color: #64748B; }
  .map-airport-tag { position: absolute; right: 18px; top: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; text-align: center; }
  .map-airport-tag svg { width: 15px; height: 15px; fill: #475569; }
  .map-airport-tag span { font-family: 'Switzer', sans-serif; font-size: 9.5px; font-weight: 500; line-height: 1.25; color: #475569; }
  .map-marker { position: absolute; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -85%); cursor: pointer; z-index: 10; background: none; border: none; padding: 0; }
  .map-marker.active { z-index: 25; }
  .map-marker.active .pin-bubble { transform: scale(1.18); }
  .pin-bubble { position: relative; width: 30px; height: 37px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 4px 6px rgba(225,29,37,0.35)); transition: transform 0.2s; }
  .pin-bubble svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pin-num { position: relative; font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 700; color: #FFF; margin-top: -7px; }
  .pin-label { margin-top: 3px; background: #FFF; border-radius: 7px; padding: 4px 9px 3px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.16); }
  .pin-label b { font-family: 'Switzer', sans-serif; font-size: 9.5px; font-weight: 700; color: var(--On-Surface); white-space: nowrap; max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
  .pin-label small { font-family: 'Switzer', sans-serif; font-size: 7.5px; color: var(--On-Surface-Low); text-transform: uppercase; }
  .you { position: absolute; left: 49%; top: 46%; width: 24px; height: 24px; transform: translate(-50%, -50%); border-radius: 50%; background: #1D6AE5; border: 2px solid #FFF; box-shadow: 0 0 0 10px rgba(37,99,235,0.18); color: #FFF; font-family: 'Switzer', sans-serif; font-size: 8.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; pointer-events: none; }

  .fm { position: relative; flex: 1; min-height: 0; border-radius: 16px; overflow: hidden; border: 1px solid #E2E8F0; background: #E8EEEC; }
  .fm-map { position: absolute; inset: 0; }
  .fm-safe { position: absolute; left: 0; right: 0; top: 0; bottom: 40%; transition: bottom 0.25s ease; }
  .fm-recenter { position: absolute; right: 12px; bottom: 12px; width: 38px; height: 38px; border: none; border-radius: 50%; background: #FFF; box-shadow: 0 2px 8px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 15; }
  .fm-recenter svg { width: 20px; height: 20px; stroke: #0F172A; stroke-width: 2; fill: none; }
  .fm-panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 40; background: #FFF; border-radius: 22px 22px 16px 16px; padding: 10px 16px 14px; box-shadow: 0 -6px 24px rgba(15,23,42,0.12); }
  .fm-back { display: none; position: absolute; top: -52px; left: 10px; width: 40px; height: 40px; border: none; border-radius: 50%; background: #FFF; box-shadow: 0 4px 14px rgba(15,23,42,0.18); align-items: center; justify-content: center; cursor: pointer; }
  .fm.has-agent .fm-back { display: flex; }
  .fm-back svg { width: 18px; height: 18px; stroke: var(--On-Surface); stroke-width: 2; fill: none; }
  .fm-grip { width: 40px; height: 4px; border-radius: 2px; background: #D8D8DE; margin: 0 auto 12px; }
  .fm-loc { display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; border: 1px solid #ECECF0; border-radius: 16px; }
  .fm-loc > svg { width: 21px; height: 21px; stroke: var(--On-Surface); stroke-width: 1.9; fill: none; flex-shrink: 0; }
  .fm-loc > span { flex: 1; min-width: 0; }
  .fm-loc b { display: block; font-family: 'Switzer', sans-serif; font-size: 14.5px; font-weight: 700; color: var(--On-Surface); }
  .fm-loc small { font-family: 'Switzer', sans-serif; font-size: 11.5px; color: #8C8C99; }
  .fm-loc.searching { border-color: var(--Primary); box-shadow: 0 4px 14px rgba(254,53,61,0.12); }
  .fm-loc-input { flex: 1; min-width: 0; height: 40px; border: none; outline: none; background: transparent; font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 500; color: var(--On-Surface); }
  .fm-search { width: 40px; height: 40px; border: none; border-radius: 50%; background: var(--Primary); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 3px 10px rgba(254,53,61,0.32); }
  .fm-search svg { width: 18px; height: 18px; stroke: #FFF; stroke-width: 2.4; fill: none; }
  #fmRows { margin-top: 4px; }
  .fm-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 2px; border: none; background: none; text-align: left; cursor: pointer; font-family: inherit; }
  .fm-row-l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .fm-row-l b { font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 500; color: var(--On-Surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fm-row-l small { font-family: 'Switzer', sans-serif; font-size: 12px; color: #7C869A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fm-row-d { font-family: 'Switzer', sans-serif; font-size: 13px; color: var(--On-Surface); flex-shrink: 0; }
  .fm-area { width: 100%; display: flex; align-items: center; gap: 14px; padding: 11px 2px; border: none; border-bottom: 1px solid #F1F1F4; background: none; text-align: left; cursor: pointer; font-family: inherit; }
  .fm-area:last-child { border-bottom: none; }
  .fm-area i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #CBD5E1; flex-shrink: 0; }
  .fm-area b { display: block; font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .fm-area small { font-family: 'Switzer', sans-serif; font-size: 12px; color: var(--On-Surface-Low); }
  .fm-empty { font-family: 'Switzer', sans-serif; font-size: 12.5px; color: var(--On-Surface-Low); padding: 12px 2px; }
  /* A picked agent: details and Call / Directions / Continue */
  .fm-agent { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; }
  .fm-av { width: 50px; height: 50px; border-radius: 14px; background: var(--Primary-Light); color: var(--Primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .fm-av svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 1.9; fill: none; }
  .fm-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .fm-info > b { font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 700; color: var(--On-Surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fm-info small { font-family: 'Switzer', sans-serif; font-size: 12px; color: var(--On-Surface-Low); }
  .fm-info small b { font-weight: 600; color: var(--On-Surface); letter-spacing: 0.3px; }
  .fm-meta { display: flex; align-items: center; gap: 8px; font-family: 'Switzer', sans-serif; font-size: 12px; color: var(--On-Surface-Low); }
  .fm-status { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #E8F9EE; color: #167C2A; }
  .fm-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .fm-status.closed { background: #F1F1F4; color: var(--On-Surface-Low); }
  .fm-actions { display: flex; gap: 10px; }
  .fm-btn { flex: 1; height: 48px; border-radius: 12px; cursor: pointer; font-family: 'Switzer', sans-serif; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .fm-btn:active { transform: scale(0.98); }
  .fm-btn.call { flex: 0 0 48px; border: none; background: #16A34A; box-shadow: 0 4px 14px rgba(22,163,74,0.3); }
  .fm-btn.call svg { width: 20px; height: 20px; fill: #FFF; }
  .fm-btn.outline { border: 1.5px solid var(--Border); background: #FFF; color: var(--Primary); }
  .fm-btn.solid { border: none; background: var(--Primary); color: #FFF; box-shadow: 0 4px 14px rgba(254,53,61,0.3); }

  /* ── Confirmation sheet ── */
  .scrim { position: absolute; inset: 0; z-index: 100; background: rgba(0,0,0,0.42); opacity: 0; visibility: hidden; transition: opacity 0.22s, visibility 0.22s; }
  .scrim.show { opacity: 1; visibility: visible; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 101; background: #FFF; border-radius: 28px 28px 0 0; padding: 10px 16px 24px; transform: translateY(100%); transition: transform 0.28s cubic-bezier(.2,.8,.2,1); }
  .sheet.show { transform: translateY(0); }
  .sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: #D8D8DE; margin: 0 auto 18px; }
  .cf-merchant { position: relative; display: flex; align-items: center; gap: 12px; border: 1px solid #E6E6EA; border-radius: 16px; padding: 14px; }
  .cf-ic { width: 42px; height: 42px; border-radius: 50%; background: var(--Primary-Light); color: var(--Primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 700; }
  .cf-merchant b { display: block; font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 700; color: var(--On-Surface); }
  .cf-merchant small { font-family: 'Switzer', sans-serif; font-size: 12.5px; color: var(--On-Surface-Low); }
  .cf-badge { position: absolute; top: -11px; right: 14px; padding: 4px 10px; border-radius: 999px; background: #EDEDF0; color: #3A3A42; font-family: 'Switzer', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
  .cf-rows { margin: 10px 0 20px; }
  .cf-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #EFEFF2; font-family: 'Switzer', sans-serif; }
  .cf-row:last-child { border-bottom: none; }
  .cf-row span { font-size: 12.5px; color: #55555E; }
  .cf-row b { font-size: 12.5px; font-weight: 700; color: var(--On-Surface); }
  .cf-row b.red { font-size: 14px; color: var(--Primary); }
  .cf-actions { display: flex; gap: 12px; }
  .cf-btn { flex: 1; height: 52px; border-radius: 14px; background: #FFF; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; }
  .cf-btn:active { transform: scale(0.98); }
  .cf-btn.cancel { border: 1.5px solid #E0E0E4; color: #55555E; }
  .cf-btn.confirm { border: 1.5px solid var(--Primary); color: var(--Primary); }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="app-content" id="app">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="goBack()" aria-label="Back">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title" id="hdrTitle">Withdraw At Agent</span>
      <div style="width:36px;"></div>
    </div>

    <div class="body">
      <div class="tabs" role="tablist">
        <button class="tab active" id="shortTab" role="tab" onclick="showTab('short')">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M10 9l-3 3 3 3M14 9l3 3-3 3"/></svg>
          Enter Code
        </button>
        <button class="tab" id="nearbyTab" role="tab" onclick="showTab('nearby')">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          Near By
        </button>
      </div>

      <!-- Enter Code: the short code shown at the agent's counter, then the amount -->
      <section class="panel active" id="shortPanel">
        <div class="merchant" id="merchant" hidden>
          <span class="m-av" id="mAv"></span>
          <span class="m-info"><b id="mName"></b><small><span class="m-code-lbl">Code:</span> <span id="mCode"></span></small></span>
          <button class="m-btn" id="mEdit" onclick="changeNearby()" aria-label="Change agent" title="Change agent" hidden><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="m-btn" id="mScan" onclick="rescan()" aria-label="Scan merchant QR" title="Scan merchant QR"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a3 3 0 0 1 3-3h2M16 3h2a3 3 0 0 1 3 3v2M21 16v2a3 3 0 0 1-3 3h-2M8 21H6a3 3 0 0 1-3-3v-2"/><path d="M3 12h18"/><path d="M7 8h10v2M7 16h10v-2"/></svg></button>
        </div>

        <div class="card">
          <div id="codeBlock">
            <label class="field-label" for="code">Enter Merchant Short Code:</label>
            <div class="field" id="codeField">
              <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="e.g. 452929" autocomplete="off">
            </div>
            <div class="status-chip loading" id="codeLoading"><span class="ic"></span><span>Looking Up Merchant Short Code:</span></div>
            <div class="status-chip bad" id="codeBad">
              <span class="ic"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M7 7l10 10"/></svg></span>
              <span>Invalid merchant short code</span>
            </div>
          </div>
          <div class="amount-block">
            <label class="field-label" for="amount">Amount</label>
            <div class="field">
              <input id="amount" type="text" inputmode="decimal" placeholder="e.g. 120 ETB" autocomplete="off">
            </div>
            <div class="balance"><b>Balance:</b> 20,000.00 ETB</div>
          </div>
        </div>

        <button class="btn-primary" id="continueBtn" disabled onclick="openConfirm()">Continue</button>
      </section>

      <!-- Near By (Find a Merchant): tap a pin or an agent for Call / Directions / Continue -->
      <section class="panel" id="nearbyPanel">
        <div class="fm" id="fm">
    <div class="fm-map" id="fmMap">
          <svg class="map-svg-bg" viewBox="0 0 328 228" preserveAspectRatio="none">
          <defs>
            <linearGradient id="roadGold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FDE68A"/>
              <stop offset="100%" stop-color="#FCD34D"/>
            </linearGradient>
          </defs>

          <!-- Base Ground -->
          <rect width="100%" height="100%" fill="#E9EFE9"/>

          <!-- Green Park / Garden Zones -->
          <rect x="18" y="16" width="76" height="34" rx="6" fill="#D8EBD9"/>
          <rect x="8" y="142" width="74" height="48" rx="8" fill="#D8EBD9"/>
          <rect x="110" y="68" width="62" height="46" rx="8" fill="#E0F0E2"/>
          <rect x="18" y="86" width="38" height="32" rx="5" fill="#DFEFE1"/>

          <!-- Airport Zone polygon on the right -->
          <path d="M 215,0 L 328,0 L 328,175 L 255,175 L 215,90 Z" fill="#E2EAF4"/>
          <!-- Runway lines -->
          <line x1="262" y1="32" x2="320" y2="118" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
          <line x1="262" y1="32" x2="320" y2="118" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,3"/>

          <!-- Secondary White Roads -->
          <path d="M 64,0 L 64,228" stroke="#FFFFFF" stroke-width="7" fill="none"/>
          <path d="M 162,0 L 162,228" stroke="#FFFFFF" stroke-width="6" fill="none"/>
          <path d="M 0,82 L 328,82" stroke="#FFFFFF" stroke-width="5" fill="none"/>
          <path d="M 0,166 L 250,166" stroke="#FFFFFF" stroke-width="5" fill="none"/>
          <path d="M 224,80 L 310,228" stroke="#FFFFFF" stroke-width="6" fill="none"/>

          <!-- Minor road grids -->
          <line x1="112" y1="0" x2="112" y2="228" stroke="#F1F5F9" stroke-width="2.5"/>
          <line x1="0" y1="126" x2="215" y2="126" stroke="#F1F5F9" stroke-width="2.5"/>
          <line x1="0" y1="42" x2="162" y2="42" stroke="#F1F5F9" stroke-width="2.5"/>

          <!-- Main Arterial Diagonal Road (Gold / Yellow) -->
          <path d="M -10,218 L 140,146 L 240,86 L 338,40" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.3"/>
          <path d="M -10,218 L 140,146 L 240,86 L 338,40" stroke="url(#roadGold)" stroke-width="6.5" stroke-linecap="round" fill="none"/>
          <path d="M -10,218 L 140,146 L 240,86 L 338,40" stroke="#FFFBEB" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        </svg>

        <!-- Static Text Labels -->
        <span class="map-text-label bole">Bole</span>
        <span class="map-text-label swords">Swords Bldg</span>

        <div class="map-airport-tag">
          <svg viewBox="0 0 24 24">
            <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
          </svg>
          <span>Bole International<br>Airport</span>
        </div>
          </div>
          <div class="fm-safe" id="fmSafe">
            <div id="fmPins"></div>
            <div class="you" id="fmYou">You</div>
            <button class="fm-recenter" onclick="recenter()" aria-label="Re-center map"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="2.2" fill="#0F172A"/></svg></button>
          </div>
          <div class="fm-panel" id="fmPanel">
            <button class="fm-back" onclick="fmClear()" aria-label="Back"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
            <div class="fm-grip"></div>
            <div id="fmList">
              <div class="fm-loc"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="fmLocText"><b id="fmLocName">Bole, Addis Ababa</b><small id="fmLocSub">Using your location</small></span><input class="fm-loc-input" id="fmLocInput" type="text" placeholder="Search area in Addis Ababa..." autocomplete="off" hidden oninput="renderRows()" onkeydown="if(event.key==='Enter')pickTypedArea()"><button class="fm-search" onclick="toggleAreaSearch()" aria-label="Search area"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></button></div>
              <div id="fmRows"></div>
            </div>
            <div id="fmAgent" hidden>
              <div class="fm-agent">
                <span class="fm-av"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v1a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 12.5V20h14v-7.5"/><path d="M10 20v-4h4v4"/></svg></span>
                <span class="fm-info">
                  <b id="fmName"></b>
                  <small>Merchant Short Code: <b id="fmCode"></b></small>
                  <span class="fm-meta"><span class="fm-status" id="fmStatus">Open</span><span id="fmDist"></span></span>
                </span>
              </div>
              <div class="fm-actions">
                <button class="fm-btn call" onclick="callAgent()" aria-label="Call agent"><svg viewBox="0 0 24 24"><path d="M21 16.9v2.5a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 1.1 3.7 2 2 0 0 1 3.1 1.5h2.5a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L6.7 9.3a16 16 0 0 0 6 6l1.2-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></button>
                <button class="fm-btn outline" onclick="directions()">Directions</button>
                <button class="fm-btn solid" onclick="fmContinue()">Continue</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- Confirmation: merchant, account, fee and amount; Confirm goes to the PIN -->
  <div class="scrim" id="scrim" onclick="closeConfirm()"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Confirm withdrawal">
    <div class="sheet-grip"></div>
    <div class="cf-merchant">
      <span class="cf-badge">MERCHANT</span>
      <span class="cf-ic" id="cfAv"></span>
      <span><b id="cfName"></b><small>Code: <span id="cfCode"></span></small></span>
    </div>
    <div class="cf-rows">
      <div class="cf-row"><span>Account Type:</span><b>Main account</b></div>
      <div class="cf-row"><span>Fee:</span><b id="cfFee">0.00 ETB</b></div>
      <div class="cf-row"><span>Withdrawal Amount:</span><b class="red" id="cfAmount"></b></div>
    </div>
    <div class="cf-actions">
      <button class="cf-btn cancel" onclick="closeConfirm()">Cancel</button>
      <button class="cf-btn confirm" onclick="confirmWithdraw()">Confirm</button>
    </div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const AGENTS = {
    '323217': { id: 1, abbr: 'BM', name: 'Betty Merhat Agency', dist: '0.8 km', open: true,  x: '30%', y: '26%', addr: 'Bole Medhanialem, Addis Ababa' },
    '562394': { id: 2, abbr: 'KR', name: 'Kebede Retails', dist: '1.2 km', open: true,  x: '72%', y: '30%', addr: 'Bole Airport Road, Addis Ababa' },
    '778901': { id: 3, abbr: 'MS', name: 'Meskerem Agent Services', dist: '2.1 km', open: false, x: '74%', y: '76%', addr: 'Mekanisa, Addis Ababa' },
    '204411': { id: 4, abbr: 'BM', name: 'Bole Mini-Mart', dist: '2.6 km', open: true,  x: '28%', y: '70%', addr: 'Dembel City Center, Addis Ababa' },
    '452929': { id: 5, abbr: 'AJ', name: 'AM Juice & Coffee', dist: '3.0 km', open: true,  x: '52%', y: '18%', addr: 'Kazanchis, Addis Ababa', hidden: true }
  };
  const BALANCE = 20000, FEE = 0;
  const fmt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  let d = {};
  try { d = JSON.parse(sessionStorage.getItem('withdrawData') || '{}'); } catch (e) {}
  const params = new URLSearchParams(location.search);
  const fromQr = params.get('entry') === 'qr' || d.entry === 'qr';
  // Back: from the found merchant to Enter Code (or Near By, if picked there); otherwise to the Withdraw screen
  function goBack() {
    if (merchant && !fromQr) {
      const wasNearby = $('merchant').classList.contains('nearby');
      editMerchant();
      if (wasNearby) showTab('nearby');
      return;
    }
    location.href = 'Withdraw Cash - Option 2.html';
  }

  function showTab(tab) {
    ['short', 'nearby'].forEach(t => {
      $(t + 'Tab').classList.toggle('active', t === tab);
      $(t + 'Panel').classList.toggle('active', t === tab);
    });
    $('hdrTitle').textContent = tab === 'nearby' ? 'Find a Merchant' : 'Withdraw At Agent';
    if (tab === 'nearby') requestAnimationFrame(syncSafe);
  }

  // ── The merchant: looked up from the code, picked on the map, or scanned ──
  let merchant = null;
  function setMerchant(code, via) {
    const a = AGENTS[code];
    const nearby = via === 'nearby';
    $('merchant').classList.toggle('nearby', nearby);
    $('mEdit').hidden = !nearby;
    $('mScan').hidden = nearby;
    merchant = { code, name: a.name, abbr: a.abbr };
    $('mAv').textContent = a.abbr;
    $('mName').textContent = a.name;
    $('mCode').textContent = code;
    $('merchant').hidden = false;
    $('codeBlock').hidden = true;
    $('app').classList.add('found');
    showTab('short');
    validate();
  }
  function editMerchant() {
    merchant = null;
    $('merchant').hidden = true;
    $('codeBlock').hidden = false;
    $('app').classList.remove('found');
    $('code').value = '';
    ['codeLoading', 'codeBad'].forEach(id => $(id).classList.remove('show'));
    $('codeField').classList.remove('err');
    validate();
    $('code').focus();
  }
  // Pencil (agent picked on the map): back to Near By to pick another
  function changeNearby() { editMerchant(); showTab('nearby'); }
  // The scan icon opens the camera to scan a merchant QR instead
  function rescan() { location.href = 'Withdraw Cash - Option 2.html'; }

  // Short code lookup: "Looking Up" chip for a moment, then the merchant screen or Invalid
  let timer = null;
  $('code').addEventListener('input', e => {
    const el = e.target;
    el.value = el.value.replace(/\D/g, '').slice(0, 6);
    clearTimeout(timer);
    ['codeLoading', 'codeBad'].forEach(id => $(id).classList.remove('show'));
    $('codeField').classList.remove('err');
    if (el.value.length < 6) return;
    $('codeLoading').classList.add('show');
    const code = el.value;
    timer = setTimeout(() => {
      $('codeLoading').classList.remove('show');
      if (AGENTS[code]) { setMerchant(code); $('amount').focus(); }
      else { $('codeBad').classList.add('show'); $('codeField').classList.add('err'); }
    }, 2500);
  });

  // Amount: digits with thousands separators, up to the balance
  const amountValue = () => Number($('amount').value.replace(/,/g, '')) || 0;
  $('amount').addEventListener('input', e => {
    const el = e.target;
    let v = el.value.replace(/[^\d.]/g, '');
    const [i, f] = v.split('.');
    v = (i ? Number(i).toLocaleString('en-US') : '') + (f !== undefined ? '.' + f.slice(0, 2) : '');
    el.value = v;
    validate();
  });
  $('amount').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('continueBtn').disabled) openConfirm(); });
  function validate() {
    const a = amountValue();
    $('continueBtn').disabled = !(merchant && a >= 10 && a <= BALANCE);
  }

  // ── Confirmation sheet ──
  function openConfirm() {
    if ($('continueBtn').disabled) return;
    document.activeElement && document.activeElement.blur();
    $('cfAv').textContent = merchant.abbr;
    $('cfName').textContent = merchant.name;
    $('cfCode').textContent = merchant.code;
    $('cfFee').textContent = fmt(FEE) + ' ETB';
    $('cfAmount').textContent = fmt(amountValue()) + ' ETB';
    $('scrim').classList.add('show');
    $('sheet').classList.add('show');
  }
  function closeConfirm() { $('scrim').classList.remove('show'); $('sheet').classList.remove('show'); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeConfirm(); });
  function confirmWithdraw() {
    const amount = amountValue();
    sessionStorage.setItem('withdrawData', JSON.stringify({
      method: 'agent', methodLabel: fromQr ? 'Scan Agent QR' : 'Merchant Short Code', entry: fromQr ? 'qr' : 'code',
      agentCode: merchant.code, agentName: merchant.name, agentAbbr: merchant.abbr,
      agent: { code: merchant.code, name: merchant.name, abbr: merchant.abbr },
      amount, fee: FEE, total: amount + FEE, from: location.pathname.split('/').pop(), time: new Date().toLocaleTimeString()
    }));
    location.href = 'Withdraw Cash - Enter PIN.html';
  }

  // ── Near By: numbered pins with name + distance, the nearest agents below ──
  const PIN = '<svg viewBox="0 0 28 34" fill="none"><path d="M14 0C6.268 0 0 6.268 0 14c0 9.8 14 20 14 20s14-10.2 14-20c0-7.732-6.268-14-14-14z" fill="#FE353D"/></svg>';
  const MAP_CODES = Object.keys(AGENTS).filter(c => !AGENTS[c].hidden).sort((x, y) => AGENTS[x].id - AGENTS[y].id);
  let fmChosen = null;
  $('fmPins').innerHTML = MAP_CODES.map(code => { const a = AGENTS[code]; return `
    <button class="map-marker" data-code="${code}" style="left:${a.x};top:${a.y}" onclick="event.stopPropagation(); fmSelect('${code}')" aria-label="${a.name}">
      <span class="pin-bubble">${PIN}<span class="pin-num">${a.id}</span></span>
      <span class="pin-label"><b>${a.name}</b><small>${a.dist}</small></span>
    </button>`; }).join('');
  $('fm').addEventListener('click', e => { if (!e.target.closest('.map-marker, .fm-panel, .fm-recenter')) fmClear(); });
  new ResizeObserver(syncSafe).observe($('fmPanel'));
  function syncSafe() {
    const fr = $('fm').getBoundingClientRect(), pr = $('fmPanel').getBoundingClientRect();
    if (fr.height) $('fmSafe').style.bottom = Math.max(0, fr.bottom - pr.top + 6) + 'px';
  }

  const AREAS = ['Bole', 'Piassa', 'Megenagna', 'Mekanisa', 'Kazanchis', 'CMC', 'Sarbet', 'Gerji'];
  let searchingArea = false;
  function renderRows() {
    if (searchingArea) {
      const q = $('fmLocInput').value.trim().toLowerCase();
      const hits = AREAS.filter(a => a.toLowerCase().includes(q)).slice(0, 4);
      $('fmRows').innerHTML = hits.length ? hits.map(a => `<button class="fm-area" onclick="setArea('${a}')"><i></i><span><b>${a}</b><small>Addis Ababa</small></span></button>`).join('')
        : `<div class="fm-empty">No area matches this search</div>`;
      return;
    }
    $('fmRows').innerHTML = MAP_CODES.slice(0, 3).map(code => { const a = AGENTS[code]; return `
      <button class="fm-row" onclick="fmSelect('${code}')">
        <span class="fm-row-l"><b>${a.name}</b><small>${a.addr}</small></span>
        <span class="fm-row-d">${a.dist}</span>
      </button>`; }).join('');
  }
  function toggleAreaSearch() {
    if (searchingArea) { pickTypedArea(); return; }
    searchingArea = true;
    document.querySelector('.fm-loc').classList.add('searching');
    $('fmLocText').hidden = true; $('fmLocInput').hidden = false; $('fmLocInput').value = '';
    renderRows(); $('fmLocInput').focus();
  }
  function pickTypedArea() {
    const q = $('fmLocInput').value.trim().toLowerCase();
    const hit = AREAS.find(a => a.toLowerCase().includes(q));
    if (q && hit) setArea(hit); else endAreaSearch();
  }
  function setArea(a) { $('fmLocName').textContent = a + ', Addis Ababa'; $('fmLocSub').textContent = 'Showing agents near this area'; endAreaSearch(); }
  function endAreaSearch() {
    searchingArea = false;
    document.querySelector('.fm-loc').classList.remove('searching');
    $('fmLocText').hidden = false; $('fmLocInput').hidden = true;
    renderRows();
  }
  renderRows();

  function fmSelect(code) {
    const a = AGENTS[code];
    fmChosen = code;
    $('fmName').textContent = a.name;
    $('fmCode').textContent = code;
    $('fmStatus').textContent = a.open ? 'Open' : 'Closed';
    $('fmStatus').classList.toggle('closed', !a.open);
    $('fmDist').textContent = a.dist;
    $('fmList').hidden = true; $('fmAgent').hidden = false;
    $('fm').classList.add('has-agent');
    document.querySelectorAll('#fmPins .map-marker').forEach(m => m.classList.toggle('active', m.dataset.code === code));
  }
  function fmClear() {
    fmChosen = null;
    $('fmList').hidden = false; $('fmAgent').hidden = true;
    $('fm').classList.remove('has-agent');
    document.querySelectorAll('#fmPins .map-marker.active').forEach(m => m.classList.remove('active'));
  }
  function recenter() {
    const you = $('fmYou');
    you.style.transition = 'transform 0.4s ease';
    you.style.transform = 'translate(-50%, -50%) scale(1.35)';
    setTimeout(() => { you.style.transform = 'translate(-50%, -50%)'; }, 400);
  }
  function callAgent() { window.location.href = 'tel:+251700000000'; }
  function directions() {
    const q = encodeURIComponent((AGENTS[fmChosen] && AGENTS[fmChosen].addr) || 'M-PESA agent');
    window.open('https://www.google.com/maps/search/?api=1&query=' + q, '_blank');
  }
  // Continue: back to Enter Code with this merchant filled in; the amount comes next
  function fmContinue() {
    if (!fmChosen) return;
    const code = fmChosen;
    fmClear();
    setMerchant(code, 'nearby');
    $('amount').focus();
  }

  // ── Start: scanned QR (merchant filled, no tabs), a frequent agent, or Near By ──
  if (fromQr) {
    setMerchant(AGENTS[d.agentCode] ? d.agentCode : '204411');
  } else if (AGENTS[d.agentCode]) {
    setMerchant(d.agentCode);
  }
  if (!fromQr && (params.get('tab') === 'nearby' || params.get('tab') === 'locate')) showTab('nearby');
</script>
<script src="components/keyboard.js"></script>
<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
