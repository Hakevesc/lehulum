<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Saving — M-PESA</title>
<link rel="stylesheet" href="styles/design-tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/component-status-bar.css">
<link rel="stylesheet" href="styles/component-sc-card.css">
<link rel="stylesheet" href="styles/savings.css?v=20261125c">
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap');

  /* New Individual or Target saving (?type=individual|target). Name (target:
     required), goal ≥ 500 ETB and a target date (3M / 6M / 1Y chips) with a
     "save X a month" hint → PIN → done. */
  .form { display: flex; flex-direction: column; gap: 16px; }
  .form { gap: 12px; }
  /* Product banner: red gradient, white icon square */
  .type-card { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: linear-gradient(100deg, #FE353D 0%, #E0262D 45%, #9E1218 100%); box-shadow: 0 8px 20px rgba(224,38,45,0.22); }
  .type-card i { width: 44px; height: 44px; border-radius: 12px; background: #FFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .type-card i svg { width: 24px; height: 24px; stroke: var(--Primary); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .type-card b { display: block; font-size: 16px; font-weight: 600; color: #FFF; }
  .type-card small { display: block; margin-top: 3px; font-size: 12.5px; color: rgba(255,255,255,0.92); }
  /* White field cards */
  .fcard { padding: 18px 16px; border-radius: 22px; background: #FFF; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
  .fcard > .lbl { display: block; margin-bottom: 12px; font-size: 16px; font-weight: 400; color: var(--On-Surface); }
  .fcard .input { height: 60px; padding: 0 20px; border: 1px solid #E2E2E7; border-radius: 16px; background: #F7F7F9; font-size: 16px; }
  .fcard .input:focus { background: #FFF; }
  .fcard .amount-in { background: #F7F7F9; }
  .count { display: none; }
  .plan { display: none; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #F7F7F9; font-size: 12.5px; color: #55555E; }
  .plan.show { display: flex; }
  .plan svg { width: 18px; height: 18px; stroke: var(--Primary); stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .plan b { color: var(--On-Surface); }
  /* Auto Recurring Deposit fields (as in the design) */
  #autoFields .amount-in { background: #F7F7F9; }
  .auto-min { margin: 8px 2px 0; font-size: 12px; color: var(--Primary); }
  .auto-min b { font-weight: 700; }
  .auto-min.low { font-weight: 600; }
  #autoRow.on .switch { background: var(--Primary) !important; opacity: 1; }
  /* One card: name, goal, target date, custom date (as in the design) */
  .fcard .blk { display: block; margin-top: 18px; }
  .fcard .blk:first-child { margin-top: 0; }
  #targetFields { margin-top: 18px; }
  #plan { display: none !important; }   /* not in the design */
  .fcard .lbl { display: block; margin-bottom: 10px; font-size: 16px; font-weight: 400; color: var(--On-Surface); }
  .fcard .lbl.sm { margin-top: 4px; font-size: 13px; font-weight: 600; }
  .fcard .amount-in { background: #F7F7F9; }
  .goal-min { margin: 8px 2px 0; font-size: 12px; color: var(--Primary); }
  .goal-min b { font-weight: 700; }
  .goal-min.err { font-weight: 600; }
  .fcard .dp-field { background: #F7F7F9; }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="time">10:00</span>
    <div class="status-icons">
      <svg data-name="icon-wifi" viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
      <svg data-name="icon-signal" viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
      <svg data-name="icon-battery" viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
    </div>
  </div>

  <div class="app-content">
    <div class="header-nav">
      <button class="icon-btn" onclick="location.href='Savings.html?menu=20261119d'" aria-label="Back"><svg data-name="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <span class="header-title" id="hTitle">New Saving</span>
      <span class="spacer"></span>
    </div>

    <div class="form">
      <div class="type-card"><i id="tIc"></i><span><b id="tName"></b><small id="tSub"></small></span></div>
      <div class="fcard">
      <label class="blk"><span class="lbl">Saving Name<em class="count" id="nameCount">0/20</em></span><input class="input" id="name" maxlength="20" placeholder="e.g. Saving One" oninput="check()"></label>
      <div id="targetFields">
        <label class="blk"><span class="lbl">Goal Amount</span><div class="amount-in"><input id="goal" inputmode="decimal" placeholder="0.00" oninput="check()"><small>ETB</small></div></label>
        <p class="goal-min" id="goalHint"></p>
        <div class="blk"><span class="lbl sm">Target date</span>
          <div class="quick" id="quick"><button type="button" data-m="3">3 months</button><button type="button" data-m="6" class="on">6 months</button><button type="button" data-m="12">1 year</button></div>
          <span class="lbl" style="margin-top:16px">Custom Date</span>
          <input class="input" id="by" type="date" onchange="byChanged()">
        </div>
      </div>
      </div>
      <div class="card">
        <div class="switch-row" id="autoRow" onclick="toggleAuto()"><span><b>Auto Recurring Deposit</b><small id="autoSub">Move money from your wallet on a schedule</small></span><i class="switch"></i></div>
        <div id="autoFields" style="display:none;margin-top:14px">
          <div class="amount-in"><input id="autoAmt" inputmode="decimal" placeholder="0.00" oninput="autoTouched = true; check()"><small>ETB</small></div>
          <p class="hint auto-min" id="autoHint"></p>
          <div class="quick" id="autoFreq" style="margin-top:12px"><button type="button" data-f="daily">Daily</button><button type="button" data-f="weekly">Weekly</button><button type="button" data-f="monthly" class="on">Monthly</button></div>
        </div>
      </div>
      <div class="plan" id="plan"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg><span id="planTxt"></span></div>
    </div>
    <div class="bottom-bar"><button class="btn-primary" id="go" disabled onclick="create()">Create Saving</button></div>
  </div>

</div>

<script src="savings-store.js?v=20261125c"></script>
<script>
  const $ = id => document.getElementById(id);
  const fmt = SV.fmt;
  let tt;
  function toast(m) { const t = $('toast'); if (!t) return; t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2000); }
  const IC = {
    target: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>',
    individual: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    cal: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'
  };
  const type = new URLSearchParams(location.search).get('type') === 'target' ? 'target' : 'individual';
  // Auto-save: off by default; for a target it pre-fills the amount that lands on the goal
  let autoOn = false, autoFreq = 'monthly', autoTouched = false;
  const tomorrow = () => new Date(Date.now() + 864e5).toISOString();
  function toggleAuto() { autoOn = !autoOn; $('autoRow').classList.toggle('on', autoOn); $('autoFields').style.display = autoOn ? '' : 'none'; check(); }
  document.querySelectorAll('#autoFreq button').forEach(b => b.onclick = () => { autoFreq = b.dataset.f; autoTouched = false;
    document.querySelectorAll('#autoFreq button').forEach(x => x.classList.toggle('on', x === b)); check(); });
  const autoAmount = () => parseFloat(($('autoAmt').value || '').replace(/,/g, '')) || 0;
  const S = SV.load();
  $('tIc').innerHTML = IC[type];
  $('tName').textContent = type === 'target' ? 'Target Saving' : 'Individual Saving';
  $('tSub').textContent = type === 'target' ? 'Save toward a goal by a date · 7% Interest' : 'Save any amount, any time · 7% Interest';
  $('hTitle').textContent = type === 'target' ? 'New Target Saving' : 'New Individual Saving';
  $('targetFields').style.display = type === 'target' ? '' : 'none';
  $('name').placeholder = type === 'target' ? 'e.g. New Phone' : 'e.g. Saving One';

  // Target date: quick chips or the picker (tomorrow → 5 years)
  const ymd = d => d.toISOString().slice(0, 10);
  const plusMonths = m => { const d = new Date(); d.setMonth(d.getMonth() + m); return d; };
  $('by').min = ymd(new Date(Date.now() + 864e5)); $('by').max = ymd(plusMonths(60));
  function setQuick(m) { $('by').value = ymd(plusMonths(m)); document.querySelectorAll('#quick button').forEach(b => b.classList.toggle('on', +b.dataset.m === m)); check(); }
  document.querySelectorAll('#quick button').forEach(b => b.onclick = () => setQuick(+b.dataset.m));
  function byChanged() { document.querySelectorAll('#quick button').forEach(b => b.classList.remove('on')); check(); }
  setQuick(6);

  const autoName = () => { let n = 1; while (S.pockets.some(p => p.name === 'Saving ' + n)) n++; return 'Saving ' + n; };
  function check() {
    const name = $('name').value.trim();
    $('nameCount').textContent = $('name').value.length + '/20';
    let ok = true;
    if (type === 'target') {
      const goal = parseFloat(($('goal').value || '').replace(/,/g, '')) || 0;
      const by = $('by').value;
      const low = goal > 0 && goal < SV.TARGET_MIN;
      $('goalHint').innerHTML = low ? '<b>Minimum Deposit:</b> 500.00 ETB — enter at least this much' : '<b>Minimum Deposit:</b> 500.00 ETB';
      $('goalHint').classList.toggle('err', low);
      ok = !!name && goal >= SV.TARGET_MIN && !!by;
      const show = goal >= SV.TARGET_MIN && !!by;
      $('plan').classList.toggle('show', show);
      if (show) $('planTxt').innerHTML = `Save <b>${fmt(SV.monthlyNeeded(goal, 0, by))} ETB a month</b> to reach it by ${SV.dateStr(by)}`;
    }
    if (autoOn) {
      const g = parseFloat(($('goal').value || '').replace(/,/g, '')) || 0;
      if (type === 'target' && !autoTouched && g >= SV.TARGET_MIN && $('by').value) $('autoAmt').value = SV.suggested(g, 0, tomorrow(), new Date($('by').value).toISOString(), autoFreq);
      const a = autoAmount(), low = a > 0 && a < SV.AUTO_MIN;
      $('autoHint').innerHTML = low ? '<b>Minimum Deposit:</b> 50.00 ETB — enter at least this much'
        : type === 'target' && !autoTouched && a ? `<b>Minimum Deposit:</b> 50.00 ETB · lands on your goal by ${SV.dateStr($('by').value)}` : '<b>Minimum Deposit:</b> 50.00 ETB';
      $('autoHint').classList.toggle('low', !!low);
      $('autoHint').classList.toggle('err', low);
      ok = ok && a >= SV.AUTO_MIN;
    }
    $('go').disabled = !ok;
  }
  function create() {
    const name = $('name').value.trim() || autoName();
    const goal = parseFloat(($('goal').value || '').replace(/,/g, '')) || 0;
    sessionStorage.setItem('termLoanData', JSON.stringify({
      kind: 'sav-create', title: 'Create ' + name, type, name, amount: 0,
      target: type === 'target' ? { amount: goal, by: new Date($('by').value).toISOString() } : null,
      auto: autoOn ? { amount: autoAmount(), freq: autoFreq, start: tomorrow(), next: tomorrow() } : null,
      back: 'Savings - Create.html?type=' + type, next: 'Savings - Done.html'
    }));
    location.href = 'Term Loan - Enter PIN.html';
  }
  check();
</script>
<script src="components/keyboard.js"></script>
<!-- Export to Figma button (shared exporter) -->
<script src="components/date-picker.js?v=3"></script>
<script src="figma-export.js"></script>

<script src="test-scenarios.js"></script>
</body>
</html>
