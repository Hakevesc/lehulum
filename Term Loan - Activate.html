<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activate Term Loan — M-PESA</title>
<link rel="stylesheet" href="styles/design-tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/component-status-bar.css">
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap');

  /* Activate Term Loan: shown the first time Term Loan is opened. Photo hero
     (assets/term-loan-bg.jpg) with the headline, three benefits, a terms note,
     then Activate (→ Activation Submitted) or Not now (→ Saving & Credit). */
  :root { --Font: Switzer, sans-serif; }
  body { font-family: var(--Font); }
  .phone-frame { background: #FFF; }
  .status-bar { z-index: 3; }
  .status-bar { position: relative; z-index: 3; background: transparent; }
  .app-content { position: relative; z-index: 1; background: transparent !important; display: flex; flex-direction: column; padding: 0 !important; overflow: hidden; }

  /* Hero: the photo fills the top; the headline sits on its light left side */
  .hero { position: absolute; left: 0; right: 0; top: 0; height: 520px; background: #FFF url('assets/term-loan-bg.jpg') center top / 100% auto no-repeat; z-index: 0; }
  /* White fade on the top left only, behind the headline (stops above the document) */
  .hero .fade { position: absolute; left: 0; top: 0; width: 290px; height: 330px; background: radial-gradient(ellipse 100% 100% at 0 0, #FFF 0%, rgba(255,255,255,0.92) 45%, rgba(255,255,255,0) 100%); }
  .header-nav { position: relative; z-index: 2; display: flex; align-items: center; padding: 0 12px; height: 44px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface, #1C1C21); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .headline { position: relative; z-index: 2; padding: 18px 20px 0; max-width: 200px; }
  .headline h1 { font-size: 30px; font-weight: 800; line-height: 1.08; letter-spacing: -0.6px; color: #17182A; }
  .headline h1 span { color: var(--Primary, #FE353D); }
  .headline p { max-width: 158px; margin-top: 10px; font-size: 13.5px; line-height: 1.45; color: #2B2C3A; }
  .headline i { display: block; width: 64px; height: 3px; margin-top: 12px; border-radius: 2px; background: linear-gradient(90deg, var(--Primary, #FE353D) 60%, #FFB3B6 100%); }

  .body { position: relative; z-index: 2; margin-top: auto; padding: 0 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .benefits { background: #FFF; border-radius: 22px; padding: 16px 10px 16px; box-shadow: 0 8px 26px rgba(15,23,42,0.10); }
  .benefits h2 { text-align: center; font-size: 17px; font-weight: 700; color: #17182A; }
  .b-row { margin-top: 14px; display: flex; }
  .b { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 0 4px; }
  .b .split { position: absolute; left: 0; top: 4px; bottom: 4px; width: 1px; background: #ECECF0; }
  .b svg { width: 34px; height: 34px; }
  .b span { font-size: 12px; line-height: 1.3; color: #2B2C3A; }
  .note { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #FFF1F2; }
  .note i { width: 30px; height: 30px; border-radius: 50%; background: var(--Primary, #FE353D); color: #FFF; font-style: normal; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: Switzer, sans-serif; }
  .note p { font-size: 12.5px; line-height: 1.45; color: #2B2C3A; }
  .btn-primary { width: 100%; height: 52px; border: none; border-radius: 14px; background: var(--Primary, #FE353D); color: #FFF; font-family: Switzer, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 16px rgba(254,53,61,0.28); }
  .btn-outline { width: 100%; height: 48px; margin-top: -4px; border: 1.5px solid #E2E2E7; border-radius: 14px; background: #FFF; color: #55555E; font-family: Switzer, sans-serif; font-size: 14.5px; font-weight: 500; cursor: pointer; }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="hero" aria-hidden="true"><span class="fade"></span></div>
  <div class="status-bar">
    <span class="time">10:00</span>
    <div class="status-icons">
      <svg data-name="icon-wifi" viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
      <svg data-name="icon-signal" viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
      <svg data-name="icon-battery" viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
    </div>
  </div>

  <div class="app-content">

    <div class="header-nav">
      <button class="icon-btn" onclick="notNow()" aria-label="Back"><svg data-name="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    </div>

    <div class="headline">
      <h1>Activate Term Loan By <span>M-PESA</span></h1>
      <p>Get the loan you need with an easy repayment schedule.</p>
      <i></i>
    </div>

    <div class="body">
      <div class="benefits">
        <h2>Loan Benefits</h2>
        <div class="b-row">
          <div class="b">
            <svg data-name="icon-money-bag" viewBox="0 0 34 34"><path d="M13 5h8l-2.2 4h-3.6z" fill="#E0262D"/><path d="M15.2 9h3.6C25 11.5 29 17 29 22.5 29 27.5 25 30 17 30S5 27.5 5 22.5C5 17 9 11.5 15.2 9z" fill="#FE353D"/><text x="17" y="23.6" text-anchor="middle" font-family="Switzer, sans-serif" font-size="7.2" font-weight="800" fill="#FFF">ETB</text></svg>
            <span>Get a Fixed Loan Amount</span>
          </div>
          <div class="b"><span class="split" data-shape="line" data-name="line"></span>
            <svg data-name="icon-calendar" viewBox="0 0 34 34" fill="none" stroke="#FE353D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6.5" width="21" height="20" rx="3"/><path d="M4 12.5h21M10 4v5M19 4v5"/><path d="M8.5 17h3M8.5 21.5h3M14.5 17h2" /><circle cx="24.5" cy="24.5" r="6.5" fill="#FFF"/><path d="M24.5 21.5v3.2l2 1.4"/></svg>
            <span>Flexible Repayment Plan</span>
          </div>
          <div class="b"><span class="split" data-shape="line" data-name="line"></span>
            <svg data-name="icon-shield-check" viewBox="0 0 34 34"><path d="M17 3 28 7v8.5C28 23 23.2 28.6 17 31 10.8 28.6 6 23 6 15.5V7z" fill="#FE353D"/><path d="m11.8 17 3.6 3.6 7-7.2" fill="none" stroke="#FFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Transparent Charges</span>
          </div>
        </div>
      </div>

      <div class="note"><i>i</i><p>Accept the terms to get your loan and repay according to the agreed schedule.</p></div>

      <button class="btn-primary" onclick="activate()">Activate</button>
      <button class="btn-outline" onclick="notNow()">Not now</button>
    </div>
  </div>
</div>

<script>
  // Activate once per session: Term Loan opens straight to the dashboard afterwards
  function activate() {
    try { sessionStorage.setItem('termLoanActive', '1'); } catch (e) {}
    location.href = 'Term Loan - Activation Submitted.html';
  }
  function notNow() { location.href = 'Credit & Saving.html'; }
</script>
<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
