<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agency Banking Cashout - Receipt</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&family=Barlow:wght@400&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --Primary-Dark: #C41520;
    --Primary-Darker: #A41016;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Surface-Container: #FCFCFC;
    --Gray-0: #FFF;
    --On-Primary: #FFF1F2;
    --Primary-Light: #FFF1F2;
    --Success: #1FC83B;
    --Success-Light: #E8F9EC;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { margin: 0; padding: 0; background: transparent; font-family: "Inter", sans-serif; display: flex; justify-content: center; }

  

  

  

  

  /* Scrollable Content Area */
  .scrollable-content {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
  }
  .scrollable-content::-webkit-scrollbar { width: 0; }

  /* Receipt Card */
  .receipt-card {
    width: 100%;
    background: #FFF;
    border-radius: 20px;
    padding: 48px 20px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: visible;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    margin-top: 32px;
  }

  /* Success Icon - overlapping top of receipt card */
  .success-icon-wrapper {
    position: absolute;
    top: -32px;
    left: 50%;
    transform: translateX(-50%);
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--Success);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 4px solid #F5F5F5;
    z-index: 10;
    box-shadow: 0 4px 12px rgba(31, 200, 59, 0.3);
  }

  /* Receipt Header */
  .receipt-header {
    text-align: center;
    margin-bottom: 20px;
  }

  .receipt-header h2 {
    color: var(--On-Surface);
    font-family: 'Switzer', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: 0.2px;
  }

  .receipt-header p {
    color: var(--On-Surface-Low);
    font-family: 'Switzer', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.2px;
  }

  /* Dashed Divider */
  .dashed-divider {
    width: calc(100% + 40px);
    margin: 0 -20px 20px;
    border: none;
    border-top: 2px dashed #E0E0E0;
    position: relative;
  }

  .dashed-divider::before,
  .dashed-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    background: #F5F5F5;
    border-radius: 50%;
  }

  .dashed-divider::before { left: -10px; }
  .dashed-divider::after { right: -10px; }

  /* Transaction Details */
  .transaction-details {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .detail-row .label {
    color: var(--On-Surface-Low);
    font-family: 'Switzer', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.1px;
    flex-shrink: 0;
    max-width: 140px;
  }

  .detail-row .value {
    color: var(--On-Surface);
    font-family: 'Switzer', sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-align: right;
    word-break: break-all;
    flex: 1;
  }

  .detail-row .value.copyable {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: flex-end;
  }

  .copy-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 6px;
  }

  .copy-btn:hover {
    background: var(--Primary-Light);
  }

  .copy-btn .copy-text {
    color: var(--Primary);
    font-family: 'Switzer', sans-serif;
    font-size: 11px;
    font-weight: 500;
  }

  .copy-btn i {
    width: 14px !important;
    height: 14px !important;
    color: var(--Primary);
    stroke-width: 2px;
  }

  .copy-btn.copied .copy-text {
    color: var(--Success);
  }

  .copy-btn.copied i {
    color: var(--Success);
  }

  /* Fee summary rows styling */
  .fee-detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 6px 0;
    border-top: 1px solid #F0F0F0;
  }

  .fee-detail-row .label {
    color: var(--On-Surface-Low);
    font-family: 'Switzer', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.1px;
  }

  .fee-detail-row .value {
    color: var(--On-Surface);
    font-family: 'Switzer', sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-align: right;
  }

  .fee-detail-row.total-row .label {
    color: var(--On-Surface);
    font-weight: 600;
    font-size: 13px;
  }

  .fee-detail-row.total-row .value {
    color: var(--Primary);
    font-weight: 700;
    font-size: 15px;
  }

  /* Stamp Watermark */
  .stamp-watermark {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -40%);
    width: 240px;
    height: 240px;
    opacity: 0.65;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 100;
  }

  .stamp-watermark img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Amount Section */
  .amount-section {
    width: 100%;
    text-align: center;
    padding-top: 16px;
    border-top: 1px solid #F0F0F0;
    margin-top: 4px;
    position: relative;
    z-index: 2;
  }

  .beneficiary-name {
    color: var(--On-Surface);
    font-family: 'Switzer', sans-serif;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: 0.2px;
  }

  .amount-display {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
  }

  .amount-value {
    color: var(--Primary);
    font-family: 'Switzer', sans-serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .amount-currency {
    color: var(--Primary);
    font-family: 'Switzer', sans-serif;
    font-size: 16px;
    font-weight: 500;
    padding-left: 8px;
    border-left: 2px solid var(--Primary);
    line-height: 1;
  }

  /* Amount in words */
  .amount-in-words {
    color: var(--On-Surface-Low);
    font-family: 'Switzer', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.1px;
    margin-bottom: 16px;
    line-height: 1.3;
  }

  /* QR Code */
  .qr-wrapper {
    padding: 8px;
    border: 3px solid var(--Primary);
    border-radius: 16px;
    background: #FFF;
    display: inline-block;
    position: relative;
    z-index: 2;
  }

  .qr-wrapper img {
    width: 80px;
    height: 80px;
    display: block;
  }

  

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--On-Surface);
    color: #FFF;
    padding: 12px 24px;
    border-radius: 12px;
    font-family: 'Switzer', sans-serif;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 1000;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="receipt-only"><!-- Toast Notification -->
<div class="toast" id="toast"></div>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  // Initialize Lucide icons
  lucide.createIcons();

  // Transaction data for QR code generation
  const transactionData = {
    type: 'Agency Banking Cashout',
    senderBank: 'CBE',
    senderAccount: '**** **** 1234',
    senderName: 'ABEBE KEBEDE',
    receiverName: 'BETTY MERHAT AGENCY',
    receiverShortCode: '876543',
    withdrawAmount: '2000.00',
    transactionDetail: 'Agency Banking Cashout - CBE',
    receiptNumber: 'RCP-2024-12345678',
    bankTransactionId: 'BNK-TXN-98765432',
    transactionId: 'fxt45632578',
    date: '12/12/2024',
    time: '8:34 AM',
    serviceFee: '35.00',
    vat: '6.30',
    totalAmount: '2041.30',
    amountInWords: 'Two Thousand Forty-One & 30/100 Ethiopian Birr Only',
    usedChannel: 'M-PESA App',
    transactionReason: 'Cash Withdrawal',
    currency: 'ETB'
  };

  // Generate QR Code from transaction data
  function generateQRCode() {
    const qrData = JSON.stringify(transactionData);
    const encodedData = encodeURIComponent(qrData);
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodedData}&margin=10`;
    document.getElementById('qrCode').src = qrUrl;
  }

  // Copy Transaction ID
  function copyTransactionId() {
    const transactionId = document.getElementById('transactionId').textContent;
    const copyBtn = document.getElementById('copyBtn');

    navigator.clipboard.writeText(transactionId).then(() => {
      copyBtn.classList.add('copied');
      copyBtn.querySelector('.copy-text').textContent = 'Copied!';
      showToast('Transaction ID copied to clipboard');

      setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyBtn.querySelector('.copy-text').textContent = 'Copy ID';
      }, 2000);
    }).catch(() => {
      // Fallback for older browsers
      const textArea = document.createElement('textarea');
      textArea.value = transactionId;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);

      copyBtn.classList.add('copied');
      copyBtn.querySelector('.copy-text').textContent = 'Copied!';
      showToast('Transaction ID copied to clipboard');

      setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyBtn.querySelector('.copy-text').textContent = 'Copy ID';
      }, 2000);
    });
  }

  // Show Toast
  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');

    setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }

  // Action handlers
  function closeReceipt() {
    showToast('Closing receipt...');
  }

  function shareReceipt() {
    const shareData = {
      title: 'M-PESA Agency Banking Cashout Receipt',
      text: `Cashout ${transactionData.transactionId}: ETB ${transactionData.totalAmount} to ${transactionData.receiverName}`,
      url: window.location.href
    };

    if (navigator.share) {
      navigator.share(shareData).catch(() => {});
    } else {
      showToast('Share link copied!');
    }
  }

  function downloadReceipt() {
    showToast('Downloading receipt as PDF...');
  }

  function addToFavorite() {
    const data = {
      accountName: transactionData.receiverName,
      shortCode: transactionData.receiverShortCode,
      transactionId: transactionData.transactionId,
      amount: transactionData.totalAmount,
      currency: transactionData.currency,
      type: transactionData.type
    };
    sessionStorage.setItem('favouriteData', JSON.stringify(data));
    window.location.href = 'Add Favourites.html';
  }

  function cashoutAgain() {
    showToast('Preparing cashout again...');
  }

  function reverseTransaction() {
    if (confirm('Are you sure you want to reverse this transaction?')) {
      showToast('Reversal request submitted');
    }
  }

  // Initialize
  generateQRCode();
</script>

<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
</body>
</html>
