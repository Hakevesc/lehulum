<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer to Wallet - Enter Recipient</title>
<style>
  @import url("styles/component-keypad.css");
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --Primary-Dark: #C41520;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Gray-0: #FFF;
    --On-Primary: #FFF1F2;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
    --Success: #1FC83B;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif; background: transparent;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .phone-frame {
    width: 360px; height: 780px; background: var(--Background); border-radius: 30px;
    overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .app-content { height: 100%; overflow-y: auto; position: relative; display: flex; flex-direction: column; }
  .app-content::-webkit-scrollbar { width: 0; }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 14px 24px 8px; background: var(--Background);
  }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px 12px; background: var(--Background);
  }
  .back-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%;
    background: transparent; border: none; cursor: pointer; transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; }
  .header-title {
    color: var(--On-Surface); font-family: 'Switzer', sans-serif;
    font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center;
  }

  .main-content {
    padding: 12px 20px 18px; display: flex; flex-direction: column; flex: 1; width: 100%; gap: 14px;
  }

  /* Wallet chip */
  .wallet-chip {
    align-self: center; display: flex; align-items: center; gap: 8px;
    background: #FFF; border: 1px solid var(--Border); border-radius: 999px;
    padding: 6px 14px 6px 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .wallet-chip .logo {
    width: 28px; height: 28px; border-radius: 50%; overflow: hidden; background: #F5F5F5;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .wallet-chip .logo img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }
  .wallet-chip .text { font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 500; color: var(--On-Surface); }

  /* Number entry */
  .entry-label {
    color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif;
    font-size: 12px; font-weight: 500; text-align: center; margin-top: 6px; letter-spacing: 0.2px;
  }
  .number-display {
    display: flex; align-items: center; justify-content: center; gap: 3px;
    min-height: 46px; padding: 0 8px;
  }
  .number-value {
    font-family: 'Switzer', sans-serif; font-size: 30px; font-weight: 700;
    letter-spacing: 1px; color: var(--On-Surface);
  }
  .number-value.placeholder { color: #C5C5CB; font-weight: 500; letter-spacing: 0.5px; }
  .number-caret { width: 2px; height: 30px; background: var(--Primary); animation: caret-blink 1s step-end infinite; }
  @keyframes caret-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .field-error {
    display: none; align-items: center; justify-content: center; gap: 6px; margin-top: 2px;
  }
  .field-error.show { display: flex; }
  .field-error svg { width: 14px; height: 14px; stroke: var(--Primary); stroke-width: 2; fill: none; }
  .field-error span { color: var(--Primary); font-family: 'Switzer', sans-serif; font-size: 12px; font-weight: 500; }

  /* Contacts button */
  .contacts-btn {
    align-self: center; display: flex; align-items: center; gap: 8px;
    background: var(--On-Primary); border: none; border-radius: 12px;
    padding: 10px 18px; cursor: pointer; transition: all 0.2s;
  }
  .contacts-btn:hover { background: #FFE0E2; }
  .contacts-btn svg { width: 18px; height: 18px; stroke: var(--Primary); stroke-width: 2; fill: none; }
  .contacts-btn span { color: var(--Primary); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 600; }

  .bottom-section { margin-top: auto; display: flex; flex-direction: column; }

  .continue-btn {
    height: 52px; border-radius: 14px; border: none; background: #E0E0E0;
    color: var(--On-Surface-Low); font-family: 'Poppins', sans-serif;
    font-size: 15px; font-weight: 500; cursor: not-allowed; transition: all 0.2s; margin-top: 14px;
  }
  .continue-btn.active {
    background: var(--Primary); color: #FFF; cursor: pointer; box-shadow: 0 4px 16px rgba(254,53,61,0.25);
  }
  .continue-btn.active:hover { background: #E5303A; box-shadow: 0 6px 20px rgba(254,53,61,0.35); transform: translateY(-1px); }
  .continue-btn.active:active { transform: scale(0.98) translateY(0); }

  /* ===== Bottom sheet (contacts) ===== */
  .modal-overlay {
    position: absolute; inset: 0; z-index: 1000; background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end; justify-content: center; animation: fadeInOverlay 0.2s ease-out;
  }
  .modal-overlay.show { display: flex; }
  @keyframes fadeInOverlay { from { opacity: 0; } to { opacity: 1; } }
  .bottom-sheet {
    width: 100%; background: #FFF; border-radius: 24px 24px 0 0; padding: 20px 20px 28px;
    animation: slideUpSheet 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); max-height: 70%; overflow-y: auto;
  }
  .bottom-sheet::-webkit-scrollbar { width: 0; }
  @keyframes slideUpSheet { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sheet-grip { width: 40px; height: 4px; background: #D8D8DD; border-radius: 2px; margin: 0 auto 16px; }
  .sheet-title { font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 700; color: var(--On-Surface); margin-bottom: 16px; text-align: center; }
  .sheet-list { display: flex; flex-direction: column; gap: 4px; }
  .sheet-item { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-radius: 14px; cursor: pointer; transition: background 0.15s; }
  .sheet-item:hover { background: #FFF1F2; }
  .sheet-item:active { background: #FFDFE0; }
  .sheet-avatar { width: 44px; height: 44px; border-radius: 50%; background: #E8E8EC; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 600; color: var(--On-Surface); overflow: hidden; }
  .sheet-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .sheet-item-info { flex: 1; }
  .sheet-item-name { font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .sheet-item-sub { font-family: 'Switzer', sans-serif; font-size: 12px; color: var(--On-Surface-Low); margin-top: 1px; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <span class="header-title" id="headerTitle">Send to M-PESA</span>
      <div style="width: 36px;"></div>
    </div>

    <div class="main-content">

      <div class="wallet-chip">
        <div class="logo"><img id="walletLogo" src="assets/banks logo/M-PESA-logo-icon.png" alt="M-PESA" onerror="this.style.display='none'"></div>
        <span class="text"><span id="walletName">M-PESA</span></span>
      </div>

      <div class="entry-label">Recipient mobile number</div>
      <div class="number-display">
        <span class="number-value placeholder" id="numberValue">09XX XXX XXX</span>
        <span class="number-caret"></span>
      </div>

      <div class="field-error" id="fieldError">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>Enter a valid 10-digit number starting with 09 or 07</span>
      </div>

      <button class="contacts-btn" onclick="openContacts()">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Select from Contacts</span>
      </button>

      <div class="bottom-section">
        <div class="keypad">
          <button class="key" onclick="pressKey('1')">1</button>
          <button class="key" onclick="pressKey('2')">2</button>
          <button class="key" onclick="pressKey('3')">3</button>
          <button class="key" onclick="pressKey('4')">4</button>
          <button class="key" onclick="pressKey('5')">5</button>
          <button class="key" onclick="pressKey('6')">6</button>
          <button class="key" onclick="pressKey('7')">7</button>
          <button class="key" onclick="pressKey('8')">8</button>
          <button class="key" onclick="pressKey('9')">9</button>
          <button class="key empty"></button>
          <button class="key" onclick="pressKey('0')">0</button>
          <button class="key delete" onclick="deleteKey()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
              <line x1="18" y1="9" x2="12" y2="15"></line>
              <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
          </button>
        </div>

        <button class="continue-btn" id="continueBtn" onclick="continueToValidation()" disabled>Continue</button>
      </div>

    </div>

  </div>

  <!-- Contacts bottom sheet -->
  <div class="modal-overlay" id="contactsOverlay" onclick="if(event.target===this)closeContacts()">
    <div class="bottom-sheet">
      <div class="sheet-grip"></div>
      <div class="sheet-title">Choose a contact</div>
      <div class="sheet-list" id="contactList"></div>
    </div>
  </div>
</div>

<script>
  let digits = '';

  const contacts = [
    { name: 'Henok Chala',   number: '0712131415' },
    { name: 'Aster Mequanent', number: '0911223344' },
    { name: 'Kidist Birhanu', number: '0922334455' },
    { name: 'Samuel Desta',   number: '0933445566' },
    { name: 'Marta Solomon',  number: '0944556677' }
  ];

  function initials(name) {
    return name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
  }

  function formatNumber(d) {
    // group as 09XX XXX XXX
    if (!d) return '';
    const a = d.slice(0, 4), b = d.slice(4, 7), c = d.slice(7, 10);
    return [a, b, c].filter(Boolean).join(' ');
  }

  let walletName = '';

  function getWalletPrefix() {
    // M-PESA → 07, Telebirr/Ethiotele → 09
    if (walletName.toLowerCase().includes('mpesa') || walletName.toLowerCase().includes('m-pesa')) return '07';
    return '09';
  }

  function isValid(d) {
    const prefix = getWalletPrefix();
    return d.length === 10 && d.startsWith(prefix);
  }

  function render() {
    const el = document.getElementById('numberValue');
    const err = document.getElementById('fieldError');
    const btn = document.getElementById('continueBtn');
    const prefix = getWalletPrefix();

    if (digits.length === 0) {
      el.textContent = prefix + 'XX XXX XXX';
      el.classList.add('placeholder');
    } else {
      el.textContent = formatNumber(digits);
      el.classList.remove('placeholder');
    }

    // Only show the error once a full-length but invalid number is entered
    const showErr = digits.length === 10 && !isValid(digits);
    err.classList.toggle('show', showErr);

    if (isValid(digits)) { btn.classList.add('active'); btn.disabled = false; }
    else { btn.classList.remove('active'); btn.disabled = true; }
  }

  function pressKey(k) {
    if (digits.length < 10) { digits += k; render(); }
  }
  function deleteKey() {
    digits = digits.slice(0, -1); render();
  }

  function openContacts() {
    const list = document.getElementById('contactList');
    list.innerHTML = contacts.map((c, i) => `
      <div class="sheet-item" onclick="pickContact(${i})">
        <div class="sheet-avatar">${initials(c.name)}</div>
        <div class="sheet-item-info">
          <div class="sheet-item-name">${c.name}</div>
          <div class="sheet-item-sub">${formatNumber(c.number)}</div>
        </div>
      </div>
    `).join('');
    document.getElementById('contactsOverlay').classList.add('show');
  }
  function closeContacts() {
    document.getElementById('contactsOverlay').classList.remove('show');
  }
  function pickContact(i) {
    const c = contacts[i];
    closeContacts();
    storeAndGo(c.number, c.name);
  }

  function maskNumber(d) {
    return '+251 9** *** ' + d.slice(-3);
  }

  const sampleNames = ['Henok Chala', 'Kidist Birhanu', 'Abel Tesfaye', 'Marta Solomon', 'Yonas Girma', 'Hanna Bekele'];

  function storeAndGo(number, holder) {
    let target = {};
    try { target = JSON.parse(sessionStorage.getItem('sendTarget') || '{}'); } catch (e) {}
    target.type = 'wallet';
    target.phone = maskNumber(number);
    target.fullNumber = number;
    if (holder) target.holder = holder;          // pre-known when picked from contacts
    else target.holder = sampleNames[Math.floor(Math.random() * sampleNames.length)];
    sessionStorage.setItem('sendTarget', JSON.stringify(target));
    window.location.href = 'Transfer to Wallet_Enter Amount.html';
  }

  function continueToValidation() {
    if (isValid(digits)) storeAndGo(digits);
  }

  function goBack() { window.location.href = 'Send Money Menu.html'; }

  // Reflect the wallet chosen on the Send Money menu
  (function loadTarget() {
    let target = null;
    try { target = JSON.parse(sessionStorage.getItem('sendTarget') || 'null'); } catch (e) {}
    if (target && target.type === 'wallet') {
      if (target.name) {
        walletName = target.name;
        document.getElementById('walletName').textContent = target.name;
        document.getElementById('headerTitle').textContent = 'Send to ' + target.name;
      }
      if (target.logo) {
        const img = document.getElementById('walletLogo');
        img.src = target.logo; img.alt = target.name || 'wallet'; img.style.display = '';
      }
    }
    // Update placeholder and error message based on wallet
    const prefix = getWalletPrefix();
    document.getElementById('numberValue').textContent = prefix + 'XX XXX XXX';
    const errMsg = document.querySelector('.field-error span');
    if (errMsg) {
      errMsg.textContent = 'Enter a valid 10-digit number starting with ' + prefix;
    }
  })();

  document.addEventListener('keydown', function (e) {
    if (e.key >= '0' && e.key <= '9') pressKey(e.key);
    else if (e.key === 'Backspace') deleteKey();
    else if (e.key === 'Enter') continueToValidation();
  });

  render();
</script>

<script src="figma-export.js"></script>
</body>
</html>
