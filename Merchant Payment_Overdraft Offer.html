<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Errif Overdraft</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --Primary-Dark: #C41520;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
    --Success: #1FC83B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 24px 8px; background: var(--Background); }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav { flex-shrink: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); }
  .back-btn { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; transition: all 0.2s; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .body { flex: 1; overflow-y: auto; padding: 8px 24px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .body::-webkit-scrollbar { width: 0; }
  .od-icon { width: 88px; height: 88px; border-radius: 24px; display: flex; align-items: center; justify-content: center; margin: 8px 0 18px; background: #FFF1F2; box-shadow: 0 4px 20px rgba(254,53,61,0.15); }
  .od-icon svg { width: 42px; height: 42px; stroke: var(--Primary); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .od-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  .od-desc { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 14px; line-height: 1.6; max-width: 290px; margin-bottom: 22px; }

  .od-card { width: 100%; background: #FFF; border: 1px solid var(--Border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .od-row { display: flex; justify-content: space-between; align-items: center; }
  .od-row .label { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 13px; }
  .od-row .val { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 600; }
  .od-row.hl .val { color: var(--Primary); font-weight: 700; }

  .bottom-area { flex-shrink: 0; width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 12px 24px 14px; background: var(--Background); }
  .btn-primary { width: 100%; height: 52px; border-radius: 14px; background: var(--Primary); color: #FFF; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; border: none; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 16px rgba(254,53,61,0.25); }
  .btn-primary:hover { background: #E5303A; transform: translateY(-1px); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-link { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; background: none; border: none; padding: 4px 0; }
  .btn-link:hover { color: var(--On-Surface); }

  /* Demo scenario switcher (prototype only) */
  .demo-switch { flex-shrink: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 8px 16px 16px; background: var(--Background); border-top: 1px dashed var(--Border); }
  .demo-switch span { font-family: 'Switzer', sans-serif; font-size: 10.5px; color: var(--On-Surface-Low); }
  .demo-switch button { font-family: 'Switzer', sans-serif; font-size: 10.5px; font-weight: 600; color: var(--On-Surface-Low); background: #FFF; border: 1px solid var(--Border); border-radius: 8px; padding: 4px 8px; cursor: pointer; }
  .demo-switch button.on { color: var(--Primary); border-color: var(--Primary); background: #FFF7F7; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title">Errif Overdraft</span>
      <div style="width: 36px;"></div>
    </div>

    <div class="body">
      <div class="od-icon">
        <svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
      </div>
      <h2 class="od-title" id="odTitle">You're eligible for Errif</h2>
      <p class="od-desc" id="odDesc">Activate Errif overdraft to complete this merchant payment now and repay later within your limit.</p>

      <div class="od-card">
        <div class="od-row hl"><span class="label">Available Errif limit</span><span class="val" id="odLimit">5,000.00 ETB</span></div>
        <div class="od-row"><span class="label">This payment</span><span class="val" id="odAmount">— ETB</span></div>
        <div class="od-row sub" id="odInterestRow"><span class="label">Service charge</span><span class="val">Free · 0% for 7 days</span></div>
      </div>
    </div>

    <div class="bottom-area">
      <button class="btn-primary" id="odPrimary" onclick="primaryAction()">Continue</button>
      <button class="btn-link" onclick="cancel()">Cancel payment</button>
    </div>

    <div class="demo-switch">
      <span>Demo scenario:</span>
      <button data-s="active_ok" onclick="setStatus('active_ok')">Active</button>
      <button data-s="eligible" onclick="setStatus('eligible')">Eligible</button>
      <button data-s="active_low" onclick="setStatus('active_low')">Limit low</button>
      <button data-s="ineligible" onclick="setStatus('ineligible')">Not eligible</button>
    </div>

  </div>
</div>

<script>
  const OD_LIMIT = 5000.00;
  const data = JSON.parse(sessionStorage.getItem('merchantData') || '{}');
  const fmt = n => parseFloat(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const amount = parseFloat(data.payAmount || '0');
  const status = sessionStorage.getItem('odStatus') || 'eligible';

  function finalizeOverdraft() {
    const d = JSON.parse(sessionStorage.getItem('merchantData') || '{}');
    d.payAccount = 'overdraft';
    d.overdraft = true;
    d.account = 'overdraft';
    d.fee = '0.00';
    d.total = parseFloat(d.payAmount || '0').toFixed(2);
    d.odBreakdown = computeOdBreakdown(parseFloat(d.payAmount || 0));
    sessionStorage.setItem('merchantData', JSON.stringify(d));
    window.location.href = 'Merchant Payment_Enter PIN.html';
  }

  function computeOdBreakdown(amt) {
    const mpesaBal = Math.min(amt, 30);
    const odBal = Math.max(0, amt - mpesaBal);
    const serviceFee = odBal > 0 ? parseFloat(Math.max(5, odBal * 0.05).toFixed(2)) : 0;
    const dailyFee = odBal > 0 ? parseFloat(Math.max(0.10, odBal * 0.001).toFixed(2)) : 0;
    const penalty = odBal > 0 ? parseFloat(Math.max(0.13, odBal * 0.0011).toFixed(2)) : 0;
    const due = new Date(); due.setDate(due.getDate() + 30);
    return {
      mpesaBal, odBal, serviceFee,
      totalAdvance: parseFloat((odBal + serviceFee).toFixed(2)),
      dailyFee, penalty,
      dueFmt: String(due.getDate()).padStart(2, '0') + '/' + String(due.getMonth() + 1).padStart(2, '0') + '/' + due.getFullYear()
    };
  }

  function primaryAction() {
    if (status === 'active_ok') finalizeOverdraft();
    else window.location.href = 'Merchant Payment_Overdraft Activate.html';
  }

  function cancel() { window.location.href = 'Pay Merchant.html'; }
  function goBack() { window.location.href = 'Pay Merchant.html'; }
  function setStatus(s) { sessionStorage.setItem('odStatus', s); location.reload(); }

  function init() {
    // Highlight the active demo chip
    const chip = document.querySelector('.demo-switch button[data-s="' + status + '"]');
    if (chip) chip.classList.add('on');

    // Active-but-insufficient OR not-eligible → cannot pay → Insufficient Balance
    if (status === 'active_low' || status === 'ineligible') {
      sessionStorage.setItem('insufReason', status === 'active_low' ? 'od_low' : 'ineligible');
      window.location.replace('Pay Merchant.html');
      return;
    }

    document.getElementById('odLimit').textContent = fmt(OD_LIMIT) + ' ETB';
    document.getElementById('odAmount').textContent = fmt(amount) + ' ETB';

    if (status === 'active_ok') {
      document.getElementById('odTitle').textContent = 'Pay with Errif Overdraft';
      document.getElementById('odDesc').textContent = 'Your accounts are low, but your active Errif overdraft can cover this bill. Confirm to continue.';
      document.getElementById('odPrimary').textContent = 'Pay ' + fmt(amount) + ' ETB with Errif';
    } else { // eligible
      document.getElementById('odTitle').textContent = "You're eligible for Errif";
      document.getElementById('odDesc').textContent = 'Activate Errif overdraft to complete this merchant payment now and repay later within your limit.';
      document.getElementById('odPrimary').textContent = 'Activate Errif';
      document.getElementById('odInterestRow').style.display = 'none';
    }
  }

  init();
</script>

<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
