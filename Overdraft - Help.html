<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Errif Works — M-PESA</title>
<link rel="stylesheet" href="styles/design-tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/component-status-bar.css">
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap');

  /* How Errif works (Errif ⋯ → How Errif works): Contact Support (call / email),
     then Quick Help — Errif questions as an accordion, first one open. Limits and
     fees come from term-loan-store.js. */
  :root { --Font: Switzer, sans-serif; }
  body { font-family: var(--Font); }
  .phone-frame { display: flex; flex-direction: column; }
  .phone-frame > .status-bar { flex-shrink: 0; }
  .app-content { display: flex; flex-direction: column; gap: 12px; flex: 1 1 auto; min-height: 0; height: auto; }
  .app-content > * { flex-shrink: 0; }

  .header-nav { display: flex; align-items: center; padding: 0 0 2px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface, #1C1C21); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .header-title { flex: 1; text-align: center; margin-right: 36px; font-size: 17px; font-weight: 500; color: var(--On-Surface, #1C1C21); }

  .card { background: #FFF; border-radius: 22px; padding: 18px; box-shadow: 0 4px 16px rgba(15,23,42,0.06); }

  /* Contact support */
  .support { text-align: center; }
  .support .hs { width: 60px; height: 60px; margin: 0 auto; border-radius: 18px; background: #FFF1F2; display: flex; align-items: center; justify-content: center; }
  .support .hs svg { width: 30px; height: 30px; stroke: var(--Primary, #FE353D); stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .support h2 { margin-top: 12px; font-size: 19px; font-weight: 700; color: var(--On-Surface, #1C1C21); }
  .support > p { margin-top: 3px; font-size: 13px; color: var(--On-Surface-Low, #7C7C87); }
  .way { margin-top: 10px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #F7F7F9; text-align: left; text-decoration: none; }
  .way:first-of-type { margin-top: 16px; }
  .way i { width: 36px; height: 36px; border-radius: 50%; background: var(--Primary, #FE353D); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .way i svg { width: 17px; height: 17px; stroke: #FFF; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .way span { min-width: 0; }
  .way b { display: block; font-size: 14px; font-weight: 600; color: var(--On-Surface, #1C1C21); }
  .way small { display: block; margin-top: 2px; font-size: 12px; color: #55555E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Quick help */
  .pill { display: block; width: fit-content; margin: 0 auto 4px; padding: 7px 16px; border-radius: 999px; background: #EFEFF3; font-size: 11.5px; font-weight: 600; letter-spacing: 1px; color: #55555E; text-transform: uppercase; }
  .qa + .qa { border-top: 1px solid #F1F1F4; }
  .q { width: 100%; display: flex; align-items: center; gap: 12px; padding: 15px 0; border: none; background: none; cursor: pointer; text-align: left; font-family: var(--Font); }
  .q b { flex: 1; font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--On-Surface, #1C1C21); }
  .q svg { width: 18px; height: 18px; flex-shrink: 0; stroke: #8A8A94; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s; }
  .qa.open .q svg { transform: rotate(180deg); stroke: var(--Primary, #FE353D); }
  .a { display: none; padding: 0 0 15px; font-size: 13px; line-height: 1.55; color: #55555E; }
  .qa.open .a { display: block; }
  .a b { color: var(--On-Surface, #1C1C21); font-weight: 600; }
  .help { padding-bottom: 4px; }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="time">10:00</span>
    <div class="status-icons">
      <svg data-name="icon-wifi" viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
      <svg data-name="icon-signal" viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
      <svg data-name="icon-battery" viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
    </div>
  </div>

  <div class="app-content">
    <div class="header-nav">
      <button class="icon-btn" onclick="location.href='Overdraft.html'" aria-label="Back"><svg data-name="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <span class="header-title">Errif Overdraft</span>
    </div>

    <!-- Contact support -->
    <div class="card support">
      <div class="hs"><svg data-name="icon-headset" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="13" width="4" height="7" rx="2"/><rect x="17" y="13" width="4" height="7" rx="2"/><path d="M19 20a3 3 0 0 1-3 3h-3"/></svg></div>
      <h2>Contact Support</h2>
      <p>We're here to help you 24/7</p>
      <a class="way" href="tel:0700"><i><svg data-name="icon-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></i><span><b>Call Us</b><small>0700 · free from your M-PESA line</small></span></a>
      <a class="way" href="mailto:support@m-pesa.et"><i><svg data-name="icon-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg></i><span><b>Email Us</b><small>support@m-pesa.et</small></span></a>
    </div>

    <!-- Quick help -->
    <div class="card help">
      <span class="pill">Quick help</span>
      <div id="faq"></div>
    </div>
  </div>
</div>

<script src="term-loan-store.js"></script>
<script>
  const F = TL.ERRIF_FEES, fmt = TL.fmt, E = TL.errifLoad();
  const pct = (v, d) => (v * 100).toFixed(d) + '%';
  const DOWN = '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';
  const QA = [
    ['What is Errif?', 'Errif is an overdraft on your M-PESA account. When a payment is more than your balance, Errif covers the missing amount so the payment still goes through.'],
    ['When does Errif cover a payment?', 'Only when your balance is short — for bill payments, airtime, packages and merchant payments. Errif covers just the gap, nothing more.'],
    ['How much can I use?', `Up to your Errif limit. Limits go up to <b>${fmt(F.maxLimit)} ETB</b> and are set from how you use M-PESA and repay. Your limit is <b>${fmt(E.limit)} ETB</b>.`],
    ['How do I repay?', 'Errif repays itself from the next money you receive. You can also repay any time from the Errif screen with <b>Repay Now</b> — in full or in part.'],
    ['What does it cost?', `A <b>${pct(F.access, 0)} access fee</b> on each amount Errif covers, and a daily maintenance fee of up to <b>${fmt(F.dailyMax)} ETB</b>. Nothing is charged until Errif covers a payment.`],
    ['What if I don\'t repay in time?', `Errif must be cleared within <b>${F.days} days</b>. After that a late penalty of <b>${pct(F.penalty, 1)} per day</b> applies and your Errif level and credit score can go down.`],
    ['How do I get a higher limit?', 'Use M-PESA regularly, keep money in your account and let Errif repay on time. Your level and limit are reviewed automatically.'],
    ['How do I opt out?', 'Open the Errif menu and tap <b>Opt-Out</b>. If anything is owed, pay it first. You can opt in again any time.']
  ];
  document.getElementById('faq').innerHTML = QA.map(([q, a], i) => `<div class="qa${i ? '' : ' open'}"><button class="q" type="button" onclick="this.parentElement.classList.toggle('open')"><b>${q}</b>${DOWN}</button><div class="a">${a}</div></div>`).join('');
</script>
<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
