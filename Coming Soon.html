<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap');

  /* Coming Soon: shown for any feature that is not live yet. Close goes back where
     you came from (or ?back=). */
  :root {
    --Primary: #FE353D;
    --Primary-Dark: #C8161D;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  button { font-family: inherit; }
  .phone-frame { width: 360px; height: 780px; background: #FFF; border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .app-content { position: relative; height: 100%; display: flex; flex-direction: column; }


  .status-bar { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }
  .top { position: relative; z-index: 1; padding: 6px 12px 0; flex-shrink: 0; }
  .close-x { width: 40px; height: 40px; border: none; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .close-x:hover { background: rgba(0,0,0,0.05); }
  .close-x svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8; fill: none; }

  .body { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 30px 28px 0; }
  .art-wrap { position: relative; width: 220px; height: 200px; flex-shrink: 0; }
  .art { width: 220px; height: 200px; display: block; }
  /* Trim-path wave: each arc draws in from its left end and settles at its full
     shape, holds, then trims away from the left and draws in again. The right
     arc follows the left one, like a wing beat passing through the phone. */
  .art .arc { stroke-dasharray: 100 120; stroke-dashoffset: 101; animation: trim 4.2s cubic-bezier(.45,0,.2,1) infinite; }
  .art .arc-r { animation-delay: 0.35s; }
  @keyframes trim {
    0% { stroke-dashoffset: 101; opacity: 0; }
    3% { opacity: 1; }
    28%, 78% { stroke-dashoffset: 0; }
    97% { stroke-dashoffset: -101; opacity: 1; }
    100% { stroke-dashoffset: -101; opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .art .arc { animation: none; stroke-dashoffset: 0; } }
  /* Splash money animation (Lottie) flying out of the phone screen */
  /* The notes sit in the lower part of the 300×300 Lottie canvas, so the canvas is
     offset to land them on the phone's screen */
  .money { position: absolute; left: 4px; top: -30px; width: 170px; height: 170px; pointer-events: none; }
  .eyebrow { margin-top: 28px; font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 500; letter-spacing: 1.2px; color: #8A8A94; text-transform: uppercase; }
  h1 { margin-top: 8px; font-family: 'Switzer', sans-serif; font-size: 27px; font-weight: 800; line-height: 1.12; letter-spacing: -0.3px; color: var(--On-Surface); }
  .desc { margin-top: 14px; max-width: 280px; font-family: 'Switzer', sans-serif; font-size: 13.5px; line-height: 1.55; color: #55555E; }

  .bottom-bar { position: relative; z-index: 1; flex-shrink: 0; padding: 12px 20px 26px; }
  .btn-primary { width: 100%; height: 52px; border: none; border-radius: 14px; background: var(--Primary); color: #FFF; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; box-shadow: 0 6px 18px rgba(254,53,61,0.3); }
  .btn-primary:active { transform: scale(0.98); }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="top">
      <button class="close-x" onclick="closePage()" aria-label="Close">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="body">
      <!-- A phone with the splash screen's money animation flying out of it -->
      <div class="art-wrap">
      <svg class="art" viewBox="0 0 220 200" aria-hidden="true">
        <path class="arc arc-l" pathLength="100" d="M18 132c18-30 46-30 64-12" fill="none" stroke="#FFB3B6" stroke-width="20" stroke-linecap="round"/>
        <rect x="70" y="22" width="80" height="150" rx="12" fill="#FE353D"/>
        <rect x="79" y="36" width="62" height="118" rx="4" fill="#FFF"/>
        <rect x="100" y="27" width="20" height="4" rx="2" fill="#C8161D"/>
        <path class="arc arc-r" pathLength="100" d="M150 74c14-18 34-22 52-12" fill="none" stroke="#FE353D" stroke-width="20" stroke-linecap="round"/>
      </svg>
        <div class="money" id="money"></div>
      </div>

      <p class="eyebrow">Coming soon!</p>
      <h1>Something great<br>is on the way!</h1>
      <p class="desc">We're working hard to bring you exciting new features and an even better experience.</p>
    </div>

    <div class="bottom-bar">
      <button class="btn-primary" onclick="closePage()">Close</button>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  // Close: back to where the customer came from (or ?back=, or Home)
  function closePage() {
    const back = params.get('back');
    if (back) location.href = back;
    else if (document.referrer && history.length > 1) history.back();
    else location.href = 'Lehulum Home.html';
  }
</script>
<script src="M-PESA Splash Animation/assets/mpesa-lottie-data.js"></script>
<script src="M-PESA Splash Animation/mpesa-splash.js"></script>
<script>MpesaSplash.anim(document.getElementById('money'));</script>
<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
