<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot PIN — Success</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --Primary-Dark: #C41520;
    --Success: #1AAE45;
    --Success-Bg: #E8F9ED;
    --Success-Dark: #1C5C24;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Surface: #F5F5F5;
    --White: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif; background: transparent;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }

  .phone-frame {
    width: 360px; height: 780px; background: var(--Surface);
    border-radius: 30px; overflow: hidden; position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    display: flex; flex-direction: column;
  }

  .app-content { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

  /* ===== HEADER (160px) ===== */
  .header-section {
    position: relative; width: 100%; height: 160px; flex-shrink: 0;
    background: linear-gradient(160deg, #A41016 0%, #C41520 30%, #D32F2F 60%, #B71C1C 100%);
    border-radius: 0 0 30px 30px;
    display: flex; flex-direction: column; align-items: center;
  }
  .pattern-overlay {
    position: absolute; inset: 0; opacity: 0.20; z-index: 0;
    background-image: url('assets/M-PESA-pattern.svg');
    background-size: 490px; background-position: right -270px top -270px;
    background-repeat: no-repeat; border-radius: 0 0 30px 30px; mix-blend-mode: overlay;
  }
  .status-bar {
    position: relative; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 14px 24px 8px;
  }
  .status-bar .time { font-size: 14px; font-weight: 600; color: #FFF; }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav {
    position: relative; z-index: 5;
    width: 100%; display: flex; align-items: center; justify-content: center;
    padding: 12px 20px 0;
  }
  .back-btn {
    position: absolute; left: 20px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer; transition: all 0.2s;
  }
  .back-btn:hover { transform: scale(1.1); }
  .back-btn svg { width: 24px; height: 24px; stroke: #FFF; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .header-title { color: #FFF; font-family: 'Switzer', sans-serif; font-size: 18px; font-weight: 300; letter-spacing: 0.3px; }
  .header-subtitle {
    position: relative; z-index: 5;
    color: #FFF; font-family: 'Switzer', sans-serif;
    font-size: 22px; font-weight: 600; margin-top: 28px;
    padding: 0 24px; text-align: left; width: 100%;
  }

  /* ===== MAIN CONTENT ===== */
  .main-content {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 32px 20px 28px; overflow-y: auto;
  }
  .main-content::-webkit-scrollbar { width: 0; }

  /* Result icon */
  .result-icon-wrap {
    width: 88px; height: 88px;
    border-radius: 28px;
    background: var(--Success-Bg);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
    position: relative;
    animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .result-icon-wrap::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 32px;
    border: 2px solid var(--Success);
    opacity: 0.25;
  }
  .result-icon-wrap svg { width: 44px; height: 44px; }

  @keyframes pop-in {
    0%   { transform: scale(0.5); opacity: 0; }
    80%  { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Result text */
  .result-title {
    font-family: 'Switzer', sans-serif;
    font-size: 22px; font-weight: 700;
    color: var(--Success-Dark);
    text-align: center;
    line-height: 1.3;
    margin-bottom: 10px;
    animation: slide-up 0.4s 0.15s ease both;
  }
  .result-subtitle {
    font-family: 'Switzer', sans-serif;
    font-size: 14px; font-weight: 400;
    text-align: center;
    color: var(--On-Surface-Low);
    line-height: 1.6;
    max-width: 270px;
    animation: slide-up 0.4s 0.25s ease both;
    margin-bottom: 28px;
  }

  @keyframes slide-up {
    from { transform: translateY(12px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  /* Steps */
  .steps-row {
    width: 100%; max-width: 328px;
    display: flex; align-items: center; gap: 0;
    margin-bottom: 24px;
    animation: slide-up 0.4s 0.35s ease both;
  }
  .step-item {
    display: flex; flex-direction: column; align-items: center; flex: 1; gap: 6px;
  }
  .step-circle {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Switzer', sans-serif;
    font-size: 12px; font-weight: 700;
  }
  .step-circle.done { background: var(--Success-Bg); color: var(--Success); border: 2px solid var(--Success); }
  .step-circle.done svg { width: 14px; height: 14px; stroke: var(--Success); stroke-width: 2.5; fill: none; }
  .step-circle.active { background: var(--Primary); color: #FFF; border: 2px solid var(--Primary); }
  .step-circle.pending { background: #F0F0F0; color: var(--On-Surface-Low); border: 2px solid #E0E0E0; }
  .step-label-txt {
    font-family: 'Switzer', sans-serif;
    font-size: 10px; font-weight: 500;
    text-align: center; color: var(--On-Surface-Low);
    line-height: 1.3;
  }
  .step-line { flex: 1; height: 2px; background: #E8E8E8; margin-bottom: 18px; }
  .step-line.done { background: var(--Success); }

  /* Method chip */
  .method-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px;
    font-family: 'Switzer', sans-serif;
    font-size: 11px; font-weight: 600;
    background: #F0F0F5; color: var(--On-Surface-Low);
    margin-bottom: 12px;
    animation: slide-up 0.4s 0.1s ease both;
  }
  .method-chip svg { width: 12px; height: 12px; }

  /* Detail card */
  .detail-card {
    width: 100%; max-width: 328px;
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 20px;
    background: var(--Success-Bg);
    border: 1px solid rgba(26,174,69,0.2);
    animation: slide-up 0.4s 0.3s ease both;
  }
  .detail-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0;
  }
  .detail-row:not(:last-child) {
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }
  .detail-row svg { width: 16px; height: 16px; flex-shrink: 0; }
  .detail-row .detail-label {
    font-family: 'Switzer', sans-serif;
    font-size: 12px; font-weight: 500;
    color: var(--On-Surface-Low);
    flex: 1;
  }
  .detail-row .detail-value {
    font-family: 'Switzer', sans-serif;
    font-size: 13px; font-weight: 600;
    color: var(--On-Surface);
  }

  /* Confetti */
  .confetti-wrap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 320px;
    pointer-events: none;
    overflow: hidden;
  }
  .confetti-dot {
    position: absolute;
    border-radius: 2px;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(320px) rotate(720deg); opacity: 0; }
  }

  /* ===== BOTTOM BUTTONS ===== */
  .bottom-area {
    margin-top: auto;
    width: 100%; max-width: 328px;
    display: flex; flex-direction: column; gap: 10px;
    animation: slide-up 0.4s 0.4s ease both;
  }
  .btn-primary {
    width: 100%; height: 48px; border-radius: 12px;
    background: var(--Success); color: #FFF;
    font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500;
    border: none; cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(26,174,69,0.25);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    text-decoration: none;
  }
  .btn-primary:hover { background: #158a38; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,174,69,0.35); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary svg { width: 16px; height: 16px; stroke: #FFF; stroke-width: 2.5; fill: none; }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>

<script>
// Generate confetti particles
(function() {
  var wrap = document.querySelector('.confetti-wrap');
  if (!wrap) return;
  var colors = ['#1AAE45','#FE353D','#FFD700','#4C9BFF','#FF6B6B','#A3E635'];
  for (var i = 0; i < 28; i++) {
    var dot = document.createElement('div');
    dot.className = 'confetti-dot';
    var color = colors[i % colors.length];
    var left  = Math.random() * 100;
    var delay = (Math.random() * 0.8).toFixed(2);
    var dur   = (1.2 + Math.random() * 1.2).toFixed(2);
    var size  = 5 + Math.floor(Math.random() * 6);
    var rot   = Math.floor(Math.random() * 360);
    dot.style.cssText = 'left:' + left + '%;top:-10px;width:' + size + 'px;height:' + size + 'px;background:' + color + ';transform:rotate(' + rot + 'deg);animation-duration:' + dur + 's;animation-delay:' + delay + 's;';
    wrap.appendChild(dot);
  }
})();
</script>
