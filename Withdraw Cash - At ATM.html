<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw at ATM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  /* Withdraw at ATM (cardless): enter the amount, confirm in the sheet, then
     the PIN. The voucher code arrives by SMS and works at any partner ATM. */
  :root {
    --Primary: #FE353D;
    --Primary-Light: #FFF1F2;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
    --Field: #F7F7F9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  button, input { font-family: inherit; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; background: var(--Background); flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); flex-shrink: 0; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px 16px; gap: 12px; }

  /* What is being done: cash withdrawal at an ATM */
  .service { display: flex; align-items: center; gap: 12px; background: #FFF; border-radius: 16px; padding: 14px; box-shadow: 0 4px 14px rgba(15,23,42,0.05); flex-shrink: 0; }
  .s-ic { width: 42px; height: 42px; border-radius: 12px; background: var(--Primary-Light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .s-ic svg, .cf-ic svg { width: 22px; height: 22px; stroke: var(--Primary); stroke-width: 1.9; fill: none; }
  .service b { font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 700; color: var(--On-Surface); }

  .card { background: #FFF; border-radius: 16px; padding: 16px; box-shadow: 0 4px 14px rgba(15,23,42,0.05); flex-shrink: 0; }
  .field-label { display: block; font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 500; color: var(--On-Surface); margin-bottom: 10px; }
  .field { height: 54px; background: var(--Field); border: 1.5px solid var(--Border); border-radius: 12px; padding: 0 14px; display: flex; align-items: center; gap: 8px; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; }
  .field:focus-within { border-color: var(--Primary); background: #FFF; box-shadow: 0 4px 12px rgba(254,53,61,0.12); }
  .field input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.4px; color: var(--On-Surface); }
  .field input::placeholder { color: var(--On-Surface-Low); font-size: 15px; font-weight: 400; letter-spacing: 0; }
  .balance { margin-top: 8px; font-family: 'Switzer', sans-serif; font-size: 12px; color: var(--On-Surface-Low); }
  .balance b { font-weight: 600; color: var(--On-Surface); }

  .btn-primary { width: 100%; height: 52px; border: none; border-radius: 14px; background: var(--Primary); color: #FFF; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; box-shadow: 0 4px 16px rgba(254,53,61,0.25); transition: background 0.2s, transform 0.12s; margin-top: auto; flex-shrink: 0; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { background: #E0E0E0; color: var(--On-Surface-Low); box-shadow: none; cursor: not-allowed; }

  /* ── Confirmation sheet (same as Withdraw at Agent) ── */
  .scrim { position: absolute; inset: 0; z-index: 100; background: rgba(0,0,0,0.42); opacity: 0; visibility: hidden; transition: opacity 0.22s, visibility 0.22s; }
  .scrim.show { opacity: 1; visibility: visible; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 101; background: #FFF; border-radius: 28px 28px 0 0; padding: 10px 16px 24px; transform: translateY(100%); transition: transform 0.28s cubic-bezier(.2,.8,.2,1); }
  .sheet.show { transform: translateY(0); }
  .sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: #D8D8DE; margin: 0 auto 18px; }
  .cf-merchant { position: relative; display: flex; align-items: center; gap: 12px; border: 1px solid #E6E6EA; border-radius: 16px; padding: 14px; }
  .cf-ic { width: 42px; height: 42px; border-radius: 50%; background: var(--Primary-Light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cf-merchant b { display: block; font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 700; color: var(--On-Surface); }
  .cf-merchant small { font-family: 'Switzer', sans-serif; font-size: 12.5px; color: var(--On-Surface-Low); }
  .cf-badge { position: absolute; top: -11px; right: 14px; padding: 4px 10px; border-radius: 999px; background: #EDEDF0; color: #3A3A42; font-family: 'Switzer', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
  .cf-rows { margin: 10px 0 20px; }
  .cf-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #EFEFF2; font-family: 'Switzer', sans-serif; }
  .cf-row:last-child { border-bottom: none; }
  .cf-row span { font-size: 12.5px; color: #55555E; }
  .cf-row b { font-size: 12.5px; font-weight: 700; color: var(--On-Surface); }
  .cf-row b.red { font-size: 14px; color: var(--Primary); }
  .cf-actions { display: flex; gap: 12px; }
  .cf-btn { flex: 1; height: 52px; border-radius: 14px; background: #FFF; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; }
  .cf-btn:active { transform: scale(0.98); }
  .cf-btn.cancel { border: 1.5px solid #E0E0E4; color: #55555E; }
  .cf-btn.confirm { border: 1.5px solid var(--Primary); color: var(--Primary); }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="goBack()" aria-label="Back">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title">Withdraw At ATM</span>
      <div style="width:36px;"></div>
    </div>

    <div class="body">
      <div class="service">
        <span class="s-ic"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 4l9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/></svg></span>
        <b>Cash Withdrawal</b>
      </div>

      <div class="card">
        <label class="field-label" for="amount">Amount</label>
        <div class="field">
          <input id="amount" type="text" inputmode="decimal" placeholder="e.g. 120 ETB" autocomplete="off">
        </div>
        <div class="balance"><b>Balance:</b> 20,000.00 ETB</div>
      </div>

      <button class="btn-primary" id="continueBtn" disabled onclick="openConfirm()">Continue</button>
    </div>
  </div>

  <!-- Confirmation: account, fee and amount; Confirm goes to the PIN -->
  <div class="scrim" id="scrim" onclick="closeConfirm()"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Confirm withdrawal">
    <div class="sheet-grip"></div>
    <div class="cf-merchant">
      <span class="cf-badge">ATM</span>
      <span class="cf-ic"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 4l9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/></svg></span>
      <span><b>Withdraw at ATM</b><small>Cash Withdrawal</small></span>
    </div>
    <div class="cf-rows">
      <div class="cf-row"><span>Account Type:</span><b>Main account</b></div>
      <div class="cf-row"><span>Fee:</span><b id="cfFee">0.00 ETB</b></div>
      <div class="cf-row"><span>Withdrawal Amount:</span><b class="red" id="cfAmount"></b></div>
    </div>
    <div class="cf-actions">
      <button class="cf-btn cancel" onclick="closeConfirm()">Cancel</button>
      <button class="cf-btn confirm" onclick="confirmWithdraw()">Confirm</button>
    </div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const BALANCE = 20000, FEE = 0;
  const fmt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function goBack() { location.href = 'Withdraw Cash - Option 2.html'; }

  // Amount: digits with thousands separators, up to the balance
  const amountValue = () => Number($('amount').value.replace(/,/g, '')) || 0;
  function onAmount() {
    const el = $('amount');
    let v = el.value.replace(/[^\d.]/g, '');
    const [i, f] = v.split('.');
    v = (i ? Number(i).toLocaleString('en-US') : '') + (f !== undefined ? '.' + f.slice(0, 2) : '');
    el.value = v;
    const a = amountValue();
    $('continueBtn').disabled = !(a >= 10 && a <= BALANCE);
  }
  $('amount').addEventListener('input', onAmount);
  $('amount').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('continueBtn').disabled) openConfirm(); });

  // Coming back from the PIN keeps the amount
  let prev = {};
  try { prev = JSON.parse(sessionStorage.getItem('withdrawData') || '{}'); } catch (e) {}
  if (prev.method === 'atm' && prev.amount) { $('amount').value = String(prev.amount); onAmount(); }

  function openConfirm() {
    if ($('continueBtn').disabled) return;
    document.activeElement && document.activeElement.blur();
    $('cfFee').textContent = fmt(FEE) + ' ETB';
    $('cfAmount').textContent = fmt(amountValue()) + ' ETB';
    $('scrim').classList.add('show');
    $('sheet').classList.add('show');
  }
  function closeConfirm() { $('scrim').classList.remove('show'); $('sheet').classList.remove('show'); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeConfirm(); });
  function confirmWithdraw() {
    const amount = amountValue();
    sessionStorage.setItem('withdrawData', JSON.stringify({
      method: 'atm', methodLabel: 'ATM Cardless', amount, fee: FEE, total: amount + FEE,
      from: 'Withdraw Cash - At ATM.html', time: new Date().toLocaleTimeString()
    }));
    location.href = 'Withdraw Cash - Enter PIN.html';
  }
</script>
<script src="components/keyboard.js"></script>
<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
