<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Surface-Container: #FCFCFC;
    --Gray-0: #FFF;
    --Border: #E8E8EC;
    --Success: #1FC83B;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: transparent;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }

  .phone-frame {
    width: 360px; height: 780px;
    background: #F5F5F5; border-radius: 30px;
    overflow: hidden; position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }

  .app-content { height: 100%; overflow-y: auto; position: relative; display: flex; flex-direction: column; }
  .app-content::-webkit-scrollbar { width: 0; }

  /* ── Status Bar ── */
  .status-bar {
    position: relative; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 14px 24px 8px; background: #F5F5F5;
  }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  /* ── Header Navigation ── */
  .header-nav {
    position: relative; z-index: 5; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 12px; background: #F5F5F5;
  }
  .back-btn {
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer; transition: all 0.2s;
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title {
    color: var(--On-Surface); font-family: 'Switzer', sans-serif;
    font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center;
  }
  .header-spacer { width: 36px; height: 36px; flex-shrink: 0; }

  /* ── Main Content ── */
  .main-content { padding: 8px 16px 24px; display: flex; flex-direction: column; flex: 1; width: 100%; }

  .section-label {
    color: var(--On-Surface); font-family: 'Switzer', sans-serif;
    font-size: 14px; font-weight: 600; margin: 16px 4px 10px;
  }

  /* ── Category Chips ── */
  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    flex: 1; min-width: 88px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px 8px; border-radius: 14px;
    background: #FFF; border: 1.5px solid var(--Border);
    cursor: pointer; transition: all 0.18s;
  }
  .chip svg { width: 22px; height: 22px; stroke: var(--On-Surface-Low); stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .chip span { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 12px; font-weight: 500; }
  .chip.selected { border-color: var(--Primary); background: #FFF1F2; }
  .chip.selected svg { stroke: var(--Primary); }
  .chip.selected span { color: var(--Primary); font-weight: 600; }

  /* ── Star Rating ── */
  .stars { display: flex; gap: 10px; padding: 4px; }
  .star { cursor: pointer; transition: transform 0.12s; }
  .star:active { transform: scale(0.9); }
  .star svg { width: 34px; height: 34px; stroke: #D0D0D5; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .star.active svg { stroke: #FFB400; fill: #FFB400; }

  /* ── Message ── */
  .message-wrap {
    background: #FFF; border: 1.5px solid var(--Border); border-radius: 14px;
    padding: 12px 14px; transition: border-color 0.2s;
  }
  .message-wrap:focus-within { border-color: var(--Primary); }
  .message-input {
    width: 100%; border: none; outline: none; resize: none; background: transparent;
    font-family: 'Switzer', sans-serif; font-size: 14px; color: var(--On-Surface);
    min-height: 96px; line-height: 1.55;
  }
  .message-input::placeholder { color: #B8B8BF; }
  .char-count { text-align: right; color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 11px; margin-top: 6px; }

  /* ── Submit ── */
  .bottom-area { margin-top: auto; padding-top: 18px; }
  .btn-primary {
    width: 100%; height: 50px; border-radius: 14px;
    background: var(--Primary); color: #FFF1F2;
    font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500;
    border: none; cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(254,53,61,0.25);
  }
  .btn-primary:hover { background: #E5303A; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(254,53,61,0.35); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { background: #E0E0E0; color: #7C7C87; box-shadow: none; cursor: default; pointer-events: none; }

  /* ── Success State ── */
  .success-view {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; flex: 1; padding: 40px 24px;
  }
  .success-view.show { display: flex; }
  .success-icon {
    width: 88px; height: 88px; border-radius: 50%;
    background: #EAFBEE; display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
  }
  .success-icon svg { width: 44px; height: 44px; stroke: var(--Success); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .success-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 12px; }
  .success-desc { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 14px; line-height: 1.6; max-width: 260px; margin-bottom: 28px; }
  .btn-done {
    width: 100%; height: 50px; border-radius: 14px; border: 1.5px solid var(--Border);
    background: #FFF; color: var(--On-Surface);
    font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  }
  .btn-done:hover { background: #F5F5F5; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="app-content">

    <!-- Status Bar -->
    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.55a11 11 0 0 1 14.08 0" stroke="#1C1C21" stroke-width="1.5" stroke-linecap="round"/><path d="M1.42 9a16 16 0 0 1 21.16 0" stroke="#1C1C21" stroke-width="1.5" stroke-linecap="round"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0" stroke="#1C1C21" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="20" x2="12.01" y2="20" stroke="#1C1C21" stroke-width="2" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <!-- Header Navigation -->
    <div class="header-nav">
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title">Feedback</span>
      <div class="header-spacer"></div>
    </div>

    <!-- Form View -->
    <div class="main-content" id="formView">

      <p class="section-label" style="margin-top:8px;">What's on your mind?</p>
      <div class="chips" id="chips">
        <div class="chip" data-type="Complaint" onclick="selectChip(this)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Complaint</span>
        </div>
        <div class="chip" data-type="Suggestion" onclick="selectChip(this)">
          <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
          <span>Suggestion</span>
        </div>
        <div class="chip" data-type="Compliment" onclick="selectChip(this)">
          <svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
          <span>Compliment</span>
        </div>
      </div>

      <p class="section-label">Rate your experience</p>
      <div class="stars" id="stars">
        <div class="star" data-val="1" onclick="setRating(1)"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
        <div class="star" data-val="2" onclick="setRating(2)"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
        <div class="star" data-val="3" onclick="setRating(3)"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
        <div class="star" data-val="4" onclick="setRating(4)"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
        <div class="star" data-val="5" onclick="setRating(5)"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
      </div>

      <p class="section-label">Tell us more</p>
      <div class="message-wrap">
        <textarea class="message-input" id="message" maxlength="500" placeholder="Describe your feedback, complaint, or suggestion…" oninput="updateCount()"></textarea>
      </div>
      <div class="char-count"><span id="count">0</span>/500</div>

      <div class="bottom-area">
        <button class="btn-primary" id="submitBtn" disabled onclick="submitFeedback()">Submit Feedback</button>
      </div>
    </div>

    <!-- Success View -->
    <div class="success-view" id="successView">
      <div class="success-icon">
        <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <h2 class="success-title">Thank you!</h2>
      <p class="success-desc">Your feedback has been submitted. We use it to keep improving M-PESA Lehulum.</p>
      <button class="btn-done" onclick="goBack()">Done</button>
    </div>

  </div>
</div>

<script>
  let selectedType = null;
  let rating = 0;

  function selectChip(el) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedType = el.dataset.type;
    refreshSubmit();
  }

  function setRating(val) {
    rating = val;
    document.querySelectorAll('.star').forEach(s => {
      s.classList.toggle('active', Number(s.dataset.val) <= val);
    });
    refreshSubmit();
  }

  function updateCount() {
    const msg = document.getElementById('message');
    document.getElementById('count').textContent = msg.value.length;
    refreshSubmit();
  }

  function refreshSubmit() {
    const hasMsg = document.getElementById('message').value.trim().length > 0;
    document.getElementById('submitBtn').disabled = !(selectedType && rating > 0 && hasMsg);
  }

  function submitFeedback() {
    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').classList.add('show');
  }

  function goBack() {
    if (document.referrer) { window.history.back(); }
    else { window.location.href = 'Account.html'; }
  }
</script>

<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
