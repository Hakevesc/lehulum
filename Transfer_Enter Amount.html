<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer to Bank - Enter Amount</title>
<style>
    @import url("styles/component-keypad.css");
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --Primary-Dark: #C41520;
    --Primary-Darker: #A41016;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Surface-Container: #FCFCFC;
    --Gray-0: #FFF;
    --On-Primary: #FFF1F2;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
    --Success: #1FC83B;
    --Success-Light: #E8F9EC;
    --Warning: #FF9800;
    --Warning-Light: #FFF8E1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .phone-frame {
    width: 360px;
    height: 780px;
    background: var(--Background);
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
  }

  .app-content {
    height: 100%;
    overflow-y: auto;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .app-content::-webkit-scrollbar { width: 0; }

  /* ===== RED GRADIENT HEADER ===== */
  .top-red {
    position: relative;
    background: linear-gradient(155deg, #9E0E14 0%, #D81E26 45%, #FE353D 100%);
    border-radius: 0 0 28px 28px;
    padding-bottom: 46px;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 14px 24px 8px;
  }
  .status-bar .time { font-size: 14px; font-weight: 600; color: #FFF; }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px 4px;
  }
  .back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.15); }
  .back-btn svg { width: 22px; height: 22px; stroke: #FFF; stroke-width: 1.8px; }

  .header-title {
    color: #FFF;
    font-family: 'Switzer', sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.3px;
    flex: 1;
    text-align: center;
  }

  .amount-area { text-align: center; padding: 26px 0 16px; }
  .amount-display { display: flex; align-items: baseline; justify-content: center; gap: 8px; }
  .amount-value {
    font-family: 'Switzer', sans-serif;
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
    color: #FFF;
  }
  .amount-caret { width: 3px; height: 42px; background: #FFF; border-radius: 2px; align-self: center; animation: caret-blink 1s step-end infinite; }
  @keyframes caret-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .amount-currency { font-family: 'Switzer', sans-serif; font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.85); }

  /* Recipient pill straddling the boundary */
  .recipient-pill {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translate(-50%, 50%);
    display: flex;
    align-items: center;
    gap: 10px;
    background: #FFF;
    border-radius: 16px;
    padding: 8px 16px 8px 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.10);
    white-space: nowrap;
    max-width: 88%;
  }
  .recipient-pill .logo { width: 34px; height: 34px; border-radius: 9px; overflow: hidden; background: #F5F5F5; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .recipient-pill .logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
  .recipient-pill .info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .recipient-pill .nm { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .recipient-pill .sub { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 11.5px; }

  /* ===== LOWER (light) CONTENT ===== */
  .lower-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 38px 20px 18px;
    gap: 12px;
  }

  /* Inline message */
  .msg { display: none; align-items: center; justify-content: center; gap: 6px; min-height: 18px; }
  .msg.show { display: flex; }
  .msg svg { width: 14px; height: 14px; flex-shrink: 0; fill: none; stroke-width: 2; }
  .msg .txt { font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 500; }
  .msg.warn svg { stroke: var(--Primary); }
  .msg.warn .txt { color: var(--Primary); }
  .msg.info svg { stroke: var(--Warning); }
  .msg.info .txt { color: #9a6a00; }

  /* Fee line */
  .fee-line { display: none; align-items: center; justify-content: center; gap: 6px; }
  .fee-line.show { display: flex; }
  .fee-line .fee-label { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 400; }
  .fee-line svg { width: 13px; height: 13px; color: var(--On-Surface-Low); }

  /* Funding account selector */
  .funding-title { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }
  .funding-selector { display: flex; gap: 10px; }
  .fund-option {
    flex: 1; background: #FFF; border: 1.5px solid var(--Border); border-radius: 14px;
    padding: 11px 12px; cursor: pointer; transition: all 0.18s; position: relative;
    display: flex; flex-direction: column; gap: 3px;
  }
  .fund-option.selected { border-color: var(--Primary); background: #FFF7F7; box-shadow: 0 2px 10px rgba(254,53,61,0.12); }
  .fund-option.disabled { opacity: 0.55; cursor: not-allowed; background: #FAFAFA; }
  .fund-option .fo-top { display: flex; align-items: center; justify-content: space-between; }
  .fund-option .fo-name { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 600; }
  .fund-option .fo-bal { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 12px; font-weight: 500; }
  .fund-option .radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--Border); flex-shrink: 0; transition: all 0.18s; }
  .fund-option.selected .radio { border-color: var(--Primary); background: radial-gradient(circle, var(--Primary) 0 5px, transparent 6px); }
  .fund-option .fo-tag { color: var(--Primary); font-family: 'Switzer', sans-serif; font-size: 10px; font-weight: 600; display: none; }
  .fund-option.disabled .fo-tag { display: block; }

  /* Inline insufficient-balance notice (shown under "Pay from" instead of a separate screen) */
  .insuf-notice {
    display: none; flex-direction: column; gap: 10px;
    background: #FFF1F2; border: 1px solid #FCD9DB; border-radius: 14px;
    padding: 13px 14px;
  }
  .insuf-notice.show { display: flex; }
  .insuf-notice .in-head { display: flex; align-items: center; gap: 8px; }
  .insuf-notice .in-head svg { width: 18px; height: 18px; stroke: var(--Primary); stroke-width: 1.9; fill: none; flex-shrink: 0; }
  .insuf-notice .in-title { color: var(--Primary-Dark); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 600; }
  .insuf-notice .in-row { display: flex; justify-content: space-between; align-items: center; }
  .insuf-notice .in-row .lbl { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 12px; }
  .insuf-notice .in-row .val { color: var(--Primary); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 700; }
  .insuf-notice .in-topup {
    align-self: flex-start; background: none; border: none; padding: 2px 0; cursor: pointer;
    color: var(--Primary); font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 600;
    text-decoration: underline; text-underline-offset: 2px;
  }

  .keypad { margin-top: auto; }

  .transfer-btn {
    height: 50px;
    border-radius: 14px;
    border: none;
    background: #E0E0E0;
    color: var(--On-Surface-Low);
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: not-allowed;
    transition: all 0.2s;
    margin-top: 12px;
  }
  .transfer-btn.active { background: var(--Primary); color: #FFF; cursor: pointer; box-shadow: 0 4px 16px rgba(254, 53, 61, 0.25); }
  .transfer-btn.active:hover { background: #E5303A; box-shadow: 0 6px 20px rgba(254, 53, 61, 0.35); transform: translateY(-1px); }
  .transfer-btn.active:active { transform: scale(0.98) translateY(0); }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="app-content">

    <!-- ===== RED GRADIENT HEADER ===== -->
    <div class="top-red">
      <div class="status-bar">
        <span class="time">10:00</span>
        <div class="status-icons">
          <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#FFF"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#FFF"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#FFF"/></svg>
          <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#FFF"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#FFF"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#FFF"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#FFF" opacity="0.45"/></svg>
          <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#FFF" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#FFF"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#FFF"/></svg>
        </div>
      </div>

      <div class="header-nav">
        <button class="back-btn" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <span class="header-title">Transfer to Bank</span>
        <div style="width: 36px;"></div>
      </div>

      <div class="amount-area">
        <div class="amount-display">
          <span class="amount-value" id="amountValue">0.00</span>
          <span class="amount-caret"></span>
          <span class="amount-currency">ETB</span>
        </div>
      </div>

      <!-- Recipient pill (straddles the boundary) -->
      <div class="recipient-pill">
        <div class="logo"><img id="recipientLogo" src="assets/banks logo/cbe-logo.png" alt="Bank" onerror="this.style.display='none'"></div>
        <div class="info">
          <span class="nm" id="recipientName">Kidist Birhanu</span>
          <span class="sub"><span id="recipientBank">CBE</span> &bull; <span id="recipientAccount">****4341</span></span>
        </div>
      </div>
    </div>

    <!-- ===== LOWER CONTENT ===== -->
    <div class="lower-content">

      <!-- Inline message -->
      <div class="msg" id="msg">
        <svg id="msgIcon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span class="txt" id="msgText"></span>
      </div>

      <!-- Fee -->
      <div class="fee-line" id="feeLine">
        <span class="fee-label">Fee <span id="feeVal">25.00</span> ETB</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      </div>

      <!-- Funding account -->
      <span class="funding-title">Pay from</span>
      <div class="funding-selector">
        <div class="fund-option selected" id="optMain" onclick="selectAccount('main')">
          <div class="fo-top">
            <span class="fo-name">Main Account</span>
            <span class="radio"></span>
          </div>
          <span class="fo-bal">12,580.00 ETB</span>
          <span class="fo-tag">Low balance</span>
        </div>
        <div class="fund-option" id="optReward" onclick="selectAccount('reward')">
          <div class="fo-top">
            <span class="fo-name">Reward Account</span>
            <span class="radio"></span>
          </div>
          <span class="fo-bal">800.00 ETB</span>
          <span class="fo-tag">Low balance</span>
        </div>
      </div>

      <!-- Insufficient balance — handled inline (no separate screen) -->
      <div class="insuf-notice" id="insufNotice">
        <div class="in-head">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span class="in-title">Not enough balance in either account</span>
        </div>
        <div class="in-row">
          <span class="lbl">Amount needed (incl. fee)</span>
          <span class="val" id="inNeeded">— ETB</span>
        </div>
        <button class="in-topup" onclick="window.location.href='Lehulum Home.html'">Top up my wallet</button>
      </div>

      <!-- Keypad -->
      <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key empty"></button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key delete" onclick="deleteKey()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
      </div>

      <button class="transfer-btn" id="transferBtn" onclick="continueTransfer()" disabled>Continue</button>

    </div>

  </div>
</div>

<script>
  // ── Limits & balances (PRD demo values) ──
  const MIN = 1.00;
  const MAX_TXN = 50000.00;
  const DAILY_REMAINING = 100000.00;
  const MAIN = 12580.00;
  const REWARD = 800.00;
  const FEE = 25.00;          // bank transfer fee

  let currentAmount = 0.00;
  let selectedAccount = 'main';

  function formatNumber(num) {
    return num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function setMsg(kind, text) {
    const msg = document.getElementById('msg');
    if (!kind) { msg.classList.remove('show'); return; }
    msg.classList.remove('warn', 'info');
    msg.classList.add('show', kind);
    document.getElementById('msgText').textContent = text;
  }

  function showInsuf(show, neededText) {
    const n = document.getElementById('insufNotice');
    n.classList.toggle('show', !!show);
    if (show && neededText) document.getElementById('inNeeded').textContent = neededText;
  }

  function selectAccount(acct) {
    const opt = document.getElementById(acct === 'main' ? 'optMain' : 'optReward');
    if (opt.classList.contains('disabled')) return;
    selectedAccount = acct;
    updateDisplay();
  }

  function updateDisplay() {
    const btn = document.getElementById('transferBtn');
    const feeLine = document.getElementById('feeLine');
    const optMain = document.getElementById('optMain');
    const optReward = document.getElementById('optReward');

    document.getElementById('amountValue').textContent = formatNumber(currentAmount);

    const canMain = currentAmount <= MAIN;
    const canReward = currentAmount <= REWARD;

    optMain.classList.toggle('disabled', currentAmount > 0 && !canMain);
    optReward.classList.toggle('disabled', currentAmount > 0 && !canReward);

    if (currentAmount > 0) {
      if (selectedAccount === 'main' && !canMain && canReward) selectedAccount = 'reward';
      else if (selectedAccount === 'reward' && !canReward && canMain) selectedAccount = 'main';
    }
    optMain.classList.toggle('selected', selectedAccount === 'main');
    optReward.classList.toggle('selected', selectedAccount === 'reward');

    let valid = false;
    feeLine.classList.remove('show');
    showInsuf(false);

    if (currentAmount === 0) {
      setMsg(null);
    } else if (currentAmount < MIN) {
      setMsg('warn', 'Minimum transfer is ' + formatNumber(MIN) + ' ETB');
    } else if (currentAmount > MAX_TXN) {
      setMsg('warn', 'Above per-transaction limit (' + formatNumber(MAX_TXN) + ' ETB)');
      valid = true;
    } else if (currentAmount > DAILY_REMAINING) {
      setMsg('warn', 'Exceeds remaining daily limit');
      valid = true;
    } else if (!canMain && !canReward) {
      // Insufficient in both → tell the user inline, keep Continue disabled
      setMsg(null);
      showInsuf(true, formatNumber(currentAmount + FEE) + ' ETB');
    } else if (!canMain || !canReward) {
      const using = selectedAccount === 'main' ? 'Main' : 'Reward';
      setMsg('info', 'Using ' + using + ' Account (other is low)');
      feeLine.classList.add('show');
      valid = true;
    } else {
      setMsg(null);
      feeLine.classList.add('show');
      valid = true;
    }

    btn.classList.toggle('active', valid);
    btn.disabled = !valid;
  }

  function pressKey(key) {
    const s = currentAmount.toString();
    const di = s.indexOf('.');
    if (di !== -1 && s.length - di >= 3) return;
    if (s.endsWith('.0') && key === '0') return;
    if (currentAmount === 0 && key === '0') return;
    currentAmount = currentAmount === 0 ? parseFloat(key) : parseFloat(s + key);
    updateDisplay();
  }

  function deleteKey() {
    const s = currentAmount.toString();
    currentAmount = s.length === 1 ? 0.00 : parseFloat(s.slice(0, -1));
    updateDisplay();
  }

  function continueTransfer() {
    if (currentAmount < MIN) return;

    if (currentAmount > MAX_TXN) {
      sessionStorage.setItem('sendAmount', formatNumber(currentAmount));
      sessionStorage.setItem('limitType', 'transaction');
      window.location.href = 'Transfer_Limit Exceeded.html';
      return;
    }
    if (currentAmount > DAILY_REMAINING) {
      sessionStorage.setItem('sendAmount', formatNumber(currentAmount));
      sessionStorage.setItem('limitType', 'daily');
      window.location.href = 'Transfer_Limit Exceeded.html';
      return;
    }
    // Insufficient balance is handled inline (insuf-notice); never continue here.
    if (currentAmount > MAIN && currentAmount > REWARD) return;

    sessionStorage.setItem('sendAmount', formatNumber(currentAmount));
    sessionStorage.setItem('sendFee', formatNumber(FEE));
    sessionStorage.setItem('sendTotal', formatNumber(currentAmount + FEE));
    sessionStorage.setItem('sendAccount', selectedAccount);
    window.location.href = 'Transfer_Confirmation.html';
  }

  function goBack() { history.back(); }

  // Populate recipient resolved earlier (bank rail)
  (function loadTarget() {
    let target = null;
    try { target = JSON.parse(sessionStorage.getItem('sendTarget') || 'null'); } catch (e) {}
    if (!target) return;
    if (target.holder) document.getElementById('recipientName').textContent = target.holder;
    if (target.name) document.getElementById('recipientBank').textContent = target.name;
    if (target.account) document.getElementById('recipientAccount').textContent = target.account;
    if (target.logo) {
      const logo = document.getElementById('recipientLogo');
      logo.src = target.logo; logo.alt = target.name || ''; logo.style.display = '';
    }
  })();

  document.getElementById('feeVal').textContent = formatNumber(FEE);

  document.addEventListener('keydown', function (e) {
    if (e.key >= '0' && e.key <= '9') pressKey(e.key);
    else if (e.key === 'Backspace') deleteKey();
    else if (e.key === 'Enter') continueTransfer();
  });

  updateDisplay();
</script>

<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
</body>
</html>
