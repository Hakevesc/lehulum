<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saving — M-PESA</title>
<link rel="stylesheet" href="styles/design-tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/component-status-bar.css">
<link rel="stylesheet" href="styles/component-sc-card.css">
<link rel="stylesheet" href="styles/savings.css">
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap');

  /* One saving pocket (?id=). Hero card (balance, goal progress + status, days
     left, interest), Deposit / Withdraw, the goal (set / change), transactions,
     and ⋯ → Close saving (money back to the wallet). */
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .act { height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 14px; font-family: Switzer, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
  .act svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .act.dep { background: var(--Primary); color: #FFF; box-shadow: 0 4px 14px rgba(254,53,61,0.25); }
  .act.wd { background: #FFF; color: var(--Primary); border: 1.5px solid var(--Primary); }
  .act:disabled { opacity: 0.45; cursor: default; }
  .goal { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .goal i { width: 40px; height: 40px; border-radius: 12px; background: #FFF1F2; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .goal i svg { width: 21px; height: 21px; stroke: var(--Primary); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .goal span { flex: 1; min-width: 0; }
  .goal b { display: block; font-size: 13.5px; font-weight: 600; color: var(--On-Surface); }
  .goal small { display: block; margin-top: 2px; font-size: 12px; color: var(--On-Surface-Low); }
  .goal .cv { width: 16px; height: 16px; stroke: #8A8A94; stroke-width: 2.2; fill: none; }
  .tx { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
  .tx + .tx { border-top: 1px solid #F4F4F6; }
  .tx .ic { width: 38px; height: 38px; border-radius: 12px; background: #FFE4E5; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tx .ic svg { width: 17px; height: 17px; stroke: var(--Primary); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .tx .inf { flex: 1; min-width: 0; }
  .tx .inf b { display: block; font-size: 13.5px; font-weight: 500; color: var(--On-Surface); }
  .tx .inf small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--On-Surface-Low); }
  .tx .amt { font-size: 13.5px; font-weight: 700; color: #16A34A; white-space: nowrap; }
  .tx.out .amt { color: var(--Primary); }
  .no-tx { padding: 14px 0 6px; text-align: center; font-size: 12.5px; color: var(--On-Surface-Low); }
  .menu-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 4px; border: none; background: none; text-align: left; cursor: pointer; font-family: Switzer, sans-serif; }
  .menu-item i { width: 38px; height: 38px; border-radius: 11px; background: #FFF1F2; display: flex; align-items: center; justify-content: center; }
  .menu-item i svg { width: 19px; height: 19px; stroke: var(--Primary); stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .menu-item b { flex: 1; font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .cl-ic { width: 60px; height: 60px; margin: 4px auto 12px; border-radius: 18px; background: #FFF1F2; display: flex; align-items: center; justify-content: center; }
  .cl-ic svg { width: 28px; height: 28px; stroke: var(--Primary); stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .cl-t { text-align: center; font-size: 17px; font-weight: 700; color: var(--On-Surface); }
  .cl-p { margin: 6px auto 14px; max-width: 280px; text-align: center; font-size: 13px; line-height: 1.5; color: var(--On-Surface-Low); }
  .cl-row { display: flex; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: #FFF6F6; font-size: 13px; color: #55555E; margin-bottom: 14px; }
  .cl-row b { color: var(--On-Surface); font-size: 15px; }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span class="time">10:00</span>
    <div class="status-icons">
      <svg data-name="icon-wifi" viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
      <svg data-name="icon-signal" viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
      <svg data-name="icon-battery" viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
    </div>
  </div>

  <div class="app-content">
    <div class="header-nav">
      <button class="icon-btn" onclick="location.href='Savings.html'" aria-label="Back"><svg data-name="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <span class="header-title" id="hTitle">Saving</span>
      <button class="icon-btn" onclick="openSheet('menu')" aria-label="Menu"><svg data-name="icon-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></button>
    </div>

    <div class="sc-card" id="hero"><svg class="art" viewBox="0 0 128 112" aria-hidden="true">
          <defs><linearGradient id="pigG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B70"/><stop offset="1" stop-color="#E0262D"/></linearGradient>
          <linearGradient id="coinG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#F2B233"/></linearGradient></defs>
          <ellipse cx="66" cy="98" rx="46" ry="10" fill="#8E0D12" opacity="0.18"/><ellipse cx="66" cy="92" rx="44" ry="9" fill="#C2161D"/>
          <path d="M28 68c0-16 16-28 38-28s38 12 38 28c0 10-7 18-17 22H45c-10-4-17-12-17-22z" fill="url(#pigG)"/><path d="M40 46l-4-12 14 7z" fill="#E0262D"/>
          <ellipse cx="102" cy="66" rx="9" ry="8" fill="#FF8A8E"/><circle cx="99" cy="65" r="1.6" fill="#B3131A"/><circle cx="105" cy="65" r="1.6" fill="#B3131A"/><circle cx="86" cy="56" r="2.6" fill="#5A0A0E"/>
          <rect x="52" y="44" width="18" height="3.5" rx="1.75" fill="#B3131A"/><rect x="44" y="84" width="9" height="10" rx="3" fill="#C2161D"/><rect x="78" y="84" width="9" height="10" rx="3" fill="#C2161D"/>
          <circle cx="61" cy="24" r="14" fill="url(#coinG)"/><circle cx="61" cy="24" r="10" fill="none" stroke="#E09A1F" stroke-width="1.6"/><path d="M61 18v12M58 21h4.5a2 2 0 0 1 0 4H58" fill="none" stroke="#C47D10" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      <div class="s-label"><span id="pName"></span></div>
      <div class="s-amount"><span id="pBal"></span><small>ETB</small></div>
      <div id="pGoal"></div>
    </div>
    <div class="rbtns" id="acts"></div>
    <div class="card goal" id="goalCard"></div>
    <div class="card"><div class="sec-head" style="margin:0 0 4px"><b>Transactions</b></div><div id="txs"></div></div>
  </div>

  <div class="scrim" id="scrim" onclick="closeSheets()"></div>
  <div class="sheet" id="menu" role="dialog" aria-label="Saving menu">
    <div class="sheet-grip"></div>
    <button class="menu-item" onclick="askClose()"><i><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></i><b>Close Saving</b></button>
  </div>
  <div class="sheet" id="closeSheet" role="dialog" aria-label="Close saving">
    <div class="sheet-grip"></div>
    <div class="cl-ic"><svg viewBox="0 0 24 24"><path d="M19 9.5a6 6 0 0 0-6-4H10a6 6 0 0 0-6 6c0 2 1 3.6 2.5 4.6V19h3v-2h3.5v2h3v-2.6A5.6 5.6 0 0 0 19 14h2v-4z"/></svg></div>
    <p class="cl-t">Close this saving?</p>
    <p class="cl-p" id="clText"></p>
    <div class="cl-row"><span>Sent to your M-PESA wallet</span><b id="clAmt"></b></div>
    <button class="btn-primary" onclick="confirmClose()">Close Saving</button>
    <button class="btn-ghost" onclick="closeSheets()">Not Now</button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="savings-store.js"></script>
<script src="savings-ui.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const fmt = SV.fmt;
  let tt;
  function toast(m) { const t = $('toast'); if (!t) return; t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2000); }
  const IC = {
    target: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>',
    individual: '<svg viewBox="0 0 24 24"><path d="M19 9.5a6 6 0 0 0-6-4H10a6 6 0 0 0-6 6c0 2 1 3.6 2.5 4.6V19h3v-2h3.5v2h3v-2.6A5.6 5.6 0 0 0 19 14h2v-4z"/><path d="M15.5 10h.01"/></svg>',
    cal: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'
  };
  const S = SV.load();
  const p = S.pockets.find(x => x.id === new URLSearchParams(location.search).get('id')) || S.pockets[0];
  const bal = SV.balanceOf(p), intr = SV.interestOf(p), st = SV.statusOf(p);
  $('hTitle').textContent = p.kind === 'target' ? 'Target Saving' : 'Individual Saving';
  $('pName').textContent = p.name;
  $('pBal').textContent = fmt(bal);
  $('pGoal').innerHTML = p.target
    ? `<div class="s-row"><div><span>Goal</span><b>${fmt(p.target.amount)}<small>ETB</small></b></div><span class="chip ${st.key}">${st.label}</span></div>
       <div class="s-bar"><i style="width:${Math.max(2, SV.pctOf(p))}%"></i></div>
       <p class="s-note">${SV.daysLeft(p)} days left · by ${SV.dateStr(p.target.by)} · +${fmt(intr)} ETB interest</p>`
    : `<div class="s-stats"><div class="s-stat"><small>Interest earned</small><b class="up">+${fmt(intr)}</b></div><div class="s-stat"><span class="split" data-shape="line" data-name="line"></span><small>Rate</small><b>${SV.RATE}% a year</b></div></div>`;
  // Target card: the target (tap to change it), or an invitation to set one — both open Savings - Target
  $('goalCard').innerHTML = (p.target
    ? `<i>${IC.target}</i><span><b>Target · ${fmt(p.target.amount)} ETB</b><small>By ${SV.dateStr(p.target.by)}. Tap to change it.</small></span>`
    : `<i>${IC.target}</i><span><b>It's easier with a target</b><small>Set up a goal and achieve your results faster</small></span>`)
    + '<svg class="cv" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
  $('goalCard').onclick = () => location.href = `Savings - Target.html?id=${p.id}`;
  // Deposit · Recurring Transfer · Withdraw
  $('acts').innerHTML = SVUI.roundActions([
    { label: 'Deposit', ic: 'plus', kind: 'main', onclick: "move('deposit')" },
    SVUI.recurring(p.auto, `Savings - Auto Save.html?id=${p.id}`),
    { label: 'Withdraw', ic: 'down', onclick: "move('withdraw')", disabled: bal <= 0 }
  ]);

  const IN = '<svg viewBox="0 0 24 24"><path d="M17 7 7 17M15 17H7V9"/></svg>', OUT = '<svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>';
  $('txs').innerHTML = p.txns.length ? p.txns.slice().reverse().map(t => { const out = t.type === 'WITHDRAW';
    return `<div class="tx${out ? ' out' : ''}"><span class="ic">${out ? OUT : IN}</span><span class="inf"><b>${out ? 'Withdrawn to wallet' : t.auto ? 'Auto-save from wallet' : t.by === 'fd' ? 'From a fixed deposit' : 'Deposit from wallet'}</b><small>${SV.dateStr(t.on)}</small></span><span class="amt">${out ? '-' : '+'}${fmt(t.amount)}</span></div>`; }).join('')
    : '<p class="no-tx">No transactions yet</p>';

  function move(kind) { location.href = `Savings - Amount.html?id=${p.id}&kind=${kind}`; }
  function openSheet(id) { $('scrim').classList.add('show'); $(id).classList.add('show'); }
  function closeSheets() { $('scrim').classList.remove('show'); document.querySelectorAll('.sheet').forEach(s => s.classList.remove('show')); }
  function askClose() {
    closeSheets();
    const total = bal + intr;
    $('clText').textContent = `Your balance${intr >= 0.01 ? ` and ${fmt(intr)} ETB interest` : ''} ${intr >= 0.01 ? 'go' : 'goes'} to your M-PESA wallet, and ${p.name} is removed.`;
    $('clAmt').textContent = fmt(total) + ' ETB';
    setTimeout(() => openSheet('closeSheet'), 120);
  }
  function confirmClose() {
    sessionStorage.setItem('termLoanData', JSON.stringify({ kind: 'sav-close', title: 'Close ' + p.name, id: p.id, name: p.name, amount: Math.round((bal + intr) * 100) / 100,
      back: 'Savings - Pocket.html?id=' + p.id, next: 'Savings - Done.html' }));
    location.href = 'Term Loan - Enter PIN.html';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });
  const done = new URLSearchParams(location.search).get('done');
  if (done) setTimeout(() => toast({ deposit: 'Money added to your saving', withdraw: 'Money sent to your M-PESA wallet', auto: 'Auto-save is on', autostop: 'Auto-save stopped', target: 'Target saved', untarget: 'Target removed' }[done] || 'Done'), 300);
</script>
<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
