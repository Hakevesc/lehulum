<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw Cash - Insufficient Balance</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root { --Primary: #FE353D; --On-Surface: #1C1C21; --On-Surface-Low: #7C7C87; --Border: #E8E8EC; --Background: #F5F5F5; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
  .app-content { height: 100%; display: flex; flex-direction: column; }
  .status-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 24px 8px; background: var(--Background); }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }
  .header-nav { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); }
  .back-btn { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; transition: all 0.2s; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .result-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 24px; text-align: center; }
  .result-icon { width: 92px; height: 92px; border-radius: 26px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; background: #FFF1F2; box-shadow: 0 4px 20px rgba(254,53,61,0.15); }
  .result-icon svg { width: 44px; height: 44px; stroke: var(--Primary); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .result-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  .result-desc { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 14px; line-height: 1.6; max-width: 286px; }

  .balance-card { margin-top: 22px; width: 100%; background: #FFF; border: 1px solid var(--Border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .balance-row { display: flex; justify-content: space-between; align-items: center; }
  .balance-row .label { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 13px; }
  .balance-row .amt { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 600; }
  .balance-row.total { border-top: 1px dashed var(--Border); padding-top: 12px; }
  .balance-row.total .label { color: var(--On-Surface); font-weight: 600; }
  .balance-row.total .amt { color: var(--Primary); font-weight: 700; }

  .bottom-area { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 16px 24px 28px; gap: 12px; }
  .btn-primary { width: 100%; height: 50px; border-radius: 14px; background: var(--Primary); color: #FFF1F2; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; box-shadow: 0 4px 16px rgba(254,53,61,0.2); transition: all 0.2s; }
  .btn-primary:hover { background: #E5303A; transform: translateY(-1px); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-link { border: none; background: none; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; color: var(--On-Surface); cursor: pointer; padding: 6px; }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="window.location.href='Withdraw Cash - Enter PIN.html'">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title">Insufficient Balance</span>
      <div style="width:36px;"></div>
    </div>

    <div class="result-body">
      <div class="result-icon">
        <svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
      </div>
      <h2 class="result-title">Insufficient Balance</h2>
      <p class="result-desc">Your wallet balance is not enough to cover this withdrawal. <b>No voucher was generated.</b> Lower the amount or top up your wallet to continue.</p>

      <div class="balance-card">
        <div class="balance-row"><span class="label">Main Account</span><span class="amt">12,580.00 ETB</span></div>
        <div class="balance-row"><span class="label">Reward Account</span><span class="amt">200.00 ETB</span></div>
        <div class="balance-row total"><span class="label">Amount needed</span><span class="amt" id="needed">— ETB</span></div>
        <div class="balance-row total" style="border-top:none;"><span class="label">Available</span><span class="amt" id="available">— ETB</span></div>
      </div>
    </div>

    <div class="bottom-area">
      <button class="btn-primary" onclick="lower()">Enter a Lower Amount</button>
      <button class="btn-link" onclick="topUp()">Top Up My Wallet</button>
    </div>

  </div>
</div>

<script>
  const data = JSON.parse(sessionStorage.getItem('withdrawData') || '{}');
  const fmt = n => parseFloat(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const total = parseFloat(data.total || data.amount || '0');
  const available = 12580 + 800;
  document.getElementById('needed').textContent = fmt(total) + ' ETB';
  document.getElementById('available').textContent = fmt(available) + ' ETB';

  function lower() {
    const m = (JSON.parse(sessionStorage.getItem('withdrawData') || '{}').method) || 'agent';
    window.location.href = m === 'atm'    ? 'Withdraw Cash - ATM Locator.html'
                         : m === 'nearby' ? 'Withdraw Cash - Agent Nearby.html'
                         :                  'Withdraw Cash - Agent Locator.html';
  }
  function topUp() { window.location.href = 'Lehulum Home.html'; }
</script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
