<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tariffs &amp; Fees</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap');

  /* Tariffs & Fees: red header, then grouped cards. Each service shows its fee
     pill (green Free / pink range); its fee-by-amount table is open by default; tapping the row folds it. */
  :root {
    --Primary: #FE353D;
    --Primary-Light: #FFF1F2;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Background: #F5F5F5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
  .app-content { height: 100%; overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: none; }
  .app-content::-webkit-scrollbar { width: 0; }

  /* ── Red header with soft circles ── */
  .tf-hero { position: relative; overflow: hidden; flex-shrink: 0; padding: 0 20px 28px; border-radius: 0 0 28px 28px;
    background: linear-gradient(115deg, #FF3B40 0%, #EE2A30 45%, #B7161C 100%); color: #FFF; }
  .tf-hero::before { content: ''; position: absolute; top: -40px; right: -70px; width: 260px; height: 260px; border-radius: 50%; background: rgba(255,255,255,0.07); }
  .tf-hero::after { content: ''; position: absolute; bottom: -120px; right: -10px; width: 230px; height: 230px; border-radius: 50%; background: rgba(0,0,0,0.12); }
  .tf-hero > * { position: relative; z-index: 1; }
  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 4px 8px; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: #FFF; }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }
  .tf-back { width: 36px; height: 36px; margin: 2px 0 0 -8px; border: none; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .tf-back:hover { background: rgba(255,255,255,0.14); }
  .tf-back svg { width: 22px; height: 22px; stroke: #FFF; stroke-width: 2.2; fill: none; }
  .tf-title { margin-top: 6px; font-family: 'Switzer', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.15; }
  .tf-sub { margin-top: 8px; font-family: 'Switzer', sans-serif; font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.92); max-width: 300px; }

  /* ── Groups ── */
  .main-content { padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 18px; }
  .group-label { margin: 0 4px 8px; font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 600; color: #8A8A94; }
  .fee-card { background: #FFF; border-radius: 18px; padding: 4px 16px; box-shadow: 0 4px 14px rgba(15,23,42,0.05); }
  .fee-row { display: flex; align-items: center; gap: 8px; padding: 14px 0; cursor: pointer; }
  .fee-card > .fee-row:not(:first-child) { border-top: 1px solid #ECECEF; }
  .fee-row:active { opacity: 0.85; }
  .fee-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--Primary-Light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .fee-icon svg { width: 22px; height: 22px; stroke: var(--Primary); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .fee-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .fee-name { font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 700; color: var(--On-Surface); line-height: 1.25; }
  .fee-sub { font-family: 'Switzer', sans-serif; font-size: 12px; color: #8A8A94; }
  .fee-value { flex-shrink: 0; padding: 4px 8px; border-radius: 999px; background: var(--Primary-Light); color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
  .fee-value.free { background: #E8F9EE; color: #16A34A; }
  .chev { width: 17px; height: 17px; stroke: var(--Primary); stroke-width: 2.2; fill: none; flex-shrink: 0; margin-left: -2px; transition: transform 0.2s ease; }
  .fee-row[aria-expanded="true"] .chev { transform: rotate(180deg); }

  /* ── Fee by amount band ── */
  .fee-panel { margin: 0 0 14px; padding: 10px 16px 6px; background: #F5F5F7; border-radius: 14px; animation: panelIn 0.2s ease; }
  .fee-panel[hidden] { display: none; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .band { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-top: 1px solid #E4E4E8; font-family: 'Switzer', sans-serif; font-size: 12px; color: #55555E; font-variant-numeric: tabular-nums; }
  .band.head { border-top: none; font-size: 11.5px; color: #8A8A94; }
  .band b { font-weight: 700; color: var(--On-Surface); }
  .band.head b { font-weight: 400; color: #8A8A94; }
  .band b.free { color: #16A34A; }
  /* Remark under a fee table (caps, who is charged, availability) */
  .band-note { padding: 9px 0 6px; border-top: 1px solid #E4E4E8; font-family: 'Switzer', sans-serif; font-size: 11.5px; line-height: 1.45; color: #8A8A94; }
  .disclaimer { display: flex; gap: 8px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: #ECECF0; font-family: 'Switzer', sans-serif; font-size: 11.5px; line-height: 1.55; color: var(--On-Surface-Low); }
  .disclaimer svg { width: 15px; height: 15px; stroke: var(--On-Surface-Low); stroke-width: 2; fill: none; flex-shrink: 0; margin-top: 1px; }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="tf-hero">
      <div class="status-bar">
        <span class="time">10:00</span>
        <div class="status-icons">
          <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#FFFFFF"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#FFFFFF"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#FFFFFF"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#FFFFFF" opacity="0.3"/></svg>
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.55a11 11 0 0 1 14.08 0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/><path d="M1.42 9a16 16 0 0 1 21.16 0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="20" x2="12.01" y2="20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#FFFFFF" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#FFFFFF"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#FFFFFF"/></svg>
        </div>
      </div>
      <button class="tf-back" onclick="goBack()" aria-label="Back">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <h1 class="tf-title">Tariffs &amp; Fees</h1>
      <p class="tf-sub">Applicable charges for M-PESA transactions. Fees vary by transaction amount band.</p>
    </div>

    <div class="main-content" id="groups"></div>
  </div>
</div>

<script>
  // Icons per group
  const ICONS = {
    transfer: '<svg viewBox="0 0 24 24"><path d="M4 8h15M15 4l4 4-4 4"/><path d="M20 16H5M9 12l-4 4 4 4"/></svg>',
    cash: '<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>',
    pay: '<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
    loan: '<svg viewBox="0 0 24 24"><path d="M3 10 12 4l9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/></svg>',
    globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>'
  };
  // Each service: its pill, its fee per amount band (or fee items), and any remark.
  // Figures follow the approved tariff table in the P1 requirements.
  const GROUPS = [
    { label: 'Transfers', items: [
      { icon: 'transfer', name: 'Send to M-PESA', sub: 'Person to person', pill: 'Free', bands: [['Any amount', 'Free']] },
      { icon: 'transfer', name: 'Send to Bank', sub: 'Per transaction', pill: '0.1% · max 5',
        bands: [['Any amount', '0.1%']], note: 'Capped at 5.00 ETB per transaction.' },
      { icon: 'transfer', name: 'EthSwitch Payment', sub: 'Interbank network', pill: 'Varies',
        bands: [['Any amount', 'EthSwitch tariff']], note: 'Charged as per the EthSwitch tariff.' }
    ]},
    { label: 'Cash', items: [
      { icon: 'cash', name: 'Withdraw at Agent', sub: 'Cash out', pill: '5 – 20 ETB',
        bands: [['25 – 500 ETB', '5.00 ETB'], ['501 – 1,000 ETB', '10.00 ETB'], ['Above 1,000 ETB', '20.00 ETB']] },
      { icon: 'cash', name: 'Withdraw at ATM', sub: 'Cardless', pill: '0.58%', bands: [['Any amount', '0.58%']] },
      { icon: 'cash', name: 'Cash In / Add Money', sub: 'Agent', pill: 'Free', bands: [['Any amount', 'Free']] }
    ]},
    { label: 'Payments', items: [
      { icon: 'pay', name: 'Merchant Payment', sub: 'Buy goods & services', pill: 'Free', bands: [['Any amount', 'Free']] },
      { icon: 'pay', name: 'Airtime Purchase', sub: 'Self & others', pill: 'Free', bands: [['Any amount', 'Free']] },
      { icon: 'pay', name: 'Online Payment', sub: 'Pay with M-PESA', pill: 'Free', bands: [['Any amount', 'Free']], note: 'Free for customers; the partner is charged.' },
      { icon: 'pay', name: 'Electric Utility (EEU)', sub: 'Per bill', pill: '1.00 ETB', bands: [['Any amount', '1.00 ETB']] },
      { icon: 'pay', name: 'Water Payment', sub: 'Per bill', pill: '0.5%', bands: [['Any amount', '0.5%']] },
      { icon: 'pay', name: 'Tax Payment', sub: 'Per payment', pill: '0.5% · max 5', bands: [['Any amount', '0.5%']], note: 'Capped at 5.00 ETB per payment.' },
      { icon: 'pay', name: 'School Payment', sub: 'School fees', pill: 'Free', bands: [['Any amount', 'Free']] }
    ]},
    { label: 'Loans', items: [
      { icon: 'loan', name: 'Errif Overdraft', sub: 'OD loan', pill: '3% access', head: ['Charge', 'Fee'],
        bands: [['Access fee', '3%'], ['Daily maintenance fee', '0 – 5.00 ETB'], ['Penalty (late repayment)', '0.5% / day']] },
      { icon: 'loan', name: 'Salary Advance', sub: '30 days · up to 20% of salary', pill: '4% access', head: ['Charge', 'Fee'],
        bands: [['Instalments', '1'], ['Access fee', '4%'], ['Daily maintenance fee', '0.15% / day'], ['Penalty (late repayment)', '0.5% / day']] },
      { icon: 'loan', name: 'Salary Advance', sub: '60 days · up to 35% of salary', pill: '4% access', head: ['Charge', 'Fee'],
        bands: [['Instalments', '2'], ['Access fee', '4%'], ['Daily maintenance fee', '0.15% / day'], ['Penalty (late repayment)', '0.5% / day']] }
    ]},
    { label: 'International', items: [
      { icon: 'globe', name: 'PayPal to M-PESA', sub: 'Receive from abroad', pill: '3%', bands: [['Any amount', '3%']], note: 'Charged to the customer. Coming soon.' },
      { icon: 'globe', name: 'UPESI', sub: 'International remittance', pill: '0.30 USD', bands: [['Per transaction', '0.30 USD']], note: 'Charged to the money transfer operator. Coming soon.' }
    ]}
  ];
  const CHEV = '<svg class="chev" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  const isFree = v => v === 'Free';

  document.getElementById('groups').innerHTML = GROUPS.map(g => `
    <section>
      <p class="group-label">${g.label}</p>
      <div class="fee-card">
        ${g.items.map(it => `
        <div class="fee-row" role="button" tabindex="0" aria-expanded="true" onclick="toggleFee(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleFee(this)}">
          <span class="fee-icon">${ICONS[it.icon]}</span>
          <span class="fee-info"><span class="fee-name">${it.name}</span><span class="fee-sub">${it.sub}</span></span>
          <span class="fee-value${isFree(it.pill) ? ' free' : ''}">${it.pill}</span>${CHEV}
        </div>
        <div class="fee-panel">
          <div class="band head"><span>${(it.head || ['Amount'])[0]}</span><b>Fee</b></div>
          ${it.bands.map(([a, f]) => `<div class="band"><span>${a}</span><b${isFree(f) ? ' class="free"' : ''}>${f}</b></div>`).join('')}
          ${it.note ? `<p class="band-note">${it.note}</p>` : ''}
        </div>`).join('')}
      </div>
    </section>`).join('') + `
    <div class="disclaimer">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span>Fees follow the latest approved tariff and may change. The exact charge is shown on the confirmation screen before you approve any transaction.</span>
    </div>`;

  // Every fee table starts open; tapping a row folds or unfolds just that one
  function toggleFee(row) {
    const open = row.getAttribute('aria-expanded') !== 'true';
    row.setAttribute('aria-expanded', String(open));
    row.nextElementSibling.hidden = !open;
  }

  function goBack() {
    if (document.referrer) { window.history.back(); }
    else { window.location.href = 'Account.html'; }
  }
</script>
<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
