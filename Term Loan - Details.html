<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Details</title>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap');

  /* Loan details: one hero card — lender and status, a repaid ring with what is
     left, disbursed / final due — Pay Next / Settle All, then the instalments as a timeline with status chips, and
     Repay All pinned to the bottom edge. Repay → the Repay screen (part or all) → M-PESA PIN → receipt.
     ?id=<loan> picks the loan. */
  :root {
    --Primary: #FE353D;
    --Primary-Light: #FFF1F2;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Background: #F5F5F5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Switzer, sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  button { font-family: inherit; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; background: var(--Background); flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }
  .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); flex-shrink: 0; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: rgba(0,0,0,0.05); }
  .icon-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .header-title { color: var(--On-Surface); font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { width: 0; }
  .scroll > * { flex-shrink: 0; }
  /* Hero actions: pay the next instalment, or settle the whole loan */
  /* Repay / Settle All close the instalment card */
  .pay-acts { display: flex; gap: 10px; margin-top: 18px; }
  .pay-acts button { flex: 1; min-width: 0; height: 44px; border-radius: 999px; font-family: Switzer, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .pay-acts button { height: 46px; font-size: 14px; }
  .pay-acts .next { border: none; background: var(--Primary); color: #FFF; box-shadow: 0 4px 12px rgba(254,53,61,0.25); }
  .pay-acts .all { border: 1.5px solid var(--Primary); background: #FFF; color: var(--Primary); }

  .card { background: #FFF; border-radius: 20px; padding: 16px; box-shadow: 0 4px 16px rgba(15,23,42,0.06); }
  .loan-head { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid #F1F1F4; }
  .logo { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #EFEFF2; background: #FFF; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .logo img { width: 34px; height: 34px; object-fit: contain; }
  .loan-head .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .loan-head b { font-size: 15px; font-weight: 700; color: var(--On-Surface); }
  .loan-head small { font-size: 12.5px; color: var(--On-Surface-Low); }
  .badge { flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.ok { background: #E8F9EE; color: #167C2A; }
  .badge.warn { background: #FEF3C7; color: #B45309; }
  .badge.done { background: #EDEDF0; color: #55555E; }
  .badge.part { background: #FFF1E6; color: #C2410C; }

  .lbl { font-size: 12px; color: var(--On-Surface-Low); }

  /* Hero: repaid ring + remaining */
  .hero-mid { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
  .ring { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring b { font-size: 19px; font-weight: 700; color: var(--On-Surface); line-height: 1; }
  .ring small { margin-top: 3px; font-size: 10.5px; color: var(--On-Surface-Low); }
  .left-amt b { display: block; margin-top: 2px; font-size: 24px; font-weight: 700; letter-spacing: -0.3px; color: var(--On-Surface); white-space: nowrap; }
  .left-amt b span { font-size: 12.5px; font-weight: 500; color: var(--On-Surface-Low); margin-left: 3px; }
  .left-amt p { margin-top: 4px; font-size: 12px; color: #55555E; }
  .left-amt p b { display: inline; font-size: 12px; font-weight: 600; color: #16A34A; letter-spacing: 0; }
  .badge.step { background: #16A34A; color: #FFF; }
  .badge.step::before { display: none; }
  .badge.step.warn { background: #F59E0B; }
  .badge.step.late { background: var(--Primary); }


  /* Loan facts */
  .facts { margin-top: 16px; padding-top: 14px; border-top: 1px solid #F1F1F4; display: flex; }
  .fact { position: relative; flex: 1; min-width: 0; }
  .fact .split { position: absolute; left: -8px; top: 2px; bottom: 2px; width: 1px; background: #ECECF0; }
  .fact + .fact { padding-left: 16px; }
  .fact + .fact .split { left: 0; }
  .fact b { display: block; margin-top: 3px; font-size: 13px; font-weight: 700; color: var(--On-Surface); white-space: nowrap; }
  .btn-red { flex-shrink: 0; height: 38px; padding: 0 18px; border: none; border-radius: 999px; background: var(--Primary); color: #FFF; font-family: Switzer, sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: 0 3px 10px rgba(254,53,61,0.25); }
  .btn-red:disabled { background: #C9C9CE; color: #FFF; box-shadow: none; cursor: default; }

  .title { font-size: 15px; font-weight: 600; color: var(--On-Surface); }
  .bar { margin-top: 12px; height: 8px; border-radius: 4px; background: #F1F1F4; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: #16A34A; }

  .sec-head { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px -2px; }
  .sec-head a { font-size: 12.5px; font-weight: 600; color: var(--Primary); cursor: pointer; }
  /* Instalment detail: every instalment stacked, the next one payable */
  /* Instalment timeline: a dot per instalment on a line — red for the next one,
     green when paid, grey to come — with a status chip and the amount */
  .tl { position: relative; padding: 4px 0 2px 22px; }
  .tl::before { content: ''; position: absolute; left: 5px; top: 12px; bottom: 30px; width: 2px; background: #ECECF0; }
  .inst { position: relative; }
  .inst + .inst { margin-top: 18px; }
  .inst .dot { position: absolute; left: -22px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #D0D0D6; box-shadow: 0 0 0 3px #FFF; }
  .inst.next .dot { background: var(--Primary); }
  .inst.paid .dot { background: #16A34A; }
  .inst-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .inst-top b { display: block; font-size: 14px; font-weight: 700; color: var(--On-Surface); }
  .inst-top small { display: block; margin-top: 3px; font-size: 12px; color: var(--On-Surface-Low); }
  .st { flex-shrink: 0; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .st.next { background: #FFF1F2; color: var(--Primary); }
  .st.late { background: var(--Primary); color: #FFF; }
  .st.up { background: #EDEDF0; color: #55555E; }
  .st.paid { background: #E8F9EE; color: #167C2A; }
  .st.part { background: #FFF1E6; color: #C2410C; }
  .inst .bar { margin-top: 10px; height: 8px; }
  .inst .bar i { background: var(--Primary); }
  .inst.paid .bar i { background: #16A34A; }
  .inst.partly .bar i { background: #F97316; }
  .inst-amt { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; font-size: 12.5px; color: var(--On-Surface-Low); }
  .inst-amt b { font-size: 14px; font-weight: 700; color: var(--On-Surface); }
  .part-line { margin-top: 8px; display: flex; justify-content: space-between; font-size: 12px; color: #55555E; }
  .part-line b { color: var(--On-Surface); font-weight: 700; }
  .part-line .pct { font-weight: 700; color: #C2410C; }
  .part-chip { margin-left: 6px; padding: 2px 8px; border-radius: 999px; background: #FFF1E6; color: #C2410C; font-style: normal; font-size: 10.5px; font-weight: 700; vertical-align: 1px; }
  .paid-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; color: #16A34A; }
  .paid-tag svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 3; fill: none; }

</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="icon-btn" onclick="location.href='Term Loan.html'" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <span class="header-title">Loan Details</span>
      <button class="icon-btn" onclick="location.href='Tariffs & Fees.html'" aria-label="Fees"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></button>
    </div>

    <div class="scroll" id="scroll"></div>
  </div>

</div>

<script src="term-loan-store.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const { fmt } = TL;
  const params = new URLSearchParams(location.search);
  const loans = TL.load();
  const loan = loans.find(l => l.id === params.get('id')) || TL.active(loans)[0] || loans[0];

  const CAL = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
  const TICK = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

  function render() {
    const paid = TL.paidOf(loan), left = TL.remainingOf(loan), nx = TL.nextDue(loan);
    const n = loan.instalments.length;
    const soon = nx && (new Date(nx.due) - Date.now()) < 5 * 864e5;
    const part = nx && TL.instPaid(nx) > 0;   // next instalment is part-paid
    const late = nx && new Date(nx.due) < Date.now();
    // Chip: which instalment is next ("1 of 2") — amber when due soon, red when overdue
    const chip = !nx ? ['done', 'Paid off'] : ['step' + (late ? ' late' : soon ? ' warn' : ''), `${nx.n} of ${n}`];
    const pct = Math.round(paid / loan.total * 100), C = 2 * Math.PI * 40;
    const unpaid = loan.instalments.filter(i => !i.paid).length;
    const n0 = v => fmt(v).replace(/\.00$/, '');
    $('scroll').innerHTML = `
      <div class="card">
        <div class="loan-head"><span class="logo"><img src="${loan.logo}" alt=""></span>
          <span class="info"><b>${loan.product}</b><small>${loan.lender}</small></span><span class="badge ${chip[0]}">${chip[1]}</span></div>

        <div class="hero-mid">
          <div class="ring">
            <svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="40" fill="none" stroke="#F1F1F4" stroke-width="9"/>
              ${pct ? `<circle cx="46" cy="46" r="40" fill="none" stroke="#16A34A" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(C * pct / 100).toFixed(1)} ${C.toFixed(1)}"/>` : ''}</svg>
            <div><b>${pct}%</b><small>Repaid</small></div>
          </div>
          <div class="left-amt"><span class="lbl">Left to repay</span><b>${fmt(left)}<span>ETB</span></b>
            <p><b>${fmt(paid)}</b> paid of ${fmt(loan.total)} ETB</p></div>
        </div>

        <div class="facts">
          <div class="fact"><span class="lbl">Disbursed Date</span><b>${TL.dateStr(loan.disbursed)}</b></div>
          <div class="fact"><span class="split" data-shape="line" data-name="line"></span><span class="lbl">Final due</span><b>${TL.dateStr(loan.instalments[n - 1].due)}</b></div>
        </div>
      </div>

      <div class="sec-head"><span class="title">Instalment Detail</span></div>
      <div class="card"><div class="tl">${loan.instalments.map(i => {
          const late = !i.paid && new Date(i.due) < Date.now(), date = new Date(i.due).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
          const got = TL.instPaid(i), partly = !i.paid && got > 0, isNext = i === nx;
          const d = TL.dueIn(i.due);
          const st = i.paid ? ['paid', 'Paid'] : late ? ['late', 'Overdue'] : partly ? ['part', 'Partly paid'] : isNext ? ['next', d === 'Today' ? 'Due today' : 'Due in ' + d] : ['up', 'Upcoming'];
          return `<div class="inst${isNext ? ' next' : ''}${i.paid ? ' paid' : ''}${partly ? ' partly' : ''}"><span class="dot"></span>
            <div class="inst-top"><div><b>Instalment ${i.n} of ${n}</b><small>${i.paid ? 'Paid · ' + date : (late ? 'Overdue · ' : 'Due in ' + d + ' · ') + date}</small></div><span class="st ${st[0]}">${st[1]}</span></div>
            <div class="bar"><i style="width:${i.paid ? 100 : got ? Math.round(got / i.amount * 100) : isNext ? 4 : 0}%"></i></div>
            ${partly ? `<div class="part-line"><span>Paid <b>${fmt(got)}</b> of ${fmt(i.amount)} ETB</span><span class="pct">${Math.round(got / i.amount * 100)}%</span></div>` : ''}
            <div class="inst-amt"><span>${partly ? 'Left to pay' : 'Repayment amount'}</span><b>${fmt(partly ? TL.instLeft(i) : i.amount)} ETB</b></div>
          </div>`; }).join('')}
      </div>
      ${nx ? `<div class="pay-acts"><button class="next" type="button" onclick="openRepay(${nx.n})">Repay</button>${unpaid > 1 ? `<button class="all" type="button" onclick="openRepay('all')">Settle All</button>` : ''}</div>` : ''}
      </div>`;
  }

  // Repay Now / Pay Rest / Repay All open the Repay screen (part or all)
  function openRepay(which) {
    if (!TL.nextDue(loan)) return;
    location.href = `Term Loan - Repay.html?id=${loan.id}&mode=${which === 'all' ? 'all' : 'part'}`;
  }

  render();
</script>
<script src="components/keyboard.js"></script>
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
