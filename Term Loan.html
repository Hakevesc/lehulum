<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Term Loan</title>
<!-- Same balance card as Home and Saving & Credit -->
<link rel="stylesheet" href="styles/design-tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/component-status-bar.css">
<link rel="stylesheet" href="styles/component-sc-card.css">
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&display=swap');

  /* Term Loan dashboard (the green product mockups, in Lehulum style): the red
     limit card with the credit-score chip, how much of the limit is used, the
     loans taken (swipe), and loan offers as a list of banks (All Banks / loan type
     dropdowns) — a bank opens Term Loan - Offers.html with only its offers. ?partner=boa shows the M-PESA × BOA co-brand. */
  :root { --Font: Switzer, sans-serif; --Primary: #FE353D; --Primary-Light: #FFF1F2; --On-Surface: #1C1C21; --On-Surface-Low: #7C7C87; }
  body { font-family: var(--Font); }
  .phone-frame { display: flex; flex-direction: column; }
  .phone-frame > .status-bar { flex-shrink: 0; }
  .app-content { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; height: auto; }
  /* Quick Apply: the second way to apply, fixed under the offers */
  .cta-bar { flex-shrink: 0; padding: 10px 16px 18px; background: var(--Background, #F5F5F5); box-shadow: 0 -6px 16px rgba(0,0,0,0.04); }
  .cta-bar button { width: 100%; height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 14px; background: var(--Primary); color: #FFF; font-family: var(--Font); font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 16px rgba(254,53,61,0.25); }
  .cta-bar svg { width: 18px; height: 18px; stroke: #FFF; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .app-content > * { flex-shrink: 0; }

  .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 0 0 12px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: rgba(0,0,0,0.05); }
  .icon-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .header-title { color: var(--On-Surface); font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  /* Co-brand strip (partner variant) */
  .cobrand { display: none; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; padding: 10px; background: #FFF; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); font-size: 12px; font-weight: 600; color: var(--On-Surface-Low); }
  .cobrand.show { display: flex; }
  .cobrand img { height: 22px; width: auto; }
  .cobrand .x { color: #B0B0B8; font-weight: 500; }

  /* Credit-score gauge in the card's top-right (in place of an illustration) */
  .gauge { position: absolute; right: 14px; top: 14px; width: 116px; padding: 0; border: none; background: none; cursor: pointer; font-family: var(--Font); text-align: center; color: var(--On-Surface); }
  .gauge > svg { display: block; width: 116px; height: 68px; }
  .gauge b { position: absolute; left: 0; right: 0; top: 30px; font-size: 22px; font-weight: 700; line-height: 1; }
  .gauge small { position: absolute; left: 0; right: 0; top: 54px; font-size: 11px; font-weight: 600; color: #16A34A; }

  /* Lender logo tile (offer cards) */
  .logo { width: 38px; height: 38px; border-radius: 11px; background: #FFF; border: 1px solid #EFEFF2; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .logo img { width: 30px; height: 30px; object-fit: contain; }


  .section-hdr { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; margin-bottom: 10px; }
  .section-title { color: var(--On-Surface); font-size: 15px; font-weight: 600; }
  .see-all-btn { display: inline-flex; align-items: center; gap: 2px; color: var(--Primary); font-size: 12.5px; font-weight: 600; cursor: pointer; border: none; background: none; font-family: var(--Font); padding: 0; }
  .see-all-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }


  /* Offer filters */
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -15px 8px; padding: 0 15px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #E6E6EA; background: #FFF; font-family: var(--Font); font-size: 12.5px; font-weight: 600; color: #55555E; cursor: pointer; }
  .chip.on { background: var(--Primary); border-color: var(--Primary); color: #FFF; box-shadow: 0 3px 10px rgba(254,53,61,0.25); }
  .chips.second { margin-bottom: 12px; }
  .chips.second .chip { height: 34px; padding: 0 16px; font-size: 13px; font-weight: 500; color: #3A3A44; background: #FFF; }
  .chips.second .chip.on { background: var(--Primary-Light); border: 1.5px solid var(--Primary); color: var(--Primary); font-weight: 600; box-shadow: none; }
  /* Bank + loan type dropdowns */
  .drops { position: relative; z-index: 20; display: flex; gap: 10px; margin-bottom: 12px; }
  .drop { flex: 1; min-width: 0; height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #E6E6EA; border-radius: 14px; background: #FFF; cursor: pointer; font-family: var(--Font); text-align: left; }
  .drop.set { border-color: #F7C6CA; background: #FFF8F8; }
  .drop .ic { width: 18px; height: 18px; flex-shrink: 0; stroke: var(--On-Surface); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .drop span { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; color: var(--On-Surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drop .cv { width: 16px; height: 16px; flex-shrink: 0; stroke: #55555E; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s; }
  .drop.open { border-color: var(--Primary); }
  .drop.open .cv { transform: rotate(180deg); stroke: var(--Primary); }
  /* The dropdown menu opens under its button */
  .pop { position: absolute; top: 48px; z-index: 30; max-height: 330px; overflow-y: auto; scrollbar-width: none; padding: 6px; border: 1px solid #ECECF0; border-radius: 16px; background: #FFF; box-shadow: 0 12px 32px rgba(15,23,42,0.16); opacity: 0; visibility: hidden; transform: translateY(-6px); transition: opacity 0.16s, transform 0.16s, visibility 0.16s; }
  .pop::-webkit-scrollbar { display: none; }
  .pop.show { opacity: 1; visibility: visible; transform: none; }
  .pop .bank { padding: 9px 8px; border-radius: 12px; gap: 10px; }
  .pop .bank + .bank { border-top: none; }
  .pop .bank:hover { background: #F7F7F9; }
  .pop .bank.on { background: var(--Primary-Light); }
  .pop .bank .logo { width: 32px; height: 32px; border-radius: 9px; }
  .pop .bank .logo img { width: 24px; height: 24px; }
  .pop .bank b { font-size: 13.5px; white-space: nowrap; }
  .pop .bank .tick { width: 18px; height: 18px; flex-shrink: 0; stroke: var(--Primary); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
  .pop .bank.on .tick { visibility: visible; }
  .hdr-note { font-size: 12px; color: var(--On-Surface-Low); }

  /* Banks: one row each — tap for that bank's offers */
  .banks { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
  .bk { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px; border: none; border-radius: 20px; background: #FFF; box-shadow: 0 4px 16px rgba(15,23,42,0.06); cursor: pointer; text-align: left; font-family: var(--Font); }
  .bk .logo { width: 48px; height: 48px; border-radius: 14px; }
  .bk .logo img { width: 36px; height: 36px; }
  .bk .info { flex: 1; min-width: 0; }
  .bk b { display: block; font-size: 15px; font-weight: 700; color: var(--On-Surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bk small { display: block; margin-top: 3px; font-size: 12.5px; color: var(--On-Surface-Low); }
  .bk small em { font-style: normal; font-weight: 700; color: #167C2A; }
  .bk .chev { width: 18px; height: 18px; flex-shrink: 0; stroke: var(--On-Surface); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .no-offers { padding: 22px; text-align: center; font-size: 13px; color: var(--On-Surface-Low); background: #FFF; border-radius: 18px; }

  /* Menu sheet */
  .scrim { position: absolute; inset: 0; z-index: 100; background: rgba(0,0,0,0.42); opacity: 0; visibility: hidden; transition: opacity 0.22s, visibility 0.22s; }
  .scrim.show { opacity: 1; visibility: visible; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 101; background: #FFF; border-radius: 28px 28px 0 0; padding: 10px 16px 24px; transform: translateY(100%); transition: transform 0.28s cubic-bezier(.2,.8,.2,1); }
  .sheet.show { transform: translateY(0); }
  .sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: #D8D8DE; margin: 0 auto 14px; }
  .menu-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 4px; border: none; background: none; text-align: left; cursor: pointer; font-family: var(--Font); }
  .menu-item + .menu-item { border-top: 1px solid #ECECEF; }
  .menu-item i { width: 38px; height: 38px; border-radius: 11px; background: var(--Primary-Light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .menu-item i svg { width: 19px; height: 19px; stroke: var(--Primary); stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .menu-item b { flex: 1; font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .menu-item .chev { width: 17px; height: 17px; stroke: #A0A0AA; stroke-width: 2.2; fill: none; }

  /* Rows in the bank / loan type dropdown */
  .sheet-title { font-size: 16px; font-weight: 700; color: var(--On-Surface); margin: 0 4px 4px; }
  .sheet-sub { font-size: 12px; color: var(--On-Surface-Low); margin: 0 4px 8px; }
  .bank-list { max-height: 400px; overflow-y: auto; scrollbar-width: none; }
  .bank-list::-webkit-scrollbar { display: none; }
  .bank { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 4px; border: none; background: none; text-align: left; cursor: pointer; font-family: var(--Font); }
  .bank + .bank { border-top: 1px solid #ECECEF; }
  .bank .info { flex: 1; min-width: 0; }
  .bank b { display: block; font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .bank small { display: block; margin-top: 1px; font-size: 11.5px; color: var(--On-Surface-Low); }
  .bank small.has { color: #167C2A; font-weight: 600; }
  .bank .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #D0D0D6; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .bank.on .radio { border-color: var(--Primary); }
  .bank.on .radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--Primary); }

  .toast { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1C1C21; color: #FFF; padding: 11px 18px; border-radius: 12px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 1000; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
<link rel="stylesheet" href="styles/device.css">
<style>@media (max-width: 480px) { .app-content { padding-top: 2px; } }</style>
</head>

    <div class="status-icons">

<script src="term-loan-store.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const { fmt } = TL;
  const params = new URLSearchParams(location.search);
  if (params.get('partner') === 'boa') $('cobrand').classList.add('show');

  // Limit and loans
  const loans = TL.load();
  const live = TL.active(loans);
  const owed = TL.outstanding(loans);
  const avail = Math.max(0, TL.LIMIT - owed);
  const nextAll = live.map(TL.nextDue).filter(Boolean).sort((a, b) => new Date(a.due) - new Date(b.due))[0];
  $('limitAmt').dataset.value = fmt(avail);
  $('usedTxt').dataset.value = fmt(owed);
  $('limitTxt').textContent = 'of ' + fmt(TL.LIMIT) + ' ETB';
  const pct = Math.round(owed / TL.LIMIT * 100);
  $('usedBar').style.width = Math.max(pct, 1) + '%';
  $('usedPct').textContent = pct + '%';
  const dueWhen = d => /\d/.test(d) ? 'due in ' + d : d === 'Today' ? 'due today' : 'overdue';
  $('dueNote').textContent = nextAll
    ? `${live.length} active loan${live.length === 1 ? '' : 's'} · next ${fmt(TL.instLeft(nextAll))} ETB ${dueWhen(TL.dueIn(nextAll.due))}`
    : 'No loans due — your full limit is available';

  // Score gauge (300–900 scale)
  $('gScore').textContent = TL.SCORE.value; $('gLabel').textContent = TL.SCORE.label;
  $('gArc').setAttribute('stroke-dasharray', `${Math.round((TL.SCORE.value - 300) / 6)} 100`);

  // Eye toggle: amounts hidden until tapped
  (function () {
    const btn = $('eyeBtn'), on = btn.innerHTML, vals = document.querySelectorAll('.sc-card .mask');
    const masks = [...vals].map(v => v.textContent);
    const off = '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19.5C5 19.5 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.74A9.1 9.1 0 0 1 12 4.5c7 0 11 7.5 11 7.5a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
    let shown = false;
    btn.addEventListener('click', () => {
      shown = !shown;
      vals.forEach((v, k) => { v.textContent = shown ? v.dataset.value : masks[k]; });
      btn.innerHTML = shown ? off : on;
      btn.title = shown ? 'Hide balances' : 'Show balances';
    });
  })();

  // Loan offers by bank. The loan type dropdown narrows the banks to those that
  // offer it (and their "Up to"); All Banks narrows to one. A bank opens its offers.
  let bank = 'all', type = 'all';
  const TYPES = [{ v: 'all', name: 'All Loan Types' }, { v: 'cash', name: 'Cash Loan' }, { v: 'salary', name: 'Salary Advance' }];
  const n0 = v => fmt(v).replace('.00', '');
  const ofType = o => type === 'all' || o.product === type;
  // Every bank with offers, in offer order
  const BANKS = [];
  TL.OFFERS.forEach(o => { if (!BANKS.some(b => b.name === o.lender)) BANKS.push({ name: o.lender, logo: o.logo }); });
  const offersOf = name => TL.OFFERS.filter(o => o.lender === name && ofType(o));
  const CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
  function renderOffers() {
    const list = BANKS.filter(b => (bank === 'all' || b.name === bank) && offersOf(b.name).length);
    $('bankCount').textContent = list.length + (list.length === 1 ? ' Bank' : ' Banks') + ' Available';
    $('offers').innerHTML = list.length ? list.map(b => `<button class="bk" type="button" onclick="openBank('${b.name}')">
        <span class="logo"><img src="${b.logo}" alt=""></span>
        <span class="info"><b>${b.name}</b><small>Up to <em>${n0(Math.max(...offersOf(b.name).map(o => o.max)))} ETB</em></small></span>${CHEV}</button>`).join('')
      : '<div class="no-offers">No bank offers this loan type yet.</div>';
  }
  function openBank(name) { location.href = `Term Loan - Offers.html?bank=${encodeURIComponent(name)}` + (type !== 'all' ? '&type=' + type : ''); }

  // Bank / loan type dropdowns: the menu opens under the tapped button and stays open
  // until that button is tapped again (picking an option keeps it open)
  let picking = null;
  const TICK = '<svg class="tick" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
  function openPick(what) {
    if (picking === what) return closePick();
    picking = what;
    const btn = $(what + 'Drop'), pop = $('pop');
    pop.innerHTML = what === 'bank'
      ? [{ name: 'all' }].concat(BANKS).map(b => `<button class="bank${bank === b.name ? ' on' : ''}" type="button" onclick="pick('${b.name}')">
            <span class="logo">${b.logo ? `<img src="${b.logo}" alt="">` : '<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:var(--Primary);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>'}</span>
            <span class="info"><b>${b.name === 'all' ? 'All Banks' : b.name}</b></span>${TICK}</button>`).join('')
      : TYPES.map(t => `<button class="bank${type === t.v ? ' on' : ''}" type="button" onclick="pick('${t.v}')">
            <span class="info"><b>${t.name}</b></span>${TICK}</button>`).join('');
    // Bank menu hangs from the left edge, loan type from the right; at least as wide as its button
    pop.style.left = what === 'bank' ? '0' : 'auto';
    pop.style.right = what === 'bank' ? 'auto' : '0';
    pop.style.width = Math.max(btn.offsetWidth, what === 'bank' ? 240 : 200) + 'px';
    document.querySelectorAll('.drop').forEach(d => d.classList.toggle('open', d === btn));
    pop.classList.add('show');
  }
  function closePick() { picking = null; $('pop').classList.remove('show'); document.querySelectorAll('.drop').forEach(d => d.classList.remove('open')); }
  function pick(v) {
    const what = picking;
    if (what === 'bank') { bank = v; $('bankTxt').textContent = v === 'all' ? 'All Banks' : v; $('bankDrop').classList.toggle('set', v !== 'all'); }
    else { type = v; $('typeTxt').textContent = v === 'all' ? 'Loan Type' : TYPES.find(t => t.v === v).name; $('typeDrop').classList.toggle('set', v !== 'all'); }
    renderOffers();
    $('pop').querySelectorAll('.bank').forEach(b => b.classList.toggle('on', b.getAttribute('onclick') === `pick('${v}')`));
  }
  renderOffers();

  function openMenu() { $('scrim').classList.add('show'); $('sheet').classList.add('show'); }
  function closeMenu() { $('scrim').classList.remove('show'); $('sheet').classList.remove('show'); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
  let tt;
  function showToast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2000); }
  if (params.get('done') === 'apply') showToast('Loan sent to your M-PESA balance');
  if (params.get('done') === 'repay') showToast('Repayment received');
  if (params.get('done') === 'activated') showToast('Term Loan activated');
</script>
