<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Money</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  /* Add Money: one entry for every way to fund the wallet — cash at an agent,
     a Visa card (Bank of Abyssinia), PayPal from abroad, and asking someone. */
  :root {
    --Primary: #FE353D;
    --Primary-Light: #FFF1F2;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Background: #F5F5F5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  button { font-family: inherit; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; background: var(--Background); flex-shrink: 0; }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }
  .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); flex-shrink: 0; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 18px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { width: 0; }
  .scroll > * { flex-shrink: 0; }


  .group-label { margin: 0 4px 8px; font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 600; color: #8A8A94; }
  .list { background: #FFF; border-radius: 18px; padding: 2px 14px; box-shadow: 0 4px 14px rgba(15,23,42,0.05); }
  .opt { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 0; border: none; background: none; text-align: left; cursor: pointer; }
  .opt + .opt { border-top: 1px solid #ECECEF; }
  .opt:active { opacity: 0.85; }
  .opt[disabled] { cursor: default; }
  .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--Primary-Light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
  .ic svg { width: 22px; height: 22px; stroke: var(--Primary); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ic.boa { background: #FFF; border: 1px solid #EFEFF2; }
  .ic.boa img { object-fit: contain; padding: 4px; }
  .ic.pp { background: #EAF2FF; font-family: 'Switzer', sans-serif; font-size: 20px; font-weight: 800; font-style: italic; color: #1A3E8C; }
  .ic.pp img { width: 22px; height: auto; object-fit: contain; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .info b { font-family: 'Switzer', sans-serif; font-size: 14.5px; font-weight: 700; color: var(--On-Surface); }
  .info small { font-family: 'Switzer', sans-serif; font-size: 12px; line-height: 1.4; color: var(--On-Surface-Low); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { flex-shrink: 0; padding: 4px 9px; border-radius: 999px; font-family: 'Switzer', sans-serif; font-size: 10.5px; font-weight: 700; }
  .tag.free { background: #E8F9EE; color: #16A34A; }
  .tag.soon { background: #EDEDF0; color: #55555E; }
  .chev { width: 17px; height: 17px; stroke: var(--Primary); stroke-width: 2.2; fill: none; flex-shrink: 0; }
  .opt[disabled] .info b { color: #8A8A94; }

  /* Bank & remittance: logos of who supports it, and Learn how (animated guide) */
  .opt.rich { flex-direction: column; align-items: stretch; gap: 12px; cursor: default; }
  .opt.rich:active { opacity: 1; }
  .rich-top { display: flex; align-items: center; gap: 12px; }
  .rich-top .info small { white-space: normal; }
  .rich-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .stack { display: flex; align-items: center; }
  .stack img, .stack .pt, .stack .more { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #FFF; background: #FFF; box-shadow: 0 1px 4px rgba(0,0,0,0.12); object-fit: contain; }
  .stack > * + * { margin-left: -9px; }
  .stack .pt { display: flex; align-items: center; justify-content: center; font-family: 'Switzer', sans-serif; font-size: 10.5px; font-weight: 700; color: #FFF; }
  .stack .more { display: flex; align-items: center; justify-content: center; background: #F1F1F4; font-family: 'Switzer', sans-serif; font-size: 11px; font-weight: 700; color: #55555E; }
  .learn { height: 34px; padding: 0 16px; border: none; border-radius: 999px; background: var(--Primary); color: #FFF; font-family: 'Poppins', sans-serif; font-size: 12.5px; font-weight: 500; cursor: pointer; box-shadow: 0 3px 10px rgba(254,53,61,0.25); }
  .learn:active { transform: scale(0.97); }


  .toast { position: absolute; left: 50%; bottom: 28px; transform: translate(-50%, 10px); background: #1C1C21; color: #FFF; font-family: 'Switzer', sans-serif; font-size: 13px; padding: 10px 14px; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; white-space: nowrap; z-index: 20; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
<link rel="stylesheet" href="styles/device.css">
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="location.href='Lehulum Home.html'" aria-label="Back">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title">Add Money</span>
      <div style="width:36px;"></div>
    </div>

    <div class="scroll">
      <section>
        <p class="group-label">Cash</p>
        <div class="list">
          <button class="opt" type="button" onclick="go('Cash In.html')">
            <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v1a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 12.5V20h14v-7.5"/><path d="M10 20v-4h4v4"/></svg></span>
            <span class="info"><b>Deposit at Agent</b><small>Your QR or agent short code</small></span>
            <span class="tag free">Free</span>
            <svg class="chev" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </section>

      <section>
        <p class="group-label">Card &amp; International</p>
        <div class="list">
          <button class="opt" type="button" onclick="go('Add Money - Visa Card.html')">
            <span class="ic boa"><img src="assets/banks logo/abyssinya-bank.png" alt="Bank of Abyssinia"></span>
            <span class="info"><b>Visa Card</b><small>Top up via Bank of Abyssinia</small></span>
            <svg class="chev" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="opt" type="button" onclick="go('PayPal.html')">
            <span class="ic pp"><img src="assets/paypal-icon.svg" alt="PayPal"></span>
            <span class="info"><b>PayPal</b><small>From your own PayPal account</small></span>
            <svg class="chev" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </section>

      <section>
        <p class="group-label">Bank &amp; Remittance</p>
        <div class="list">
          <div class="opt rich">
            <div class="rich-top">
              <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 10 12 4l9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/></svg></span>
              <span class="info"><b>Transfer from Bank</b><small>Move funds from your bank to M-PESA instantly</small></span>
            </div>
            <div class="rich-foot">
              <span class="stack"><img src="assets/banks logo/cbe-logo.png" alt=""><img src="assets/banks logo/abyssinya-bank.png" alt=""><img src="assets/banks logo/dashen-bank.png" alt=""><img src="assets/banks logo/awass-bank.png" alt=""><img src="assets/banks logo/hibret-bank.png" alt=""><span class="more">+15</span></span>
              <button class="learn" type="button" onclick="go('Add Money - Bank Guide.html')">Learn how</button>
            </div>
          </div>
          <div class="opt rich">
            <div class="rich-top">
              <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
              <span class="info"><b>Receive from Abroad</b><small>Receive international money transfers easily</small></span>
            </div>
            <div class="rich-foot">
              <span class="stack"><span class="pt" style="background:#0E7A3B">DH</span><span class="pt" style="background:#1F2A6B">TP</span><span class="pt" style="background:#0B3D2E">TH</span><span class="pt" style="background:#1C1C21">ON</span><span class="more">+8</span></span>
              <button class="learn" type="button" onclick="go('Add Money - Bank Guide.html?type=abroad')">Learn how</button>
            </div>
          </div>
        </div>
      </section>

      <section>
        <p class="group-label">From people</p>
        <div class="list">
          <button class="opt" type="button" onclick="go('Coming Soon.html?f=Request%20Money&back=Add%20Money.html')">
            <span class="ic"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></span>
            <span class="info"><b>Request Money</b><small>Ask friends or family to send</small></span>
            <span class="tag soon">Soon</span>
          </button>
        </div>
      </section>

    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
  function go(page) { location.href = page; }
  let tt;
  function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }
</script>
<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
<script src="test-scenarios-data.js"></script>
<script src="test-scenarios.js"></script>
</body>
</html>
