<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchant Payment - Confirm</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
    --Success: #1FC83B;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif; background: transparent;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .phone-frame {
    width: 360px; height: 780px; background: var(--Background); border-radius: 30px;
    overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar {
    flex-shrink: 0; display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 14px 24px 8px; background: var(--Background);
  }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav {
    flex-shrink: 0; width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px 12px; background: var(--Background);
  }
  .back-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%;
    background: transparent; border: none; cursor: pointer; transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title {
    color: var(--On-Surface); font-family: 'Switzer', sans-serif;
    font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center;
  }

  .scroll { flex: 1; overflow-y: auto; padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 16px; }
  .scroll::-webkit-scrollbar { width: 0; }

  /* Merchant header card */
  .merchant-card {
    background: #FFF; border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .merchant-icon {
    width: 48px; height: 48px; border-radius: 13px; background: rgba(254,53,61,0.08); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 700; color: var(--Primary);
  }
  .merchant-info { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .merchant-name { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 600; }
  .merchant-sub { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 12.5px; }
  .merchant-badge {
    display: inline-flex; align-items: center; gap: 4px; margin-top: 2px;
    padding: 3px 8px; border-radius: 6px; align-self: flex-start;
    background: rgba(31,200,59,0.08); color: var(--Success);
    font-family: 'Switzer', sans-serif; font-size: 11px; font-weight: 600;
  }
  .merchant-badge svg { width: 11px; height: 11px; stroke: var(--Success); fill: none; stroke-width: 2.5; }

  /* Breakdown card */
  .breakdown {
    background: #FFF; border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .b-row { display: flex; justify-content: space-between; align-items: center; }
  .b-row .label { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 13px; }
  .b-row .value { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 600; }
  .b-row .value.free { color: var(--Success); }
  .b-divider { height: 1px; background: var(--Border); margin: 2px 0; }
  .b-row.total .label { color: var(--On-Surface); font-size: 14px; font-weight: 600; }
  .b-row.total .value { color: var(--Primary); font-size: 20px; font-weight: 700; }

  /* Funding account */
  .funding {
    background: #FFF; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .funding .icon { width: 38px; height: 38px; border-radius: 10px; background: #FFF1F2; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .funding .icon svg { width: 20px; height: 20px; stroke: var(--Primary); stroke-width: 2; fill: none; }
  .funding .info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .funding .info .t { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 11.5px; }
  .funding .info .v { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 600; }

  .bottom-area { flex-shrink: 0; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 10px; background: var(--Background); }
  .btn-primary {
    width: 100%; height: 52px; border-radius: 14px; background: var(--Primary); color: #FFF;
    font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; border: none; cursor: pointer;
    transition: all 0.2s; box-shadow: 0 4px 16px rgba(254,53,61,0.25);
  }
  .btn-primary:hover { background: #E5303A; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(254,53,61,0.35); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-link { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; background: none; border: none; padding: 6px 0; transition: color 0.2s; }
  .btn-link:hover { color: var(--On-Surface); }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title">Confirm Payment</span>
      <div style="width: 36px;"></div>
    </div>

    <div class="scroll">

      <!-- Merchant -->
      <div class="merchant-card">
        <div class="merchant-icon" id="mIcon">SH</div>
        <div class="merchant-info">
          <span class="merchant-name" id="mName">Shoa Supermarket</span>
          <span class="merchant-sub" id="mSub">Retail • Merchant No. 247810</span>
          <span class="merchant-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Verified Merchant
          </span>
        </div>
      </div>

      <!-- Breakdown -->
      <div class="breakdown">
        <div class="b-row">
          <span class="label">Payment amount</span>
          <span class="value" id="amount">0.00 ETB</span>
        </div>
        <div class="b-row">
          <span class="label">Applicable charges</span>
          <span class="value free" id="fee">Free</span>
        </div>
        <div class="b-divider"></div>
        <div class="b-row total">
          <span class="label">Total deduction</span>
          <span class="value" id="total">0.00 ETB</span>
        </div>
      </div>

      <!-- Funding account -->
      <div class="funding">
        <div class="icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        </div>
        <div class="info">
          <span class="t">Paying from</span>
          <span class="v" id="fundingAccount">Main Account</span>
        </div>
      </div>

    </div>

    <div class="bottom-area">
      <button class="btn-primary" onclick="confirmPay()">Confirm &amp; Pay</button>
      <button class="btn-link" onclick="goBack()">Edit payment</button>
    </div>

  </div>
</div>

<script>
  const merchant = JSON.parse(sessionStorage.getItem('merchantData') || '{}');

  const name = merchant.name || 'Shoa Supermarket';
  const abbr = merchant.abbr || (name ? name.slice(0,2).toUpperCase() : 'SH');
  const sub  = merchant.sub || 'Merchant No. 247810';
  const amount = parseFloat(merchant.payAmount || '0').toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const feeNum = parseFloat(merchant.fee || '0');
  const total  = parseFloat(merchant.total || merchant.payAmount || '0').toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  const ACCOUNT_LABELS = { main: 'Main Account', reward: 'Reward Account', overdraft: 'Errif Overdraft' };

  document.getElementById('mIcon').textContent = abbr;
  document.getElementById('mName').textContent = name;
  document.getElementById('mSub').textContent = sub;
  document.getElementById('amount').textContent = amount + ' ETB';

  const feeEl = document.getElementById('fee');
  if (feeNum > 0) { feeEl.textContent = feeNum.toFixed(2) + ' ETB'; feeEl.classList.remove('free'); }
  else { feeEl.textContent = 'Free'; }

  document.getElementById('total').textContent = total + ' ETB';
  document.getElementById('fundingAccount').textContent = ACCOUNT_LABELS[merchant.account] || 'Main Account';

  function confirmPay() { window.location.href = 'Merchant Payment_Enter PIN.html'; }
  function goBack() { window.location.href = 'Merchant Payment_Enter Amount.html'; }
</script>

<script src="figma-export.js"></script>
</body>
</html>
