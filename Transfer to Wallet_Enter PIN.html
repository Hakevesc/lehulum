<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer to Wallet - Enter PIN</title>
<style>
    @import url("styles/component-keypad.css");
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --Primary-Dark: #C41520;
    --Primary-Darker: #A41016;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Surface-Container: #FCFCFC;
    --Gray-0: #FFF;
    --On-Primary: #FFF1F2;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .phone-frame {
    width: 360px;
    height: 780px;
    background: var(--Background);
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
  }

  .app-content {
    height: 100%;
    overflow-y: auto;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .app-content::-webkit-scrollbar { width: 0; }

  /* ===== RED GRADIENT HEADER ===== */
  .header-section {
    position: relative; width: 100%; height: 160px; flex-shrink: 0;
    background: linear-gradient(160deg, #A41016 0%, #C41520 30%, #D32F2F 60%, #B71C1C 100%);
    border-radius: 0 0 30px 30px;
    display: flex; flex-direction: column; align-items: center;
  }
  .pattern-overlay {
    position: absolute; inset: 0; opacity: 0.20; z-index: 0;
    background-image: url('assets/M-PESA-pattern.svg');
    background-size: 490px; background-position: right -270px top -270px;
    background-repeat: no-repeat; border-radius: 0 0 30px 30px; mix-blend-mode: overlay;
  }
  .status-bar {
    position: relative; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 14px 24px 8px;
  }
  .status-bar .time { font-size: 14px; font-weight: 600; color: #FFF; }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav {
    position: relative; z-index: 5;
    width: 100%; display: flex; align-items: center; justify-content: center;
    padding: 12px 20px 0;
  }
  .back-btn {
    position: absolute; left: 20px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer; transition: all 0.2s;
  }
  .back-btn:hover { transform: scale(1.1); }
  .back-btn svg { width: 24px; height: 24px; stroke: #FFF; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .header-title { color: #FFF; font-family: 'Switzer', sans-serif; font-size: 18px; font-weight: 300; letter-spacing: 0.3px; }

  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 20px 20px;
    gap: 12px;
  }
  .main-content > .pin-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 0;
  }

  /* ===== REVIEW CARD ===== */
  .review-card {
    width: 100%;
    background: #FFF;
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .review-logo {
    width: 40px; height: 40px; border-radius: 10px; overflow: hidden;
    background: #F5F5F5; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .review-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
  .review-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .review-name { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 600; }
  .review-bank {
    color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .review-bank .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--On-Surface-Low); }
  .review-account { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 12px; }
  .review-amount {
    color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 16px; font-weight: 700;
    text-align: right; flex-shrink: 0;
  }

  /* PIN section */
  .pin-section { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
  .pin-label { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 15px; font-weight: 500; letter-spacing: 0.3px; text-align: center; }

  .pin-container { display: flex; gap: 20px; justify-content: center; }
  .pin-box {
    width: 64px; height: 64px; border-radius: 16px; background: #FFF; border: 2px solid #ECECEC;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }
  .pin-box.filled { background: #FFF; border-color: transparent; }
  .pin-box.filled .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--On-Surface); }
  .pin-box.active { border-color: var(--Primary); background: #FFF5F5; }
  .pin-box.active .dot { display: none; }
  .pin-box.active::after { content: ''; width: 2px; height: 24px; background: var(--Primary); animation: cursor-blink 1s step-end infinite; }
  @keyframes cursor-blink { from, to { background-color: transparent } 50% { background-color: var(--Primary) } }
  .pin-box.error { border-color: var(--Primary); background: #FFF5F5; animation: shake 0.4s ease-in-out; }
  .pin-box.error .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--Primary); }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .pin-error { display: none; align-items: center; justify-content: center; gap: 6px; }
  .pin-error.show { display: flex; }
  .pin-error svg { width: 14px; height: 14px; stroke: var(--Primary); stroke-width: 2; fill: none; flex-shrink: 0; }
  .pin-error span { color: var(--Primary); font-family: 'Switzer', sans-serif; font-size: 12.5px; font-weight: 500; }

  .pin-input { position: absolute; opacity: 0; pointer-events: none; }

  .keypad { margin-top: auto; }

  /* Success overlay */
  .success-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .success-overlay.show { display: flex; }
  .success-modal {
    width: 280px; background: #FFF; border-radius: 20px; padding: 32px 24px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  .success-icon { width: 72px; height: 72px; border-radius: 50%; background: var(--On-Primary); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .success-icon svg { width: 36px; height: 36px; stroke: var(--Primary); stroke-width: 2.5px; }
  .success-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .success-subtitle { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 400; line-height: 1.5; margin-bottom: 20px; }
  .success-done-btn { width: 100%; height: 44px; border-radius: 12px; background: var(--Primary); color: #FFF; border: none; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
  .success-done-btn:hover { background: #E5303A; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="app-content">

    <!-- ===== RED GRADIENT HEADER ===== -->
    <div class="header-section">
      <div class="pattern-overlay"></div>
      <div class="status-bar">
        <span class="time">10:00</span>
        <div class="status-icons">
          <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#FFF"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#FFF"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#FFF"/></svg>
          <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#FFF"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#FFF"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#FFF"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#FFF" opacity="0.45"/></svg>
          <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#FFF" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#FFF"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#FFF"/></svg>
        </div>
      </div>
      <div class="header-nav">
        <button class="back-btn" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <span class="header-title">Enter PIN</span>
      </div>
    </div>

    <div class="main-content">

      <!-- Review Card -->
      <div class="review-card">
        <div class="review-logo"><img id="reviewWalletLogo" src="assets/banks logo/M-PESA-logo-icon.png" alt="Wallet" onerror="this.style.display='none'"></div>
        <div class="review-info">
          <span class="review-name" id="reviewName">Henok Chala</span>
          <div class="review-bank">
            <span id="reviewWalletName">M-PESA</span>
            <span class="sep"></span>
            <span class="review-account" id="reviewAccount">+251 9** *** ***</span>
          </div>
        </div>
        <span class="review-amount" id="reviewAmount">0.00 ETB</span>
      </div>

      <!-- PIN -->
      <div class="pin-section">
        <span class="pin-label">Enter Your M-PESA PIN</span>
        <div class="pin-container" id="pinContainer">
          <div class="pin-box" data-index="0"><div class="dot"></div></div>
          <div class="pin-box" data-index="1"><div class="dot"></div></div>
          <div class="pin-box" data-index="2"><div class="dot"></div></div>
          <div class="pin-box" data-index="3"><div class="dot"></div></div>
        </div>
        <div class="pin-error" id="pinError">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="pinErrorText">Incorrect PIN. 2 attempts left.</span>
        </div>
        <input type="password" class="pin-input" id="pinInput" maxlength="4" inputmode="numeric">
      </div>

      <!-- Keypad -->
      <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key empty"></button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key delete" onclick="pressBackspace()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
      </div>

    </div>

    <!-- Success Overlay -->
    <div class="success-overlay" id="successOverlay">
      <div class="success-modal">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h3 class="success-title">Transfer Successful!</h3>
        <p class="success-subtitle" id="successSubtitle">Transfer completed successfully</p>
        <button class="success-done-btn" onclick="closeSuccess()">View Receipt</button>
      </div>
    </div>

  </div>
</div>

<script>
  const CORRECT_PIN = '1234';
  const MAX_ATTEMPTS = 3;

  let pin = '';
  const pinInput = document.getElementById('pinInput');
  const pinBoxes = document.querySelectorAll('.pin-box');
  const pinError = document.getElementById('pinError');

  // Load session data for review card
  (function loadReview() {
    let target = {};
    try { target = JSON.parse(sessionStorage.getItem('sendTarget') || '{}'); } catch (e) {}
    const amount = sessionStorage.getItem('sendAmount') || '0.00';

    const name = target.holder || 'Recipient';
    const walletName = target.name || 'M-PESA';
    const account = target.phone || '+251 9** *** ***';

    document.getElementById('reviewName').textContent = name;
    document.getElementById('reviewWalletName').textContent = walletName;
    document.getElementById('reviewAccount').textContent = account;
    document.getElementById('reviewAmount').textContent = amount + ' ETB';

    if (target.logo) {
      const img = document.getElementById('reviewWalletLogo');
      img.src = target.logo;
      img.alt = walletName;
      img.style.display = '';
    }
  })();

  function updatePinDisplay() {
    pinBoxes.forEach((box, index) => {
      box.classList.remove('filled', 'active', 'error');
      if (index < pin.length) box.classList.add('filled');
      else if (index === pin.length) box.classList.add('active');
    });
  }

  function pressKey(value) {
    pinError.classList.remove('show');
    if (pin.length < 4) {
      pin += value;
      pinInput.value = pin;
      updatePinDisplay();
      // Auto-submit when 4 digits entered
      if (pin.length === 4) {
        setTimeout(confirmTransfer, 150);
      }
    }
  }

  function pressBackspace() {
    pin = pin.slice(0, -1); pinInput.value = pin; updatePinDisplay();
  }

  function confirmTransfer() {
    if (pin.length !== 4) return;

    if (pin === CORRECT_PIN) {
      sessionStorage.removeItem('pinAttempts');
      window.location.href = 'Transfer to Wallet_Confirmation.html';
      return;
    }

    let attempts = parseInt(sessionStorage.getItem('pinAttempts') || '0', 10) + 1;
    sessionStorage.setItem('pinAttempts', String(attempts));

    if (attempts >= MAX_ATTEMPTS) {
      window.location.href = 'PIN-Locked.html';
      return;
    }

    const left = MAX_ATTEMPTS - attempts;
    document.getElementById('pinErrorText').textContent =
      'Incorrect PIN. ' + left + (left === 1 ? ' attempt' : ' attempts') + ' left.';
    pinBoxes.forEach(b => { b.classList.remove('filled', 'active'); b.classList.add('error'); });
    pinError.classList.add('show');
    setTimeout(() => { pin = ''; pinInput.value = ''; updatePinDisplay(); }, 500);
  }

  function closeSuccess() {
    window.location.href = 'Transfer to Wallet_Confirmation.html';
  }

  function goBack() { history.back(); }

  document.addEventListener('keydown', function (e) {
    if (e.key >= '0' && e.key <= '9') pressKey(e.key);
    else if (e.key === 'Backspace') pressBackspace();
  });

  document.querySelector('.keypad').addEventListener('click', function () { pinInput.focus(); });
  updatePinDisplay();
</script>

<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
</body>
</html>
