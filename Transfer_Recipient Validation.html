<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipient Validation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
    --Success: #1FC83B;
    --Success-Light: #E8F9EC;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif; background: transparent;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .phone-frame {
    width: 360px; height: 780px; background: var(--Background); border-radius: 30px;
    overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 14px 24px 8px; background: var(--Background);
  }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px 12px; background: var(--Background);
  }
  .back-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%;
    background: transparent; border: none; cursor: pointer; transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; }
  .header-title {
    color: var(--On-Surface); font-family: 'Switzer', sans-serif;
    font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center;
  }

  .main-content {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 20px; width: 100%;
  }

  /* Loading state */
  .loading-state { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .loading-state.hide { display: none; }
  .spinner-lg {
    width: 48px; height: 48px; border: 4px solid var(--Border);
    border-top-color: var(--Primary); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 500; }

  /* Resolved card */
  .resolved { width: 100%; display: none; flex-direction: column; align-items: center; animation: fadeUp 0.3s ease-out; }
  .resolved.show { display: flex; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .verified-badge {
    display: inline-flex; align-items: center; gap: 6px; background: var(--Success-Light);
    border-radius: 999px; padding: 6px 14px; margin-bottom: 18px;
  }
  .verified-badge svg { width: 16px; height: 16px; stroke: var(--Success); stroke-width: 2.5; fill: none; }
  .verified-badge span { color: #128a2a; font-family: 'Switzer', sans-serif; font-size: 12px; font-weight: 600; }

  .recipient-card {
    width: 100%; background: #FFF; border-radius: 20px; padding: 24px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .recipient-avatar {
    width: 72px; height: 72px; border-radius: 50%; background: #E8E8EC;
    display: flex; align-items: center; justify-content: center; margin-bottom: 6px;
    font-family: 'Switzer', sans-serif; font-size: 24px; font-weight: 700; color: var(--On-Surface);
  }
  .recipient-name { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 0.2px; }
  .recipient-rail { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 500; }

  .detail-list { width: 100%; margin-top: 18px; display: flex; flex-direction: column; gap: 0; border-top: 1px dashed var(--Border); padding-top: 14px; }
  .detail-list .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
  .detail-list .row + .row { border-top: 1px solid #F4F4F6; }
  .detail-list .label { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 12.5px; }
  .detail-list .value { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 13.5px; font-weight: 600; }

  .hint { margin-top: 16px; color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 12px; text-align: center; max-width: 270px; line-height: 1.5; }

  .bottom-area { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 0 20px 24px; gap: 10px; }
  .btn-primary {
    width: 100%; height: 52px; border-radius: 14px; background: var(--Primary); color: #FFF;
    font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; border: none; cursor: pointer;
    transition: all 0.2s; box-shadow: 0 4px 16px rgba(254,53,61,0.25);
  }
  .btn-primary:hover { background: #E5303A; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(254,53,61,0.35); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { background: #E0E0E0; color: var(--On-Surface-Low); cursor: not-allowed; box-shadow: none; transform: none; }
  .btn-link { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; background: none; border: none; padding: 6px 0; transition: color 0.2s; }
  .btn-link:hover { color: var(--On-Surface); }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <span class="header-title">Confirm Recipient</span>
      <div style="width: 36px;"></div>
    </div>

    <div class="main-content">

      <!-- Loading -->
      <div class="loading-state" id="loadingState">
        <div class="spinner-lg"></div>
        <span class="loading-text">Validating recipient…</span>
      </div>

      <!-- Resolved -->
      <div class="resolved" id="resolved">
        <div class="verified-badge">
          <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
          <span>Recipient verified</span>
        </div>
        <div class="recipient-card">
          <div class="recipient-avatar" id="avatar">HC</div>
          <div class="recipient-name" id="custName">Henok Chala</div>
          <div class="recipient-rail" id="railName">M-PESA</div>

          <div class="detail-list">
            <div class="row">
              <span class="label" id="railLabel">Wallet</span>
              <span class="value" id="railValue">M-PESA</span>
            </div>
            <div class="row">
              <span class="label" id="idLabel">Mobile number</span>
              <span class="value" id="idValue">+251 9** *** 326</span>
            </div>
          </div>
        </div>
        <p class="hint">Please confirm these details are correct before continuing. You cannot reverse a completed transfer.</p>
      </div>

    </div>

    <div class="bottom-area">
      <button class="btn-primary" id="confirmBtn" onclick="confirmRecipient()" disabled>Confirm Recipient</button>
      <button class="btn-link" onclick="history.back()">Edit details</button>
    </div>

  </div>
</div>

<script>
  const sampleNames = ['Henok Chala', 'Kidist Birhanu', 'Abel Tesfaye', 'Marta Solomon', 'Yonas Girma', 'Hanna Bekele'];
  let target = {};
  try { target = JSON.parse(sessionStorage.getItem('sendTarget') || '{}'); } catch (e) {}

  function initials(name) {
    return (name || '?').split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
  }

  function resolveAndRender() {
    const isBank = target.type === 'bank';
    const identifier = isBank ? (target.account || '') : (target.fullNumber || '');

    // Deterministic failure hook for demo/testing: identifiers ending in 0000 don't validate
    if (identifier && identifier.endsWith('0000')) {
      window.location.href = 'Transfer_Recipient Not Found.html';
      return;
    }

    // Use a pre-known holder (e.g. contact / resolved bank name) or pick a sample
    const name = target.holder || sampleNames[Math.floor(Math.random() * sampleNames.length)];
    target.holder = name;
    sessionStorage.setItem('sendTarget', JSON.stringify(target));

    document.getElementById('avatar').textContent = initials(name);
    document.getElementById('custName').textContent = name;
    document.getElementById('railName').textContent = target.name || (isBank ? 'Bank' : 'M-PESA');

    if (isBank) {
      document.getElementById('railLabel').textContent = 'Bank';
      document.getElementById('railValue').textContent = target.name || 'Bank';
      document.getElementById('idLabel').textContent = 'Account number';
      document.getElementById('idValue').textContent = target.account || '****0000';
    } else {
      document.getElementById('railLabel').textContent = 'Wallet';
      document.getElementById('railValue').textContent = target.name || 'M-PESA';
      document.getElementById('idLabel').textContent = 'Mobile number';
      document.getElementById('idValue').textContent = target.phone || '+251 9** *** ***';
    }

    document.getElementById('loadingState').classList.add('hide');
    document.getElementById('resolved').classList.add('show');
    const btn = document.getElementById('confirmBtn');
    btn.disabled = false;
  }

  function confirmRecipient() {
    const dest = target.type === 'bank' ? 'Transfer_Enter Amount.html' : 'Transfer to Wallet_Enter Amount.html';
    window.location.href = dest;
  }

  // Brief validation delay
  setTimeout(resolveAndRender, 1200);
</script>

<script src="figma-export.js"></script>
</body>
</html>
