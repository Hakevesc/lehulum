<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Errif Overdraft</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root { --Primary: #FE353D; --On-Surface: #1C1C21; --On-Surface-Low: #7C7C87; --Border: #E8E8EC; --Background: #F5F5F5; --Success: #1FC83B; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .phone-frame { width: 360px; height: 780px; background: var(--Background); border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
  .app-content { height: 100%; display: flex; flex-direction: column; }

  .status-bar { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 24px 8px; background: var(--Background); }
  .status-bar .time { font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  .header-nav { flex-shrink: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; background: var(--Background); }
  .back-btn { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: transparent; border: none; cursor: pointer; transition: all 0.2s; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .back-btn svg { width: 22px; height: 22px; stroke: var(--On-Surface); stroke-width: 1.8px; fill: none; }
  .header-title { color: var(--On-Surface); font-family: 'Switzer', sans-serif; font-size: 17px; font-weight: 500; letter-spacing: 0.3px; flex: 1; text-align: center; }

  .scroll-content { flex: 1; overflow-y: auto; padding: 8px 20px 12px; display: flex; flex-direction: column; gap: 14px; }
  .scroll-content::-webkit-scrollbar { width: 0; }

  .section-label { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 2px; }

  /* Balance Card */
  .balance-card { background: #FFF; border: 1px solid var(--Border); border-radius: 16px; padding: 18px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .balance-card .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .balance-card .card-header .icon { width: 36px; height: 36px; border-radius: 10px; background: #FFF1F2; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .balance-card .card-header .icon svg { width: 18px; height: 18px; stroke: var(--Primary); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .balance-card .card-header .info { flex: 1; }
  .balance-card .card-header .info .name { font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .balance-card .card-header .info .sub { font-family: 'Switzer', sans-serif; font-size: 11.5px; color: var(--On-Surface-Low); margin-top: 1px; }
  .balance-card .balance-row { display: flex; align-items: center; justify-content: space-between; }
  .balance-card .balance-row .label { font-family: 'Switzer', sans-serif; font-size: 12px; color: var(--On-Surface-Low); }
  .balance-card .balance-row .value { font-family: 'Switzer', sans-serif; font-size: 18px; font-weight: 700; color: var(--On-Surface); }
  .balance-card .balance-row .value.hidden { color: var(--On-Surface-Low); letter-spacing: 2px; font-size: 16px; }

  /* Activate CTA */
  .activate-cta { display: flex; align-items: center; justify-content: space-between; background: #FFF1F2; border: 1px solid rgba(254,53,61,0.2); border-radius: 14px; padding: 14px 16px; cursor: pointer; transition: all 0.2s; text-decoration: none; }
  .activate-cta:hover { background: #FFE4E6; transform: translateY(-1px); }
  .activate-cta:active { transform: scale(0.98); }
  .activate-cta .left { display: flex; align-items: center; gap: 12px; }
  .activate-cta .left .icon { width: 40px; height: 40px; border-radius: 12px; background: var(--Primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .activate-cta .left .icon svg { width: 20px; height: 20px; stroke: #FFF; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .activate-cta .left .text .title { font-family: 'Switzer', sans-serif; font-size: 14px; font-weight: 600; color: var(--On-Surface); }
  .activate-cta .left .text .desc { font-family: 'Switzer', sans-serif; font-size: 11.5px; color: var(--On-Surface-Low); margin-top: 1px; }
  .activate-cta .arrow { display: flex; align-items: center; }
  .activate-cta .arrow svg { width: 20px; height: 20px; stroke: var(--Primary); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .info-banner { background: #FFF; border: 1px solid var(--Border); border-radius: 12px; padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; }
  .info-banner svg { width: 18px; height: 18px; stroke: var(--On-Surface-Low); stroke-width: 2; fill: none; flex-shrink: 0; margin-top: 1px; }
  .info-banner p { font-family: 'Switzer', sans-serif; font-size: 12px; color: var(--On-Surface-Low); line-height: 1.5; }

  .bottom-area { flex-shrink: 0; width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 12px 24px 24px; background: var(--Background); }
  .btn-primary { width: 100%; height: 52px; border-radius: 14px; background: var(--Primary); color: #FFF; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; border: none; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 16px rgba(254,53,61,0.25); }
  .btn-primary:hover { background: #E5303A; transform: translateY(-1px); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-link { color: var(--On-Surface-Low); font-family: 'Switzer', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; background: none; border: none; padding: 4px 0; }
  .btn-link:hover { color: var(--On-Surface); }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="app-content">

    <div class="status-bar">
      <span class="time">10:00</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#1C1C21"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#1C1C21"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#1C1C21"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#1C1C21"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#1C1C21"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#1C1C21"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#1C1C21" opacity="0.3"/></svg>
        <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#1C1C21" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#1C1C21"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#1C1C21"/></svg>
      </div>
    </div>

    <div class="header-nav">
      <button class="back-btn" onclick="goBack()" aria-label="Go back">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="header-title">Errif Overdraft</span>
      <div style="width: 36px;"></div>
    </div>

    <div class="scroll-content">

      <div class="section-label">Your Accounts</div>

      <!-- M-PESA Balance Card -->
      <div class="balance-card">
        <div class="card-header">
          <div class="icon">
            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M12 9v6M9 12h6"/></svg>
          </div>
          <div class="info">
            <div class="name">M-PESA Balance</div>
            <div class="sub">Available for purchases</div>
          </div>
        </div>
        <div class="balance-row">
          <span class="label">Balance</span>
          <span class="value">12,580.00 ETB</span>
        </div>
      </div>

      <!-- Errif Overdraft Card (Not Activated) -->
      <a class="activate-cta" href="Activate Errif Overdraft.html">
        <div class="left">
          <div class="icon">
            <svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
          </div>
          <div class="text">
            <div class="title">Errif Overdraft</div>
            <div class="desc">Not activated — Get instant credit when you need it</div>
          </div>
        </div>
        <div class="arrow">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </a>

      <!-- Info Banner -->
      <div class="info-banner">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <p>Errif Overdraft lets you complete purchases even when your balance is low. Activate now to get a pre-approved limit of <strong>5,000.00 ETB</strong>.</p>
      </div>

    </div>

    <div class="bottom-area">
      <button class="btn-primary" onclick="window.location.href='Activate Errif Overdraft.html'">Activate Errif</button>
      <button class="btn-link" onclick="notNow()">Not now</button>
    </div>

  </div>
</div>

<script>
  function notNow() { window.location.href = '../Airtime_Buy.html'; }
  function goBack() { window.location.href = '../Airtime_Buy.html'; }
</script>

<script src="../figma-export.js"></script>
</body>
</html>
