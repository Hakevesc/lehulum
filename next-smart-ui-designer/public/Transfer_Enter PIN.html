<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amount & PIN</title>
<style>
    @import url("styles/component-keypad.css");
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap');
  @import url('https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap');

  :root {
    --Primary: #FE353D;
    --Primary-Dark: #C41520;
    --Primary-Darker: #A41016;
    --On-Surface: #1C1C21;
    --On-Surface-Low: #7C7C87;
    --Surface-Container: #FCFCFC;
    --Gray-0: #FFF;
    --On-Primary: #FFF1F2;
    --Border: #E8E8EC;
    --Background: #F5F5F5;
    --Success: #1FC83B;
    --Success-Light: #E8F9EC;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .phone-frame {
    width: 360px;
    height: 780px;
    background: var(--Background);
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
  }

  .app-content {
    height: 100%;
    overflow-y: auto;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .app-content::-webkit-scrollbar { width: 0; }

  /* ===== RED GRADIENT HEADER ===== */
  .top-red {
    position: relative;
    background: linear-gradient(155deg, #9E0E14 0%, #D81E26 45%, #FE353D 100%);
    border-radius: 0 0 28px 28px;
    padding-bottom: 46px;
  }

  /* Status Bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 14px 24px 8px;
  }
  .status-bar .time { font-size: 14px; font-weight: 600; color: #FFF; }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 18px; height: 18px; }

  /* Header Navigation */
  .header-nav {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px 4px;
  }
  .back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.15); }
  .back-btn svg { width: 22px; height: 22px; stroke: #FFF; stroke-width: 1.8px; }

  .header-title {
    color: #FFF;
    font-family: 'Switzer', sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.3px;
    flex: 1;
    text-align: center;
  }

  /* Amount inside the red header */
  .amount-area {
    text-align: center;
    padding: 30px 0 16px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .amount-area:not(.active) { opacity: 0.6; }

  .amount-display {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
  }
  .amount-value {
    font-family: 'Switzer', sans-serif;
    font-size: 54px;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
    color: #FFF;
  }
  .amount-currency {
    font-family: 'Switzer', sans-serif;
    font-size: 20px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
  }
  .amount-caret {
    width: 3px;
    height: 42px;
    background: #FFF;
    border-radius: 2px;
    align-self: center;
    display: none;
    animation: caret-blink 1s step-end infinite;
  }
  .amount-area.active .amount-caret { display: block; }
  @keyframes caret-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  /* Balance pill straddling the red/light boundary */
  .balance-pill {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translate(-50%, 50%);
    display: flex;
    align-items: center;
    gap: 14px;
    background: #FFF;
    border-radius: 20px;
    padding: 9px 18px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.10);
    white-space: nowrap;
  }
  .balance-item {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--On-Surface);
    font-family: 'Switzer', sans-serif;
    font-size: 12.5px;
    font-weight: 400;
  }
  .balance-item .label { color: var(--On-Surface-Low); }
  .balance-item .amount { font-weight: 600; color: var(--On-Surface); }
  .balance-divider { width: 1px; height: 14px; background: var(--Border); }

  /* ===== LOWER (light) CONTENT ===== */
  .lower-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 36px 20px 18px;
  }

  /* Validation / errors — centered in the gap between PIN and keypad */
  .middle-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .insufficient-warning,
  .pin-error {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .insufficient-warning.show,
  .pin-error.show { display: flex; }
  .warning-icon { width: 15px; height: 15px; color: var(--Primary); flex-shrink: 0; }
  .warning-text { color: var(--Primary); font-family: 'Switzer', sans-serif; font-size: 12px; font-weight: 500; }

  /* PIN Section */
  .pin-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 12px;
  }
  .pin-section:not(.active) { opacity: 0.55; }

  .pin-label {
    color: var(--On-Surface-Low);
    font-family: 'Switzer', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.3px;
    text-align: center;
  }

  .pin-container { display: flex; gap: 18px; justify-content: center; }

  .pin-box {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: #FFF;
    border: 2px solid #ECECEC;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
  }
  .pin-box.filled { background: #FFF; border-color: transparent; }
  .pin-box.filled .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--On-Surface); }
  .pin-box.active { border-color: var(--Primary); background: #FFF5F5; }
  .pin-box.active .dot { display: none; }
  .pin-box.active::after {
    content: ''; width: 2px; height: 24px; background: var(--Primary);
    animation: cursor-blink 1s step-end infinite;
  }
  @keyframes cursor-blink {
    from, to { background-color: transparent }
    50% { background-color: var(--Primary) }
  }

  .pin-input { position: absolute; opacity: 0; pointer-events: none; }

  /* Keypad — sits at the bottom (the middle-area does the pushing) */
  .keypad { margin-top: 0; padding: 16px; }
  .key { height: 48px; }

  /* Transfer Button */
  .transfer-btn {
    height: 50px;
    border-radius: 14px;
    border: none;
    background: #E0E0E0;
    color: var(--On-Surface-Low);
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: not-allowed;
    transition: all 0.2s;
    margin-top: 14px;
  }
  .transfer-btn.active {
    background: var(--Primary);
    color: #FFF;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(254, 53, 61, 0.25);
  }
  .transfer-btn.active:hover {
    background: #E5303A;
    box-shadow: 0 6px 20px rgba(254, 53, 61, 0.35);
    transform: translateY(-1px);
  }
  .transfer-btn.active:active { transform: scale(0.98) translateY(0); }

  /* ===== SUCCESS OVERLAY ===== */
  .success-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .success-overlay.show { display: flex; }

  .success-modal {
    width: 280px;
    background: #FFF;
    border-radius: 20px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  .success-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--On-Primary);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .success-icon svg { width: 36px; height: 36px; stroke: var(--Primary); stroke-width: 2.5px; }

  .success-title {
    color: var(--On-Surface);
    font-family: 'Switzer', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .success-subtitle {
    color: var(--On-Surface-Low);
    font-family: 'Switzer', sans-serif;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .success-done-btn {
    width: 100%;
    height: 44px;
    border-radius: 12px;
    background: var(--Primary);
    color: #FFF;
    border: none;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .success-done-btn:hover { background: #E5303A; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="app-content">

    <!-- ===== RED GRADIENT HEADER ===== -->
    <div class="top-red">

      <!-- Status Bar -->
      <div class="status-bar">
        <span class="time">10:00</span>
        <div class="status-icons">
          <svg viewBox="0 0 24 24" fill="none"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#FFF"/><path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#FFF"/><path d="M9 17l2 2c1.1-1.1 2.9-1.1 4 0l2-2c-2.21-2.21-5.79-2.21-8 0z" fill="#FFF"/></svg>
          <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="4" height="12" rx="1" fill="#FFF"/><rect x="8" y="4" width="4" height="14" rx="1" fill="#FFF"/><rect x="14" y="2" width="4" height="16" rx="1" fill="#FFF"/><rect x="20" y="0" width="4" height="18" rx="1" fill="#FFF" opacity="0.45"/></svg>
          <svg viewBox="0 0 28 14" fill="none"><rect x="0" y="1" width="22" height="12" rx="2.5" stroke="#FFF" stroke-width="1.5"/><rect x="2" y="3" width="16" height="8" rx="1" fill="#FFF"/><rect x="24" y="4" width="2" height="6" rx="1" fill="#FFF"/></svg>
        </div>
      </div>

      <!-- Header Navigation -->
      <div class="header-nav">
        <button class="back-btn" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <span class="header-title">Transfer to Bank</span>
        <div style="width: 36px;"></div>
      </div>

      <!-- Amount -->
      <div class="amount-area active" id="amountEntry" onclick="setMode('amount')">
        <div class="amount-display">
          <span class="amount-value" id="amountValue">0.00</span>
          <span class="amount-caret"></span>
          <span class="amount-currency">ETB</span>
        </div>
      </div>

      <!-- Balance pill (straddles the boundary) -->
      <div class="balance-pill">
        <div class="balance-item">
          <span class="label">Main:</span>
          <span class="amount">12,580.00 Birr</span>
        </div>
        <div class="balance-divider"></div>
        <div class="balance-item">
          <span class="label">Available:</span>
          <span class="amount">800.00 Birr</span>
        </div>
      </div>
    </div>

    <!-- ===== LOWER CONTENT ===== -->
    <div class="lower-content">

      <!-- PIN Section -->
      <div class="pin-section" id="pinSection" onclick="setMode('pin')">
        <span class="pin-label">Enter Your M-PESA PIN</span>
        <div class="pin-container" id="pinContainer">
          <div class="pin-box" data-index="0"><div class="dot"></div></div>
          <div class="pin-box" data-index="1"><div class="dot"></div></div>
          <div class="pin-box" data-index="2"><div class="dot"></div></div>
          <div class="pin-box" data-index="3"><div class="dot"></div></div>
        </div>
        <input type="password" class="pin-input" id="pinInput" maxlength="4" inputmode="numeric">
      </div>

      <!-- Validation / errors — in the space between PIN and keypad -->
      <div class="middle-area">
        <div class="insufficient-warning" id="insufficientWarning">
          <svg class="warning-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span class="warning-text">Insufficient Balance: 800.00 Birr</span>
        </div>
        <div class="pin-error" id="pinError">
          <svg class="warning-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span class="warning-text" id="pinErrorText">Incorrect PIN. Try again.</span>
        </div>
      </div>

      <!-- Keypad -->
      <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key empty"></button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key delete" onclick="deleteKey()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
      </div>

      <!-- Transfer Button -->
      <button class="transfer-btn" id="transferBtn" onclick="confirmTransfer()" disabled>Transfer</button>

    </div>

    <!-- Success Overlay -->
    <div class="success-overlay" id="successOverlay">
      <div class="success-modal">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h3 class="success-title">Transfer Successful!</h3>
        <p class="success-subtitle" id="successSubtitle">-0.00 ETB sent</p>
        <button class="success-done-btn" onclick="closeSuccess()">Done</button>
      </div>
    </div>

  </div>
</div>

<script>
  const availableBalance = 800.00;
  let mode = 'amount';        // 'amount' first, then 'pin'
  let currentAmount = 0.00;
  let pin = '';
  let recipientName = 'recipient';

  const pinBoxes = document.querySelectorAll('.pin-box');
  const pinInput = document.getElementById('pinInput');

  function formatNumber(num) {
    return num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // Switch which field the keypad drives
  function setMode(next) {
    if (next === 'pin' && currentAmount <= 0) return; // enter an amount first
    mode = next;
    document.getElementById('amountEntry').classList.toggle('active', mode === 'amount');
    document.getElementById('pinSection').classList.toggle('active', mode === 'pin');
    updatePinDisplay();
  }

  function updateAmountDisplay() {
    const warning = document.getElementById('insufficientWarning');
    document.getElementById('amountValue').textContent = formatNumber(currentAmount);
    warning.classList.toggle('show', currentAmount > availableBalance);
    updateTransferButton();
  }

  function updatePinDisplay() {
    pinBoxes.forEach((box, index) => {
      box.classList.remove('filled', 'active');
      if (index < pin.length) { box.classList.add('filled'); }
      else if (index === pin.length && mode === 'pin') { box.classList.add('active'); }
    });
    updateTransferButton();
  }

  function updateTransferButton() {
    const btn = document.getElementById('transferBtn');
    const valid = currentAmount > 0 && currentAmount <= availableBalance && pin.length === 4;
    btn.classList.toggle('active', valid);
    btn.disabled = !valid;
  }

  // Keypad routes to the amount first, then to the PIN
  function pressKey(key) {
    if (mode === 'amount') {
      const s = currentAmount.toString();
      const di = s.indexOf('.');
      if (di !== -1 && s.length - di >= 3) return;   // max 2 decimals
      if (currentAmount === 0 && key === '0') return;
      currentAmount = currentAmount === 0 ? parseFloat(key) : parseFloat(s + key);
      updateAmountDisplay();
    } else {
      if (pin.length < 4) { pin += key; pinInput.value = pin; updatePinDisplay(); }
    }
  }

  function deleteKey() {
    if (mode === 'pin' && pin.length > 0) {
      pin = pin.slice(0, -1); pinInput.value = pin; updatePinDisplay();
      return;
    }
    if (mode === 'pin' && pin.length === 0) { setMode('amount'); return; }
    const s = currentAmount.toString();
    currentAmount = s.length === 1 ? 0.00 : parseFloat(s.slice(0, -1));
    updateAmountDisplay();
  }

  function confirmTransfer() {
    if (currentAmount > 0 && currentAmount <= availableBalance && pin.length === 4) {
      sessionStorage.setItem('sendAmount', formatNumber(currentAmount));
      document.getElementById('successSubtitle').textContent =
        '-' + formatNumber(currentAmount) + ' ETB sent to ' + recipientName;
      document.getElementById('successOverlay').classList.add('show');
    }
  }

  function closeSuccess() {
    window.location.href = 'Transaction Confirmation.html';
  }

  function goBack() { console.log('Navigate back'); }

  // Carry the recipient name through for the success message
  function loadTarget() {
    let target = null;
    try { target = JSON.parse(sessionStorage.getItem('sendTarget') || 'null'); } catch (e) {}
    if (target) recipientName = target.holder || target.name || 'recipient';
  }

  document.addEventListener('keydown', function(e) {
    if (e.key >= '0' && e.key <= '9') { pressKey(e.key); }
    else if (e.key === 'Backspace') { deleteKey(); }
    else if (e.key === 'Enter') { confirmTransfer(); }
  });

  loadTarget();
  updateAmountDisplay();
  updatePinDisplay();
</script>


<!-- Export to Figma button (shared exporter) -->
<script src="figma-export.js"></script>
</body>
</html>
